<script>/* Keeps the page at its normal size on phones. Shared by the hub, Hold'em and Mahjong (each build inlines it in <head>).
   iOS Safari ignores user-scalable=no, so a double tap or a pinch could zoom the page, and inside a game the table
   then wouldn't pinch back out. Double taps are covered by touch-action:manipulation on every element, pinches by
   cancelling Safari's gesture events. If the page still ends up zoomed (a text field, a system setting), pinching is
   allowed again until it's back to normal size and a small note says how to zoom out. */
(function () {
  var root = document.documentElement, vv = window.visualViewport;
  var st = document.createElement('style');
  st.textContent = '*,*::before,*::after{touch-action:manipulation}html.zoomed #game{touch-action:manipulation}' +
    '#zoomhint{position:fixed;left:0;top:0;z-index:2147483000;display:flex;justify-content:center;pointer-events:none;transform-origin:0 0;opacity:0;transition:opacity .25s}' +
    '#zoomhint.on{opacity:1}#zoomhint span{margin-top:calc(env(safe-area-inset-top,0px) + 10px);padding:9px 16px;border-radius:999px;background:rgba(12,14,13,.9);color:#f4efe4;' +
    'font:700 14px/1.2 -apple-system,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12);white-space:nowrap}';
  (document.head || root).appendChild(st);
  var zoomed = function () { return !!vv && vv.scale > 1.02; };
  var block = function (e) { if (!zoomed() && e.cancelable) e.preventDefault(); };
  document.addEventListener('gesturestart', block, { passive: false });
  document.addEventListener('gesturechange', block, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if ((e.touches && e.touches.length > 1) || (e.scale && e.scale !== 1)) block(e);
  }, { passive: false });
  if (!vv) return;
  var hint = null, timer = 0;
  var place = function () {
    if (!hint) return;
    hint.style.width = innerWidth + 'px';
    hint.style.transform = 'translate(' + vv.offsetLeft + 'px,' + vv.offsetTop + 'px) scale(' + (1 / vv.scale) + ')';
  };
  var sync = function () {
    var z = zoomed();
    if (z !== root.classList.contains('zoomed')) root.classList.toggle('zoomed', z);
    clearTimeout(timer);
    if (z) {
      if (!hint) {
        hint = document.createElement('div'); hint.id = 'zoomhint'; hint.setAttribute('aria-hidden', 'true');
        hint.appendChild(document.createElement('span'));
        document.body.appendChild(hint);
      }
      hint.firstChild.textContent = /^zh/.test(root.lang) ? '双指捏合，缩回原来大小' : 'Pinch with two fingers to zoom back out';
      place();
      timer = setTimeout(function () { if (zoomed()) hint.classList.add('on'); }, 700);
    } else if (hint) hint.classList.remove('on');
  };
  vv.addEventListener('resize', sync);
  vv.addEventListener('scroll', function () { if (zoomed()) place(); });
})();
</script>

/* Xiangqi: a lacquer-dark room in cinnabar and gold, the same glass panels and gold buttons as Hold'em and Mahjong.
   The board is the hero: ivory pieces on a dark board (or a pale wood one, a setting). */
:root{
  --bg0:#10060a;--bg1:#2a0e13;--bg2:#571c22;
  --ink:#f5ecdd;--ink2:#d5c4ae;--ink3:#a08c7e;--gold:#e8c67b;--gold2:#b8893b;--gold-hi:#f6e2b0;
  --red:#e2574a;--red2:#b3362a;--jade:#3fb884;--jade2:#1d8a5c;--warn:#e09a3a;--bad:#e05a48;--blue:#5a9bf0;
  --panel:rgba(22,9,12,.9);--line:rgba(232,198,123,.2);--glass:rgba(255,255,255,.06);
  --pc-red:#c22a20;--pc-black:#201a1a;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --brush:"XQBrush","Kaiti SC","STKaiti","KaiTi",serif;
  --piece:"XQPiece","Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","SimSun",serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","Fraunces",Georgia,serif;
  --display:"Fraunces","Songti SC","STSong",Georgia,serif;
  --ui:"Manrope",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --nota:var(--ui);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font:500 15px/1.45 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.screen{position:fixed;inset:0}
svg.ic{width:20px;height:20px;flex:none}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}

/* ===== lobby ===== */
.room-bg,#lobby,#room{background:radial-gradient(120% 64% at 50% 0%,var(--bg2) 0%,var(--bg1) 46%,var(--bg0) 100%)}
#lobby,#room{overflow-y:auto;-webkit-overflow-scrolling:touch}
#lobby::before,#room::before,#game::before,#review::before,#explore::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--noise);opacity:.5;mix-blend-mode:overlay}
.lob{position:relative;max-width:440px;margin:0 auto;padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 28px)}
.lobtop{position:relative;z-index:2;display:flex;align-items:center;gap:8px;min-height:36px}
.pillbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap;text-decoration:none}
.pillbtn:active{background:rgba(255,255,255,.1)}
.pillbtn.home{gap:4px;padding:0 13px 0 8px;color:var(--ink)}
.pillbtn.home .ic{width:18px;height:18px;color:var(--gold)}
.hero{position:relative;text-align:center;padding:30px 0 4px}
.hart{position:relative;height:138px;width:260px;margin:0 auto}
.hart .glow{position:absolute;left:50%;top:26px;width:240px;height:130px;margin-left:-120px;border-radius:50%;background:radial-gradient(closest-side,rgba(232,198,123,.3),transparent);filter:blur(6px)}
.hart .hp{position:absolute;left:50%;top:16px;--ps:84px;width:var(--ps);height:var(--ps);margin-left:-42px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.hart .hp.h0{transform:translate(-74px,14px) rotate(-14deg)}
.hart .hp.h1{transform:translate(0,-4px);z-index:2}
.hart .hp.h2{transform:translate(74px,14px) rotate(12deg)}
@media (prefers-reduced-motion:no-preference){.hart .hp.h1{animation:hfloat 6s ease-in-out infinite}}
@keyframes hfloat{50%{transform:translate(0,-10px)}}
.title{position:relative;display:inline-flex;align-items:center;gap:10px;margin-top:2px}
.title h1{margin:0;display:flex;flex-direction:column;align-items:center;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.title .w1{font-family:var(--brush);font-weight:400;font-size:54px;line-height:1.08;letter-spacing:2px;background:linear-gradient(180deg,#fff3cf 0%,#e8c67b 55%,#b8893b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 2px 2px}
.title .w2{font:800 12px/1 var(--ui);letter-spacing:.5em;color:var(--gold);margin-top:4px;padding-left:.5em}
.title .w2:empty{display:none}
html[lang=en] .title h1{align-items:flex-start}
html[lang=en] .title .seal{display:none}
html[lang=en] .title .w1{font:italic 600 52px/0.98 var(--display);letter-spacing:-.02em;padding:0 6px 6px 0}
.seal{writing-mode:vertical-rl;font-family:var(--brush);font-size:19px;line-height:1;color:#fff2e6;background:linear-gradient(160deg,#d8463a,#a32a22);padding:7px 5px;border-radius:5px;box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,235,220,.35);transform:rotate(4deg);letter-spacing:2px}
.tagline{margin:10px auto 0;color:var(--ink2);font-size:14px;line-height:1.6;max-width:340px}
.box{position:relative;margin-top:16px;padding:16px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.me-row{display:flex;gap:14px;align-items:center}
.me-av{width:62px;height:62px;border-radius:50%;flex:none;box-shadow:0 0 0 2.5px var(--gold),0 6px 16px rgba(0,0,0,.4)}
.me-av svg{width:100%;height:100%;display:block}
.fld{flex:1;min-width:0}
.lbl{display:block;font-size:12px;color:var(--ink3);letter-spacing:1px;margin:0 0 6px 2px}
.inp{width:100%;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.28);color:var(--ink);padding:0 14px;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:rgba(232,198,123,.6)}
.avs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
.avs button{min-width:0;aspect-ratio:1;border-radius:50%;overflow:hidden;opacity:.72;transition:transform .15s,opacity .15s}
.avs button svg{width:100%;height:100%;display:block}
.avs button.on{opacity:1;box-shadow:0 0 0 2.5px var(--gold);transform:scale(1.06)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{position:relative;z-index:1;height:38px;border-radius:11px;font-size:15px;font-weight:700;color:var(--ink2);transition:color .2s}
.tabs button.on{color:#2b1d07}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:11px;background:linear-gradient(180deg,#f1d592,#c99b48);box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tabs.two{grid-template-columns:repeat(2,1fr)}
.tabs.two .pill{width:calc((100% - 8px)/2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;font-size:16px;font-weight:800;width:100%;transition:transform .1s,filter .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#f3d896,#c99b48);color:#2b1d07;box-shadow:0 6px 18px rgba(201,155,72,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.red{background:linear-gradient(180deg,#e45a49,#b3362a);color:#fff;box-shadow:0 6px 18px rgba(180,54,42,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.jade{background:linear-gradient(180deg,#4cc592,#1f8f60);color:#06281a;box-shadow:0 6px 18px rgba(31,143,96,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:var(--ink)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 16px}
.btn.xs{height:32px;font-size:13px;border-radius:10px;width:auto;padding:0 12px;font-weight:700}
.btn[disabled]{filter:grayscale(.8) brightness(.7);pointer-events:none}
.btn .ic{width:18px;height:18px}
.code-row{display:flex;gap:10px}
.code-row .inp{flex:1;text-align:center;font-size:22px;letter-spacing:10px;font-weight:700;text-transform:uppercase;height:50px}
.code-row .btn{width:110px}
.opts{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;font-size:14px;color:var(--ink2);margin-bottom:14px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{min-width:44px;height:32px;padding:0 9px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
@media (max-width:380px){.seg button{padding:0 7px;font-size:12.5px}.opts{gap:10px 9px}}
.seg button.on{background:rgba(232,198,123,.16);border-color:rgba(232,198,123,.7);color:var(--gold)}
.seg .dot{width:14px;height:14px;border-radius:50%;background:#f4ead6;box-shadow:inset 0 0 0 3px var(--pc-red)}
.seg .dot.k{box-shadow:inset 0 0 0 3px #2a2424}
.more{font-size:13px;color:var(--ink3);text-align:center;padding:4px;display:flex;justify-content:center;gap:6px;align-items:center;line-height:1.5}
.err{color:#ff9c8f;font-size:13px;min-height:18px;text-align:center;margin-top:8px}
.resume{display:flex;align-items:center;gap:10px}
.resume+.resume{margin-top:10px}
.resume .tx{flex:1;font-size:14px;color:var(--ink2);line-height:1.5;min-width:0}
.resume .tx b{color:var(--ink);font-size:15px}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--ink3);line-height:1.7}
.wx{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(217,71,58,.16);border:1px solid rgba(217,71,58,.35);font-size:13px;color:#ffd2cb;line-height:1.5}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.row3 .btn{height:44px;font-size:13.5px;font-weight:700;gap:6px;border-radius:14px}
.row3 .btn .ic{color:var(--gold);width:17px;height:17px}

/* practice pane: the opponent card */
.pane{display:flex;flex-direction:column}
.opp-card{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:10px}
.nav{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;color:var(--ink2)}
.nav:active{transform:scale(.92)}
.nav svg{width:20px;height:20px}
.nav:disabled{opacity:.3}
.opp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.opp-name{display:flex;align-items:baseline;gap:8px;justify-content:center;flex-wrap:wrap}
.opp-name b{font-size:21px;font-weight:800}
.opp-name small{font-size:12px;color:var(--ink3)}
.opp p{margin:0;font-size:13px;color:var(--ink2);min-height:1.45em}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px}
.ladder button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--ink3);padding:2px 0;min-width:0;white-space:nowrap}
.ladder i{width:32px;height:32px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.14);filter:grayscale(.6) opacity(.6);transition:transform .2s,filter .2s,box-shadow .2s}
.ladder button.past i{filter:grayscale(.15) opacity(.9)}
.ladder button.on{color:var(--gold);font-weight:800}
html[lang=en] .ladder button{font-size:10px;letter-spacing:-.02em}
@media (max-width:380px){html[lang=en] .ladder button{font-size:9.5px}html[lang=en] .ladder button.on{font-weight:700}}
.ladder button.on i{filter:none;transform:scale(1.16);box-shadow:0 0 0 2.5px var(--gold),0 3px 10px rgba(0,0,0,.4)}
.record{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:rgba(0,0,0,.22);border-radius:14px;padding:9px 4px;margin-bottom:14px}
.record b{display:block;font:700 20px/1.2 var(--display)}
.record small{font-size:11px;color:var(--ink3)}
.duo{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0 10px}
.duo .vs{font:italic 600 22px var(--display);color:var(--gold)}
.pane-desc{margin:0 0 14px;font-size:14px;color:var(--ink2);line-height:1.7;text-align:center}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.06);width:100%;text-align:left;font-size:14px;font-weight:600}
.toggle small{display:block;color:var(--ink3);font-size:12px;font-weight:500;margin-top:2px;line-height:1.45}
.toggle:disabled{opacity:.6}
.sw{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.16);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--jade)}.sw.on::after{left:21px}
.engine{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.eng-note{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:8px;min-height:18px;padding:0 2px;line-height:1.4}
.eng-note .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;min-width:40px}
.eng-note .bar i{display:block;height:100%;background:var(--jade);width:0;transition:width .2s}
.eng-note b{color:var(--jade);white-space:nowrap}
.eng-note .bad{color:#ff9c8f}
.linkbtn{color:var(--gold);font-weight:700;font-size:12.5px;padding:4px 0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.eng-chip{white-space:nowrap;font-size:10.5px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--ink2);margin-left:6px;vertical-align:middle;font-weight:700;letter-spacing:0}
.eng-chip.pf{background:rgba(63,184,132,.22);color:#a8ecc9}

/* ===== mascots and avatars ===== */
.avatar{position:relative;width:52px;height:52px;border-radius:50%;flex:none;background:#2a1a1c;box-shadow:0 0 0 2px rgba(255,255,255,.16),0 6px 14px rgba(0,0,0,.4);transition:box-shadow .25s}
.avatar>span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
.avatar>span>svg{width:100%;height:100%;display:block}
.avatar.big{width:92px;height:92px;box-shadow:0 0 0 3px var(--gold),0 10px 24px rgba(0,0,0,.45)}
.avatar.active{box-shadow:0 0 0 2.5px var(--gold),0 0 18px rgba(232,198,123,.55)}
.avatar.off>span{filter:grayscale(1) brightness(.6)}
.avatar.happy{animation:hop .45s ease-out 2}
.avatar.sad{animation:shake .4s ease-in-out 2}
.avatar.think{animation:think .9s ease-in-out infinite}
@keyframes think{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-2px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-9px) scale(1.1)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-8deg)}75%{transform:translateX(4px) rotate(8deg)}}
.ava-svg{width:100%;height:100%;display:block}
.ava-svg .chr{animation:abob 3.2s ease-in-out infinite}
@keyframes abob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
.ava-svg .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.k-bunny .eye{animation-delay:1.1s}.k-panda .eye{animation-delay:2.3s}.k-fox .eye{animation-delay:.6s}.k-tiger .eye{animation-delay:3.1s}.k-dragon .eye{animation-delay:1.7s}.k-piece .eye{animation-delay:2.7s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.ava-svg .ear-l,.ava-svg .ear-r{transform-box:fill-box;transform-origin:50% 100%}
.ava-svg .ear-l{animation:earL 5.2s infinite}.ava-svg .ear-r{animation:earR 5.2s infinite 1.4s}
@keyframes earL{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-9deg)}95%{transform:rotate(4deg)}}
@keyframes earR{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(9deg)}95%{transform:rotate(-4deg)}}
.ava-svg .wing-l,.ava-svg .wing-r{transform-box:fill-box;transform-origin:50% 20%}
.avatar.happy .wing-l{animation:flapL .25s ease-in-out 4}.avatar.happy .wing-r{animation:flapR .25s ease-in-out 4}
@keyframes flapL{50%{transform:rotate(-30deg)}}@keyframes flapR{50%{transform:rotate(30deg)}}
.ava-svg .e-happy,.ava-svg .e-sad,.ava-svg .tear,.ava-svg .m-happy{display:none}
.avatar.happy .e-open,.avatar.happy .m-norm,.avatar.sad .e-open{display:none}
.avatar.happy .e-happy,.avatar.happy .m-happy,.avatar.sad .e-sad,.avatar.sad .tear{display:inline}
.avatar.happy .blush{opacity:.85}
.ava-svg .tear{animation:tear 1s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:1}100%{transform:translateY(7px);opacity:0}}
.avatar.think .e-open{transform:translate(1.8px,-2px);transition:transform .3s}
.ladder i .ava-svg .chr,.ladder i .ava-svg .eye,.ladder i .ava-svg .ear-l,.ladder i .ava-svg .ear-r{animation:none}
.bubble{position:absolute;left:4px;top:calc(100% + 8px);max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fbf4e4;color:#2a1c12;font-style:normal;font-size:13px;font-weight:700;padding:5px 10px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(4px) scale(.9);transition:.2s;pointer-events:none;z-index:12}
.bubble.emo{font-size:26px;padding:2px 8px;line-height:1.25}
.bubble.up{top:auto;bottom:calc(100% + 8px)}
.bubble.show{opacity:1;transform:none}

/* ===== waiting room ===== */
.room{position:relative;max-width:460px;margin:0 auto;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 24px)}
.rhead{display:flex;align-items:center;gap:10px;height:40px}
.tb-btn{width:36px;height:36px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;flex:none}
.tb-btn svg{width:19px;height:19px}
.tb-btn:active{background:rgba(255,255,255,.1)}
.codebig{margin:14px 0 4px;text-align:center}
.codebig .l{font-size:13px;color:var(--ink3);letter-spacing:2px}
.codebig .c{font-size:54px;font-weight:800;letter-spacing:12px;color:var(--gold);margin:4px 0 0 12px;font-variant-numeric:tabular-nums}
.share{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
.seats2{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:18px}
.seats2 .vs{font:italic 600 20px var(--display);color:var(--gold)}
.rs{position:relative;padding:16px 10px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0}
.rs .av{width:60px;height:60px;border-radius:50%;overflow:hidden}
.rs .av svg{width:100%;height:100%;display:block}
.rs .nm{font-size:15px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs .sub{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.rs.empty{border-style:dashed;color:var(--ink3)}
.rs.off .av{filter:grayscale(1) brightness(.6)}
.rs .x{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.rs .x svg{width:16px;height:16px}
.rs .tag{position:absolute;left:8px;top:8px;font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(232,198,123,.18);color:var(--gold);font-weight:700}
.sdot{width:13px;height:13px;border-radius:50%;background:#f4ead6;box-shadow:inset 0 0 0 3px var(--pc-red);flex:none}
.sdot.k{box-shadow:inset 0 0 0 3px #2a2424}
.room .opts{margin:18px 4px 0}
.rules-sum{margin-top:14px;font-size:13px;color:var(--ink2);line-height:1.8;text-align:center}
.ractions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:spin 1s linear infinite;margin:0 auto 12px}
.spin.sm{width:16px;height:16px;border-width:2px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== game ===== */
#game,#review,#explore{background:radial-gradient(70% 46% at 50% 44%,rgba(255,220,170,.07),transparent 72%),radial-gradient(120% 80% at 50% 40%,#4a181e 0%,#32101a 40%,#1b090d 74%,#0e0508 100%)}
#game{display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 6px) max(8px,var(--sal)) 0 max(8px,var(--sar));overflow:hidden}
#game>*{position:relative;z-index:1}
.topbar{width:100%;max-width:600px;height:40px;display:flex;align-items:center;gap:8px;flex:none}
.tb-info{flex:1;display:flex;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;min-width:0}
.tb-info .chip{padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tb-info .chip b{color:var(--ink);font-weight:800}
.netdot{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:#46d18d;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.netdot.bad{background:#ff6b5b}
.plate{width:100%;max-width:600px;display:flex;align-items:center;gap:10px;min-height:60px;flex:none;padding:0 4px}
.who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.who-txt{display:flex;flex-direction:column;min-width:0;gap:1px}
.who-txt b{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-txt small{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.caps{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;max-width:124px;flex:none}
.cap{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffaf0,#e6d6b6);font:900 11px/17px var(--piece);text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.5);color:var(--pc-black);display:grid;place-items:center}
.cap.r{color:var(--pc-red)}
.cap svg{width:12px;height:12px;display:block}
.clock{flex:none;min-width:64px;height:34px;padding:0 10px;border-radius:11px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);display:grid;place-items:center;font:700 17px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--ink2)}
.clock.run{background:linear-gradient(180deg,#f3d896,#c99b48);color:#2b1d07;border-color:transparent}
.clock.low{color:#ff9c8f}.clock.run.low{background:linear-gradient(180deg,#e45a49,#b3362a);color:#fff}
.turn{flex:none;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(0,0,0,.28);color:var(--ink3);white-space:nowrap}
.turn.mine{background:linear-gradient(180deg,#f3d896,#c99b48);color:#2b1d07}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.ticker{height:26px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--ink3);flex:none;white-space:nowrap}
.ticker b{font:700 16px var(--nota);color:var(--ink)}
.ticker b.r{color:#ff8f7d}
.ticker .chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:rgba(0,0,0,.3)}
.ticker .chip.hot{background:var(--red2);color:#fff}
.tools{width:calc(100% + 16px);max-width:616px;display:grid;grid-template-columns:repeat(4,1fr);flex:none;margin-top:4px;padding:8px 0 calc(8px + var(--sab));background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.42));border-top:1px solid rgba(255,255,255,.06)}
.tools.five{grid-template-columns:repeat(5,1fr)}
.tools button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink2);padding:2px 0;white-space:nowrap}
.tools svg{width:23px;height:23px}
.tools button:active{color:var(--gold)}
.tools button:disabled{opacity:.32}
.tools button.hot{color:var(--gold)}
.side-moves{display:none}

/* ===== board ===== */
.board{position:relative;border-radius:14px;cursor:pointer;touch-action:manipulation;
  --bd-line:rgba(236,205,140,.6);--bd-text:rgba(236,205,140,.42);--bd-frame:rgba(232,198,123,.3);--bd-mark:#f0cf85;
  background:radial-gradient(90% 60% at 30% 12%,rgba(255,228,180,.1),transparent 60%),linear-gradient(165deg,#3b2327 0%,#2a171b 46%,#1d0f12 100%);
  box-shadow:inset 0 0 0 1px var(--bd-frame),inset 0 1px 0 rgba(255,255,255,.08),0 0 0 5px rgba(0,0,0,.3),0 22px 46px rgba(0,0,0,.55)}
.board.wood{--bd-line:#6d4526;--bd-text:rgba(109,69,38,.62);--bd-frame:rgba(109,69,38,.5);--bd-mark:#8a4a16;
  background:radial-gradient(90% 60% at 30% 12%,rgba(255,244,214,.75),transparent 60%),linear-gradient(170deg,#f1d9aa,#e6c58d 42%,#d5aa6c);
  box-shadow:inset 0 0 0 1px rgba(109,69,38,.4),0 0 0 5px #5b3920,0 0 0 6px rgba(255,220,170,.2),0 22px 46px rgba(0,0,0,.55)}
.board>svg,.board>.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board .grid{color:var(--bd-line)}
.board .grid text{fill:var(--bd-text)}
.board .arrows{z-index:6}
.board .badges{z-index:7}
.board .marks{z-index:1}
.pc{position:absolute;left:0;top:0;width:var(--ps);height:var(--ps);transition:transform .26s cubic-bezier(.25,.8,.3,1.08),opacity .25s;z-index:2;will-change:transform;color:var(--pc-black)}
.pc.r{color:var(--pc-red)}
.pc.moving{z-index:4}
.pc .face{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 26%,#fffdf6 0%,#fbf3e2 40%,#efe2c8 78%,#e2d0ad 100%);
  box-shadow:0 calc(var(--ps)*.05) 0 #c9b188,0 calc(var(--ps)*.075) 0 #9b8460,0 calc(var(--ps)*.16) calc(var(--ps)*.2) rgba(0,0,0,.5),inset 0 -2px 3px rgba(140,108,58,.2),inset 0 1.5px 1px #fff;
  transition:transform .16s ease,box-shadow .16s ease}
.pc .face::before{content:"";position:absolute;inset:7.5%;border-radius:50%;border:max(1.4px,calc(var(--ps)*.036)) solid currentColor;opacity:.82}
.pc span.g{font-family:var(--piece);font-weight:900;font-size:calc(var(--ps)*.54);line-height:1;transform:translateY(-1.5%)}
.pc svg.g{width:60%;height:60%;display:block}
.pc.sel .face{transform:translateY(calc(var(--ps)*-.13)) scale(1.08);box-shadow:0 calc(var(--ps)*.05) 0 #c9b188,0 calc(var(--ps)*.075) 0 #9b8460,0 calc(var(--ps)*.34) calc(var(--ps)*.3) rgba(0,0,0,.45),0 0 0 2.5px var(--gold),inset 0 -2px 3px rgba(140,108,58,.2),inset 0 1.5px 1px #fff}
.pc.dead{opacity:0}
.pc.born .face{animation:born .3s ease-out}
@keyframes born{from{transform:scale(.6);opacity:0}}
.pc.chk .face{animation:chk 1s ease-in-out infinite}
@keyframes chk{0%,100%{box-shadow:0 calc(var(--ps)*.05) 0 #c9b188,0 calc(var(--ps)*.075) 0 #9b8460,0 0 0 3px rgba(240,80,60,.95),0 0 20px 7px rgba(240,80,60,.6)}50%{box-shadow:0 calc(var(--ps)*.05) 0 #c9b188,0 calc(var(--ps)*.075) 0 #9b8460,0 0 0 3px rgba(240,80,60,.45),0 0 9px 2px rgba(240,80,60,.3)}}
.board.facing .pc:not(.r) .g{transform:rotate(180deg)}
.board.facing.flipped .pc:not(.r) .g{transform:none}
.board.facing.flipped .pc.r .g{transform:rotate(180deg)}
.mk{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none}
.mk.dot{width:calc(var(--ps)*.3);height:calc(var(--ps)*.3);background:#57d6a0;box-shadow:0 0 0 calc(var(--ps)*.07) rgba(87,214,160,.25),0 2px 6px rgba(0,0,0,.4)}
.mk.ring{width:calc(var(--ps)*1.06);height:calc(var(--ps)*1.06);box-shadow:0 0 0 3px #57d6a0,0 0 14px rgba(87,214,160,.8);z-index:3}
.mk.from{width:calc(var(--ps)*.4);height:calc(var(--ps)*.4);border:2px solid var(--bd-mark);opacity:.75}
.mk.to{width:calc(var(--ps)*1.14);height:calc(var(--ps)*1.14);border-radius:0;--c:var(--bd-mark);
  background:linear-gradient(var(--c),var(--c)) 0 0/28% 2.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/2.5px 28% no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 0/28% 2.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/2.5px 28% no-repeat,
  linear-gradient(var(--c),var(--c)) 0 100%/28% 2.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/2.5px 28% no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 100%/28% 2.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/2.5px 28% no-repeat}
.bdgw{position:absolute;left:0;top:0}
.bdg{min-width:21px;height:21px;padding:0 5px;border-radius:11px;font:800 12px/21px var(--ui);text-align:center;color:#fff;box-shadow:0 0 0 2px #fff6e4,0 2px 6px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.c-best{background:var(--jade2)}.c-good{background:#5f9440}.c-slow{background:#b38a1e}.c-err{background:#d27a22}.c-blun{background:#cf4030}
#game.exploring .board{box-shadow:inset 0 0 0 1px var(--bd-frame),0 0 0 3px var(--jade),0 0 0 7px rgba(63,184,132,.22),0 22px 46px rgba(0,0,0,.55)}

/* in-game explore strip */
.expanel{width:100%;max-width:600px;display:flex;flex-direction:column;gap:6px;padding:2px 4px;flex:none}
.ex-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.ex-badge{background:var(--jade2);color:#fff;font-weight:800;font-size:12px;padding:2px 9px;border-radius:8px;animation:exPulse 2s ease-in-out infinite;white-space:nowrap}
@keyframes exPulse{50%{box-shadow:0 0 0 4px rgba(63,184,132,.25)}}
.ex-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:42px}
.ex-chips::-webkit-scrollbar{display:none}
.cchip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);color:var(--ink)}
.cchip b{font:700 15px var(--nota)}
.cchip b.r{color:#ff8f7d}
.cchip i{font-style:normal;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.14);font:800 11px/18px var(--ui);text-align:center}
.cchip.on{background:rgba(63,184,132,.25);border-color:var(--jade)}
.cchip.dim{opacity:.45}
.ex-wait{font-size:12px;line-height:1.5;color:var(--ink3);align-self:center}

/* ===== sheets, overlay, toast ===== */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,3,5,.6);opacity:0;transition:opacity .25s}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;margin:0 auto;max-width:520px;max-height:86%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#34151a,#1c0b0f);border:1px solid rgba(255,255,255,.09);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + var(--sab));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sheet h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:19px;font-weight:800}
html[lang^=zh] .sheet h3{font:400 25px/1.1 var(--brush);letter-spacing:2px;color:var(--gold-hi)}
.sheet h3 .x{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
.sheet h3 .x svg{width:17px;height:17px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.06);text-align:left;width:100%;font-size:14.5px;font-weight:600}
.item:active{background:rgba(255,255,255,.08)}
.item small{display:block;color:var(--ink3);font-size:12px;font-weight:500;margin-top:2px}
.item .ic{color:var(--gold)}
.item.danger{color:#ffb0a4}.item.danger .ic{color:#ff9c8f}
.item .avatar{width:44px;height:44px}
.res-tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:8px;color:#fff;white-space:nowrap}
.res-tag.win{background:var(--red2)}.res-tag.loss{background:#4c4044}.res-tag.draw{background:#8a6a2a}
.note{font-size:13px;color:var(--ink2);line-height:1.6;margin:0}
.note.dim{color:var(--ink3);font-size:12px}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn{flex:1;height:46px;font-size:15px}
.code-box{width:100%;min-height:84px;max-height:150px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.3);color:var(--ink);font:16px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical;-webkit-user-select:text;user-select:text;outline:none}
.code-sec{margin-top:14px}.code-sec>b{display:block;font-size:14px;margin-bottom:6px}.code-sec .btns{margin-top:8px}
#overlay{position:fixed;inset:0;z-index:70;background:rgba(8,3,5,.66);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#overlay .card{width:100%;max-width:340px;padding:22px 20px;border-radius:22px;background:linear-gradient(180deg,#3a181d,#200c10);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;font-size:15px;line-height:1.55}
#overlay .card b{display:block;font-size:16px}
#overlay .card p{margin:8px 0 0;color:var(--ink2);font-size:13.5px}
.ovb{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.ovb .btn{flex:1;min-width:96px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);z-index:80;transform:translateX(-50%);max-width:calc(100vw - 32px);background:rgba(18,8,10,.94);color:var(--ink);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(232,198,123,.35),0 8px 20px rgba(0,0,0,.4);text-align:center;animation:toast .25s}
#toast b{color:var(--gold)}
/* in a game the toast sits in the gap under the opponent's name, not on top of it */
body:has(#game:not([hidden])) #toast{top:calc(var(--sat) + 114px)}
@keyframes toast{from{opacity:0;transform:translateX(-50%) translateY(-8px)}}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;display:grid;place-items:center}
#fx .big{font:400 86px/1 var(--brush);letter-spacing:6px;color:#fff3d6;text-shadow:0 0 28px rgba(226,87,74,.95),0 4px 0 #8a1f18,0 10px 30px rgba(0,0,0,.6);animation:bigfx 1.25s cubic-bezier(.2,.9,.3,1) forwards}
html[lang=en] #fx .big{font:italic 700 58px/1 var(--display);letter-spacing:0}
@keyframes bigfx{0%{transform:scale(2.2);opacity:0}18%{transform:scale(1);opacity:1}72%{transform:scale(1);opacity:1}100%{transform:scale(1.08);opacity:0}}

/* result sheet */
.result{text-align:center;padding-top:4px}
.res-head{display:flex;align-items:center;justify-content:center;gap:16px}
.res-head .avatar{width:72px;height:72px}
.stamp{min-width:104px;height:104px;padding:0 12px;border-radius:18px;display:grid;place-items:center;font:400 72px/1 var(--brush);color:#ff7a66;box-shadow:inset 0 0 0 4px currentColor,inset 0 0 0 8px transparent,inset 0 0 0 10px currentColor;transform:rotate(-7deg);animation:stamp .5s cubic-bezier(.3,1.5,.5,1)}
html[lang=en] .stamp{font:italic 700 34px/1 var(--display);min-width:128px;height:84px}
.stamp.loss{color:#a99b92}.stamp.draw{color:var(--gold)}
@keyframes stamp{from{transform:rotate(-7deg) scale(2.4);opacity:0}}
.res-line{font-size:15px;color:var(--ink);margin-top:12px;font-weight:600}
.res-rec{font-size:13px;color:var(--ink3);margin-top:4px}
.res-score{display:inline-flex;gap:14px;align-items:center;margin-top:10px;padding:8px 16px;border-radius:14px;background:rgba(0,0,0,.25);font-weight:800;font-size:18px}
.res-score small{font-size:12px;color:var(--ink3);font-weight:600;display:block}
.res-wait{font-size:13px;color:var(--ink3);margin-top:10px;min-height:20px}

/* chat sheet */
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emos button{height:46px;border-radius:12px;background:rgba(0,0,0,.22);font-size:24px}
.phr{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.phr button{padding:8px 12px;border-radius:99px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);font-size:13.5px;font-weight:600}
.chatrow .inp{letter-spacing:0;font-size:16px;text-align:left;text-transform:none;font-weight:500}
.chatrow .btn{width:84px}

/* rules sheet */
.rules-txt{font-size:14px;line-height:1.7;color:var(--ink2)}
.rules-txt h4{margin:16px 0 6px;font-size:14.5px;color:var(--gold)}
.rules-txt p{margin:0 0 8px}
.rp{display:grid;grid-template-columns:44px 1fr;gap:10px 12px;align-items:center;margin:8px 0}
.rp .pcs{position:relative;width:44px;height:44px;--ps:40px}
.rp .pcs .pc{position:relative;display:block}
.rp b{color:var(--ink)}

/* ===== review and explore ===== */
#review,#explore{display:flex;flex-direction:column;align-items:center;gap:10px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 8px) max(8px,var(--sal)) calc(var(--sab) + 24px) max(8px,var(--sar))}
#review>*,#explore>*{position:relative;z-index:1}
.rv-head{width:100%;max-width:600px;display:flex;align-items:center;gap:8px;flex:none}
.rv-head .btn{flex:none}
.rv-title{flex:1;text-align:center;font-size:13px;line-height:1.3;font-weight:600;color:var(--ink2);min-width:0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.evalbar{width:100%;max-width:600px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.evalbar .track{flex:1;height:10px;border-radius:5px;background:#17100f;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.evalbar .track i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#c9372a,#ee6a54);transition:width .35s ease}
.evalbar .er{color:#ff8f7d;min-width:64px}.evalbar .eb{color:var(--ink2);min-width:64px;text-align:right}
.rv-board{flex:none;padding:8px 0;position:relative}
.rv-ctrl{display:flex;gap:6px;width:100%;max-width:600px;flex:none}
.rv-ctrl button{flex:1;height:42px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.07);display:grid;place-items:center;color:var(--ink)}
.rv-ctrl button:active{background:rgba(255,255,255,.1)}
.rv-ctrl button:disabled{opacity:.35}
.rv-ctrl svg{width:22px;height:22px}
.rv-ctrl .txt{font-size:13px;font-weight:800}
.panelbox{width:100%;max-width:600px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.25);flex:none;overflow:hidden}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(0,0,0,.28);padding:4px;gap:2px}
.ptabs button{height:36px;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink3)}
.ptabs button.on{background:rgba(232,198,123,.16);color:var(--gold)}
.panel{padding:12px 14px 14px;min-height:150px}
.chart-box{position:relative;touch-action:pan-y}
#chart{width:100%;height:190px;display:block}
.chart-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:6px;gap:8px;font-variant-numeric:tabular-nums}
.chart-cap b{color:var(--ink)}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
.prog-txt{font-size:12px;color:var(--ink3);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pfcta{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(63,184,132,.1);border:1px solid rgba(63,184,132,.28);font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:10px;line-height:1.5}
.pfcta .btn{flex:none}
.ana-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ana-move{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ana-move .big{font:700 23px var(--nota)}
.tag{font-size:12px;font-weight:800;color:#fff;padding:2px 8px;border-radius:8px;white-space:nowrap}
.tag.mate,.pv .mate-end{display:inline-block;background:#cf4030;color:#fff;font:800 12px/1.6 var(--ui);padding:0 7px;border-radius:7px;vertical-align:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0 0;font-size:14px;align-items:baseline}
.kv dt{color:var(--ink3);font-size:13px;white-space:nowrap}
.kv dd{margin:0;min-width:0}
.pv{font:600 15px/1.8 var(--nota);word-break:keep-all}
.pv span{display:inline-block;margin-right:8px;color:var(--ink)}
.pv span.r,.red-t{color:#ff8f7d}
.blk-t{color:var(--ink)}
.pv span.k{cursor:pointer;border-radius:6px;padding:0 3px}
.pv span.k.on{background:rgba(232,198,123,.2);box-shadow:inset 0 0 0 1.5px var(--gold2)}
.pv span.k em{font:500 10px var(--ui);color:var(--ink3);margin-right:2px;vertical-align:1px}
.pv .calc{font:500 12px var(--ui);color:var(--ink3)}
.mini-btn{margin-top:12px;padding:9px 14px;border-radius:11px;background:linear-gradient(180deg,#4cc592,#1f8f60);color:#06281a;font-weight:800;font-size:13.5px}
.mini-btn.alt{background:rgba(255,255,255,.1);color:var(--ink)}
.pv-mode{display:flex;background:rgba(0,0,0,.3);border-radius:9px;padding:2px;gap:2px;flex:none}
.pv-mode button{font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;color:var(--ink3)}
.pv-mode button.on{background:rgba(232,198,123,.18);color:var(--gold)}
.moves{display:grid;grid-template-columns:28px 1fr 1fr;gap:2px 6px;font-size:15px;max-height:320px;overflow-y:auto}
.moves .no{color:var(--ink3);font-size:12px;align-self:center;text-align:right;font-variant-numeric:tabular-nums}
.moves button{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 8px;border-radius:8px;font:600 15px var(--nota);text-align:left;color:var(--ink)}
.moves button.r{color:#ff8f7d}
.moves button.cur{background:rgba(232,198,123,.18);box-shadow:inset 0 0 0 1.5px var(--gold2)}
.moves .tag{font-family:var(--ui);font-size:11px;padding:1px 5px}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc>div{background:rgba(0,0,0,.22);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ring{--p:0;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring b{width:64px;height:64px;border-radius:50%;background:#2a1216;display:grid;place-items:center;font:700 21px var(--display);font-variant-numeric:tabular-nums}
.acc small{font-size:12px;color:var(--ink3)}
.acc .nm{font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.cnt{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;font-variant-numeric:tabular-nums}
table.cnt th,table.cnt td{padding:6px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
table.cnt th{font-weight:500;color:var(--ink3);font-size:12px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.cnt td:first-child{text-align:left}
.keys{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.keys h4{margin:4px 0;font-size:13px;color:var(--ink3);font-weight:500}
.keys button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;background:rgba(0,0,0,.22);text-align:left}
.keys button .grow{font:600 14.5px var(--nota)}
.keys button small{color:var(--ink3);font-variant-numeric:tabular-nums}
.preview-bar{position:absolute;left:50%;top:2px;transform:translate(-50%,-100%);background:var(--jade2);color:#fff;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:12px;display:flex;gap:10px;align-items:center;white-space:nowrap;z-index:9;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.preview-bar button{color:#fff;font-weight:800;text-decoration:underline}
.cands{display:flex;flex-direction:column;gap:8px}
.cand{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.06);text-align:left;width:100%;cursor:pointer}
.cand:active{background:rgba(255,255,255,.08)}
.cand .rk{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font:800 12px/22px var(--ui);text-align:center}
.cand:first-of-type .rk{background:var(--jade2)}
.cand .mv{font:700 18px var(--nota)}
.cand .sc{font-size:12px;color:var(--ink3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cand .sc b{color:var(--ink);font-size:14px}
.cand .line{grid-column:2/4;font-size:13px;line-height:1.6}
.cand .line .pv{font-size:13.5px;line-height:1.7}
.cand .line .pv span{color:var(--ink2)}
.cand .line .pv span.r{color:#f0a092}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ex-top .turn-l{font:700 16px var(--nota)}
.ex-top .toggle{width:auto;padding:6px 10px;gap:8px;font-size:13px}
.ex-top .sw{width:38px;height:22px}.ex-top .sw::after{width:16px;height:16px}.ex-top .sw.on::after{left:19px}
.ex-h{margin:14px 0 6px;font-size:12px;color:var(--ink3);font-weight:500}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== wide screens (desktop, tablets on their side) ===== */
@media (min-width:900px) and (min-aspect-ratio:1/1){
  .lob{max-width:920px;display:grid;grid-template-columns:1fr 440px;gap:0 48px;align-items:start}
  .lob .lobtop{grid-column:1/3}
  .lob .hero{grid-column:1;grid-row:2/span 6;position:sticky;top:60px;padding-top:70px}
  .lob .hero .hart{transform:scale(1.25);margin-bottom:26px}
  .lob>:not(.lobtop):not(.hero){grid-column:2}
  .lob .foot{grid-column:1/3}
  #game{display:grid;grid-template-columns:270px var(--bw,700px) var(--sp,0px);grid-template-rows:auto auto auto minmax(0,1fr) auto auto;
    grid-template-areas:"top board ." "op board ." "ticker board ." "list board ." "me board ." "tools board .";column-gap:24px;row-gap:10px;
    justify-content:center;align-content:stretch;align-items:stretch;padding:14px 24px}
  #game .topbar{grid-area:top;max-width:none}
  #game .board-wrap{grid-area:board;min-height:0}
  #opBar{grid-area:op}#meBar{grid-area:me}
  #game .plate{max-width:none;padding:10px 12px;border-radius:18px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);flex-wrap:wrap;row-gap:8px}
  #game .plate .caps{max-width:none;flex:1 1 100%;justify-content:flex-start;order:5}
  #ticker{grid-area:ticker;justify-content:flex-end;padding:0 8px}
  body:has(#game:not([hidden])) #toast{top:calc(var(--sat) + 22px)}
  #game .bubble{max-width:150px}
  #game .side-moves{grid-area:list;display:grid;align-content:start;grid-template-columns:28px 1fr 1fr;gap:2px 6px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:12px;overflow-y:auto;min-height:0}
  #game.exploring .side-moves{display:none}
  #exPanel{grid-area:list;max-width:none;align-self:start}
  #exPanel .ex-chips{flex-wrap:wrap;overflow:visible}
  #game .tools{grid-area:tools;width:100%;max-width:none;margin:0;border-radius:18px;padding:10px 0;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.06)}
  #game .tools button:hover{color:var(--gold)}
  .side-moves h5{grid-column:1/4;margin:0 0 6px;font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:1px}
  .side-moves .no{color:var(--ink3);font-size:12px;align-self:center;text-align:right;font-variant-numeric:tabular-nums}
  .side-moves span.mv{padding:5px 8px;border-radius:8px;font:600 15px var(--nota);color:var(--ink)}
  .side-moves span.mv.r{color:#ff8f7d}
  .side-moves span.mv.cur{background:rgba(232,198,123,.18);box-shadow:inset 0 0 0 1px rgba(232,198,123,.5)}
  .side-moves .empty{grid-column:1/4;color:var(--ink3);font-size:13px}
  #review,#explore{display:grid;grid-template-columns:minmax(360px,440px) var(--bw,640px);grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"head head" "paper eval" "paper board" "paper ctrl";gap:12px 32px;justify-content:center;align-content:stretch;overflow:hidden;padding:20px 32px}
  #review .rv-head,#explore .rv-head{grid-area:head;max-width:none}
  #review .evalbar,#explore .evalbar{grid-area:eval;max-width:none}
  #review .rv-board,#explore .rv-board{grid-area:board;display:flex;align-items:center;justify-content:center;min-height:0;padding:0}
  #review .rv-ctrl,#explore .rv-ctrl{grid-area:ctrl;max-width:none}
  #review .panelbox,#explore .panelbox{grid-area:paper;max-width:none;display:flex;flex-direction:column;min-height:0;align-self:stretch}
  #review .panel,#explore .panel{overflow-y:auto;flex:1;min-height:0}
  #review .moves,#explore .moves{max-height:none}
  #chart{height:260px}
  .rv-ctrl button:hover{background:rgba(255,255,255,.1)}
}
</style>
</head>
<body>
<div id="sprite"></div>

<!-- ============ lobby ============ -->
<section id="lobby" class="screen">
  <div class="lob">
    <div class="lobtop">
      <a class="pillbtn home" href="../"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg><span data-t="allGames"></span></a>
      <div class="grow"></div>
      <button class="pillbtn" id="btnRules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rule"/></svg><span data-t="rules"></span></button>
      <button class="pillbtn" id="btnLang"><svg class="ic" viewBox="0 0 24 24"><use href="#i-globe"/></svg><span></span></button>
    </div>
    <div class="hero">
      <div class="hart" id="hart"><div class="glow"></div></div>
      <div class="title"><h1><span class="w1" data-t="titleA"></span><span class="w2" data-t="titleB"></span></h1><span class="seal">楚汉</span></div>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <div id="wxTip" class="wx" hidden data-t="wx"></div>
    <div class="box" id="resumeBox" hidden></div>
    <div class="box">
      <div class="me-row">
        <div class="me-av" id="meAv"></div>
        <div class="fld"><label class="lbl" for="nick" data-t="yourName"></label><input id="nick" class="inp" maxlength="10" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="avs" id="avs"></div>
    </div>
    <div class="box">
      <div class="tabs" id="tabs"><span class="pill"></span><button data-tab="join" data-t="tabJoin"></button><button data-tab="host" data-t="tabHost"></button><button data-tab="solo" data-t="tabSolo"></button></div>
      <div id="paneJoin" class="pane">
        <div class="code-row"><input id="joinCode" class="inp" maxlength="4" placeholder="····" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn gold" id="btnJoin" data-t="join"></button></div>
        <div class="more" data-t="joinHint" style="margin-top:8px"></div>
      </div>
      <div id="paneHost" class="pane" hidden>
        <div class="opts" id="optsHost"></div>
        <button class="btn gold" id="btnCreate" data-t="create"></button>
      </div>
      <div id="paneSolo" class="pane" hidden>
        <div class="tabs two" id="modeSeg"><span class="pill"></span><button data-mode="ai" data-t="modeAi"></button><button data-mode="pvp" data-t="modePvp"></button></div>
        <div class="pane" id="paneAi">
          <div class="opp-card">
            <button class="nav" id="lvPrev"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
            <div class="opp">
              <div class="avatar big" id="homeAva"><span></span></div>
              <div class="opp-name"><b id="lvName"></b><small id="lvWho"></small></div>
              <p id="lvDesc"></p>
            </div>
            <button class="nav" id="lvNext"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><use href="#i-back"/></svg></button>
          </div>
          <div class="ladder" id="ladder"></div>
          <div class="record" id="record"></div>
          <div class="opts" id="optsAi"></div>
          <div class="engine">
            <button class="toggle" id="advTgl"><span><span data-t="advPf"></span><small data-t="advPfSub"></small></span><i class="sw"></i></button>
            <div class="eng-note" id="engNote"></div>
          </div>
          <button class="btn gold" id="btnSolo" data-t="startSolo"></button>
        </div>
        <div class="pane" id="panePvp" hidden>
          <div class="duo"><div class="avatar big" id="duoR"><span></span></div><span class="vs">vs</span><div class="avatar big" id="duoB"><span></span></div></div>
          <p class="pane-desc" data-t="pvpDesc"></p>
          <button class="toggle" id="facingTgl" style="margin-bottom:14px"><span><span data-t="facing"></span><small data-t="facingSub"></small></span><i class="sw"></i></button>
          <button class="btn gold" id="btnPvp" data-t="startPvp"></button>
        </div>
      </div>
      <div class="err" id="lobErr"></div>
    </div>
    <div class="row3">
      <button class="btn glass" id="histBtn"><svg class="ic" viewBox="0 0 24 24"><use href="#i-history"/></svg><span data-t="history"></span></button>
      <button class="btn glass" id="codeBtn"><svg class="ic" viewBox="0 0 24 24"><use href="#i-save"/></svg><span data-t="saveCode"></span></button>
      <button class="btn glass" id="setBtn"><svg class="ic" viewBox="0 0 24 24"><use href="#i-gear"/></svg><span data-t="settings"></span></button>
    </div>
    <div class="foot" data-t="foot"></div>
  </div>
</section>

<!-- ============ waiting room ============ -->
<section id="room" class="screen" hidden>
  <div class="room">
    <div class="rhead">
      <button class="tb-btn" id="roomBack"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <div class="grow"></div>
      <button class="pillbtn" id="roomRules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rule"/></svg><span data-t="rules"></span></button>
    </div>
    <div class="codebig"><div class="l" data-t="roomCode"></div><div class="c" id="roomCode">····</div></div>
    <div class="share"><button class="btn glass sm" id="btnCopy"><svg class="ic" viewBox="0 0 24 24"><use href="#i-copy"/></svg><span data-t="copyInvite"></span></button><button class="btn glass sm" id="btnShare"><svg class="ic" viewBox="0 0 24 24"><use href="#i-share"/></svg><span data-t="share"></span></button></div>
    <div class="seats2" id="seats2"></div>
    <div class="opts" id="optsRoom"></div>
    <div class="rules-sum" id="rulesSum"></div>
    <div class="ractions" id="roomActs"></div>
  </div>
</section>

<!-- ============ game ============ -->
<section id="game" class="screen" hidden>
  <div class="topbar">
    <button class="tb-btn" id="btnMenu"><svg viewBox="0 0 24 24"><use href="#i-menu"/></svg><span class="netdot" id="netDot" hidden></span></button>
    <div class="tb-info" id="tbInfo"></div>
    <button class="tb-btn" id="btnChat" hidden><svg viewBox="0 0 24 24"><use href="#i-chat"/></svg></button>
    <button class="tb-btn" id="btnSound"></button>
  </div>
  <div class="plate" id="opBar">
    <div class="who">
      <div class="avatar" id="opAva"><span></span><i class="bubble" id="opBubble"></i></div>
      <div class="who-txt"><b id="opName"></b><small id="opSub"></small></div>
    </div>
    <div class="caps" id="capsOp"></div>
    <div class="clock" id="opClock" hidden></div>
  </div>
  <div class="board-wrap" id="gWrap"><div class="board" id="gBoard"></div></div>
  <div class="ticker" id="ticker"></div>
  <div class="side-moves" id="gMoves"></div>
  <div class="expanel" id="exPanel" hidden>
    <div class="ex-line"><span class="ex-badge" data-t="exploring"></span><span id="exTurn"></span></div>
    <div class="ex-chips" id="exChips"></div>
  </div>
  <div class="plate" id="meBar">
    <div class="who">
      <div class="avatar" id="meAva"><span></span><i class="bubble up" id="meBubble"></i></div>
      <div class="who-txt"><b id="meName"></b><small id="meSub"></small></div>
    </div>
    <div class="caps" id="capsMe"></div>
    <div class="turn" id="turnTag"></div>
    <div class="clock" id="meClock" hidden></div>
  </div>
  <nav class="tools five" id="exTools" hidden>
    <button id="eQuit"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg><span data-t="exQuit"></span></button>
    <button id="eBack"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg><span data-t="exBack"></span></button>
    <button id="eFlip"><svg viewBox="0 0 24 24"><use href="#i-flip"/></svg><span data-t="flip"></span></button>
    <button id="eFwd"><svg viewBox="0 0 24 24"><use href="#i-redo"/></svg><span data-t="exFwd"></span></button>
    <button id="eReset"><svg viewBox="0 0 24 24"><use href="#i-reset"/></svg><span data-t="exReset"></span></button>
  </nav>
  <nav class="tools" id="mainTools">
    <button id="tUndo"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg><span data-t="undo"></span></button>
    <button id="tExplore"><svg viewBox="0 0 24 24"><use href="#i-branch"/></svg><span data-t="explore"></span></button>
    <button id="tHint"><svg viewBox="0 0 24 24"><use href="#i-hint"/></svg><span data-t="hint"></span></button>
    <button id="tDraw" hidden><svg viewBox="0 0 24 24"><use href="#i-hand"/></svg><span data-t="offerDraw"></span></button>
    <button id="tResign"><svg viewBox="0 0 24 24"><use href="#i-flag"/></svg><span id="tResignTx"></span></button>
  </nav>
</section>

<!-- ============ review ============ -->
<section id="review" class="screen" hidden>
  <div class="rv-head">
    <button class="btn glass xs" id="rvBack"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg><span data-t="back"></span></button>
    <div class="rv-title" id="rvTitle"></div>
    <button class="btn glass xs" id="rvExplore" data-t="explore"></button>
    <button class="btn gold xs" id="rvRetry" data-t="retry"></button>
  </div>
  <div class="evalbar"><span class="er" id="evR"></span><div class="track"><i id="evFill"></i></div><span class="eb" id="evB"></span></div>
  <div class="rv-board"><div class="board" id="rBoard"></div></div>
  <div class="rv-ctrl">
    <button id="rFirst"><svg viewBox="0 0 24 24"><use href="#i-first"/></svg></button>
    <button id="rPrev"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <button id="rPlay"><svg viewBox="0 0 24 24" id="rPlayIco"><use href="#i-play"/></svg></button>
    <button id="rNext"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><use href="#i-back"/></svg></button>
    <button id="rLast"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><use href="#i-first"/></svg></button>
  </div>
  <div class="panelbox">
    <div class="ptabs" id="ptabs">
      <button data-tab="chart" class="on" data-t="tabChart"></button><button data-tab="ana" data-t="tabAna"></button><button data-tab="moves" data-t="tabMoves"></button><button data-tab="report" data-t="tabReport"></button>
    </div>
    <div class="panel" id="p-chart">
      <div class="chart-box"><canvas id="chart"></canvas></div>
      <div class="chart-cap" id="chartCap"></div>
      <div class="prog"><i id="progBar"></i></div>
      <div class="prog-txt"><span id="progTxt"></span><button class="linkbtn" id="deepBtn" data-t="deep"></button></div>
      <div class="pfcta" id="pfCta" hidden></div>
    </div>
    <div class="panel" id="p-ana" hidden></div>
    <div class="panel" id="p-moves" hidden></div>
    <div class="panel" id="p-report" hidden></div>
  </div>
</section>

<!-- ============ explore ============ -->
<section id="explore" class="screen" hidden>
  <div class="rv-head">
    <button class="btn glass xs" id="xBack"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg><span id="xBackTx"></span></button>
    <div class="rv-title" id="xTitle"></div>
    <button class="btn gold xs" id="xPlay" data-t="playOn"></button>
  </div>
  <div class="evalbar"><span class="er" id="xEvR"></span><div class="track"><i id="xEvFill"></i></div><span class="eb" id="xEvB"></span></div>
  <div class="rv-board"><div class="board" id="xBoard"></div></div>
  <div class="rv-ctrl">
    <button id="xFirst"><svg viewBox="0 0 24 24"><use href="#i-first"/></svg></button>
    <button id="xPrev"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg></button>
    <button id="xAi"><span class="txt" data-t="engineMove"></span></button>
    <button id="xNext"><svg viewBox="0 0 24 24"><use href="#i-redo"/></svg></button>
    <button id="xFlip"><svg viewBox="0 0 24 24"><use href="#i-flip"/></svg></button>
  </div>
  <div class="panelbox"><div class="panel">
    <div class="ex-top"><span class="turn-l" id="xTurn"></span>
      <button class="toggle" id="xLive"><span data-t="live"></span><i class="sw on"></i></button></div>
    <div class="cands" id="xCands"></div>
    <h4 class="ex-h" id="xMovesH"></h4>
    <div class="moves" id="xMoves"></div>
  </div></div>
</section>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet"></div>
<div id="fx"></div>
<div id="toast" hidden></div>
<div id="overlay" hidden><div class="card" id="ovCard"></div></div>

        ['General', 'stays inside the palace and moves one point up, down or sideways. The two generals may never face each other along an open file.'],
        ['Advisor', 'stays inside the palace and moves one point diagonally.'],
        ['Elephant', 'moves exactly two points diagonally and cannot cross the river. A piece on the point in between blocks it.'],
        ['Horse', 'moves one point straight, then one diagonally outward. A piece right next to it in that direction blocks the move.'],
        ['Chariot', 'moves any distance along a file or a rank, like a rook. It cannot jump.'],
        ['Cannon', 'moves like the chariot. To capture, it must jump over exactly one piece of either colour standing in between.'],
        ['Soldier', 'moves one point forward. Once across the river it may also step sideways, but never backward.'],

      rulesMore: '<h4>Other rules</h4><p><b>Check</b>: when your general is attacked you must deal with it, and no move may leave your own general in check.</p><p><b>Perpetual check</b> is not allowed. When the same position comes up three times, the side that kept checking loses; if neither did, the game is drawn.</p><p><b>Draws</b>: sixty moves by each side without a capture, neither side having a piece left that can cross the river, or (online) both players agreeing.</p><h4>Reading the moves</h4><p>A move is written like <b>C2=5</b>: the piece, the file it stands on, then <b>=</b> sideways, <b>+</b> forward or <b>-</b> backward, then the file it lands on (for a straight move, how many points). Each side counts files 1 to 9 from its own right. K general, A advisor, E elephant, H horse, R chariot, C cannon, P soldier.</p>',

      rulesMore: '<h4>其他规则</h4><p><b>将军</b>：自己的将（帅）被攻击时必须应将，走完以后也不能让自己被将军。</p><p><b>长将</b>：不能一直重复将军。同一局面出现三次时，一直将军的一方判负；双方都没有长将就算和棋。</p><p><b>和棋</b>：六十回合没有吃子、双方都没有能过河进攻的子，或者联机时双方同意，都算和棋。</p><h4>看棋谱</h4><p>着法写成四个字，比如“炮二平五”：炮从第二路横走到第五路。红方的路数从自己右手边数起，写作一到九；黑方写作 1 到 9。“进”是往前，“退”是往后，“平”是横走。</p>',

    // file numbers: black's files along the top, red's along the bottom (as each side counts them)
    const ls = c * .24, band = q - B.ps / 2, ty = band / 2 + ls * .36 - c * .02;   // centred in the strip above the back rank
    s += `<g font-size="${f(ls)}" text-anchor="middle" font-family='${zh() ? 'XQPiece,"Songti SC","Noto Serif SC",serif' : 'Manrope,sans-serif'}' font-weight="${zh() ? 700 : 600}">`;
    for (let k = 0; k < 9; k++) {
      const col = B.flip ? 8 - k : k;
      const red = zh() ? RN[8 - col] : String(9 - col), blk = String(col + 1);
      s += `<text x="${f(X(k))}" y="${f(ty)}">${B.flip ? red : blk}</text><text x="${f(X(k))}" y="${f(B.H - band / 2 + ls * .36 + c * .05)}">${B.flip ? blk : red}</text>`;
    }
    s += `</g>`;
    grid.setAttribute('viewBox', `0 0 ${B.W} ${B.H}`); grid.innerHTML = s;
    arrows.setAttribute('viewBox', `0 0 ${B.W} ${B.H}`);
  }
  function place(node, sq) { const { x, y } = B.xy(sq); node.style.transform = `translate(${x - B.ps / 2}px,${y - B.ps / 2}px)`; }
  function makePiece(pc) {
    const d = document.createElement('div'); d.className = 'pc ' + (sideOf(pc) ? 'k' : 'r');
    d.innerHTML = `<div class="face">${glyph(pc)}</div>`; return d;
  }
  B.setFlip = f => { f = !!f; el.classList.toggle('flipped', f); if (B.flip != f) { B.flip = f; drawGrid(); B.items.forEach(it => place(it.el, it.sq)); if (B.lastMarks) B.marks(B.lastMarks); } };
  B.clear = () => { B.items.forEach(it => it.el.remove()); B.items = []; B.lastMarks = null; marks.innerHTML = ''; arrows.innerHTML = ''; badges.innerHTML = ''; };
  // language, piece style or board colour changed
  B.restyle = () => {
    el.classList.toggle('wood', DB.settings.board == 'wood');
    drawGrid();
    B.items.forEach(it => { it.el.firstChild.innerHTML = glyph(it.pc); });
    if (B.lastMarks) B.marks(B.lastMarks);
  };
  B.setPosition = (sqArr, animate = true) => {
    const target = [];
    for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) { const s = sqOf(r, c), pc = sqArr[s]; if (pc) target.push({ sq: s, pc, done: false }); }
    const free = B.items.slice(); const next = [];
    target.forEach(t => { const i = free.findIndex(it => it.sq == t.sq && it.pc == t.pc); if (i >= 0) { next.push(free[i]); free.splice(i, 1); t.done = true; } });
    target.forEach(t => {
      if (t.done) return;
      let bi = -1, bd = 1e9; const [tr, tc] = rc(t.sq);
      free.forEach((it, i) => { if (it.pc != t.pc) return; const [r, c] = rc(it.sq), dd = Math.abs(r - tr) + Math.abs(c - tc); if (dd < bd) { bd = dd; bi = i; } });
      if (bi >= 0) {
        const it = free.splice(bi, 1)[0]; it.sq = t.sq;
        if (!animate) it.el.style.transition = 'none';
        it.el.classList.add('moving'); place(it.el, t.sq);
        if (!animate) { it.el.offsetWidth; it.el.style.transition = ''; }
        setTimeout(() => it.el.classList.remove('moving'), 300);
        next.push(it);
      } else {
        const node = makePiece(t.pc); node.style.transition = 'none'; place(node, t.sq); pcsL.appendChild(node);
        node.offsetWidth; node.style.transition = ''; if (animate) node.classList.add('born');
        next.push({ el: node, sq: t.sq, pc: t.pc });
      }
    });
    free.forEach(it => {
      if (animate) { setTimeout(() => { it.el.classList.add('dead'); it.el.style.transform += ' scale(.5)'; }, 170); setTimeout(() => it.el.remove(), 480); }
      else it.el.remove();
    });
    B.items = next;
  };
  const ACOL = { green: '#35c98a', orange: '#f0913a', blue: '#6aa5f5' };
  B.marks = m => {
    B.lastMarks = m;
    let h = '';
    const at = (sq, cls) => { const { x, y } = B.xy(sq); return `<div class="mk ${cls}" style="transform:translate(${x}px,${y}px) translate(-50%,-50%)"></div>`; };
    if (m.last) { h += at(m.last[0], 'from') + at(m.last[1], 'to'); }
    (m.dots || []).forEach(d => h += at(d.sq, d.cap ? 'ring' : 'dot'));
    marks.innerHTML = h;
    B.items.forEach(it => { it.el.classList.toggle('sel', it.sq == m.sel); it.el.classList.toggle('chk', it.sq == m.check); });
    let a = '<defs>' + Object.keys(ACOL).map(k => `<marker id="ah${k}${uid}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 10 5 0 10z" fill="${ACOL[k]}"/></marker>`).join('') + '</defs>';
    (m.arrows || []).forEach(ar => {
      if (!ar.mv) return;
      const p1 = B.xy(SRC(ar.mv)), p2 = B.xy(DST(ar.mv)), dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;
      const sh = B.cell * .18, ex = p2.x - dx / len * B.cell * .32, ey = p2.y - dy / len * B.cell * .32, sx = p1.x + dx / len * sh, sy = p1.y + dy / len * sh;
      const k = ACOL[ar.color] ? ar.color : 'green', col = ACOL[k];
      const op = ar.op || .9, wd = B.cell * (ar.thin ? .1 : .15);
      a += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="${wd}" stroke-linecap="round" opacity="${op}" marker-end="url(#ah${k}${uid})" ${ar.dash ? `stroke-dasharray="${B.cell * .2} ${B.cell * .16}"` : ''}/>
        <circle cx="${p1.x}" cy="${p1.y}" r="${B.cell * .12}" fill="${col}" opacity="${op}"/>`;
    });
    arrows.innerHTML = a;
    let bh = '';
    if (m.badge) {
      const { x, y } = B.xy(m.badge.sq);
      bh = `<div class="bdgw" style="transform:translate(${x + B.ps * .26}px,${y - B.ps * .7}px)"><div class="bdg ${CLS[m.badge.cls].c}">${clsT(m.badge.cls)}</div></div>`;
    }
    badges.innerHTML = bh;
  };
  el.classList.toggle('wood', DB.settings.board == 'wood');
  BOARDS.push(B);
  return B;
}

// ---- save code: everything (settings, records, the game in progress) as text to copy and paste back.
// Storage in in-app browsers such as WeChat can be wiped, so this is how progress is carried over.
// The format is the one the earlier stand-alone version of this game wrote, so its codes still load.
const CODE_TAG = 'MYXQ';
const b64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = t => { const s = atob(t.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function zipBytes(u8, inflate) {
  const cs = inflate ? new DecompressionStream('deflate-raw') : new CompressionStream('deflate-raw');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer());
}
// moves travel as one string of 4-letter coordinates; analysis is left out (it is recomputed in review)
function packSave() {
  const g = r => { const o = Object.assign({}, r); delete o.analysis; delete o.anaEngine; delete o.deep; o.moves = mvStr(r.moves); return o; };
  return { v: 1, g: 2, t: Date.now(), settings: DB.settings, stats: DB.stats, history: DB.history.map(g), current: DB.current ? g(DB.current) : null };
}
async function makeCode() {
  const raw = new TextEncoder().encode(JSON.stringify(packSave()));
  try { if (typeof CompressionStream != 'undefined') return CODE_TAG + '1.' + b64u(await zipBytes(raw)); } catch (e) {}
  return CODE_TAG + '0.' + b64u(raw);
}
async function readCode(text) {
  const t = (text || '').replace(/\s+/g, ''), m = t.match(/MYXQ([01])\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error(T('codeBad'));
  if (m[1] == '1' && typeof DecompressionStream == 'undefined') throw new Error(T('codeOld'));
  let d;
  try { let u8 = unb64u(m[2]); if (m[1] == '1') u8 = await zipBytes(u8, true); d = JSON.parse(new TextDecoder().decode(u8)); } catch (e) { d = null; }
  if (!d || d.v != 1 || !Array.isArray(d.history)) throw new Error(T('codeCut'));
  const g = r => Object.assign({}, r, { moves: strMv(r.moves), reason: REASON_OLD[r.reason] || r.reason });
  const ok = r => { const p = new E.Position(); p.startpos(); for (const mv of r.moves) { if (p.legalMoves().indexOf(mv) < 0) return false; p.makeMove(mv); } return true; };
  const hist = d.history.map(g).filter(ok), cur = d.current ? g(d.current) : null;
  // a code from the earlier version: keep its play settings, not its engine choice (that would start a 48 MB download)
  const s = d.settings || {}, keep = d.g == 2 ? s : { level: s.level, side: s.side, sound: s.sound, voice: s.voice, facing: s.facing, pvBoth: s.pvBoth };
  for (const k in keep) if (keep[k] == null) delete keep[k];
  return { t: d.t, settings: keep, stats: d.stats || {}, history: hist, current: cur && ok(cur) ? cur : null };
}
function openCode() {
  const n = DB.history.length, st = Object.values(DB.stats).reduce((a, x) => a + (x.w || 0) + (x.d || 0) + (x.l || 0), 0);
  const sh = sheet(head(T('hCode')) + `<p class="note">${T('codeIntro', { g: st, n })}</p>
    <div class="code-sec"><b>${T('codeBackup')}</b><textarea class="code-box" id="codeOut" readonly placeholder="${esc(T('codeMaking'))}"></textarea>
      <div class="btns"><button class="btn gold" id="codeCopy">${T('codeCopy')}</button></div></div>
    <div class="code-sec"><b>${T('codeRestore')}</b><textarea class="code-box" id="codeIn" placeholder="${esc(T('codePh'))}" autocomplete="off" spellcheck="false"></textarea>
      <div class="btns"><button class="btn glass" id="codeLoad">${T('codeLoad')}</button></div></div>`, { id: 'code' });

$('gBoard').addEventListener('pointerdown', e => {
  const sq = gb.hit(e.clientX, e.clientY);
  if (G.ex) { if (sq >= 0) exTap(sq); return; }
  if (G.over || sq < 0) return;
  const p = G.pos, mover = p.sd, pc = p.sq[sq];

  if (pc && sideOf(pc) == mover) { G.sel = G.sel == sq ? -1 : sq; AU.select(); renderGame(false); return; }
  if (G.sel < 0) { if (isPvp() && pc) toast(T('turnOf', { s: SIDE(mover) })); return; }
  const mv = MOVE(G.sel, sq);
  if (legalFrom(p, G.sel).indexOf(mv) >= 0) { playMove(mv, true); return; }

// a move lands on the game board (mine, the computer's, or one that came over the network)
function playMove(mv, byHuman) {
  const p = G.pos, sd = p.sd, cap = p.sq[DST(mv)], txt = notation(p, mv), n = G.moves.length;
  G.moves.push(mv); G.sel = -1; G.hint = 0;
  p.fromMoves(G.moves);
  renderGame(true);
  setTimeout(() => cap ? AU.capture() : AU.place(), 200);
  const chk = p.inCheck(), end = checkEnd(p);
  setTicker(sd, txt, chk ? T('chkChip') : cap ? T('capChip', { p: pcName(cap) }) : '', chk);
  if (cap && isAi()) { if (byHuman) say(pick(T('sayLost')), 'sad'); else say(pick(T('sayTook')), 'happy'); }
  if (end && end.reason == 'mate') setTimeout(() => { AU.check(); bigFx(T('fxMate')); }, 260);
  else if (chk && !end) setTimeout(() => { AU.check(); AU.say(T('vCheck')); bigFx(T('fxCheck')); if (!byHuman) say(T('sayCheck'), 'happy'); }, 260);
  if (isNet()) { if (byHuman) S.move(mv2uci(mv), n); return; }
  saveCurrent();
  // lock the board right away; the result follows after the last move has landed
  if (end) { G.over = true; G.thinking = false; renderGame(false); setTimeout(() => finish(end), 650); return; }
  if (byHuman && isAi()) aiTurn();
}
function checkEnd(p) {
  if (p.isMate()) return { winner: 1 - p.sd, reason: p.inCheck() ? 'mate' : 'stale' };
  const rep = p.repStatus(2);
  if (rep) {
    if ((rep & 2) && !(rep & 4)) return { winner: 1 - p.sd, reason: 'perp' };
    if ((rep & 4) && !(rep & 2)) return { winner: p.sd, reason: 'perp' };
    return { winner: -1, reason: 'rep' };
  }
  let n = 0; for (let i = p.pcList.length - 1; i > 0 && p.pcList[i] == 0 && p.mvList[i]; i--) n++;
  if (n >= 120) return { winner: -1, reason: 'sixty' };
  if (p.noAttackers()) return { winner: -1, reason: 'nomat' };
  return null;
}

function aiTurn() {
  if (G.over || !isAi()) return;
  const tok = ++G.token, t0 = Date.now();
  G.thinking = true; $('opAva').classList.add('think'); renderGame(false);
  const lv = G.level;
  const bubbleT = setTimeout(() => { if (G.token == tok && G.thinking) say(T(lv >= 4 ? 'sayThinkLong' : 'sayThink')); }, 900);
  Eng.ai(G.moves.slice(), lv).then(r => {
    if (tok != G.token || G.over) return;
    const minWait = lv <= 1 ? 650 : lv <= 3 ? 500 : 250;
    setTimeout(() => {
      if (tok != G.token) return;
      clearTimeout(bubbleT); G.thinking = false; $('opAva').classList.remove('think');
      if (!r || !r.mv) { renderGame(false); return; }
      playMove(r.mv, false);
    }, Math.max(0, minWait - (Date.now() - t0)));
  });
}

}

// ---- hints ----
// does mv shuffle back: undo our previous move, or bring back a position already seen with the same side to move
function repeatsPos(moves, mv) {
  const prev = moves[moves.length - 2];
  if (prev && SRC(mv) == DST(prev) && DST(mv) == SRC(prev)) return true;
  const p = new E.Position(); p.startpos(); const seen = new Set();
  if (moves.length % 2) seen.add(p.key + ':' + p.lock);
  moves.forEach((m, i) => { p.makeMove(m); if ((moves.length - i) % 2 == 0) seen.add(p.key + ':' + p.lock); });
  p.makeMove(mv);
  return seen.has(p.key + ':' + p.lock);
}
// the engine's best move; but when that only shuffles back and forth in a position that is not lost, look
// for the best move that keeps the game going and take it if it is about as good
async function hintMove(moves, ms) {
  const r = await Eng.analyze(moves, ms);
  if (!r || !r.mv || r.eng != 'pf' || realMate(r.vl) > 0 || r.vl < -150 || !repeatsPos(moves, r.mv)) return r;
  const p = new E.Position(); p.fromMoves(moves);
  const alts = p.legalMoves().filter(m => !repeatsPos(moves, m));
  if (!alts.length) return r;
  const a = await PF.analyze(moves, Math.round(ms * .6), 1, alts);
  return a && a.mv && alts.indexOf(a.mv) >= 0 && !realMate(-a.vl) && a.vl >= Math.min(r.vl, 0) - 60 ? a : r;
}

// ---------- host ----------
function startHost(o) {
  const restore = o.restore || null, st = DB.settings;
  let code = restore ? restore.code : rid(4);
  const room = restore ? restore.room : { code, started: false, gameNo: 0, gid: 0, p: [null, null], red: 0, opt: { side: st.hostSide, clock: st.hostClock }, moves: '', over: null, ask: null, ready: [false, false], score: [0, 0, 0], clk: null };
  const tokens = restore && restore.tokens ? restore.tokens : [token, ''];

  if (room.p[1]) room.p[1].on = false;
  room.ask = null; if (room.clk) room.clk.run = -1;
  let conn = null, seen = 0, peer = null, closing = false, tries = 0, askSeq = 0, clkT0 = 0, flagT = 0, syncQ = false;
  const lastAsk = [{}, {}], pos = new E.Position();

  const moves = () => strMv(room.moves);
  const turn = () => (room.moves.length / 4) % 2;          // side to move: 0 red, 1 black
  const sideOfP = i => i == room.red ? 0 : 1, pOfSide = sd => sd == 0 ? room.red : 1 - room.red;
  const guestOn = () => !!(room.p[1] && room.p[1].on && !room.p[1].gone);
