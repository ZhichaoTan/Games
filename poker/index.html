<title>Midnight Hold'em</title>
<script>/* Keeps the page at its normal size on phones. Shared by the hub, Hold'em and Mahjong (each build inlines it in <head>).
   iOS Safari ignores user-scalable=no, so a double tap or a pinch could zoom the page, and inside a game the table
   then wouldn't pinch back out. Double taps are covered by touch-action:manipulation on every element, pinches by
   cancelling Safari's gesture events. If the page still ends up zoomed (a text field, a system setting), pinching is
   allowed again until it's back to normal size and a small note says how to zoom out. */
(function () {
  var root = document.documentElement, vv = window.visualViewport;
  var st = document.createElement('style');
  st.textContent = '*,*::before,*::after{touch-action:manipulation}html.zoomed #game{touch-action:manipulation}' +
    '#zoomhint{position:fixed;left:0;top:0;z-index:2147483000;display:flex;justify-content:center;pointer-events:none;transform-origin:0 0;opacity:0;transition:opacity .25s}' +
    '#zoomhint.on{opacity:1}#zoomhint span{margin-top:calc(env(safe-area-inset-top,0px) + 10px);padding:9px 16px;border-radius:999px;background:rgba(12,14,13,.9);color:#f4efe4;' +
    'font:700 14px/1.2 -apple-system,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12);white-space:nowrap}';
  (document.head || root).appendChild(st);
  var zoomed = function () { return !!vv && vv.scale > 1.02; };
  var block = function (e) { if (!zoomed() && e.cancelable) e.preventDefault(); };
  document.addEventListener('gesturestart', block, { passive: false });
  document.addEventListener('gesturechange', block, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if ((e.touches && e.touches.length > 1) || (e.scale && e.scale !== 1)) block(e);
  }, { passive: false });
  if (!vv) return;
  var hint = null, timer = 0;
  var place = function () {
    if (!hint) return;
    hint.style.width = innerWidth + 'px';
    hint.style.transform = 'translate(' + vv.offsetLeft + 'px,' + vv.offsetTop + 'px) scale(' + (1 / vv.scale) + ')';
  };
  var sync = function () {
    var z = zoomed();
    if (z !== root.classList.contains('zoomed')) root.classList.toggle('zoomed', z);
    clearTimeout(timer);
    if (z) {
      if (!hint) {
        hint = document.createElement('div'); hint.id = 'zoomhint'; hint.setAttribute('aria-hidden', 'true');
        hint.appendChild(document.createElement('span'));
        document.body.appendChild(hint);
      }
      hint.firstChild.textContent = /^zh/.test(root.lang) ? '双指捏合，缩回原来大小' : 'Pinch with two fingers to zoom back out';
      place();
      timer = setTimeout(function () { if (zoomed()) hint.classList.add('on'); }, 700);
    } else if (hint) hint.classList.remove('on');
  };
  vv.addEventListener('resize', sync);
  vv.addEventListener('scroll', function () { if (zoomed()) place(); });
})();
</script>

/* 布局：竖屏一屏 —— 顶栏 / 台灯照着的跑道形牌桌（自己永远在正下方）/ 固定高度的玻璃操作台 */
:root{
  --night:#0a0e13; --night-2:#131a22; --night-3:#1a232d;
  --felt:#0f5a4c; --felt-hi:#1d7f68; --felt-lo:#07362e;
  --walnut:#3b2517; --walnut-hi:#62402a; --walnut-lo:#1a0f08;
  --brass:#d3ac63; --brass-hi:#f4ddA6; --brass-lo:#8c682b;
  --ivory:#f9f4e9; --ivory-2:#ebe2cf;
  --ink:#1a1c25; --crimson:#c33641; --vermilion:#cf3a2b; --sea:#2a5a63;
  --text:#efe8da; --mute:#98a3ad; --faint:#5e6a75; --line:rgba(239,232,218,.12);
  --glass:rgba(17,23,30,.74); --glass-2:rgba(255,255,255,.06);
  --display:"Fraunces","Songti SC","STSong",Georgia,serif;
  --ui:"Manrope",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --dock:166px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--text);font:500 14px/1.4 var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(90% 60% at 50% 12%,rgba(255,214,150,.10),transparent 60%),radial-gradient(140% 90% at 50% 40%,#16202a 0%,#0c1117 55%,#06080b 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{font-family:var(--ui);font-size:16px}
[hidden]{display:none!important}
svg.u{display:block;width:100%;height:100%}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ====================== 纸牌 ====================== */
.card{--w:44px;position:relative;width:var(--w);height:calc(var(--w)*1.4);perspective:700px;flex:none}
.card-in{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.75,.25,1)}
.card.down .card-in{transform:rotateY(180deg)}
.card.notr .card-in{transition:none}
.face,.back{position:absolute;inset:0;border-radius:calc(var(--w)*.12);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face{background:linear-gradient(165deg,#fffdf8 0%,#f6f0e3 60%,#ece3d0 100%);color:var(--ink);
  box-shadow:inset 0 0 0 .6px rgba(0,0,0,.18),inset 0 1px 0 #fff,0 calc(var(--w)*.06) calc(var(--w)*.18) rgba(0,0,0,.42)}
.card.red .face{color:var(--crimson)}
.face .r{position:absolute;left:9%;top:4%;font:700 calc(var(--w)*.47)/1 var(--display);letter-spacing:-.03em;font-variation-settings:"SOFT" 50}
.face .r.ten{letter-spacing:-.09em;font-size:calc(var(--w)*.42);left:6%}
.face .p1{position:absolute;left:11%;top:41%;width:26%;height:26%;fill:currentColor}
.face .p2{position:absolute;right:7%;bottom:6%;width:52%;height:52%;fill:currentColor}
.face::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 38%);pointer-events:none}
.back{transform:rotateY(180deg);overflow:hidden;
  background:var(--moon) center/38% no-repeat,
    repeating-linear-gradient(45deg,rgba(211,172,99,.30) 0 .8px,transparent .8px 6px),
    repeating-linear-gradient(-45deg,rgba(211,172,99,.30) 0 .8px,transparent .8px 6px),
    radial-gradient(circle at 50% 50%,#24345a,#121a2e 75%);
  box-shadow:inset 0 0 0 calc(var(--w)*.055) #efe6d2,inset 0 0 0 calc(var(--w)*.085) #121a2e,inset 0 0 0 calc(var(--w)*.1) rgba(211,172,99,.8),0 calc(var(--w)*.06) calc(var(--w)*.16) rgba(0,0,0,.45)}
.card.sm{--w:23px}.card.md{--w:33px}.card.lg{--w:56px}.card.xl{--w:76px}
.card.sm .back{background-size:46%,auto,auto,auto}
.card.dim .face{filter:brightness(.55) saturate(.6)}
.card.hi .face{box-shadow:inset 0 0 0 .6px rgba(0,0,0,.18),0 0 0 2px var(--brass),0 0 18px rgba(244,221,166,.55),0 6px 14px rgba(0,0,0,.5)}
.card.hi{translate:0 -5px;transition:translate .35s}

/* ====================== 大厅 ====================== */
#lobby{overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:center}
.lob{width:100%;max-width:440px;padding:18px max(18px,env(safe-area-inset-left,0px)) 34px;display:flex;flex-direction:column;gap:16px;position:relative}
.lobtop{display:flex;align-items:center;gap:8px;min-height:36px;position:relative;z-index:2}
.lobtop .grow{flex:1;min-width:0}
.home-btn{display:flex;align-items:center;gap:4px;height:34px;padding:0 13px 0 8px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap;transition:background .2s}
.home-btn svg{width:18px;height:18px;color:var(--brass)}
.home-btn:active,.lang-btn:active,.wallet-btn:active{background:rgba(255,255,255,.1)}
.lang-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;
  background:var(--glass-2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.lang-btn svg{width:16px;height:16px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:26px}
.fan{position:relative;height:150px;width:240px;margin-bottom:2px}
.fan .card{position:absolute;left:50%;bottom:6px;transform-origin:50% 120%;margin-left:-38px}
.fan .f0{rotate:-17deg;translate:-30px 8px}
.fan .f1{rotate:-3deg;translate:-4px -4px;z-index:1}
.fan .f2{rotate:13deg;translate:26px 4px;z-index:2}
.fan .chips{position:absolute;right:16px;bottom:-8px;width:46px;height:46px;z-index:2;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.fan .chips svg{position:absolute;width:40px;height:40px}
.fan .glow{position:absolute;left:50%;top:60%;width:300px;height:200px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(244,221,166,.22),transparent);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.fan{animation:float 6s ease-in-out infinite}}
@keyframes float{50%{transform:translateY(-6px)}}
.mark{display:flex;align-items:center;gap:14px}
.mark h1{margin:0;display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.mark .w1{font:italic 600 52px/0.95 var(--display);letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff7e6 10%,#f0d9a0 55%,#c99a4a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 4px 4px 0}
.mark .w2{font:800 12px/1 var(--ui);letter-spacing:.62em;color:var(--brass);margin-top:6px;padding-left:3px}
.seal{width:32px;height:56px;rotate:5deg;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.tagline{margin:4px 0 0;max-width:30ch;text-align:center;color:var(--mute);font-size:14px;line-height:1.55;text-wrap:balance}
.box{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 20px 40px rgba(0,0,0,.25)}
.lbl{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.me-row{display:flex;align-items:center;gap:12px}
.me-av{width:56px;height:56px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--brass),0 0 0 4px rgba(211,172,99,.18),0 8px 18px rgba(0,0,0,.4);overflow:hidden}
.me-row .fld{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.inp{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:12px 14px;font-size:16px;font-weight:700;
  transition:border-color .2s,background .2s}
.inp:focus{outline:none;border-color:rgba(211,172,99,.6);background:rgba(0,0,0,.4)}
.inp::placeholder{color:var(--faint);font-weight:600}
.avs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.avs button{aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;transition:transform .15s,box-shadow .2s;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.avs button:active{transform:scale(.92)}
.avs button.on{box-shadow:0 0 0 2px var(--brass),0 0 14px rgba(211,172,99,.45)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;position:relative}
.tabs button{position:relative;z-index:1;padding:10px 0;font-weight:800;font-size:14px;color:var(--mute);transition:color .2s}
.tabs button.on{color:var(--ink)}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:linear-gradient(180deg,#f6e2b0,#d3ac63);transition:transform .3s cubic-bezier(.3,.8,.3,1)}
.tabs.r .pill{transform:translateX(100%)}
.code-row{display:flex;gap:10px}
.inp.code{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.5em;text-align:center;font:700 24px/1 var(--display);padding:12px 0 12px .5em}
.btn{border-radius:16px;padding:14px 16px;font-weight:800;font-size:16px;letter-spacing:.01em;transition:transform .12s,filter .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#f7e3b2 0%,#ddb56b 45%,#b88a3c 100%);color:#22180a;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.18),0 8px 20px rgba(211,172,99,.22)}
.btn.glass{background:var(--glass-2);border:1px solid var(--line);color:var(--text)}
.btn.ghost{color:var(--mute);font-weight:700;font-size:14px;padding:10px}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:12px}
.btn svg{width:18px;height:18px}
.opts{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center}
.opts>span{font-size:12px;font-weight:700;color:var(--mute)}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mute);transition:background .2s,color .2s}
.seg button.on{background:rgba(255,255,255,.1);color:var(--text);box-shadow:inset 0 0 0 1px rgba(211,172,99,.45)}
.note{font-size:12.5px;color:var(--faint);line-height:1.65;text-align:center;margin:0 6px;text-wrap:pretty}
.err{color:#ff9b9b;font-size:13px;min-height:1.2em;text-align:center;font-weight:600}
.wx{background:linear-gradient(180deg,#f4ddA6,#d3ac63);color:#22180a;font-size:13px;font-weight:700;padding:10px 14px;border-radius:14px;line-height:1.5}

/* ====================== 牌桌 ====================== */
.top{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-left,0px)) 4px;position:relative;z-index:6}
.ib{width:38px;height:38px;border-radius:50%;background:var(--glass-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);flex:none}
.ib svg{width:19px;height:19px}
.room{display:flex;align-items:center;gap:8px;padding:0 14px;height:38px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.room b{font:700 16px/1 var(--display);letter-spacing:.14em;color:var(--brass-hi)}
.dot{width:7px;height:7px;border-radius:50%;background:#53d88a;box-shadow:0 0 8px #53d88a}
.dot.bad{background:#ff6b6b;box-shadow:0 0 8px #ff6b6b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.sp{flex:1}
#table{position:relative;flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto}
#rim{position:absolute;border-radius:9999px;
  background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(0,0,0,.3)),
    repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px),
    linear-gradient(180deg,var(--walnut-hi),var(--walnut) 40%,var(--walnut-lo));
  box-shadow:0 26px 60px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 6px rgba(0,0,0,.4)}
#felt{position:absolute;inset:16px;border-radius:9999px;overflow:hidden;
  background:var(--noise),radial-gradient(85% 60% at 50% 34%,var(--felt-hi) 0%,var(--felt) 48%,var(--felt-lo) 100%);
  box-shadow:0 0 0 1.5px var(--brass-lo),0 0 0 2.5px rgba(244,221,166,.35),inset 0 0 0 1px rgba(0,0,0,.35),inset 0 10px 30px rgba(0,0,0,.35),inset 0 -20px 50px rgba(0,0,0,.45)}
#felt::before{content:"";position:absolute;inset:-10%;background:radial-gradient(52% 36% at 50% 30%,rgba(255,226,170,.20),transparent 70%);mix-blend-mode:screen;pointer-events:none}
#felt::after{content:"";position:absolute;inset:14px;border-radius:9999px;border:1px solid rgba(244,221,166,.10);pointer-events:none}
#emblem{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;transition:opacity .4s}
#emblem.hide{opacity:0}
#emblem svg{width:26px;height:26px;color:rgba(0,0,0,.22);filter:drop-shadow(0 1px 0 rgba(255,255,255,.07))}
#emblem .e1{font:italic 600 24px/1 var(--display);color:rgba(0,0,0,.22);text-shadow:0 1px 0 rgba(255,255,255,.07);letter-spacing:-.01em}
#emblem .e2{font:800 9px/1 var(--ui);letter-spacing:.5em;color:rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(255,255,255,.06);padding-left:.5em}
.slot{display:none}
.bcard{position:absolute;transition:translate .35s}
#pot{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:999px;
  background:rgba(4,20,17,.55);box-shadow:inset 0 0 0 1px rgba(244,221,166,.18);white-space:nowrap;transition:opacity .3s}
#pot .ci{width:20px;height:20px;color:var(--crimson)}
#pot .pl{font-size:10px;font-weight:800;letter-spacing:.18em;color:rgba(244,221,166,.6);text-transform:uppercase}
#pot b{font:700 17px/1 var(--ui);color:var(--brass-hi)}
#banner{position:absolute;transform:translate(-50%,0);text-align:center;width:86%;pointer-events:none}
#banner .b1{font-weight:800;font-size:14px;color:var(--text);text-shadow:0 1px 3px rgba(0,0,0,.6)}
#banner .b2{font:italic 600 18px/1.2 var(--display);color:var(--brass-hi);text-shadow:0 1px 3px rgba(0,0,0,.6)}
#banner .b0{font-size:13px;color:rgba(244,240,230,.7);font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#banner.show{animation:bannerIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes bannerIn{from{opacity:0;transform:translate(-50%,8px)}}

.seat{position:absolute;width:0;height:0;transition:left .5s cubic-bezier(.3,.8,.3,1),top .5s cubic-bezier(.3,.8,.3,1)}
.seat.notr{transition:none}
.pod{position:absolute;left:calc(var(--a)*-.5);top:calc(var(--a)*-.5);width:var(--a);height:var(--a)}
.seat .av{position:absolute;inset:0;z-index:3;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(211,172,99,.85),0 0 0 3.5px rgba(10,14,19,.9),0 6px 14px rgba(0,0,0,.55);transition:filter .3s,opacity .3s}
.timer{position:absolute;z-index:3;left:-7px;top:-7px;width:calc(100% + 14px);height:calc(100% + 14px);rotate:-90deg;opacity:0;transition:opacity .25s;overflow:visible}
.timer circle{fill:none;stroke-width:3.2}
.timer .trk{stroke:rgba(255,255,255,.12)}
.timer .bar{stroke:var(--brass-hi);stroke-linecap:round;stroke-dasharray:188.5;filter:drop-shadow(0 0 3px rgba(244,221,166,.8))}
.timer.low .bar{stroke:#ff6b6b;filter:drop-shadow(0 0 3px rgba(255,107,107,.8))}
.seat.turn .timer{opacity:1}
.seat.turn .av{box-shadow:0 0 0 2px var(--brass-hi),0 0 0 3.5px rgba(10,14,19,.9),0 0 22px rgba(244,221,166,.45)}
.plate{position:absolute;z-index:4;left:0;translate:-50% 0;min-width:74px;max-width:104px;top:calc(var(--a)*.5 - 6px);display:flex;flex-direction:column;align-items:center;padding:5px 10px 4px;border-radius:12px;
  background:linear-gradient(180deg,rgba(24,31,40,.94),rgba(13,18,24,.94));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 4px 10px rgba(0,0,0,.4);transition:box-shadow .3s}
.seat.turn .plate{box-shadow:inset 0 0 0 1px rgba(244,221,166,.7),0 0 16px rgba(244,221,166,.25),0 4px 10px rgba(0,0,0,.4)}
.crowd .plate{min-width:64px;max-width:80px;padding:4px 7px 3px}
.crowd .nm{font-size:10px;max-width:68px}.crowd .stk{font-size:12px}
.crowd .mini.show .card{--w:29px}
.nm{font-size:11px;font-weight:700;color:var(--mute);max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.stk{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13.5px;color:var(--text);line-height:1.2}
.stk .ci{width:11px;height:11px;color:var(--brass)}
/* 借了多少：放在筹码数前面 */
.loan{font:800 9px/1 var(--ui);font-style:normal;padding:2px 4px;border-radius:5px;background:linear-gradient(180deg,#6d2731,#4d1922);color:#ffd2d6;white-space:nowrap;letter-spacing:.01em;box-shadow:inset 0 0 0 1px rgba(255,160,170,.22)}
.crowd .loan{font-size:8px;padding:2px 3px}
.plate.lo .ci{display:none}
.plate.lo{max-width:124px}.crowd .plate.lo{max-width:98px}.crowd .plate.lo .stk{font-size:11px;gap:3px}
.seat.me .nm{color:var(--brass-hi)}
.seat.folded .av{filter:grayscale(.85) brightness(.6)}
.seat.folded .plate{opacity:.6}
.seat.off .av{filter:grayscale(1) brightness(.5)}
.seat.gone .pod,.seat.gone .plate{opacity:.35}
.tag{position:absolute;left:50%;top:-11px;translate:-50% 0;z-index:8;padding:2px 7px 3px;border-radius:7px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  background:#1d2630;color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.1);opacity:0;transition:opacity .2s}
.tag.on{opacity:1}
.tag.pop{animation:tagPop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tagPop{from{transform:scale(.4)}}
.tag.k-fold{background:#3a3f47;color:#c5ccd3}
.tag.k-check{background:#264b56;color:#bfe9f0}
.tag.k-call{background:#2c5a3f;color:#c9f2d7}
.tag.k-bet,.tag.k-raise{background:#8a5a1f;color:#ffe9c2}
.tag.k-allin{background:linear-gradient(180deg,#e04a55,#a12530);color:#fff}
.tag.k-sb,.tag.k-bb{background:#e9e0cb;color:#2a2214}
.tag.k-off{background:#2a2f36;color:#8d96a0}
.tag.k-wait{background:#2a2f36;color:#a7b0ba}
.mini{position:absolute;top:calc(var(--a)*-.5 - 6px);display:flex;z-index:5;pointer-events:none}
.mini.r{left:calc(var(--a)*.5 - 16px)}.mini.l{right:calc(var(--a)*.5 - 16px);flex-direction:row-reverse}
.mini .card{--w:19px}
.mini.r .card+.card{margin-left:-12px}.mini.l .card+.card{margin-right:-12px}
.mini .card:first-child{rotate:-8deg}.mini .card:last-child{rotate:9deg;translate:0 1px}
.mini.show{left:0;right:auto;translate:-50% 0;top:calc(var(--a)*-.5 - 12px);flex-direction:row;z-index:6}
.mini.show .card{--w:33px}
.mini.show .card+.card{margin-left:-9px;margin-right:0}
.hn{position:absolute;left:0;translate:-50% 0;top:calc(var(--a)*.5 - 22px);font:italic 600 12.5px/1 var(--display);color:var(--brass-hi);white-space:nowrap;z-index:7;
  padding:4px 8px;border-radius:8px;background:rgba(6,10,14,.88);box-shadow:inset 0 0 0 1px rgba(244,221,166,.25)}
.delta{position:absolute;left:0;translate:-50% 0;top:calc(var(--a)*-.5 - 16px);z-index:9;font:800 15px/1 var(--ui);padding:3px 8px;border-radius:8px;background:rgba(6,10,14,.82);color:var(--brass-hi);text-shadow:0 2px 6px rgba(0,0,0,.8);white-space:nowrap;pointer-events:none}
.seat.shown .delta{top:calc(var(--a)*-.5 - 40px)}
.seat.shown.top .delta{top:calc(var(--a)*.5 + 36px)}
.delta.neg{color:#ff9d9d}
.delta.go{animation:deltaIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes deltaIn{0%{opacity:0;transform:translateY(12px) scale(.8)}25%{opacity:1;transform:none}100%{opacity:1}}
.seat.win .av{box-shadow:0 0 0 2px var(--brass-hi),0 0 0 3.5px rgba(10,14,19,.9),0 0 26px rgba(244,221,166,.75)}
.seat.win .pod::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(closest-side,rgba(244,221,166,.35),transparent);animation:halo 1.6s ease-in-out infinite;z-index:2}
@keyframes halo{50%{transform:scale(1.15);opacity:.6}}
.bubble{position:absolute;left:50%;bottom:calc(var(--a)*.5 + 10px);translate:-50% 0;background:var(--ivory);color:var(--ink);font-weight:700;font-size:13px;padding:6px 10px;border-radius:14px;white-space:nowrap;
  box-shadow:0 6px 16px rgba(0,0,0,.45);z-index:10;animation:bub .3s cubic-bezier(.2,1.4,.4,1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;translate:-50% 0;rotate:45deg;border-radius:2px}
.bubble.emo{font-size:30px;padding:2px 8px;background:transparent;box-shadow:none}
.bubble.emo::after{display:none}
@keyframes bub{from{transform:translateY(8px) scale(.5);opacity:0}}
.bet{position:absolute;display:flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:999px;background:rgba(4,16,13,.62);box-shadow:inset 0 0 0 1px rgba(244,221,166,.14);
  font-weight:800;font-size:12.5px;color:var(--ivory);white-space:nowrap;transform:translate(-50%,-50%);z-index:2;transition:left .5s,top .5s,opacity .25s}
.bet .ci{width:17px;height:17px;color:var(--crimson);filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.bet.pop{animation:betPop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes betPop{from{transform:translate(-50%,-50%) scale(.5)}}
#dealer{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e8dfcb);color:#2a2214;
  font:800 10.5px/20px var(--display);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(140,104,43,.6);z-index:6;transition:left .6s cubic-bezier(.3,.8,.3,1),top .6s cubic-bezier(.3,.8,.3,1)}
#mine{position:absolute;display:flex;z-index:5}
#mine .wrap{position:relative}
#mine .wrap:first-child{rotate:-7deg;z-index:1}
#mine .wrap:last-child{rotate:7deg;margin-left:-14px;translate:0 3px;z-index:2}
#myHand{position:absolute;transform:translate(-50%,0);font:italic 600 14px/1 var(--display);color:var(--brass-hi);white-space:nowrap;z-index:5;text-shadow:0 1px 3px #000;
  padding:4px 10px;border-radius:9px;background:rgba(6,10,14,.72);box-shadow:inset 0 0 0 1px rgba(244,221,166,.2);transition:opacity .3s}
#fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.fly{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;color:var(--crimson);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.ov{position:absolute;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none}
.ov>div{pointer-events:auto;max-width:78%;text-align:center;padding:16px 20px;border-radius:18px;background:rgba(10,14,19,.9);box-shadow:inset 0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.6);color:var(--mute);font-size:13.5px;line-height:1.5}
.ov b{display:block;color:var(--text);font:italic 600 19px/1.3 var(--display);margin-bottom:4px}
.spin{width:22px;height:22px;margin:0 auto 10px;border-radius:50%;border:2.5px solid rgba(211,172,99,.25);border-top-color:var(--brass);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ====================== 操作台 ====================== */
#dock{height:var(--dock);flex:none;width:100%;max-width:560px;margin:0 auto;padding:10px max(12px,env(safe-area-inset-left,0px)) 8px;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;position:relative;z-index:6}
#dock::before{content:"";position:absolute;inset:0 0 calc(-1*env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:linear-gradient(180deg,rgba(23,30,38,.92),rgba(12,16,21,.97));
  box-shadow:inset 0 1px 0 rgba(244,221,166,.16),0 -10px 30px rgba(0,0,0,.35);z-index:-1}
.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sizes button{height:32px;border-radius:10px;font-size:12px;font-weight:800;color:var(--mute);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:all .15s;white-space:nowrap}
.sizes button.on{color:#22180a;background:linear-gradient(180deg,#f4ddA6,#d3ac63);box-shadow:none}
.sizes button:disabled{opacity:.3}
.rrow{display:flex;align-items:center;gap:10px;height:34px}
.rrow .ib{width:34px;height:34px;font:700 20px/1 var(--ui);color:var(--brass-hi);background:rgba(255,255,255,.05)}
.rng{flex:1;-webkit-appearance:none;appearance:none;height:34px;background:transparent;margin:0;--pct:0%}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brass) var(--pct),rgba(255,255,255,.12) var(--pct))}
.rng::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brass) var(--pct),rgba(255,255,255,.12) var(--pct))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ece2cc);box-shadow:0 0 0 3px var(--brass),0 4px 10px rgba(0,0,0,.5)}
.rng::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#f3ead6;box-shadow:0 0 0 3px var(--brass),0 4px 10px rgba(0,0,0,.5)}
.acts{display:grid;grid-template-columns:1fr 1.12fr 1.3fr;gap:8px}
.acts button{height:58px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:16px;line-height:1.1;transition:transform .12s,filter .2s}
.acts button:active{transform:scale(.96)}
.acts button small{font-size:13px;font-weight:800;opacity:.85;font-feature-settings:"tnum" 1}
.a-fold{background:linear-gradient(180deg,#5b1e25,#3d1218);color:#ffc9cd;box-shadow:inset 0 0 0 1px rgba(255,140,150,.22),inset 0 1px 0 rgba(255,255,255,.08)}
.a-call{background:linear-gradient(180deg,#24505a,#173640);color:#dff5f7;box-shadow:inset 0 0 0 1px rgba(150,230,240,.2),inset 0 1px 0 rgba(255,255,255,.1)}
.a-raise{background:linear-gradient(180deg,#f7e3b2 0%,#ddb56b 50%,#b88a3c 100%);color:#22180a;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.18),0 8px 20px rgba(211,172,99,.18)}
.acts button:disabled{opacity:.28;filter:grayscale(.6)}
.wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.status{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;font-weight:700}
.status .mav{width:26px;height:26px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px var(--brass)}
.status b{color:var(--text)}
.pre{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pre button{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:13px;font-weight:800;color:var(--mute);transition:all .15s}
.pre button i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);display:grid;place-items:center;font-style:normal;font-size:10px;color:transparent}
.pre button.on{color:var(--text);box-shadow:inset 0 0 0 1px rgba(211,172,99,.7)}
.pre button.on i{background:var(--brass);box-shadow:none;color:#22180a}
.nbar{width:min(240px,62%);height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.nbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi));transform-origin:left;animation:drain linear both}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.qemo{display:flex;gap:6px;justify-content:center}
.qemo button{width:38px;height:32px;border-radius:11px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);font-size:18px;line-height:1;transition:transform .12s}
.qemo button:active{transform:scale(.86)}
.roomcode{font:700 34px/1 var(--display);letter-spacing:.24em;color:var(--brass-hi);padding-left:.24em}
.row{display:flex;gap:8px;width:100%;max-width:420px}
.row>*{flex:1;min-width:0}

/* ====================== 弹层 ====================== */
.sheet-bg{position:fixed;inset:0;background:rgba(3,5,8,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:84%;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;background:linear-gradient(180deg,#19212b,#10151b);
  box-shadow:inset 0 1px 0 rgba(244,221,166,.18),0 -20px 50px rgba(0,0,0,.5);
  padding:10px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 2px}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.sheet h3{margin:0;font:italic 600 22px/1.2 var(--display);color:var(--text)}
.sheet .sub{margin:-8px 0 0;color:var(--mute);font-size:13px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.04)}
.prow .pav{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 1.5px rgba(211,172,99,.6)}
.prow .pi{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .pi b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pi span{font-size:12px;color:var(--mute)}
.prow .pv{font-weight:800;color:var(--brass-hi)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log{font-size:12.5px;color:#c9d0d6;line-height:1.75;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px;max-height:34vh;overflow-y:auto;-webkit-user-select:text;user-select:text}
.log .h{color:var(--brass);font-weight:800;margin-top:6px}
.log .h:first-child{margin-top:0}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12.5px;color:var(--mute)}
.ranks span:nth-child(odd){color:var(--text)}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emos button{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.05);font-size:26px;transition:transform .12s}
.emos button:active{transform:scale(.9)}
.phr{display:flex;flex-wrap:wrap;gap:8px}
.phr button{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.06);font-size:14px;font-weight:700}
.ta{width:100%;height:96px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:12px;font-size:16px;font-family:var(--ui);-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;max-width:88%;padding:10px 16px;border-radius:14px;
  background:rgba(20,26,33,.95);box-shadow:inset 0 0 0 1px rgba(244,221,166,.25),0 12px 30px rgba(0,0,0,.5);font-weight:700;font-size:13.5px;text-align:center;animation:toastIn .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes toastIn{from{transform:translate(-50%,-10px);opacity:0}}
/* ====================== 机器人智商 / 胜率辅助 ====================== */
.iq{display:inline-block;font:800 8.5px/1 var(--ui);padding:2px 4px 2px;border-radius:5px;margin-right:4px;vertical-align:1px;letter-spacing:.02em}
.iq.l0{background:#3b5735;color:#cdf3bb}.iq.l1{background:#33405a;color:#c6d6ee}.iq.l2{background:#123d59;color:#a3dfff}.iq.l3{background:linear-gradient(180deg,#f6e2b0,#c99a4a);color:#2a1a08}
button.iq{font-size:12px;padding:6px 9px;border-radius:10px;margin:0;vertical-align:0;flex:none}
#odds{position:absolute;z-index:5;width:70px;padding:6px 8px 7px;border-radius:12px;background:rgba(6,10,14,.82);box-shadow:inset 0 0 0 1px rgba(244,221,166,.22),0 6px 14px rgba(0,0,0,.4);text-align:left;cursor:pointer;transition:opacity .3s}
#odds .og-l{font:800 8.5px/1 var(--ui);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
#odds .og-v{font:700 20px/1.05 var(--display);color:var(--brass-hi);margin-top:3px;transition:color .3s,opacity .3s}
#odds .og-b{height:3px;border-radius:2px;background:rgba(255,255,255,.13);margin-top:5px;position:relative}
#odds .og-b i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:currentColor;color:var(--brass);transition:width .45s cubic-bezier(.3,.8,.3,1)}
#odds .og-b b{position:absolute;top:-3px;width:2px;height:9px;margin-left:-1px;border-radius:1px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.6)}
#odds .og-n{font-size:9.5px;font-weight:700;color:var(--mute);margin-top:5px;white-space:nowrap}
#odds.good .og-v{color:#93efb3}#odds.good .og-b i{color:#5fd590}
#odds.bad .og-v{color:#ff9d9d}#odds.bad .og-b i{color:#e0646c}
#odds.calc .og-v{opacity:.45}
#odds.sm{width:80px;padding:0 7px;display:grid;grid-template-columns:auto 1fr;align-items:baseline;align-content:center;column-gap:4px}
#odds.sm .og-l{font-size:8px;letter-spacing:.1em}
#odds.sm .og-v{font-size:15px;margin:0;text-align:right}
#odds.sm .og-b{grid-column:1/-1;margin-top:4px}
#odds.sm .og-n{display:none}
#myHand.og-good{color:#93efb3}#myHand.og-bad{color:#ffaaaa}
.ib.on{background:linear-gradient(180deg,#f4ddA6,#d3ac63);color:#22180a;border-color:transparent}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat2>div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px}
.stat2 span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.stat2 b{display:block;font:700 28px/1.1 var(--display);color:var(--brass-hi)}
.cats{display:flex;flex-direction:column;gap:6px}
.cats>div{display:grid;grid-template-columns:7.5em 1fr 3.4em;align-items:center;gap:10px;font-size:13px}
.cats span{color:var(--mute)}.cats em{font-style:normal;font-weight:800;text-align:right}
.cats i{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.cats i u{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi))}
.cats .me span,.cats .me em{color:var(--brass-hi)}
.hintx{font-size:12px;color:var(--faint);line-height:1.5}

/* ====================== 积分 ====================== */
.wallet-btn{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 7px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--brass-hi);white-space:nowrap}
.wallet-btn svg{width:20px;height:20px;color:var(--crimson);filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.rd{width:8px;height:8px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 8px #ff6b6b;animation:blink 1.6s infinite}
.seatbox{flex-direction:row;align-items:center;gap:12px;border-color:rgba(211,172,99,.35);background:linear-gradient(180deg,rgba(211,172,99,.12),rgba(211,172,99,.04))}
.seatbox p{margin:0;flex:1;font-size:13.5px;line-height:1.45;color:var(--text)}
.seatbox p b{color:var(--brass-hi)}
.seatbox .bs{display:flex;flex-direction:column;gap:6px;flex:none}
.savedbox{gap:10px;border-color:rgba(211,172,99,.35);background:linear-gradient(180deg,rgba(211,172,99,.12),rgba(211,172,99,.04))}
.svh{display:flex;flex-direction:column;gap:2px}.svh b{font:italic 600 18px/1.2 var(--display);color:var(--text)}.svh span{font-size:12.5px;color:var(--mute)}
/* 战绩表：存档卡片和结束时的最终战绩 */
.stand{display:flex;flex-direction:column;gap:4px}
.stand .shd,.srow{display:grid;grid-template-columns:26px minmax(0,1fr) auto 64px;align-items:center;gap:8px}
.stand .shd{padding:0 10px;font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.stand .shd span:nth-child(3),.stand .shd span:nth-child(4){text-align:right}
.srow{padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.045);font-size:13px}
.srow .pav{width:26px;height:26px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px rgba(211,172,99,.5)}
.srow .sn{min-width:0;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--text)}
.srow .sn em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.srow .sn .loan{flex:none}
.srow .sc{font-weight:800;color:var(--text);text-align:right}
.srow .snet{font-weight:800;text-align:right;color:var(--mute)}
.srow .snet.up{color:#9fe3ab}.srow .snet.dn{color:#ff9ea6}
.srow.me{background:rgba(211,172,99,.13)}.srow.me .sn em{color:var(--brass-hi)}
.tabs{grid-template-columns:repeat(3,1fr)}
.tabs .pill{width:calc((100% - 8px)/3)}
.tabs[data-i="1"] .pill{transform:translateX(100%)}.tabs[data-i="2"] .pill{transform:translateX(200%)}
.lvdesc{font-size:12px;color:var(--mute);line-height:1.5;margin:-4px 0 0;min-height:1.5em}
.lvdesc b{color:var(--brass-hi)}
.mini-av{display:flex;justify-content:center;gap:6px;margin-top:-2px}
.mini-av span{width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px rgba(211,172,99,.55)}

#hub{z-index:45;background:var(--night);overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:center}
#hub::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(90% 55% at 50% 0%,rgba(255,214,150,.11),transparent 62%),radial-gradient(140% 90% at 50% 40%,#16202a 0%,#0c1117 55%,#06080b 100%)}
.hubin{width:100%;max-width:440px;padding:10px max(16px,env(safe-area-inset-left,0px)) 30px;display:flex;flex-direction:column;gap:14px;position:relative}
.hub-top{display:flex;align-items:center;gap:10px;min-height:44px}
.hub-top h2{margin:0;font:italic 600 23px/1.1 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hub-bal{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 7px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font-weight:800;color:var(--brass-hi);flex:none}
.hub-bal svg{width:18px;height:18px;color:var(--crimson)}
.hub-bal.bump{animation:bump .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes bump{40%{transform:scale(1.14)}}
.bal{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;background:radial-gradient(120% 140% at 0% 0%,rgba(244,221,166,.22),transparent 55%),linear-gradient(160deg,#1b2633,#0f151c);
  border:1px solid rgba(211,172,99,.3);box-shadow:0 20px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:4px}
.bal::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:var(--moon) center/70% no-repeat;opacity:.18;rotate:-12deg}
.bal b{font:700 46px/1.05 var(--display);letter-spacing:-.01em;background:linear-gradient(180deg,#fff7e6 10%,#f0d9a0 55%,#c99a4a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-feature-settings:"tnum" 1}
.bal .sub{font-size:12.5px;color:var(--mute)}
.hcard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.03));border:1px solid var(--line);text-align:left;width:100%}
.hcard .hi{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:rgba(211,172,99,.14);color:var(--brass-hi)}
.hcard .hi svg{width:24px;height:24px}
.hcard .ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hcard .ht b{font-size:15px}
.hcard .ht span{font-size:12.5px;color:var(--mute);line-height:1.45}
.hcard .btn{flex:none;min-width:96px}
.btn:disabled{opacity:.45;filter:grayscale(.4)}
.btn.gold:disabled{background:rgba(255,255,255,.06);color:var(--mute);box-shadow:inset 0 0 0 1px var(--line);opacity:1;filter:none;font-feature-settings:"tnum" 1}
.switch{width:48px;height:29px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:23px;height:23px;border-radius:50%;background:#efe8da;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.switch.on{background:linear-gradient(180deg,#f4ddA6,#c99a4a)}.switch.on::after{transform:translateX(19px)}
.gcard{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-radius:20px;text-align:left;width:100%;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);transition:transform .12s}
.gcard:active{transform:scale(.98)}
.gcard .art{width:78px;height:70px;flex:none;position:relative;border-radius:14px;background:radial-gradient(90% 90% at 50% 30%,var(--felt-hi),var(--felt-lo));box-shadow:inset 0 0 0 1px rgba(244,221,166,.18);overflow:hidden}
.gcard .art .card{position:absolute;--w:26px}
.gcard .ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gcard b{font:italic 600 18px/1.15 var(--display)}
.gcard span{font-size:12.5px;color:var(--mute);line-height:1.4}
.gcard em{font-style:normal;color:var(--brass-hi);font-weight:800;font-size:11.5px;letter-spacing:.04em}
.gcard .go{width:18px;height:18px;color:var(--faint);flex:none;rotate:180deg}

/* ---- 小游戏 ---- */
.mg-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--mute)}
.mg-head b{color:var(--brass-hi)}
.felt-box{border-radius:22px;padding:16px 12px;background:var(--noise),radial-gradient(85% 70% at 50% 30%,var(--felt-hi) 0%,var(--felt) 50%,var(--felt-lo) 100%);
  box-shadow:0 0 0 1.5px var(--brass-lo),0 0 0 2.5px rgba(244,221,166,.3),inset 0 10px 30px rgba(0,0,0,.3),0 18px 40px rgba(0,0,0,.35);position:relative}
.lad{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lad span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:10px;background:rgba(0,0,0,.22);font-weight:800;font-size:12px;color:rgba(239,232,218,.55);transition:all .25s}
.lad span i{font-style:normal;font-size:9.5px;letter-spacing:.1em;color:rgba(239,232,218,.35)}
.lad span.done{background:rgba(211,172,99,.2);color:var(--brass-hi)}
.lad span.next{box-shadow:inset 0 0 0 1.5px var(--brass);color:var(--text)}
.hl-stage{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 0 8px}
.hl-stage .arw{width:26px;height:26px;color:rgba(244,221,166,.55)}
.mg-msg{min-height:26px;text-align:center;font:italic 600 18px/1.3 var(--display);color:var(--brass-hi);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mg-msg.bad{color:#ffb0b0}
.mg-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mg-btns .btn{min-height:56px;flex-direction:column;gap:1px}
.mg-btns .btn small{font-size:11.5px;font-weight:700;opacity:.75}
.mg-btns .wide{grid-column:1/-1}
.btn.up{background:linear-gradient(180deg,#2d6a4a,#1b4631);color:#d8f7e4;box-shadow:inset 0 0 0 1px rgba(150,240,190,.2)}
.btn.dn{background:linear-gradient(180deg,#6a2d36,#46161f);color:#ffd5d9;box-shadow:inset 0 0 0 1px rgba(255,150,160,.2)}
.qz-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.qz-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi));transform-origin:left}
.qz-bar i.run{animation:drain linear both}
.qz-board{display:flex;justify-content:center;gap:6px}
.qz-hands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qz-hand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:18px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:box-shadow .2s,background .2s}
.qz-hand .lbl{color:var(--mute)}
.qz-hand .cs{display:flex;gap:5px}
.qz-hand em{font:italic 600 14px/1.2 var(--display);color:var(--brass-hi);min-height:1.2em;font-style:italic}
.qz-hand.win{background:rgba(211,172,99,.12);box-shadow:inset 0 0 0 1.5px var(--brass)}
.qz-hand.pick.bad{box-shadow:inset 0 0 0 1.5px #e0646c}
.mm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;justify-items:center}
.mm-grid button{border-radius:9px}
.mm-grid .card.hi{translate:none}
.mm-grid .card.got .face{box-shadow:inset 0 0 0 .6px rgba(0,0,0,.18),0 0 0 2px var(--brass),0 0 14px rgba(244,221,166,.45)}
.result{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;text-align:center}
.result b{font:700 40px/1 var(--display);color:var(--brass-hi)}
.result span{color:var(--mute);font-size:13.5px}
.coinburst{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;color:var(--brass);pointer-events:none;z-index:70}
@media (max-width:359px){.top{gap:6px}.room [data-t]{display:none}.room{padding:0 12px}.hub-top{gap:8px}.hub-top h2{font-size:20px}}
@media (max-height:720px){:root{--dock:156px}.acts button{height:52px}.sizes button{height:30px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="lobby" class="screen">
  <div class="lob">
    <div class="lobtop">
      <a class="home-btn" href="../"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg><span data-t="allGames"></span></a>
      <div class="grow"></div>
      <button class="wallet-btn" id="walletBtn"><svg viewBox="0 0 100 100"><use href="#chip"/></svg><b id="walletAmt">0</b><span class="rd" id="walletDot" hidden></span></button>
      <button class="lang-btn" id="langBtn"><svg viewBox="0 0 24 24"><use href="#i-globe"/></svg><span id="langLbl">中文</span></button>
    </div>
    <div class="hero">
      <div class="fan" id="fan"><div class="glow"></div></div>
      <div class="mark">
        <h1><span class="w1">Midnight</span><span class="w2">HOLD’EM</span></h1>
        <svg class="seal" viewBox="0 0 60 104"><use href="#seal"/></svg>
      </div>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <div id="wxTip" class="wx" hidden data-t="wx"></div>
    <div class="box seatbox" id="seatBox" hidden></div>
    <div class="box savedbox" id="savedBox" hidden></div>

    <div class="box">
      <div class="me-row">
        <div class="me-av" id="meAv"></div>
        <div class="fld"><label class="lbl" for="nick" data-t="yourName"></label><input id="nick" class="inp" maxlength="10" autocomplete="off" autocapitalize="words" spellcheck="false"></div>
      </div>
      <div class="avs" id="avs"></div>
    </div>

    <div class="box">
      <div class="tabs" id="tabs"><span class="pill"></span><button data-tab="join" data-t="tabJoin"></button><button data-tab="host" data-t="tabHost"></button><button data-tab="solo" data-t="tabSolo"></button></div>
      <div id="paneJoin" style="display:flex;flex-direction:column;gap:12px">
        <div class="code-row"><input id="joinCode" class="inp code" maxlength="4" placeholder="····" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn gold" id="btnJoin" data-t="joinBtn"></button></div>
      </div>
      <div id="paneHost" style="display:flex;flex-direction:column;gap:14px" hidden>
        <div class="opts">
          <span data-t="blinds"></span><div class="seg" id="optBlind"></div>
          <span data-t="stack"></span><div class="seg" id="optChips"></div>
          <span data-t="clock"></span><div class="seg" id="optTime"></div>
        </div>
        <button class="btn gold" id="btnCreate" data-t="hostBtn"></button>
        <button class="btn glass" id="btnResume" hidden></button>
      </div>
      <div id="paneSolo" style="display:flex;flex-direction:column;gap:14px" hidden>
        <div class="opts">
          <span data-t="opps"></span><div class="seg" id="optOpp"></div>
          <span data-t="botIq"></span><div class="seg" id="optIq"></div>
        </div>
        <div class="mini-av" id="soloAvs"></div>
        <p class="lvdesc" id="lvDesc"></p>

    let win = 0, tie = 0;
    for (let it = 0; it < iters; it++) {
      for (let i = 0; i < need; i++) { const j = i + Math.floor(rnd() * (rest.length - i)); const t = rest[i]; rest[i] = rest[j]; rest[j] = t; }
      const b = board.concat(rest.slice(0, 5 - board.length));
      let k = 5 - board.length;
      const me = score(hole.concat(b)); cats[catOf(me)]++;
      let best = 0, n = 0;
      for (let o = 0; o < nOpp; o++) { const s = score([rest[k], rest[k + 1]].concat(b)); k += 2; if (s > best) { best = s; n = 1; } else if (s === best) n++; }
      if (me > best) win++; else if (me === best) tie++;
    }
    return { win: win / iters, tie: tie / iters, cats: cats.map(x => x / iters) };
  }

  // 机器人用的胜率：对手的手牌按他们的打法范围抽样（opps: [{range 0~1, read: 是否这一轮下过注}]）
  function equityR(hole, board, opps, iters, rnd) {
    rnd = rnd || Math.random;
    const used = new Set([...hole, ...board]);
    const rest = []; for (let c = 0; c < 52; c++) if (!used.has(c)) rest.push(c);
    const bs = board.length >= 3 ? score(board) : 0, bcat = board.length >= 3 ? Math.floor(bs / 1048576) : -1;
    let win = 0;
    for (let it = 0; it < iters; it++) {
      let k = 0;
      const hands = [];
      for (const o of opps) {
        let a, b;
        const leak = Math.min(1, 0.1 * o.range / Math.max(0.01, 1 - o.range));   // 偶尔也会玩范围外的牌
        for (let tr = 0; tr < 30; tr++) {
          const i = k + Math.floor(rnd() * (rest.length - k)); let t = rest[k]; rest[k] = rest[i]; rest[i] = t;
          const j = k + 1 + Math.floor(rnd() * (rest.length - k - 1)); t = rest[k + 1]; rest[k + 1] = rest[j]; rest[j] = t;
          a = rest[k]; b = rest[k + 1];
          if (tr === 29) break;
          if (pfPct(a, b) > o.range && rnd() > leak) continue;            // 不在他平时会玩的牌里
          if (o.read && bcat >= 0) {                                      // 这一轮他下注了：多半是和牌面有关系的牌
            const hit = Math.floor(score([a, b].concat(board)) / 1048576) > bcat;
            const fd = board.length < 5 && [0, 1, 2, 3].some(su => board.filter(c => suitOf(c) === su).length + (suitOf(a) === su) + (suitOf(b) === su) >= 4 && (suitOf(a) === su || suitOf(b) === su));
            if (!hit && !fd && rnd() > 0.25) continue;
          }
          break;
        }
        hands.push(a, b); k += 2;
      }
      for (let i = 0; i < 5 - board.length; i++) { const j = k + i + Math.floor(rnd() * (rest.length - k - i)); const t = rest[k + i]; rest[k + i] = rest[j]; rest[j] = t; }
      const full = board.concat(rest.slice(k, k + 5 - board.length));
      const me = score(hole.concat(full));
      let better = 0, ties = 0;
      for (let o = 0; o < opps.length; o++) { const sc = score([hands[2 * o], hands[2 * o + 1]].concat(full)); if (sc > me) { better = 1; break; } if (sc === me) ties++; }
      if (!better) win += 1 / (ties + 1);
    }
    return win / iters;
  }

  // 机器人智商：模拟次数、估算误差、开池/跟注范围、激进程度、诈唬、跟注站倾向、读牌、位置意识
  const IQ = {
    70:  { it: 140, noise: 0.10, open: 0.70, call: 0.42, agg: 0.35, bluff: 0.03, loose: 0.08, model: 0, pos: 0, rk: 1 },
    100: { it: 220, noise: 0.05, open: 0.50, call: 0.30, agg: 0.55, bluff: 0.07, loose: 0.03, model: 0, pos: 0.2 },
    130: { it: 360, noise: 0,    open: 0.34, call: 0.17, agg: 0.75, bluff: 0.11, loose: 0,    model: 1, pos: 0.7 },
    160: { it: 520, noise: 0,    open: 0.30, call: 0.14, agg: 0.85, bluff: 0.14, loose: 0,    model: 2, pos: 1 },
  };
  const IQS = [70, 100, 130, 160];
  // 机器人思考快慢：在默认的思考时间上乘这个倍数（秒出、快、正常、慢）
  const PACES = [0.12, 0.4, 1, 2.2];

  const SEATS = 9;

  class Game {
    constructor(opts) {
      this.settings = Object.assign({ sb: 5, bb: 10, startChips: 1000, turnTime: 30, botPace: 1, autoNext: true }, opts.settings || {});
      this.now = opts.now || (() => Date.now());
      this.rnd = opts.rnd || Math.random;
      // 洗牌和抽庄用的随机整数；测试时传入 rnd 就用它（可复现），平时用密码学随机数
      this.int = opts.rnd ? (n => Math.floor(opts.rnd() * n)) : randInt;
      this.schedule = opts.schedule || ((fn, ms) => setTimeout(fn, ms));
      this.onChange = opts.onChange || (() => {});
      this.players = []; // {id,name,seat,chips,...}
      this.hand = null;
      this.handNum = 0;
      this.dealerSeat = -1;
      this.log = [];
      this.paused = false;
      this.nextAt = 0;
      this._timerGen = 0;
      this.actSeq = 0;
    }

    // ---------- 座位 ----------
    byId(id) { return this.players.find(p => p.id === id); }
    bySeat(s) { return this.players.find(p => p.seat === s); }
    addPlayer({ id, name, isBot, token, avatar, chips, iq }) {
      if (this.players.length >= SEATS) return null;
      let seat = 0; while (this.bySeat(seat)) seat++;
      const buyIn = chips == null ? this.settings.startChips : Math.max(0, Math.min(this.settings.startChips, Math.floor(chips)));
      const p = { id, name, isBot: !!isBot, token, avatar: avatar || 0, seat, chips: buyIn, buyin: buyIn, loan: 0, rebuys: 0, iq: isBot ? (IQ[iq] ? iq : 100) : 0,
        st: { h: 0, vpip: 0, pfr: 0, agg: 0, pas: 0 },
        connected: true, inHand: false, folded: false, allIn: false, bet: 0, committed: 0, acted: false, canRaise: true,
        hole: [], lastAction: '', actSeq: 0, showCards: false, net: 0 };
      this.players.push(p);
      this.addLog({ k: 'join', n: name });
      this.changed();
      this.maybeAutoStart();
      return p;
    }
    removePlayer(id) {
      const p = this.byId(id); if (!p) return;
      if (p.inHand && !p.folded && this.hand && this.hand.street !== 'done') {
        if (this.hand.toAct === p.seat) { this.act(p.id, { type: 'fold' }, true); }
        else { p.folded = true; p.lastAction = 'fold'; p.actSeq = ++this.actSeq; }
      }
      // 已投入的筹码留在底池里：把玩家留到这手结束再删
      if (p.inHand && this.hand && this.hand.street !== 'done') { p.leaving = true; this.afterExternalFold(); }
      else this.players = this.players.filter(x => x !== p);
      this.addLog({ k: 'leave', n: p.name });
      this.changed();
    }
    rebuy(id, amount) {
      const p = this.byId(id);
      if (!p || p.chips > 0 || (p.inHand && this.hand && this.hand.street !== 'done')) return false;
      const a = amount == null ? this.settings.startChips : Math.max(0, Math.min(this.settings.startChips, Math.floor(amount)));
      if (!a) return false;
      p.chips = a; p.rebuys++; p.loan += a;   // 输光后借的筹码记在账上
      this.addLog({ k: 'rebuy', n: p.name, a });
      this.changed(); this.maybeAutoStart();
      return true;
    }
    // 还钱：不在打的这一手里时，从筹码里还一笔（最多一次借的数）
    repay(id) {
      const p = this.byId(id), h = this.hand;
      if (!p || !(p.loan > 0) || !(p.chips > 0) || (p.inHand && !p.folded && h && h.street !== 'done')) return 0;
      const a = Math.min(p.loan, p.chips, this.settings.startChips);
      p.chips -= a; p.loan -= a;
      p.rebuys = p.loan ? Math.max(1, Math.ceil(p.loan / this.settings.startChips)) : 0;
      this.addLog({ k: 'repay', n: p.name, a });
      this.changed();
      return a;
    }
    // 中途收桌（保存进度、结束牌局）：这一手作废，每人拿回这手下的注；庄家按钮退回去，下次接着玩时这一手重发
    voidHand() {
      const h = this.hand;
      this._timerGen++; this._live = null; this._frozen = null; this.nextAt = 0;
      if (h && h.street !== 'done') {
        for (const p of this.players) if (p.inHand && !p.leaving) p.chips += p.committed;
        this.dealerSeat = h.prevDealer; this.handNum--;
        this.addLog({ k: 'void' });
      }
      for (const p of this.players) Object.assign(p, { inHand: false, folded: false, allIn: false, bet: 0, committed: 0, hole: [], lastAction: '', showCards: false, best: null, net: 0, won: 0 });
      this.players = this.players.filter(p => !p.leaving);
      this.hand = null;
      this.changed();
    }
    setIq(id, iq) { const p = this.byId(id); if (p && p.isBot && IQ[iq]) { p.iq = iq; this.changed(); } }
    setPace(k) { if (PACES.includes(k)) { this.settings.botPace = k; this.changed(); } }
    setConnected(id, on) {
      const p = this.byId(id); if (!p) return;
      if (p.connected === on) return;
      p.connected = on;
      // 掉线时缩短等待；连回来时重新给满时间
      if (this.hand && this.hand.street !== 'done' && this.hand.toAct === p.seat) this.setDeadline(p);
      this.changed();
      if (on) this.maybeAutoStart();
    }

    addLog(e) { this.log.push(e); if (this.log.length > 80) this.log.shift(); }
    changed() { this.onChange(); }

    eligible() {
      return this.players.filter(p => p.chips > 0 && !p.leaving && !p.sitOut && (p.connected || p.isBot))
        .sort((a, b) => a.seat - b.seat);
    }
    nextSeat(from, list) { // list 中座位号严格在 from 之后的第一个（循环）
      const seats = list.map(p => p.seat).sort((a, b) => a - b);
      for (const s of seats) if (s > from) return s;
      return seats[0];
    }

    maybeAutoStart() {
      if (this.paused || !this.started) return;
      if (this.hand && this.hand.street !== 'done') return;
      if (this.nextAt) return;
      if (this.eligible().length >= 2) {
        this.nextAt = this.now() + 1500;
        this.later(() => { this.nextAt = 0; this.startHand(); }, 1500);
      }
    }

    start() { this.started = true; this.paused = false; this.maybeAutoStart(); this.changed(); }
    // 所有计时都走这里。同一时刻只有一个有效计时（新的作废旧的），暂停时把它冻住，恢复后按剩下的时间接着走
    later(fn, ms) {
      const gen = ++this._timerGen;
      if (this.paused) { this._live = null; this._frozen = { fn, left: ms }; return; }
      this._live = { gen, fn, due: this.now() + ms };
      this.schedule(() => { if (gen === this._timerGen) { this._live = null; fn(); } }, ms);
    }
    // 暂停：整桌原地冻住，谁的倒计时都不走、机器人不出手、没人会被超时弃牌；恢复后从停下的地方接着来
    setPaused(v) {
      v = !!v; if (v === this.paused) return;
      const h = this.hand, live = !!(h && h.street !== 'done');
      if (v) {
        const L = this._live;
        this._frozen = live && L && L.gen === this._timerGen ? { fn: L.fn, left: Math.max(0, L.due - this.now()) } : null;
        this._timerGen++; this._live = null; this.nextAt = 0;
        if (live && h.deadline) { h.left = Math.max(0, h.deadline - this.now()); h.deadline = 0; }
        this.paused = true;
      } else {
        this.paused = false;
        const f = this._frozen; this._frozen = null;
        if (live && f) {
          const ms = Math.max(f.left, 600);   // 刚恢复时留一点反应时间
          if (h.left) { h.deadline = this.now() + Math.max(h.left, 600); h.left = 0; }
          this.later(f.fn, ms);
        } else if (live) { const p = h.toAct >= 0 && this.bySeat(h.toAct); if (p) this.setDeadline(p); }
        else this.maybeAutoStart();
      }
      this.changed();
    }

    // ---------- 一手牌 ----------
    startHand() {
      // 清理离桌；输光的机器人自己补码复活
      this.players = this.players.filter(p => !p.leaving);
      for (const p of this.players) if (p.isBot && p.chips === 0) {
        p.chips = this.settings.startChips; p.rebuys++; p.loan += p.chips;
        this.addLog({ k: 'rebuy', n: p.name, a: p.chips });
        if (this.onBotRebuy) this.onBotRebuy(p);
      }
      const el = this.eligible();
      if (el.length < 2 || this.paused) { this.hand = null; this.changed(); return; }
      this.handNum++;
      for (const p of this.players) {
        Object.assign(p, { inHand: false, folded: false, allIn: false, bet: 0, committed: 0, acted: false, canRaise: true, hole: [], lastAction: '', actSeq: 0, showCards: false, net: 0, won: 0, best: null,
          vp: false, pr: false, aggSt: '', trap: '' });
      }
      el.forEach(p => { p.inHand = true; p.st.h++; });
      // 庄家按钮每手顺时针移一位；开局第一手抽签定庄（以前总是房主先当庄）
      const prevDealer = this.dealerSeat;
      this.dealerSeat = prevDealer < 0 ? el[this.int(el.length)].seat : this.nextSeat(prevDealer, el);
      let sbSeat, bbSeat;
      if (el.length === 2) { sbSeat = this.dealerSeat; bbSeat = this.nextSeat(sbSeat, el); }
      else { sbSeat = this.nextSeat(this.dealerSeat, el); bbSeat = this.nextSeat(sbSeat, el); }
      const deck = shuffle([...Array(52).keys()], this.int);
      this.hand = { num: this.handNum, street: 'preflop', deck, board: [], dealer: this.dealerSeat, prevDealer, sbSeat, bbSeat,
        curBet: 0, minRaise: this.settings.bb, nr: 0, toAct: -1, deadline: 0, results: null, pot: 0 };
      // 从小盲开始发两轮
      const order = [];
      let s = sbSeat; for (let i = 0; i < el.length; i++) { order.push(this.bySeat(s)); s = this.nextSeat(s, el); }
      for (let r = 0; r < 2; r++) for (const p of order) p.hole.push(deck.pop());
      this.addLog({ k: 'hand', h: this.handNum });
      this.post(this.bySeat(sbSeat), this.settings.sb, 'sb');
      this.post(this.bySeat(bbSeat), this.settings.bb, 'bb');
      this.hand.curBet = this.settings.bb;
      this.hand.minRaise = this.settings.bb;
      this.hand.toAct = bbSeat;
      this.advance();
    }
    post(p, amt, label) {
      const a = Math.min(amt, p.chips);
      p.chips -= a; p.bet += a; p.committed += a;
      if (p.chips === 0) p.allIn = true;
      p.lastAction = label; p.actSeq = ++this.actSeq;
    }

    inHand() { return this.players.filter(p => p.inHand && !p.folded); }
    needsAct(p) { return p.inHand && !p.folded && !p.allIn && (!p.acted || p.bet < this.hand.curBet); }

    legal(p) {
      const h = this.hand;
      if (!h || h.street === 'done' || h.toAct !== p.seat) return null;
      const toCall = Math.min(h.curBet - p.bet, p.chips);
      const maxTo = p.bet + p.chips;
      const canRaise = p.canRaise && maxTo > h.curBet &&
        this.inHand().some(o => o !== p && !o.allIn); // 至少还有一个人能跟
      let minTo = h.curBet + h.minRaise;
      if (h.curBet === 0) minTo = Math.max(this.settings.bb, 1);
      minTo = Math.min(minTo, maxTo);
      return { toCall, canCheck: toCall === 0, canRaise, minTo, maxTo, curBet: h.curBet, myBet: p.bet };
    }

    act(id, a, force) {
      if (this.paused && !force) return 'paused';
      const p = this.byId(id), h = this.hand;
      if (!p || !h || h.street === 'done' || h.toAct !== p.seat) return 'not-your-turn';
      const L = this.legal(p);
      let type = a.type;
      if (type === 'check' && !L.canCheck) return 'cannot-check';
      if (type === 'call' && L.toCall === 0) type = 'check';
      if (type === 'raise' && !L.canRaise) type = L.toCall ? 'call' : 'check';
      if (type === 'fold') {
        p.folded = true; p.lastAction = 'fold';
        this.addLog({ k: 'fold', n: p.name });
      } else if (type === 'check') {
        p.lastAction = 'check'; this.addLog({ k: 'check', n: p.name });
      } else if (type === 'call') {
        const c = L.toCall;
        p.chips -= c; p.bet += c; p.committed += c;
        if (p.chips === 0) { p.allIn = true; p.lastAction = 'allin'; } else p.lastAction = 'call';
        this.addLog({ k: p.allIn ? 'callAllin' : 'call', n: p.name, a: c });
      } else if (type === 'raise') {
        let to = Math.floor(Number(a.to) || 0);
        to = Math.max(L.minTo, Math.min(L.maxTo, to));
        const add = to - p.bet;
        const raiseBy = to - h.curBet;
        p.chips -= add; p.bet = to; p.committed += add;
        const wasBet = h.curBet === 0;
        if (p.chips === 0) p.allIn = true;
        if (raiseBy >= h.minRaise) {
          h.minRaise = raiseBy;
          for (const o of this.players) if (o !== p && o.inHand) { o.acted = false; o.canRaise = true; }
        } else { // 不足额全押：已行动过的人不能再加注
          for (const o of this.players) if (o !== p && o.inHand) { if (o.acted) o.canRaise = false; o.acted = false; }
        }
        h.curBet = to; h.nr++;
        p.lastAction = p.allIn ? 'allin' : (wasBet ? 'bet' : 'raise');
        this.addLog({ k: p.lastAction, n: p.name, a: to });
      } else return 'bad-action';
      if (type === 'call' || type === 'raise') {
        if (!h.board.length) { if (!p.vp) { p.vp = true; p.st.vpip++; } if (type === 'raise' && !p.pr) { p.pr = true; p.st.pfr++; } }
        else if (type === 'raise') { p.st.agg++; p.aggSt = h.street; } else p.st.pas++;
      }
      p.acted = true; p.actSeq = ++this.actSeq;
      this.advance(p.seat);
      return 'ok';
    }

    afterExternalFold() {
      const h = this.hand; if (!h || h.street === 'done') return;
      if (this.inHand().length <= 1) this.advance(h.toAct);
    }

    advance(fromSeat) {
      const h = this.hand;
      h.pot = this.players.reduce((s, p) => s + p.committed - p.bet, 0);
      const live = this.inHand();
      if (live.length === 1) return this.finishUncontested(live[0]);
      const list = this.players.filter(p => p.inHand).sort((a, b) => a.seat - b.seat);
      // 下一个需要行动的人
      let s = fromSeat === undefined ? h.toAct : fromSeat;
      for (let i = 0; i < list.length; i++) {
        s = this.nextSeat(s, list);
        const p = this.bySeat(s);
        if (this.needsAct(p)) {
          h.toAct = s; this.setDeadline(p); this.changed(); return;
        }
      }
      this.endStreet();
    }

    setDeadline(p) {
      const h = this.hand;
      const t = p.isBot ? 0 : (p.connected ? this.settings.turnTime * 1000 : 6000);
      h.deadline = p.isBot || this.paused ? 0 : this.now() + t;
      h.left = p.isBot || !this.paused ? 0 : t;
      if (p.isBot) {
        this.later(() => { if (h === this.hand && h.toAct === p.seat) this.botAct(p); }, (650 + (p.iq - 70) * 3 + this.rnd() * 1100) * (PACES.includes(this.settings.botPace) ? this.settings.botPace : 1));
      } else {
        this.later(() => {
          if (h === this.hand && h.toAct === p.seat && h.street !== 'done') {
            const L = this.legal(p);
            this.addLog({ k: 'timeout', n: p.name });
            this.act(p.id, { type: L && L.canCheck ? 'check' : 'fold' }, true);
          }
        }, t);
      }
    }

    endStreet() {
      const h = this.hand;
      for (const p of this.players) { p.bet = 0; p.acted = false; p.canRaise = true; }
      h.pot = this.players.reduce((s, p) => s + p.committed, 0);
      h.curBet = 0; h.minRaise = this.settings.bb; h.nr = 0; h.toAct = -1; h.deadline = 0; h.left = 0;
      const canAct = this.inHand().filter(p => !p.allIn);
      if (h.street === 'river') return this.showdown();
      const runout = canAct.length <= 1;
      if (runout) for (const p of this.inHand()) p.showCards = true; // 全押摊牌：亮牌发完
      this.dealNext();
      this.changed();
      if (runout) {
        this.later(() => this.endStreet(), 1700);
      } else {
        for (const p of this.players) if (p.inHand && !p.folded && !p.allIn) p.lastAction = '';
        this.later(() => this.advance(h.dealer), 750);
      }
    }
    dealNext() {
      const h = this.hand, d = h.deck;
      d.pop(); // 烧牌
      if (h.street === 'preflop') { h.board.push(d.pop(), d.pop(), d.pop()); h.street = 'flop'; }
      else if (h.street === 'flop') { h.board.push(d.pop()); h.street = 'turn'; }
      else if (h.street === 'turn') { h.board.push(d.pop()); h.street = 'river'; }
      this.addLog({ k: 'street', s: h.street, b: h.board.slice() });
    }

    finishUncontested(w) {
      const h = this.hand;
      const total = this.players.reduce((s, p) => s + p.committed, 0);
      w.chips += total; w.won = total;
      h.results = [{ amount: total, winners: [w.seat], cat: -1 }];
      this.addLog({ k: 'winFold', n: w.name, a: total });
      this.endHand();
    }

    showdown() {
      const h = this.hand;
      h.street = 'showdown';
      const live = this.inHand();
      for (const p of live) { p.showCards = true; p.best = bestHand(p.hole.concat(h.board)); }

};

// 1 积分 = 1 筹码。入座时从积分里买筹码，离开时筹码换回积分；无限模式下入座不扣、离开也不退。
// seat 记着"我在哪张桌上还有多少筹码"，页面意外关掉也能在大厅里回到牌桌或换回积分。
const DAILY = 5000;
const Wal = Object.assign({ bal: 0, day: '', inf: false, seat: null, best: {} }, store.get('wallet') || {});
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const canClaim = () => Wal.day !== today();
const balInner = () => `<svg viewBox="0 0 100 100"><use href="#chip"/></svg><b>${Wal.inf ? '∞' : fmt(Wal.bal)}</b>`;
function wSave(){ store.set('wallet', Wal); paintWallet(); }
function paintWallet(){
  $('walletAmt').textContent = Wal.inf ? '∞' : fmt(Wal.bal);
  $('walletDot').hidden = !canClaim();
  const hb = $('hubBal'); if (hb) hb.innerHTML = balInner();
}
function claimDaily(){ if (!canClaim()) return 0; Wal.day = today(); Wal.bal += DAILY; wSave(); return DAILY; }
function earn(n){ n = Math.max(0, Math.round(n)); if (n) { Wal.bal += n; wSave(); bumpBal(); } return n; }
const buyInFor = want => Wal.inf ? want : Math.min(want, Wal.bal);
function seatSettle(){ const s = Wal.seat; if (!s) return 0; Wal.seat = null; const a = s.paid ? Math.max(0, s.chips | 0) : 0; Wal.bal += a; wSave(); return a; }
function seatStart(code, chips, kind){ seatSettle(); const paid = !Wal.inf; if (paid) Wal.bal = Math.max(0, Wal.bal - chips); Wal.seat = { code, chips, paid, kind, at: Date.now() }; wSave(); }
function seatRepay(a, chips){ if (!Wal.seat) return; if (Wal.seat.paid) Wal.bal += a; Wal.seat.chips = chips; wSave(); toast(t('repaid', { a: fmt(a) }), 2600); }
function seatRebuy(a){ if (!Wal.seat) return; const paid = !Wal.inf; if (paid) Wal.bal = Math.max(0, Wal.bal - a); Wal.seat.paid = paid; Wal.seat.chips = a; wSave(); }
// 把座位“停”起来（保存的牌局）。只能停一个：之前停着的另一桌先换回积分
function parkSeat(rec){
  const o = Wal.parked;
  if (o && o.code !== rec.code) { const a = o.paid ? Math.max(0, o.chips | 0) : 0; Wal.bal += a; if (a) setTimeout(() => toast(t('cashed', { a: fmt(a) })), 600); }
  Wal.parked = rec;
}
function zeroHostSave(code){ const sv = store.get('hostsave'); const hp = sv && sv.code === code && sv.players.find(x => x.id === 'host'); if (hp) { hp.chips = 0; store.set('hostsave', sv); } }
// 放弃某张桌子上的座位：筹码换回积分；客人换个身份，免得回去又拿到原来的座位
function abandonSeat(){
  const s = Wal.seat; if (!s) return 0;
  const a = seatSettle();
  if (s.kind === 'client') { token = rid(16); store.set('token', token); }
  if (s.kind === 'host') zeroHostSave(s.code);
  return a;
}
// 进桌前：别的桌上的筹码先结清；积分为零时自动领今天的礼包，领过了就引导去小游戏

  if (noCheck || Wal.inf || Wal.bal > 0 || (Wal.seat && Wal.seat.code === code)) return true;

}

// ============================== 房主 ==============================
function startHost(cfg){
  S.mode = 'host'; S.code = cfg.code; S.myId = 'host'; S.solo = !!cfg.solo;
  const game = new P.Game({ settings: cfg.settings, onChange: () => queueSync() });
  const conns = new Map(), seen = new Map();
  let peer = null, syncQueued = false, locked = false;

  const kind = S.solo ? 'solo' : 'host';
  if (cfg.players) {
    game.handNum = cfg.handNum || 0; game.dealerSeat = cfg.dealerSeat ?? -1;
    for (const sp of cfg.players) {
      const p = game.addPlayer({ id: sp.id, name: sp.name, isBot: sp.isBot, token: sp.token, avatar: sp.avatar, iq: sp.iq });
      if (!p) continue;
      p.seat = sp.seat; p.chips = sp.chips; p.rebuys = sp.rebuys || 0;
      p.buyin = sp.buyin ?? game.settings.startChips; p.loan = sp.loan ?? p.rebuys * game.settings.startChips;   // 旧存档没记借了多少：按次数估
      if (!sp.isBot && sp.id !== 'host') p.connected = false;
    }
    let me = game.byId('host');
    if (!me) me = game.addPlayer({ id: 'host', name: myName, token, avatar: myAv, chips: 0 });
    me.name = myName; me.avatar = myAv; me.token = token;
    // 这张桌上我的筹码之前已经换回积分了（或者没有记录）：重新买入，不算借。输光了存下来的，回来照样在底部借筹码
    if (!(Wal.seat && Wal.seat.code === S.code && Wal.seat.kind === kind)) {
      const a = buyInFor(game.settings.startChips);
      Object.assign(me, { chips: a, buyin: a, loan: 0, rebuys: 0 });
      seatStart(S.code, a, kind);
    }
    game.log.length = 0; game.addLog({ k: 'restored' });
  } else {
    seatSettle();
    const buy = buyInFor(game.settings.startChips);
    game.addPlayer({ id: 'host', name: myName, token, avatar: myAv, chips: buy });
    seatStart(S.code, buy, kind);
  }
  // 机器人输光自己补码，头上冒个 💰
  game.onBotRebuy = p => setTimeout(() => broadcastEmote(p.seat, 'e7'), 300);

  const saveData = () => ({ code: S.code, settings: game.settings, handNum: game.handNum, dealerSeat: game.dealerSeat, savedAt: Date.now(),
    players: game.players.filter(p => !p.leaving).map(p => ({ id: p.id, name: p.name, isBot: p.isBot, iq: p.iq, token: p.token, avatar: p.avatar, seat: p.seat, chips: p.chips, rebuys: p.rebuys, loan: p.loan, buyin: p.buyin })) });
  const standings = () => game.players.filter(p => !p.leaving).sort((a, b) => a.seat - b.seat).map(p => ({ id: p.id, n: p.name, c: p.chips, b: p.buyin, l: p.loan, r: p.rebuys, bot: p.isBot ? 1 : 0, av: p.avatar, iq: p.iq }));
  function save(){
    if (S.solo || S.closing) return;
    const h = game.hand; if (h && h.street !== 'done') return; // 只在两手之间存，筹码才准
    store.set('hostsave', saveData());
  }
  function queueSync(){ if (syncQueued) return; syncQueued = true; Promise.resolve().then(() => { syncQueued = false; sync(); }); }
  function sync(){
    onView(game.view('host'));
    for (const [pid, c] of conns) if (c.open) { try { c.send({ t: 'state', v: game.view(pid) }); } catch(e){} }
    save();
  }
  setInterval(() => {
    const now = Date.now();
    for (const [pid, ts] of seen) {
      const p = game.byId(pid);
      if (p && p.connected && now - ts > 15000) { game.setConnected(pid, false); const c = conns.get(pid); if (c) try { c.close(); } catch(e){} conns.delete(pid); }
    }
    sync();
  }, 3000);

  S.act = a => { const r = game.act('host', a); if (r !== 'ok') toast(r === 'paused' ? pausedTxt() : t('cant')); };
  S.emote = e => broadcastEmote(game.byId('host').seat, e);
  S.rebuy = a => { if (game.rebuy('host', a)) seatRebuy(game.byId('host').chips); };
  S.repay = () => { const a = game.repay('host'); if (a) seatRepay(a, game.byId('host').chips); else toast(t('repayWait')); };
  S.leave = () => {
    S.closing = true;
    const me = game.byId('host');
    if (Wal.seat && Wal.seat.code === S.code) { Wal.seat.chips = me ? me.chips : 0; seatSettle(); }
    if (!S.solo) zeroHostSave(S.code);
  };
  // 保存进度：正在打的这一手作废（下的注退回），存下每人的筹码、借款和庄家位置，告诉大家这局存好了，然后收桌
  S.saveLater = () => {
    S.closing = true; game.started = false; game.voidHand();
    const at = Date.now(), snap = standings(), me = game.byId('host');
    store.set('saved', Object.assign(saveData(), { savedAt: at })); store.set('hostsave', null);
    parkSeat({ code: S.code, chips: me ? me.chips : 0, paid: Wal.seat && Wal.seat.code === S.code ? Wal.seat.paid : !Wal.inf, kind: 'host', at, snap });
    Wal.seat = null; wSave();
    for (const [pid, c] of conns) if (c.open) { const p = game.byId(pid); try { c.send({ t: 'saved', chips: p ? p.chips : 0, at, snap, host: myName }); } catch(e){} }
    return sleep(700).then(() => { try { peer && peer.destroy(); } catch(e){} });
  };

      const p = v.players.find(x => x.seat === s); const o = p && seatMap.get(p.id);
      if (o) setTimeout(() => flyChips(potXY, o.pos, 5, 0), 650 + ri * 250);
    }));

  } else pot.style.opacity = (done && !full) ? pot.style.opacity : (potVal > 0 ? '1' : '0');
  if (!done) pot.style.opacity = potVal > 0 || live > 0 ? '1' : '0';
  if (done && full) pot.style.opacity = '0';
  if (done && !justDone && !full && ph && ph.street === 'done') pot.style.opacity = '0';
  // 数字滚动
  const target = done ? total : potVal;
  if (full || REDUCED) { potShown = target; $('potAmt').textContent = fmt(target); return; }
  if (target === potShown) return;
  const from = potShown, t0 = performance.now(), id = ++potTween, wait = flights.length ? 380 : 0;
  potShown = target;

    if (id !== potTween) return;
    const k = Math.min(1, Math.max(0, (now - t0 - wait) / 420));
    $('potAmt').textContent = fmt(from + (target - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  if (h && h.street === 'done' && ph && ph.street !== 'done' && h.results) {
    const my = me();
    if (my && h.results.some(r => r.winners.includes(my.seat))) setTimeout(() => Snd.win(), 700); else Snd.chip(4, 0.65);
  }
  const L = v.me && v.me.legal;

function countUp(el, from, to){
  if (!el || REDUCED) { if (el) el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);

// 一把筹码从按钮飞到右上角的余额上
function coinBurst(fromEl){
  const to = $('hubBal'); if (REDUCED || !fromEl || !to) return;
  const a = fromEl.getBoundingClientRect(), b = to.getBoundingClientRect();
  const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = b.left + 16, y1 = b.top + b.height / 2;
  for (let i = 0; i < 9; i++) {

    c.innerHTML = '<svg class="u" viewBox="0 0 100 100"><use href="#chip"/></svg>';
    c.style.left = x0 + 'px'; c.style.top = y0 + 'px'; c.style.color = ['#c33641', '#d3ac63', '#1f5b52'][i % 3];
    document.body.appendChild(c);
    const sx = (Math.random() - .5) * 90, sy = -30 - Math.random() * 50;
    const an = c.animate([{ transform: 'translate(0,0) scale(.6)', opacity: 0 }, { transform: `translate(${sx}px,${sy}px) scale(1.1)`, opacity: 1, offset: .35 }, { transform: `translate(${x1 - x0}px,${y1 - y0}px) scale(.5)`, opacity: .9 }],
      { duration: 820, delay: i * 45, easing: 'cubic-bezier(.3,.1,.3,1)', fill: 'both' });

const cardOf = s => ('23456789TJQKA'.indexOf(s[0]) << 2) | 'shdc'.indexOf(s[1]);
