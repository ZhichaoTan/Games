<title>川麻 · 血战到底</title>
<script>/* Keeps the page at its normal size on phones. Shared by the hub, Hold'em and Mahjong (each build inlines it in <head>).
   iOS Safari ignores user-scalable=no, so a double tap or a pinch could zoom the page, and inside a game the table
   then wouldn't pinch back out. Double taps are covered by touch-action:manipulation on every element, pinches by
   cancelling Safari's gesture events. If the page still ends up zoomed (a text field, a system setting), pinching is
   allowed again until it's back to normal size and a small note says how to zoom out. */
(function () {
  var root = document.documentElement, vv = window.visualViewport;
  var st = document.createElement('style');
  st.textContent = '*,*::before,*::after{touch-action:manipulation}html.zoomed #game{touch-action:manipulation}' +
    '#zoomhint{position:fixed;left:0;top:0;z-index:2147483000;display:flex;justify-content:center;pointer-events:none;transform-origin:0 0;opacity:0;transition:opacity .25s}' +
    '#zoomhint.on{opacity:1}#zoomhint span{margin-top:calc(env(safe-area-inset-top,0px) + 10px);padding:9px 16px;border-radius:999px;background:rgba(12,14,13,.9);color:#f4efe4;' +
    'font:700 14px/1.2 -apple-system,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12);white-space:nowrap}';
  (document.head || root).appendChild(st);
  var zoomed = function () { return !!vv && vv.scale > 1.02; };
  var block = function (e) { if (!zoomed() && e.cancelable) e.preventDefault(); };
  document.addEventListener('gesturestart', block, { passive: false });
  document.addEventListener('gesturechange', block, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if ((e.touches && e.touches.length > 1) || (e.scale && e.scale !== 1)) block(e);
  }, { passive: false });
  if (!vv) return;
  var hint = null, timer = 0;
  var place = function () {
    if (!hint) return;
    hint.style.width = innerWidth + 'px';
    hint.style.transform = 'translate(' + vv.offsetLeft + 'px,' + vv.offsetTop + 'px) scale(' + (1 / vv.scale) + ')';
  };
  var sync = function () {
    var z = zoomed();
    if (z !== root.classList.contains('zoomed')) root.classList.toggle('zoomed', z);
    clearTimeout(timer);
    if (z) {
      if (!hint) {
        hint = document.createElement('div'); hint.id = 'zoomhint'; hint.setAttribute('aria-hidden', 'true');
        hint.appendChild(document.createElement('span'));
        document.body.appendChild(hint);
      }
      hint.firstChild.textContent = /^zh/.test(root.lang) ? '双指捏合，缩回原来大小' : 'Pinch with two fingers to zoom back out';
      place();
      timer = setTimeout(function () { if (zoomed()) hint.classList.add('on'); }, 700);
    } else if (hint) hint.classList.remove('on');
  };
  vv.addEventListener('resize', sync);
  vv.addEventListener('scroll', function () { if (zoomed()) place(); });
})();
</script>

:root{
  --bg0:#06150f;--bg1:#0c2a21;--felt:#12402f;--felt2:#0e3326;
  --ink:#f3eedf;--ink2:#c9c2ad;--ink3:#8f9a8e;--gold:#e8c67b;--gold2:#b8893b;--red:#d9473a;--jade:#2f9a6a;
  --panel:rgba(8,24,18,.82);--line:rgba(232,198,123,.22);--glass:rgba(255,255,255,.06);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --brush:"MJBrush","Kaiti SC","STKaiti","KaiTi",serif;
  --bk:#1d9466;--bk2:#43c58f;--bk3:#106a46;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
[hidden]{display:none!important}
.screen{position:fixed;inset:0}
svg.ic{width:20px;height:20px;flex:none}

/* ===== 大厅 ===== */
#lobby{overflow-y:auto;-webkit-overflow-scrolling:touch;background:
  radial-gradient(120% 70% at 50% 0%,#1b5a43 0%,#0f3528 45%,#071a13 100%)}
#lobby::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--noise);opacity:.5;mix-blend-mode:overlay}
.lob{position:relative;max-width:440px;margin:0 auto;padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 28px)}
.lobtop{position:relative;z-index:2;display:flex;align-items:center;gap:8px;min-height:36px}
.lobtop .grow{flex:1;min-width:0}
.lobtop .pillbtn{white-space:nowrap}
.lobtop .pillbtn:active{background:rgba(255,255,255,.1)}
.pillbtn.home{gap:4px;padding:0 13px 0 8px;color:var(--ink);text-decoration:none}
.pillbtn.home .ic{width:18px;height:18px;color:var(--gold)}
.pillbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);font-size:13px;color:var(--ink2)}
.hero{position:relative;text-align:center;padding:40px 0 4px}
.fan{position:relative;height:150px;margin:0 auto;width:260px}
.fan .ft{position:absolute;left:50%;top:18px;width:66px;height:90px;margin-left:-33px;transform-origin:50% 140%}
.fan .glow{position:absolute;left:50%;top:40px;width:220px;height:120px;margin-left:-110px;border-radius:50%;background:radial-gradient(closest-side,rgba(232,198,123,.28),transparent);filter:blur(6px)}
.title{position:relative;display:inline-flex;align-items:center;gap:10px;margin-top:-8px}
.title h1{margin:0;display:flex;flex-direction:column;align-items:center;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.title .w1{font-family:var(--brush);font-weight:400;font-size:54px;line-height:1.08;letter-spacing:2px;background:linear-gradient(180deg,#fff3cf 0%,#e8c67b 55%,#b8893b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 2px 2px}
.title .w2{font:800 12px/1 "Manrope",var(--ui);letter-spacing:.62em;color:var(--gold);margin-top:4px;padding-left:.62em}
.title .w2:empty{display:none}
html[lang=en] .title h1{align-items:flex-start}
html[lang=en] .title .seal{display:none}
html[lang=en] .title .w1{font:italic 600 50px/0.98 "Fraunces",Georgia,serif;letter-spacing:-.02em;padding:0 4px 6px 0}
.seal{writing-mode:vertical-rl;font-family:var(--brush);font-size:19px;line-height:1;color:#fff2e6;background:linear-gradient(160deg,#d8463a,#a32a22);padding:7px 5px;border-radius:5px;box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,235,220,.35);transform:rotate(4deg);letter-spacing:2px}
.tagline{margin:10px auto 0;color:var(--ink2);font-size:14px;line-height:1.6;max-width:300px}
.box{position:relative;margin-top:16px;padding:16px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.me-row{display:flex;gap:14px;align-items:center}
.me-av{width:62px;height:62px;border-radius:50%;flex:none;box-shadow:0 0 0 2.5px var(--gold),0 6px 16px rgba(0,0,0,.4)}
.me-av svg{width:100%;height:100%}
.fld{flex:1;min-width:0}
.lbl{display:block;font-size:12px;color:var(--ink3);letter-spacing:1px;margin:0 0 6px 2px}
.inp{width:100%;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.28);color:var(--ink);padding:0 14px;font-size:16px;outline:none}
.inp:focus{border-color:rgba(232,198,123,.6)}
.avs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
.avs button{min-width:0;aspect-ratio:1;border-radius:50%;overflow:hidden;opacity:.72;transition:transform .15s,opacity .15s}
.avs button svg{width:100%;height:100%}
.avs button.on{opacity:1;box-shadow:0 0 0 2.5px var(--gold);transform:scale(1.06)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{position:relative;z-index:1;height:38px;border-radius:11px;font-size:15px;font-weight:600;color:var(--ink2);transition:color .2s}
.tabs button.on{color:#2b1d07}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:11px;background:linear-gradient(180deg,#f1d592,#c99b48);box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;font-size:16px;font-weight:700;width:100%;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#f3d896,#c99b48);color:#2b1d07;box-shadow:0 6px 18px rgba(201,155,72,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.red{background:linear-gradient(180deg,#e45a49,#b3362a);color:#fff;box-shadow:0 6px 18px rgba(180,54,42,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:var(--ink)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 16px}
.btn[disabled]{filter:grayscale(.8) brightness(.7);pointer-events:none}
.code-row{display:flex;gap:10px}
.code-row .inp{flex:1;text-align:center;font-size:22px;letter-spacing:10px;font-weight:700;text-transform:uppercase;height:50px}
.code-row .btn{width:110px}
.opts{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;font-size:14px;color:var(--ink2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:44px;height:32px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);font-size:13px;color:var(--ink2)}
.seg button.on{background:rgba(232,198,123,.16);border-color:rgba(232,198,123,.7);color:var(--gold)}
.more{font-size:13px;color:var(--ink3);text-align:center;padding:4px;display:flex;justify-content:center;gap:6px;align-items:center}
.err{color:#ff9c8f;font-size:13px;min-height:18px;text-align:center;margin-top:8px}
.resume{display:flex;align-items:center;gap:12px}
.resume .tx{flex:1;font-size:14px;color:var(--ink2);line-height:1.5}
.resume .tx b{color:var(--ink);font-size:15px}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--ink3);line-height:1.7}
.wx{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(217,71,58,.16);border:1px solid rgba(217,71,58,.35);font-size:13px;color:#ffd2cb;line-height:1.5}

/* ===== 等人（房间） ===== */
#room{background:radial-gradient(120% 70% at 50% 0%,#1b5a43 0%,#0f3528 45%,#071a13 100%);overflow-y:auto}
.room{max-width:460px;margin:0 auto;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 24px)}
.rhead{display:flex;align-items:center;gap:10px;height:40px}
.rhead .grow{flex:1}
.codebig{margin:14px 0 4px;text-align:center}
.codebig .l{font-size:13px;color:var(--ink3);letter-spacing:2px}
.codebig .c{font-size:54px;font-weight:800;letter-spacing:12px;color:var(--gold);margin:4px 0 0 12px;font-variant-numeric:tabular-nums}
.share{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
.seats4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rs{position:relative;padding:14px 10px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-align:center;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.rs .av{width:56px;height:56px;border-radius:50%}
.rs .av svg{width:100%;height:100%}
.rs .nm{font-size:15px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs .sub{font-size:12px;color:var(--ink3)}
.rs.empty{border-style:dashed;color:var(--ink3)}
.rs .x{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.rs .x svg{width:16px;height:16px}
.rs .tag{position:absolute;left:8px;top:8px;font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(232,198,123,.18);color:var(--gold)}
.rules-sum{margin-top:14px;font-size:13px;color:var(--ink2);line-height:1.8;text-align:center}

/* ===== 牌桌 ===== */
#game{background:radial-gradient(62% 44% at 50% 45%,rgba(255,232,180,.09),transparent 72%),radial-gradient(115% 78% at 50% 45%,#215f49 0%,#174b3a 40%,#0d3026 72%,#071a14 100%);overflow:hidden;touch-action:none}
#game::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(140% 100% at 50% 45%,transparent 52%,rgba(0,0,0,.42) 100%)}
#game::before{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.55;mix-blend-mode:overlay;pointer-events:none}
#tbl{position:absolute;inset:0}
.felt-ring{position:absolute;border-radius:34px;background:radial-gradient(85% 75% at 50% 45%,rgba(255,255,255,.035),rgba(0,0,0,.07));box-shadow:inset 0 0 0 1px rgba(255,255,255,.055),inset 0 0 44px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.16);pointer-events:none}
.felt-ring::before{content:"";position:absolute;inset:7px;border-radius:28px;border:1.5px dashed rgba(255,255,255,.075)}
.topbar{position:absolute;left:0;right:0;top:0;height:calc(var(--sat) + 44px);padding:var(--sat) 10px 0;display:flex;align-items:center;gap:8px;z-index:30;pointer-events:none}
.topbar>*{pointer-events:auto}
.tb-btn{width:36px;height:36px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative}
.tb-btn svg{width:19px;height:19px}
.tb-info{flex:1;display:flex;justify-content:center;gap:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.tb-info .chip{padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06)}
.tb-info .chip b{color:var(--ink);font-weight:700}
.netdot{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:#46d18d;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.netdot.bad{background:#ff6b5b}

/* 牌：基准 60×82，用 transform 缩放和移动。两层：象牙色牌面 + 翠绿色牌背，侧面露出两层的厚度 */
.t{position:absolute;left:0;top:0;width:60px;height:82px;transform-origin:30px 41px;will-change:transform;transition:transform .3s cubic-bezier(.22,.8,.25,1),opacity .22s;z-index:5}
.t .f{position:absolute;inset:0;border-radius:9px;background:linear-gradient(162deg,#fffef9 0%,#fbf6ea 45%,#f1e8d4 100%);overflow:hidden;box-shadow:inset 0 1.5px 0 #fff,inset 0 -2px 3px rgba(140,108,58,.16)}
.t .f svg{position:absolute;left:4%;top:3.5%;width:92%;height:93%}
.t .b{position:absolute;border-radius:9px;z-index:-1}
/* 站着的（自己手牌）：上面露出牌的顶边（翠绿背层 + 象牙色面层），下面一道影子 */
.t.stand .b{left:0;right:0;top:-13px;bottom:0;background:linear-gradient(180deg,var(--bk2) 0,var(--bk) 3.4%,var(--bk3) 8.2%,#e2d4b4 8.7%,#f4ecda 12%,#ece1c8 13.8%);box-shadow:0 9px 12px -1px rgba(0,0,0,.42),0 2px 3px rgba(0,0,0,.25)}
.t.stand .f{box-shadow:inset 0 -5px 4px -3px rgba(150,118,66,.28),inset 0 2px 0 #fff,inset 2px 0 0 rgba(255,255,255,.6)}
/* 平躺的（牌河、碰杠）：下面露出厚度；横着放的按方向把厚度画在屏幕下方 */
.t.flat .b,.t.down .b{left:0;right:0;top:6px;bottom:-11px;box-shadow:0 7px 9px rgba(0,0,0,.34),0 1px 2px rgba(0,0,0,.3)}
.t.flat .b{background:linear-gradient(180deg,#d4c6a7 0,#e4d8bd 86%,var(--bk3) 89.5%,var(--bk) 94%,#0b4f34 100%)}
.t.down .b{background:linear-gradient(180deg,var(--bk3) 0,var(--bk3) 86%,#e6d9be 90%,#cfc0a0 100%)}
.t.flat.o1 .b,.t.down.o1 .b{top:0;bottom:0;left:-11px;right:6px;box-shadow:-6px 0 9px rgba(0,0,0,.34)}
.t.flat.o1 .b{background:linear-gradient(270deg,#d4c6a7 0,#e4d8bd 86%,var(--bk3) 89.5%,var(--bk) 94%,#0b4f34 100%)}
.t.down.o1 .b{background:linear-gradient(270deg,var(--bk3) 0,var(--bk3) 86%,#e6d9be 90%,#cfc0a0 100%)}
.t.flat.o3 .b,.t.down.o3 .b{top:0;bottom:0;left:6px;right:-11px;box-shadow:6px 0 9px rgba(0,0,0,.34)}
.t.flat.o3 .b{background:linear-gradient(90deg,#d4c6a7 0,#e4d8bd 86%,var(--bk3) 89.5%,var(--bk) 94%,#0b4f34 100%)}
.t.down.o3 .b{background:linear-gradient(90deg,var(--bk3) 0,var(--bk3) 86%,#e6d9be 90%,#cfc0a0 100%)}
.t.flat .f{box-shadow:inset 0 1.5px 0 #fff,inset 0 -2px 2px rgba(150,118,66,.2)}
.t.down .f{background:linear-gradient(158deg,var(--bk2) 0%,var(--bk) 42%,var(--bk3) 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -2px 3px rgba(0,0,0,.18)}
.t.down .f::before{content:"";position:absolute;inset:22% 26%;border-radius:50%;border:2.5px solid rgba(255,255,255,.13);box-shadow:inset 0 0 0 5px rgba(255,255,255,.05)}
.t.sel{z-index:8}
.t.dim .f::after{content:"";position:absolute;inset:0;background:rgba(18,28,24,.4)}
.t.que .f::before{content:"";position:absolute;right:4px;top:4px;width:13px;height:13px;border-radius:50%;background:#cc3328;box-shadow:0 0 0 2.5px #fff,0 1px 3px 2px rgba(0,0,0,.2);z-index:2}
.t.hl .f{background:linear-gradient(162deg,#fff8d6,#ffeaa8 60%,#f6d77f)}
.t.last .f{box-shadow:0 0 0 3px #ffcf5a,0 0 14px 3px rgba(255,207,90,.55),inset 0 1.5px 0 #fff}
.t.last::before{content:"";position:absolute;left:50%;top:-17px;width:0;height:0;margin-left:-7px;border:7px solid transparent;border-top:9px solid #ffcf5a;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));animation:bob 1s ease-in-out infinite alternate;z-index:4}
.t.o1.last::before,.t.o3.last::before{display:none}
@keyframes bob{0%{translate:0 -3px}100%{translate:0 2px}}
.t.got .f{animation:gotGlow 1.6s ease-out}
@keyframes gotGlow{0%,40%{background:linear-gradient(162deg,#fff3b0,#ffd76a)}100%{}}
.t.mk::after,.t.mkb::after{content:"";position:absolute;left:50%;top:-40px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#35d28c;box-shadow:0 0 0 4px rgba(0,0,0,.3),0 0 18px #35d28c;z-index:3}
.t.mkb::after{background:radial-gradient(circle,#fff 0 30%,#35d28c 34%)}
.t.huT .f{box-shadow:0 0 0 3px #ff7a52,0 0 16px #ff7a52}
.t.drop .f,.t.drop .b{animation:drop .4s ease-in both}
@keyframes drop{0%{transform:scale(1.14)}72%{transform:scale(.97)}100%{transform:scale(1)}}

/* 对手手牌：一个元素画一排立着的牌（从背后/侧面看） */
.ohand{position:absolute;z-index:4;pointer-events:none}
.ohand i{position:absolute;border-radius:3px}
.ohand.top i{background:linear-gradient(180deg,#f3ead6 0,#e2d5b6 19%,var(--bk3) 21%,var(--bk2) 27%,var(--bk) 50%,var(--bk3) 100%);box-shadow:0 3px 4px rgba(0,0,0,.42),inset 0 -1px 0 rgba(0,0,0,.2)}
.ohand.side i{background:linear-gradient(90deg,var(--bk3) 0,var(--bk) 30%,var(--bk2) 52%,var(--bk3) 60%,#dccfaf 62%,#f6eedd 82%,#e9dec6 100%);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.ohand.side.r i{background:linear-gradient(270deg,var(--bk3) 0,var(--bk) 30%,var(--bk2) 52%,var(--bk3) 60%,#dccfaf 62%,#f6eedd 82%,#e9dec6 100%)}
.ohand.down i{background:linear-gradient(158deg,var(--bk2),var(--bk) 45%,var(--bk3));box-shadow:0 2px 0 #e6d9be,0 3px 0 #cfc0a0,0 5px 5px rgba(0,0,0,.38)}

/* 座位 */
.seat{position:absolute;z-index:12;display:flex;align-items:center;gap:6px;pointer-events:auto;transition:opacity .3s}
.seat .av{position:relative;width:var(--a,40px);height:var(--a,40px);border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 4px 10px rgba(0,0,0,.35);transition:box-shadow .25s}
.seat .av svg{width:100%;height:100%;border-radius:50%}
.seat.turn .av{box-shadow:0 0 0 2.5px #ffd36b,0 0 18px rgba(255,211,107,.6)}
.seat .info{display:flex;flex-direction:column;gap:1px;min-width:0;padding:3px 8px 4px;border-radius:10px;background:rgba(3,14,10,.42);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.seat .nm{font-size:12px;color:var(--ink);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.seat .sc{font-size:12.5px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.seat .sc.neg{color:#ff9a8a}
.seat.vert{flex-direction:column;gap:3px;text-align:center}
.seat.vert .info{align-items:center;margin-top:9px}
.seat.rev{flex-direction:row-reverse;text-align:right}
.seat.rev .info{align-items:flex-end}
.status.intb,.autobar.intb{z-index:31;background:rgba(6,20,15,.94);border:1px solid var(--line)}
#game.tbmsg .tb-info{visibility:hidden}
.badge{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--brush);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.badge.zhuang{right:-6px;top:-6px;width:19px;height:19px;font-size:13px;background:linear-gradient(160deg,#f0c35a,#b9852a);color:#3a2706;font-family:var(--ui);font-weight:800;font-size:11px}
.badge.que{left:-7px;top:-6px;width:21px;height:21px;font-size:15px;border:1.5px solid rgba(255,255,255,.85)}
.badge.que .qi{width:14px;height:14px;color:#fff}
.qbtn .q .qi{width:1em;height:1em;display:block}
.badge.que.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.stat{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:10px;line-height:15px;padding:0 6px;border-radius:99px;background:rgba(0,0,0,.6);color:var(--ink2);white-space:nowrap}
.stat.hu{background:linear-gradient(180deg,#e45a49,#b3362a);color:#fff;font-family:var(--brush);font-size:13px;line-height:17px;bottom:-10px}
.ring{position:absolute;inset:-4px;pointer-events:none}
.ring circle{fill:none;stroke:#ffd36b;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.bubble{position:absolute;z-index:40;max-width:170px;padding:7px 11px;border-radius:14px;background:#fff8e8;color:#2a2116;font-size:13px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:bub 2.6s ease forwards;pointer-events:none}
.bubble.emo{font-size:30px;padding:4px 8px;background:transparent;box-shadow:none}
@keyframes bub{0%{opacity:0;transform:translateY(6px) scale(.9)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* 中间罗盘 */
.compass{position:absolute;z-index:3;border-radius:24%;background:radial-gradient(110% 80% at 28% 18%,rgba(255,255,255,.11),transparent 46%),linear-gradient(150deg,#2a3431 0%,#141b19 55%,#0a0f0d 100%);box-shadow:0 0 0 1.5px rgba(232,198,123,.5),0 0 0 4.5px rgba(0,0,0,.28),0 14px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 8px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;flex-direction:column}
.compass .lt{position:absolute;background:rgba(255,255,255,.075);border-radius:99px;box-shadow:inset 0 1px 1px rgba(0,0,0,.5);transition:background .25s,box-shadow .25s}
.compass .lt.on{background:linear-gradient(90deg,#ffe7a6,#ffc451,#ffe7a6);box-shadow:0 0 9px 2px rgba(255,196,81,.8),0 0 26px 4px rgba(255,196,81,.4);animation:ltp 1.1s ease-in-out infinite alternate}
@keyframes ltp{0%{opacity:.72}100%{opacity:1}}
.compass .lt.hu{background:#e0503f;box-shadow:0 0 8px rgba(224,80,63,.65)}
.compass .left{font-size:10.5px;color:rgba(232,198,123,.62);letter-spacing:.06em}
.compass .left b{display:block;font:800 23px/1.1 "Manrope",var(--ui);color:#ffeec4;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,205,100,.38)}
.compass .clock{position:absolute;bottom:6px;font-size:11px;color:#ffd36b;font-weight:700;font-variant-numeric:tabular-nums}
.compass .dir{position:absolute;font-family:var(--brush);font-size:14px;color:rgba(232,198,123,.75)}

/* 操作按钮 */
.acts{position:absolute;z-index:25;display:flex;gap:10px;align-items:flex-end;justify-content:flex-end}
.abtn{position:relative;width:62px;height:62px;border-radius:50%;font-family:var(--brush);font-size:30px;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18);animation:abIn .28s cubic-bezier(.2,1.5,.4,1);text-shadow:0 2px 3px rgba(0,0,0,.35)}
.abtn:active{transform:scale(.93)}
.abtn::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(70% 50% at 50% 18%,rgba(255,255,255,.42),transparent 70%);pointer-events:none}
.abtn::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid rgba(255,255,255,.7);opacity:0;pointer-events:none}
.abtn.hu::after,.abtn.gang::after,.abtn.peng::after{animation:abPulse 1.5s ease-out .3s infinite}
.abtn.hu::after{border-color:#ffd36b}
@keyframes abPulse{0%{opacity:.85;transform:scale(.92)}100%{opacity:0;transform:scale(1.35)}}
.turnglow{position:absolute;z-index:4;pointer-events:none;border-radius:50%;background:radial-gradient(50% 50% at 50% 60%,rgba(255,206,100,.28),rgba(255,206,100,.08) 55%,transparent 72%);animation:tgIn .35s ease-out}
@keyframes tgIn{0%{opacity:0}100%{opacity:1}}
.abtn.hu{width:72px;height:72px;font-size:36px;background:radial-gradient(circle at 40% 30%,#ff8a5c,#d9362a 60%,#a5221a)}
.abtn.gang{background:radial-gradient(circle at 40% 30%,#b493ff,#7a55d8 60%,#5634a8)}
.abtn.peng{background:radial-gradient(circle at 40% 30%,#6fb6ff,#2f7fd6 60%,#1d59a3)}
.abtn.pass{width:52px;height:52px;font-size:24px;background:radial-gradient(circle at 40% 30%,#8a9792,#56625d 60%,#3b4541)}
.abtn .mini{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:24px;height:33px;border-radius:4px;background:linear-gradient(162deg,#fffef9,#f6efdf);box-shadow:0 2px 0 var(--bk3),0 4px 8px rgba(0,0,0,.4)}
.abtn .mini svg{position:absolute;left:1px;top:1px;width:22px;height:31px}
@keyframes abIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.gopts{position:absolute;z-index:26;display:flex;gap:8px;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.gopts button{width:34px;height:46px;border-radius:5px;background:linear-gradient(162deg,#fffef9,#f6efdf);position:relative;box-shadow:0 3px 0 var(--bk3),0 4px 8px rgba(0,0,0,.35)}
.gopts button svg{position:absolute;left:1.5px;top:1.5px;width:31px;height:43px}

/* 提示框（听什么） */
.tip{position:absolute;z-index:24;padding:8px 10px;border-radius:14px;background:rgba(6,20,15,.88);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);pointer-events:none;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.tip .w{display:flex;align-items:center;gap:3px}
.tip .mt{width:22px;height:30px;border-radius:3.5px;background:linear-gradient(162deg,#fffef9,#f6efdf);position:relative;flex:none;box-shadow:0 2px 0 var(--bk3)}
.tip .mt svg{position:absolute;left:1px;top:1px;width:20px;height:28px}
.tip .n{font-weight:700;color:var(--ink)}
.tip .n.z{color:#ff8b7b}
.tip .fn{font-size:11px;color:var(--gold)}
.tip .lab{font-family:var(--brush);font-size:17px;color:var(--gold)}

/* 中间横幅（换三张/定缺/等待） */
.banner{position:absolute;z-index:22;left:50%;transform:translateX(-50%);min-width:240px;max-width:calc(100vw - 24px);padding:12px 16px;border-radius:18px;background:rgba(6,20,15,.88);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.4);text-align:center}
.banner .h{font-family:var(--brush);font-size:24px;color:var(--gold);line-height:1.2}
.banner .s{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5}
.banner .row{display:flex;gap:10px;justify-content:center;margin-top:10px}
.qbtn{position:relative;width:74px;height:84px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.qbtn .q{font-family:var(--brush);font-size:38px;line-height:1}
.qbtn .c{font-size:11px;color:var(--ink3)}
.qbtn.rec{border-color:rgba(232,198,123,.75);background:rgba(232,198,123,.12)}
.qbtn.rec::after{content:"推荐";position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;padding:1px 7px;border-radius:99px;background:linear-gradient(180deg,#f1d592,#c99b48);color:#2b1d07;font-weight:700}
.dirfx{position:absolute;z-index:23;pointer-events:none;width:180px;height:180px;margin:-90px 0 0 -90px}
.dirfx svg{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(255,200,90,.6));animation:spin 1.5s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes spin{0%{transform:rotate(0) scale(.6);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:rotate(var(--rot,180deg)) scale(1);opacity:0}}

/* 大字 */
.callout{position:absolute;z-index:35;pointer-events:none;font-family:var(--brush);white-space:nowrap;transform:translate(-50%,-50%);animation:call 1.25s cubic-bezier(.2,1.2,.3,1) forwards;text-shadow:0 4px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.45)}
.callout.big{font-size:84px}
.callout.mid{font-size:52px}
.callout.sm{font-size:30px}
.callout .sub{display:block;font-size:.36em;text-align:center;margin-top:-4px;font-family:var(--ui);font-weight:700;letter-spacing:1px}
@keyframes call{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}14%{opacity:1;transform:translate(-50%,-50%) scale(.94)}22%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.c-hu{background:linear-gradient(180deg,#fff4cf,#ffbe45 45%,#e8471f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 1px #5a1205) drop-shadow(0 0 1px #5a1205) drop-shadow(0 4px 0 #6e1508) drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.c-peng{color:#eef6ff;text-shadow:2px 0 #1f62b5,-2px 0 #1f62b5,0 2px #1f62b5,0 -2px #1f62b5,1.5px 1.5px #1f62b5,-1.5px 1.5px #1f62b5,1.5px -1.5px #1f62b5,-1.5px -1.5px #1f62b5,0 5px 0 #0d3466,0 9px 18px rgba(0,0,0,.5);color:#eef6ff}
.c-gang{color:#fbf6ff;text-shadow:2px 0 #6a3bd0,-2px 0 #6a3bd0,0 2px #6a3bd0,0 -2px #6a3bd0,1.5px 1.5px #6a3bd0,-1.5px 1.5px #6a3bd0,1.5px -1.5px #6a3bd0,-1.5px -1.5px #6a3bd0,0 5px 0 #34186f,0 9px 18px rgba(0,0,0,.5)}
.c-rain{color:#f0f9ff;text-shadow:2px 0 #2a6fa8,-2px 0 #2a6fa8,0 2px #2a6fa8,0 -2px #2a6fa8,1.5px 1.5px #2a6fa8,-1.5px 1.5px #2a6fa8,1.5px -1.5px #2a6fa8,-1.5px -1.5px #2a6fa8,0 4px 0 #123a5c,0 8px 16px rgba(0,0,0,.5)}
.c-wind{color:#f4fff1;text-shadow:2px 0 #2c7b4a,-2px 0 #2c7b4a,0 2px #2c7b4a,0 -2px #2c7b4a,1.5px 1.5px #2c7b4a,-1.5px 1.5px #2c7b4a,1.5px -1.5px #2c7b4a,-1.5px -1.5px #2c7b4a,0 4px 0 #123f24,0 8px 16px rgba(0,0,0,.5)}
.fly{position:absolute;z-index:36;pointer-events:none;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;animation:fly 1.6s ease forwards;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.fly.p{color:#ffd36b}.fly.m{color:#ff8c7c}
@keyframes fly{0%{opacity:0;transform:translate(-50%,6px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.fx{position:absolute;z-index:34;pointer-events:none}
.coin{position:absolute;left:-9px;top:-9px;width:18px;height:18px;z-index:37;pointer-events:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6cf 0 14%,#ffd66b 30%,#e3a22c 68%,#a86a12 100%);box-shadow:0 0 0 1.5px rgba(122,74,8,.55),0 3px 6px rgba(0,0,0,.4),0 0 10px rgba(255,200,90,.5)}
.coin::after{content:"";position:absolute;inset:5px;border-radius:2px;border:1.5px solid rgba(122,74,8,.55);transform:rotate(45deg) scale(.8)}
.callout::before{content:"";position:absolute;left:50%;top:50%;width:2.4em;height:2.4em;margin:-1.2em 0 0 -1.2em;border-radius:50%;z-index:-1;pointer-events:none;opacity:0}
.callout.c-hu::before{background:repeating-conic-gradient(from 0deg,rgba(255,214,110,.5) 0deg 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 30%,transparent 100%);mask:radial-gradient(closest-side,#000 30%,transparent 100%);animation:rays 1.5s ease-out forwards}
.callout.c-peng::before,.callout.c-gang::before{border:4px solid currentColor;animation:ring .9s ease-out forwards}
@keyframes rays{0%{opacity:0;transform:scale(.35) rotate(0)}18%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(50deg)}}
@keyframes ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}

/* 底部抽屉 */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;background:linear-gradient(180deg,#143a2d,#0b231a);border-top:1px solid var(--line);padding:18px 16px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}

.compass .left{text-align:center;line-height:1.2}
.fan .ft{animation:ftIn .5s cubic-bezier(.2,1.2,.4,1) both}
.fan .ft .tb{position:absolute;left:0;right:0;top:-9px;bottom:0;border-radius:9px;background:linear-gradient(180deg,var(--bk2) 0,var(--bk) 3%,var(--bk3) 7%,#e2d4b4 7.5%,#f4ecda 10%);box-shadow:0 10px 20px rgba(0,0,0,.45)}
.fan .ft .tf{position:absolute;inset:0;border-radius:9px;background:linear-gradient(162deg,#fffef9 0%,#fbf6ea 45%,#f1e8d4 100%);box-shadow:inset 0 -5px 4px -3px rgba(150,118,66,.28),inset 0 2px 0 #fff}
.fan .ft .tf svg{position:absolute;left:4%;top:3.5%;width:92%;height:93%}
@keyframes ftIn{0%{opacity:0;translate:0 30px}100%{opacity:1;translate:0 0}}
/* 英文：手写体换成衬线体，字号收一点 */
html[lang=en]{--brush:"Fraunces","MJBrush",Georgia,serif}
html[lang=en] body{font-family:"Manrope",var(--ui)}
html[lang=en] .title h1{font-size:44px;letter-spacing:0;font-weight:700;font-style:italic}
html[lang=en] .abtn{font:800 15px/1 "Manrope",var(--ui);letter-spacing:.02em}
html[lang=en] .abtn.hu{font-size:19px}
html[lang=en] .abtn.pass{font-size:13px}
html[lang=en] .abtn.ts{font-size:13px}
html[lang=en] .tspanel .h,html[lang=en] .tres{font-weight:700;font-style:italic}
html[lang=en] .tspanel .h{font-size:20px}
html[lang=en] .callout{font-weight:700;font-style:italic}
html[lang=en] .callout.big{font-size:54px}html[lang=en] .callout.mid{font-size:38px}html[lang=en] .callout.sm{font-size:22px}
html[lang=en] .banner .h,html[lang=en] .sheet h3,html[lang=en] .res-head .t1{font-weight:700;font-style:italic}
html[lang=en] .qbtn .q{font-family:"Fraunces",serif;font-weight:700;font-size:30px}
html[lang=en] .qbtn{height:96px;width:86px}
html[lang=en] .badge.que{font:800 11px/1 "Manrope",var(--ui)}
html[lang=en] .stat.hu{font:800 10px/17px "Manrope",var(--ui)}
html[lang=en] .tip .lab{font-size:14px;font-style:italic;font-weight:700}
@media (prefers-reduced-motion:reduce){.t{transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="sprite"></div>

<!-- ============ 大厅 ============ -->
<section id="lobby" class="screen">
  <div class="lob">
    <div class="lobtop">
      <a class="pillbtn home" href="../"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg><span data-t="allGames"></span></a>
      <div class="grow"></div>
      <button class="pillbtn" id="btnRules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rule"/></svg><span data-t="rules"></span></button>
      <button class="pillbtn" id="btnLang"><svg class="ic" viewBox="0 0 24 24"><use href="#i-globe"/></svg><span></span></button>
    </div>
    <div class="hero">
      <div class="fan" id="fan"><div class="glow"></div></div>
      <div class="title"><h1><span class="w1" data-t="titleA"></span><span class="w2" data-t="titleB"></span></h1><span class="seal">血战</span></div>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <div id="wxTip" class="wx" hidden data-t="wx"></div>
    <div class="box" id="resumeBox" hidden></div>
    <div class="box">
      <div class="me-row">
        <div class="me-av" id="meAv"></div>
        <div class="fld"><label class="lbl" for="nick" data-t="yourName"></label><input id="nick" class="inp" maxlength="10" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="avs" id="avs"></div>
    </div>
    <div class="box">
      <div class="tabs" id="tabs"><span class="pill"></span><button data-tab="join" data-t="tabJoin"></button><button data-tab="host" data-t="tabHost"></button><button data-tab="solo" data-t="tabSolo"></button></div>
      <div id="paneJoin" class="pane">
        <div class="code-row"><input id="joinCode" class="inp" maxlength="4" placeholder="····" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn gold" id="btnJoin" data-t="join"></button></div>
        <div class="more" data-t="joinHint"></div>
      </div>
      <div id="paneHost" class="pane" hidden>
        <div class="opts" id="optsHost"></div>
        <button class="btn gold" id="btnCreate" data-t="create"></button>
      </div>
      <div id="paneSolo" class="pane" hidden>
        <div class="opts" id="optsSolo"></div>
        <button class="btn gold" id="btnSolo" data-t="startSolo"></button>
      </div>
      <div class="err" id="lobErr"></div>
    </div>
    <div class="foot" data-t="foot"></div>
  </div>
</section>

<!-- ============ 等人 ============ -->
<section id="room" class="screen" hidden>
  <div class="room">
    <div class="rhead">
      <button class="tb-btn" id="roomBack"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <div class="grow"></div>
      <button class="pillbtn" id="roomRules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rule"/></svg><span data-t="rules"></span></button>
    </div>
    <div class="codebig"><div class="l" data-t="roomCode"></div><div class="c" id="roomCode">····</div></div>
    <div class="share"><button class="btn glass sm" id="btnCopy"><svg class="ic" viewBox="0 0 24 24"><use href="#i-copy"/></svg><span data-t="copyInvite"></span></button><button class="btn glass sm" id="btnShare"><svg class="ic" viewBox="0 0 24 24"><use href="#i-share"/></svg><span data-t="share"></span></button></div>
    <div class="seats4" id="seats4"></div>
    <div class="rules-sum" id="rulesSum"></div>
    <div class="ractions" id="roomActs"></div>
  </div>
</section>

<!-- ============ 牌桌 ============ -->
<section id="game" class="screen" hidden>
  <div id="tbl"></div>
  <div class="topbar">
    <button class="tb-btn" id="btnMenu"><svg viewBox="0 0 24 24"><use href="#i-menu"/></svg><span class="netdot" id="netDot" hidden></span></button>
    <div class="tb-info" id="tbInfo"></div>
    <button class="tb-btn" id="btnChat"><svg viewBox="0 0 24 24"><use href="#i-chat"/></svg></button>
    <button class="tb-btn" id="btnSound"></button>
  </div>
</section>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet"></div>
<div id="toast" hidden></div>
<div id="overlay" hidden><div class="card" id="ovCard"></div></div>

      return calcFan(c, R.melds[o], { gangPao: kind === 'discard' && !!gangPao, rob: kind === 'rob', haidi: R.wall.length === 0 && kind !== 'rob' }, this.rules);
    }
    // 别人打出（或补杠）一张牌：看谁能胡/碰/杠
    claimOpts(o, t, kind, from, gangPao) {
      const R = this.R;
      if (R.hu[o]) return null;
      const isQ = SU(t) === R.que[o];
      const op = {};
      // 2v2：不能胡队友打的（或者抢队友的杠）
      if (!isQ && !this.hasQue(o) && !this.isMate(o, from)) {
        const c = counts(R.hands[o]); c[t]++;
        if (isHu(c, R.melds[o].length, R.que[o])) {
          // 过手胡：放过一手胡以后，自己摸牌之前只能胡番数更大的
          if (!R.passHu[o]) op.hu = true;
          else { const f = this.claimFan(o, t, kind, gangPao); if (f && f.fan > (R.passFan ? R.passFan[o] : 99)) op.hu = true; }
        }
      }
      if (kind === 'discard' && R.wall.length > 0 && !isQ) {
        let n = 0; for (const x of R.hands[o]) if (TY(x) === t) n++;
        if (n >= 2) op.peng = true;
        if (n >= 3) op.gang = true;
      }
      return Object.keys(op).length ? op : null;
    }
    openClaim(kind, from, id, gangPao) {
      const R = this.R, t = TY(id);
      const opts = [null, null, null, null];
      let any = false;
      for (let k = 1; k < 4; k++) { const o = (from + k) % 4; opts[o] = this.claimOpts(o, t, kind, from, gangPao); if (opts[o]) any = true; }
      if (!any) {
        if (kind === 'discard') return this.nextTurn(from);
        return this.completeBuGang(from, id);
      }
      R.claim = { kind, from, id, t, opts, resp: [null, null, null, null], gangPao: !!gangPao };
      R.stage = 'claim';
      this.emit('claim', { kind, from, id });
    }
    actClaim(s, k) {
      const R = this.R, C = R.claim;
      if (R.phase !== 'play' || R.stage !== 'claim' || !C) return 'phase';
      const op = C.opts[s];
      if (!op || C.resp[s]) return 'no';
      if (k !== 'pass' && !op[k]) return 'no';
      C.resp[s] = k;
      // 过手胡：自己摸牌之前，只能胡比放过的这手番数更大的牌
      if (op.hu && k !== 'hu') {
        const f = this.claimFan(s, C.t, C.kind, C.gangPao);
        if (!R.passFan) R.passFan = [-1, -1, -1, -1];
        R.passHu[s] = true; R.passFan[s] = Math.max(R.passFan[s], f ? f.fan : 0);
      }
      this.tryResolve();
      return 'ok';
    }
    tryResolve() {
      const R = this.R, C = R.claim;
      const seats = [1, 2, 3].map(k => (C.from + k) % 4);
      if (seats.some(o => C.opts[o] && C.opts[o].hu && !C.resp[o])) return;   // 还有人能胡没表态
      const winners = seats.filter(o => C.resp[o] === 'hu');
      if (winners.length) return this.resolveHu(winners);
      if (seats.some(o => C.opts[o] && !C.resp[o])) return;
      const g = seats.find(o => C.resp[o] === 'gang'), p = seats.find(o => C.resp[o] === 'peng');
      R.claim = null;
      if (C.kind === 'rob') return this.completeBuGang(C.from, C.id);
      if (g != null) return this.doMingGang(g, C);
      if (p != null) return this.doPeng(p, C);
      this.nextTurn(C.from);
    }
    takeFromRiver(C) {
      const R = this.R, rv = R.river[C.from];
      if (rv[rv.length - 1] === C.id) rv.pop(); else { const i = rv.indexOf(C.id); if (i >= 0) rv.splice(i, 1); }
    }
    resolveHu(winners) {
      const R = this.R, C = R.claim;
      R.claim = null;
      if (C.kind === 'discard') this.takeFromRiver(C);
      else { // 抢杠：那张牌从补杠的人手里拿走，碰还是碰
        const h = R.hands[C.from], i = h.indexOf(C.id); if (i >= 0) h.splice(i, 1);
      }
      const multi = winners.length > 1;
      for (const w of winners) this.recordWin(w, C.kind === 'rob' ? 'rob' : 'pao', C.from, C.id, { gangPao: C.gangPao, multi });
      // 呼叫转移：杠完放炮，那次杠的钱给胡的人（一炮多响给第一个）
      if (C.gangPao && R.lastKong && R.lastKong.s === C.from) this.transferKong(R.lastKong, winners[0]);
      if (multi) this.emit('multi', { from: C.from, n: winners.length });
      if (this.roundDone()) return this.endRound('hu');
      this.nextTurn(winners[winners.length - 1]);
    }
    doPeng(s, C) {
      const R = this.R;
      this.takeFromRiver(C);
      const h = R.hands[s], ids = [C.id];
      for (let i = h.length - 1; i >= 0 && ids.length < 3; i--) if (TY(h[i]) === C.t) ids.push(h.splice(i, 1)[0]);
      R.melds[s].push({ k: 'peng', t: C.t, ids, from: C.from });
      R.claims++; R.lastKong = null;
      R.turn = s; R.stage = 'discard'; R.canSelf = false; R.drawn = null; R.afterKong = -1;
      this.emit('peng', { s, from: C.from, t: C.t, id: C.id });
    }
    doMingGang(s, C) {
      const R = this.R;
      this.takeFromRiver(C);
      const h = R.hands[s], ids = [C.id];
      for (let i = h.length - 1; i >= 0 && ids.length < 4; i--) if (TY(h[i]) === C.t) ids.push(h.splice(i, 1)[0]);
      R.melds[s].push({ k: 'gang', t: C.t, ids, from: C.from });
      R.claims++;
      const L = this.kongPay(s, 'ming', C.t, [C.from], 2);
      R.lastKong = { s, kind: 'ming', from: C.from, L };
      this.emit('gang', { s, kind: 'ming', from: C.from, t: C.t, id: C.id });
      this.drawFor(s, true);
    }
    // 刮风下雨：马上给钱。payers 里已经胡了的人不给
    kongPay(s, kind, t, payers, mult) {
      const R = this.R, amt = this.rules.base * mult;
      const from = payers.filter(p => this.foes(p, s) && !R.hu[p]).map(p => ({ s: p, amt }));
      for (const f of from) this.pay(f.s, s, f.amt);
      const L = { k: 'gang', kind, to: s, t, from, moved: false };
      R.ledger.push(L);
      return L;
    }
    transferKong(lk, to) {
      const R = this.R, L = lk.L;
      if (!L || L.moved) return;
      const amt = L.from.reduce((a, f) => a + f.amt, 0);
      L.moved = true;
      if (!amt) return;
      this.pay(lk.s, to, amt);
      R.ledger.push({ k: 'zhuan', to, from: [{ s: lk.s, amt }] });
      this.emit('zhuan', { from: lk.s, to, amt });
    }
    pay(from, to, amt) { const R = this.R; R.deltas[from] -= amt; R.deltas[to] += amt; }
    // ----- 自己回合：自摸、暗杠、补杠 -----
    selfOpts(s) {
      const R = this.R;
      if (R.phase !== 'play' || R.stage !== 'discard' || R.turn !== s) return null;
      // que：手里还有缺门的牌（不能胡）；queLock：房间规定缺门要先打，只能打缺门
      const o = { hu: false, an: [], bu: [], que: this.hasQue(s), ts: this.canTSwap(s) };
      o.queLock = !!this.rules.queFirst && o.que;
      if (o.ts) o.tsLeft = R.tsLeft[s];
      if (!R.canSelf) return o;
      const c = counts(R.hands[s]);
      if (!o.que && isHu(c, R.melds[s].length, R.que[s])) o.hu = true;
      if (R.wall.length > 0) {
        for (let t = 0; t < 27; t++) if (c[t] === 4 && SU(t) !== R.que[s]) o.an.push(t);
        for (const m of R.melds[s]) if (m.k === 'peng' && c[m.t] >= 1) o.bu.push(m.t);
      }
      return o;
    }
    actZimo(s) {
      const o = this.selfOpts(s); if (!o || !o.hu) return 'no';
      const R = this.R;
      this.recordWin(s, 'zimo', -1, R.drawn != null ? R.drawn : R.hands[s][R.hands[s].length - 1], {});
      if (this.roundDone()) { this.endRound('hu'); return 'ok'; }
      this.nextTurn(s);
      return 'ok';
    }
    actAnGang(s, t) {
      const o = this.selfOpts(s); t = t | 0; if (!o || !o.an.includes(t)) return 'no';
      const R = this.R, h = R.hands[s], ids = [];
      for (let i = h.length - 1; i >= 0; i--) if (TY(h[i]) === t) ids.push(h.splice(i, 1)[0]);
      R.melds[s].push({ k: 'angang', t, ids, from: s });
      R.claims++;
      const L = this.kongPay(s, 'an', t, [0, 1, 2, 3], 2);
      R.lastKong = { s, kind: 'an', from: -1, L };
      this.emit('gang', { s, kind: 'an', t });
      this.drawFor(s, true);
      return 'ok';
    }
    actBuGang(s, t) {
      const o = this.selfOpts(s); t = t | 0; if (!o || !o.bu.includes(t)) return 'no';
      const R = this.R, h = R.hands[s];
      const i = h.findIndex(x => TY(x) === t);
      const id = h[i];
      R.canSelf = false; R.drawn = null;
      this.emit('bugangTry', { s, t, id });
      // 先看有没有人抢杠胡（牌还算在手里，抢走了才拿出来）
      this.openClaim('rob', s, id, false);
      return 'ok';
    }
    completeBuGang(s, id) {
      const R = this.R, t = TY(id), h = R.hands[s];
      const i = h.indexOf(id); if (i >= 0) h.splice(i, 1);
      const m = R.melds[s].find(x => x.k === 'peng' && x.t === t);
      m.k = 'bugang'; m.ids.push(id);
      R.claims++;
      const L = this.kongPay(s, 'bu', t, [0, 1, 2, 3], 1);
      R.lastKong = { s, kind: 'bu', from: -1, L };
      this.emit('gang', { s, kind: 'bu', t, id });
      this.drawFor(s, true);
    }
    // ----- 2v2：跟队友换一张牌（轮到自己出牌时，每回合一次，队友同意才换） -----
    canTSwap(s) {
      const R = this.R;
      if (!this.rules.team || !R || R.phase !== 'play' || R.stage !== 'discard' || R.turn !== s) return false;
      if (R.offer || R.tsUsed === s || !(R.tsLeft && R.tsLeft[s] > 0)) return false;
      return !R.hu[s] && !R.hu[this.mate(s)];
    }
    actTSwap(s, give, take) {
      if (!this.canTSwap(s)) return 'no';
      const R = this.R, m = this.mate(s);
      give = give | 0; take = take | 0;
      if (!R.hands[s].includes(give) || !R.hands[m].includes(take)) return 'bad';
      if (TY(give) === TY(take)) return 'bad';
      R.offer = { from: s, to: m, give, take };
      R.stage = 'offer';
      this.emit('tsAsk', { s, to: m, give, take });
      return 'ok';
    }
    actTSAnswer(s, yes) {
      const R = this.R, O = R.offer;
      if (!R || R.phase !== 'play' || R.stage !== 'offer' || !O || O.to !== s) return 'no';
      R.offer = null; R.stage = 'discard'; R.tsUsed = O.from;
      if (!yes) { this.emit('tswap', { s: O.from, to: O.to, give: O.give, take: O.take, ok: false }); return 'ok'; }
      const a = R.hands[O.from], b = R.hands[O.to];
      a.splice(a.indexOf(O.give), 1); b.splice(b.indexOf(O.take), 1);
      a.push(O.take); b.push(O.give);
      if (this.rules.tswap) R.tsLeft[O.from]--;   // 不限次数的房间不扣
      // 换来的那张当成刚摸的：可以自摸、可以暗杠/补杠；不算杠上开花，也不再有天胡地胡
      R.drawn = O.take; R.canSelf = true; R.afterKong = -1; R.claims++;
      this.emit('tswap', { s: O.from, to: O.to, give: O.give, take: O.take, ok: true });
      return 'ok';
    }
    actTSBack(s) {
      const R = this.R, O = R.offer;
      if (!R || R.phase !== 'play' || R.stage !== 'offer' || !O || O.from !== s) return 'no';
      R.offer = null; R.stage = 'discard'; R.tsUsed = s;
      this.emit('tswap', { s, to: O.to, give: O.give, take: O.take, ok: false, back: true });
      return 'ok';
    }
    // ----- 摸牌 -----
    nextTurn(after) {
      const R = this.R;
      R.lastKong = null; R.claim = null;
      for (let k = 1; k <= 4; k++) { const s = (after + k) % 4; if (!R.hu[s]) return this.drawFor(s, false); }
      this.endRound('hu');
    }
    drawFor(s, kong) {
      const R = this.R;
      if (!kong) R.lastKong = null;
      if (R.wall.length === 0) return this.endRound('wall');
      const id = R.wall.pop();
      R.hands[s].push(id);
      R.drawn = id; R.turn = s; R.stage = 'discard'; R.canSelf = true; R.passHu[s] = false; if (R.passFan) R.passFan[s] = -1;
      R.afterKong = kong ? s : -1;
      this.emit('draw', { s, id, kong: !!kong, left: R.wall.length });
    }
    // ----- 胡牌 -----
    recordWin(s, how, from, id, x) {
      const R = this.R, rules = this.rules, t = TY(id);
      const conc = counts(R.hands[s]);
      if (how !== 'zimo') conc[t]++;
      const zimo = how === 'zimo';
      const ctx = {
        zimo, drew: zimo, gangHua: zimo && R.afterKong === s, gangPao: how === 'pao' && !!x.gangPao, rob: how === 'rob',
        haidi: R.wall.length === 0 && how !== 'rob',
        tian: zimo && s === R.dealer && R.discards === 0 && R.claims === 0,
        di: zimo && s !== R.dealer && !R.firstDone[s] && R.claims === 0,
      };
      // 点杠花算点炮：直杠补上来的牌自摸，只有放杠的人给，按点炮算（不加自摸）
      const dgPao = ctx.gangHua && R.lastKong && R.lastKong.kind === 'ming' && rules.dgh === 'pao' && !R.hu[R.lastKong.from] && this.foes(R.lastKong.from, s);
      const f = calcFan(conc, R.melds[s], dgPao ? Object.assign({}, ctx, { zimo: false }) : ctx, rules);
      const base = rules.base;
      let amt = base * Math.pow(2, f.fan);
      let payers;
      if (zimo && !dgPao) { payers = this.active().filter(p => this.foes(p, s)); if (rules.zimo === 'di') amt += base; }
      else payers = [dgPao ? R.lastKong.from : from];
      const L = { k: 'hu', to: s, how: dgPao ? 'dgh' : how, from: payers.map(p => ({ s: p, amt })), title: f.title, items: f.items, fan: f.fan, raw: f.raw, t, multi: !!x.multi, by: from };
      for (const p of payers) this.pay(p, s, amt);
      R.ledger.push(L);
      // 胡的那张单独放（一炮多响时几个人共用一张），自摸的从手里拿出来
      if (zimo) { const h = R.hands[s], i = h.indexOf(id); if (i >= 0) h.splice(i, 1); }
      R.hu[s] = ++R.huN;
      const W = { s, how, from: dgPao ? R.lastKong.from : from, id, t, fan: f.fan, raw: f.raw, title: f.title, items: f.items, amt, payers, order: R.huN, multi: !!x.multi };
      R.wins.push(W);
      this.emit('hu', { s, how, from: W.from, id, t, fan: f.fan, title: f.title, items: f.items, amt, payers, order: R.huN, multi: !!x.multi });
    }
    // ----- 一局结束：查花猪、查大叫、退税 -----
    tingInfo(s) {
      const R = this.R, c = counts(R.hands[s]);
      const all = this.allCounts(s);
      const hua = this.hasQue(s);
      if (hua) return { hua, ting: false, waits: [], max: 0 };
      const w = waits(c, R.melds[s].length, R.que[s], all);
      let max = 0, best = null;
      for (const t of w) {
        c[t]++; const f = calcFan(c, R.melds[s], {}, this.rules); c[t]--;
        if (f && f.fan >= max) { max = f.fan; best = f; }
      }
      return { hua, ting: w.length > 0, waits: w, max, best };
    }
    endRound(reason) {
      const R = this.R, rules = this.rules;
      if (R.phase === 'end') return;
      R.phase = 'end'; R.stage = null; R.claim = null; R.offer = null; R.endReason = reason;
      const act = this.active();
      const info = [null, null, null, null];
      if (reason === 'wall' && act.length >= 2 && act.some(a => act.some(b => this.foes(a, b)))) {
        for (const s of act) info[s] = this.tingInfo(s);
        const pigAmt = rules.base * Math.pow(2, rules.cap || 6);
        // 查花猪：花猪赔给每个不是花猪的人封顶番
        for (const a of act) if (info[a].hua) for (const b of act) if (this.foes(a, b) && !info[b].hua) {
          this.pay(a, b, pigAmt); R.ledger.push({ k: 'pig', to: b, from: [{ s: a, amt: pigAmt }] });
        }
        // 查大叫：没听牌的赔给听牌的人（按他最大的番）
        for (const a of act) if (!info[a].hua && !info[a].ting) for (const b of act) if (this.foes(a, b) && info[b].ting) {
          const amt = rules.base * Math.pow(2, info[b].max);
          this.pay(a, b, amt); R.ledger.push({ k: 'cha', to: b, from: [{ s: a, amt }], fan: info[b].max, title: info[b].best ? info[b].best.title : '' });
        }
        // 退税：没听牌的人把刮风下雨收的钱退回去
        for (const a of act) if (!info[a].ting) {
          for (const L of R.ledger.slice()) if (L.k === 'gang' && L.to === a && !L.moved && !L.refunded) {
            L.refunded = true;
            for (const f of L.from) { this.pay(a, f.s, f.amt); R.ledger.push({ k: 'tax', to: f.s, from: [{ s: a, amt: f.amt }], t: L.t }); }
          }
        }
      }
      // 下一局庄家：第一个胡的人；第一炮是一炮多响就是放炮的人；没人胡就连庄
      let next = R.dealer;
      if (R.wins.length) { const w = R.wins[0]; next = w.multi ? w.from : w.s; }
      for (let s = 0; s < 4; s++) if (this.seats[s]) this.seats[s].score += R.deltas[s];
      R.result = { reason, deltas: R.deltas.slice(), info: info.map(x => x && { hua: x.hua, ting: x.ting, waits: x.waits, max: x.max }), next };
      this.hist.push({ no: R.no, dealer: R.dealer, deltas: R.deltas.slice(), wins: R.wins.map(w => ({ s: w.s, how: w.how, title: w.title, fan: w.fan })) });
      this.dealer = next;
      if (rules.rounds && this.roundNo >= rules.rounds) this.over = true;
      this.emit('end', { reason, deltas: R.deltas.slice() });
    }
    // ----- 谁该动了 -----
    pending() {
      const R = this.R; if (!R) return [];
      if (R.phase === 'swap') return [0, 1, 2, 3].filter(s => !R.swapPick[s]);
      if (R.phase === 'que') return [0, 1, 2, 3].filter(s => R.que[s] < 0);
      if (R.phase === 'play') {
        if (R.stage === 'discard') return [R.turn];
        if (R.stage === 'offer' && R.offer) return [R.offer.to];
        if (R.stage === 'claim' && R.claim) {
          const C = R.claim, out = [];
          const anyHu = [0, 1, 2, 3].some(o => C.resp[o] === 'hu');
          for (let o = 0; o < 4; o++) if (C.opts[o] && !C.resp[o]) {
            if (anyHu && !C.opts[o].hu) continue;        // 已经有人胡了，只能碰杠的人不用等
            out.push(o);
          }
          return out;
        }
      }
      return [];
    }
    // 给某个座位的选项
    options(s) {
      const R = this.R; if (!R) return null;
      if (R.phase === 'swap') return R.swapPick[s] ? null : { k: 'swap' };
      if (R.phase === 'que') return R.que[s] >= 0 ? null : { k: 'que' };
      if (R.phase !== 'play') return null;
      if (R.stage === 'discard' && R.turn === s) return Object.assign({ k: 'turn' }, this.selfOpts(s));
      if (R.stage === 'offer' && R.offer && R.offer.to === s) return { k: 'offer', from: R.offer.from, give: R.offer.give, take: R.offer.take };
      if (R.stage === 'claim' && R.claim && R.claim.opts[s] && !R.claim.resp[s] && this.pending().includes(s))
        return Object.assign({ k: 'claim', id: R.claim.id, t: R.claim.t, kind: R.claim.kind }, R.claim.opts[s]);
      return null;
    }
    // ----- 给某个座位看的画面（藏住别人的手牌） -----
    view(me) {
      const R = this.R, rules = this.rules;
      const mine = me >= 0 && me < 4;
      const mate = mine && rules.team ? this.mate(me) : -1;
      const sees = s => s === me || s === mate;   // 自己和队友的牌都看得到
      const v = { rules, roundNo: this.roundNo, over: this.over, dealer: this.dealer, me, hist: this.hist, evn: this.evn };
      v.seats = this.seats.map(p => p && { id: p.id, name: p.name, av: p.av, bot: !!p.bot, lv: p.lv || 0, score: p.score, conn: p.conn !== false, auto: !!p.auto, ready: !!p.ready });
      if (!R) return v;

    return { nMelds: melds.length, melds, que: R.que[me], meldMask, unseen: K.unseen, U: K.U, D, nAct, rules: v.rules, lv, P: LV[lv], allC, handC0: counts(R.hand) };
  }
  // 四个等级：新手 / 普通 / 高手 / 大师
  const LV = {
    1: { noise: 0.18, qd: false, qing: false, look: false, defense: 0, claim: 'greedy' },
    2: { noise: 0.05, qd: true, qdGate: 1, qing: false, look: false, defense: 0.25, claim: 'shanten' },
    3: { noise: 0, qd: true, qdGate: 1, qing: true, look: true, defense: 0.5, claim: 'shanten' },
    4: { noise: 0, qd: true, qdGate: 1, qing: true, look: true, defense: 0.5, claim: 'shanten' },
  };
  const lvOf = x => (x >= 1 && x <= 4 ? x : 2);

  // 打哪张
  function chooseDiscard(v, lv, rnd) {
    lv = lvOf(lv); rnd = rnd || Math.random;
    const R = v.R, me = v.me, P = LV[lv];
    const hand = R.hand.slice();
    const que = R.que[me];
    const K = know(v); K.wallLeft = R.wall;
    const queTiles = hand.filter(id => SU(TY(id)) === que);
    const TH = P.defense ? threats(v, K) : [];
    if (queTiles.length) {
      // 先打缺门：没人有威胁时先打中张（留着越来越危险），有威胁时打最安全的
      const threat = TH.reduce((a, th) => a + (th ? th.p : 0), 0);
      let best = null, bs = -1e9;
      for (const id of queTiles) {
        const t = TY(id);
        let sc = lv >= 2 ? (threat > 0.4 ? -danger(t, TH, K) : RANK_DANGER[t % 9] - K.seen[t] * 0.1) : rnd();
        if (id === R.drawn) sc += 0.001;
        if (sc > bs) { bs = sc; best = id; }
      }
      return best;
    }
    const ctx = ctxFor(v, K, lv);
    const c = counts(hand);
    const cands = [];
    const tried = new Set();
    for (const id of hand) {
      const t = TY(id); if (tried.has(t)) continue; tried.add(t);
      c[t]--;
      const e = evalHand(c, ctx);
      c[t]++;
      const dg = P.defense ? danger(t, TH, K) : 0;
      cands.push({ t, e, dg });
    }
    const minS = Math.min(...cands.map(x => x.e.s));
    let pick;
    if (lv === 1) {
      // 新手：只看向听，偶尔乱打
      const pool = cands.filter(x => x.e.s === minS);
      pick = rnd() < P.noise ? cands[Math.floor(rnd() * cands.length)] : pool.sort((a, b) => b.e.stdUk - a.e.stdUk || a.t % 9 - b.t % 9)[Math.floor(rnd() * Math.min(2, pool.length))];
    } else {
      // 没人有威胁：只比进攻（期望值，乘法打破平局）；有威胁：期望得分 - 点炮代价
      const threat = TH.reduce((a, th) => a + (th ? th.p : 0), 0);
      const useDef = P.defense > 0 && threat > 0.15;
      // 先保证快：普通打法向听数最小的那些；做大牌（清一色/七对）最多慢一步，而且期望要明显更高
      const fastS = Math.min(...cands.map(x => x.e.stdS));
      const fastBest = Math.max(1e-12, ...cands.filter(x => x.e.stdS === fastS).map(x => x.e.ev));
      for (const x of cands) {
        const fast = x.e.stdS === fastS;
        const value = x.e.plan !== 'std' && x.e.s <= fastS + 1 && x.e.ev >= fastBest * 1.3;
        x.keep = fast || value;
        const tb = 1 + 1e-3 * (1 - RANK_DANGER[x.t % 9]) + 1e-4 * x.e.stdUk;   // 同等情况下先打幺九、留进张多的
        x.score = x.e.ev > 0 ? x.e.ev * tb : 1e-15 * (x.e.stdUk + 1);
        if (useDef) x.score = x.e.ev * 1.6 * tb - x.dg * P.defense;
        if (!x.keep) x.score -= 1e6;
      }
      // 真危险的时候可以放弃进攻（弃胡）：允许打慢的牌
      if (useDef && fastS >= 2) for (const x of cands) if (!x.keep) x.score += 1e6 - 0.5;
      if (P.noise && rnd() < P.noise) { const pool = cands.filter(x => x.e.s <= minS); pick = pool[Math.floor(rnd() * pool.length)]; }
      else pick = cands.reduce((a, b) => (b.score > a.score ? b : a));
    }
    // 优先打刚摸的那张（同种类时）
    const t = pick.t;
    if (R.drawn != null && TY(R.drawn) === t) return R.drawn;
    for (let i = hand.length - 1; i >= 0; i--) if (TY(hand[i]) === t) return hand[i];
    return hand[hand.length - 1];
  }

  // 现在这手（不出牌）值多少
  function handValue(v, K, lv, c, extraMeld) {
    const ctx = ctxFor(v, K, lv);
    if (extraMeld) { ctx.nMelds++; ctx.melds = ctx.melds.concat([extraMeld]); ctx.meldMask |= 1 << SU(extraMeld.t); ctx.allC = ctx.allC.slice(); }
    return evalHand(c, ctx);
  }
  // 碰/杠/过 —— 别人打出 t
  function chooseClaim(v, lv, rnd) {
    lv = lvOf(lv); rnd = rnd || Math.random;
    const R = v.R, me = v.me, o = v.opt;
    if (o.hu) return 'hu';
    if (!o.peng && !o.gang) return 'pass';
    const t = o.t;
    if (LV[lv].claim === 'greedy') return o.gang ? 'gang' : (rnd() < 0.85 ? 'peng' : 'pass');
    const K = know(v); K.wallLeft = R.wall;
    const ctx = ctxFor(v, K, lv);
    const c = counts(R.hand);
    const now = evalHand(c, ctx);
    const TH = LV[lv].defense ? threats(v, K) : [];
    // 碰：拿走两张，然后要打一张
    let pengEv = -1, pengS = 9;
    if (o.peng) {
      const c2 = c.slice(); c2[t] -= 2;
      const ctx2 = Object.assign({}, ctx, { nMelds: ctx.nMelds + 1, melds: ctx.melds.concat([{ k: 'peng', t }]), meldMask: ctx.meldMask | 1 << SU(t), allC: ctx.allC.slice() });
      ctx2.allC[t] += 1; ctx2.handC0 = ctx.handC0;
      const hasQ = c2.some((n, x) => n && SU(x) === ctx.que);
      for (let d = 0; d < 27; d++) {
        if (!c2[d]) continue;
        if (hasQ && SU(d) !== ctx.que) continue;
        c2[d]--;
        const e = evalHand(c2, ctx2);
        c2[d]++;
        const sc = e.ev - (TH.length ? danger(d, TH, K) * LV[lv].defense * 0.55 : 0);
        if (sc > pengEv) { pengEv = sc; pengS = e.s; }
      }
    }
    let gangEv = -1;
    if (o.gang) {
      const c3 = c.slice(); c3[t] -= 3;
      const ctx3 = Object.assign({}, ctx, { nMelds: ctx.nMelds + 1, melds: ctx.melds.concat([{ k: 'gang', t }]), meldMask: ctx.meldMask | 1 << SU(t), allC: ctx.allC.slice() });
      ctx3.allC[t] += 1; ctx3.handC0 = ctx.handC0;
      const e = evalHand(c3, ctx3);
      gangEv = e.ev + 2 / 1.6;    // 刮风：马上拿 2 分
    }
    const nowEv = now.ev;
    if (LV[lv].claim === 'shanten' || LV[lv].claim === 'strict') {
      if (o.gang && now.stdS >= 0) return 'gang';
      if (o.peng && pengS < now.stdS) return 'peng';
      if (o.peng && pengS === now.stdS) {
        if (LV[lv].claim === 'shanten') return 'peng';
        // 一样快时：对子多（奔对对胡）或者碰的是清一色那门才碰
        let pairs = 0; for (let x = 0; x < 27; x++) if (c[x] >= 2 && SU(x) !== ctx.que) pairs++;
        if (pairs >= 4) return 'peng';
        return 'pass';
      }
      return 'pass';
    }
    const margin = lv >= 4 ? 1.04 : 1.08;
    if (o.gang && gangEv >= Math.max(pengEv, nowEv)) return 'gang';
    if (o.peng && pengEv > nowEv * margin + 0.002) return 'peng';
    return 'pass';
  }
  // 自己回合：自摸 / 暗杠 / 补杠 / 出牌
  function chooseTurn(v, lv, rnd) {
    lv = lvOf(lv); rnd = rnd || Math.random;
    const R = v.R, me = v.me, o = v.opt;
    if (o.hu) return { k: 'zimo' };
    if (o.ts) { const sw = chooseTSwap(v, lv); if (sw) return { k: 'tswap', give: sw.give, take: sw.take }; }
    if ((o.an && o.an.length) || (o.bu && o.bu.length)) {
      if (lv === 1) {
        if (o.an.length) return { k: 'angang', t: o.an[0] };
        return { k: 'bugang', t: o.bu[0] };
      }
      const K = know(v); K.wallLeft = R.wall;
      const ctx = ctxFor(v, K, lv);
      const c = counts(R.hand);
      // 不杠：打出最好的一张后的价值
      let base = -1;
      for (let d = 0; d < 27; d++) {
        if (!c[d]) continue;
        c[d]--; const e = evalHand(c, ctx); c[d]++;
        if (e.ev > base) base = e.ev;
      }
      const TH = LV[lv].defense ? threats(v, K) : [];
      const nOther = K.active.length - 1;
      for (const t of o.an || []) {
        const c2 = c.slice(); c2[t] -= 4;
        const ctx2 = Object.assign({}, ctx, { nMelds: ctx.nMelds + 1, melds: ctx.melds.concat([{ k: 'angang', t }]), meldMask: ctx.meldMask | 1 << SU(t) });
        const e = evalHand(c2, ctx2);
        if (lv === 2 || e.ev + 2 * nOther / 1.6 >= base * 0.95) return { k: 'angang', t };
      }
      for (const t of o.bu || []) {
        const c2 = c.slice(); c2[t] -= 1;
        const ctx2 = Object.assign({}, ctx, { melds: ctx.melds.map(m => (m.t === t ? { k: 'bugang', t } : m)) });
        const e = evalHand(c2, ctx2);
        const rob = TH.length ? danger(t, TH, K) * 0.6 : 0;
        if (lv === 2 || e.ev + nOther / 1.6 - rob >= base * 0.95) return { k: 'bugang', t };
      }
    }
    return { k: 'discard', id: chooseDiscard(v, lv, rnd) };
  }

  // 换三张：挑三张同花色
  function chooseSwap(hand, lv, rnd) {
    lv = lvOf(lv); rnd = rnd || Math.random;
    const c = counts(hand);
    const bySuit = [0, 1, 2].map(s => hand.filter(id => SU(TY(id)) === s));
    const ok = [0, 1, 2].filter(s => bySuit[s].length >= 3);
    if (lv === 1) {
      const s = ok.sort((a, b) => bySuit[a].length - bySuit[b].length)[0];
      const ids = bySuit[s].slice(); shuffleIn(ids, rnd);
      return ids.slice(0, 3);
    }
    let best = null, bs = -1e9;
    for (const s of ok) {
      // 这门里最“孤”的几张
      const tiles = bySuit[s].slice().sort((a, b) => isoScore(c, TY(b)) - isoScore(c, TY(a)));
      const cand = tiles.slice(0, Math.min(6, tiles.length));
      for (let i = 0; i < cand.length; i++) for (let j = i + 1; j < cand.length; j++) for (let k = j + 1; k < cand.length; k++) {
        const pick = [cand[i], cand[j], cand[k]];
        const c2 = c.slice(); for (const id of pick) c2[TY(id)]--;
        let sc = -1e9;
        for (let q = 0; q < 3; q++) {
          let nq = 0; for (let t = q * 9; t < q * 9 + 9; t++) nq += c2[t];
          const sh = shantenStd(c2, 0, 1 << q);
          const s7 = shanten7(c2, 0, 1 << q);
          const v = -Math.min(sh, s7 + 1) * 10 - nq * 1.2 + (q === s ? 1.5 : 0);
          if (v > sc) sc = v;
        }
        sc += rnd() * 0.01;
        if (sc > bs) { bs = sc; best = pick; }
      }
    }
    return best;
  }
  function isoScore(c, t) {
    // 越孤立分越高：没有对子、没有相邻
    const r = t % 9;
    let s = 3 - Math.min(3, c[t] - 1) * 1.5;
    if (r > 0 && c[t - 1]) s -= 1.2; if (r < 8 && c[t + 1]) s -= 1.2;
    if (r > 1 && c[t - 2]) s -= 0.5; if (r < 7 && c[t + 2]) s -= 0.5;
    if (r === 0 || r === 8) s += 0.4;
    return s;
  }
  function shuffleIn(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }

  // 定缺
  function chooseQue(hand, lv, rnd) {
    lv = lvOf(lv); rnd = rnd || Math.random;
    const c = counts(hand);
    const n = [0, 1, 2].map(s => hand.filter(id => SU(TY(id)) === s).length);
    if (lv === 1) { const m = Math.min(...n); const cs = [0, 1, 2].filter(s => n[s] === m); return cs[Math.floor(rnd() * cs.length)]; }
    let best = 0, bs = -1e9;
    for (let q = 0; q < 3; q++) {
      const sh = shantenStd(c, 0, 1 << q);
      const s7 = shanten7(c, 0, 1 << q);
      const v = -Math.min(sh, s7 + 1) * 10 - n[q] * 1.5 + rnd() * 0.01;
      if (v > bs) { bs = v; best = q; }
    }
    return best;
  }

  // ---------------- 2v2：跟队友换牌 ----------------
  // 我（14 张）把 g 换成队友的 t 之后：我能不能胡、两边的向听数
  function tsCheck(H, nH, qH, M, nM, qM, g, t) {
    H[g]--; H[t]++; M[t]--; M[g]++;
    const win = isHu(H, nH, qH);
    const s = win ? -1 : shanten(H, nH, qH), m = shanten(M, nM, qM);
    H[g]++; H[t]--; M[t]++; M[g]--;
    return { win, s, m };
  }
  function tsCtx(v, asker) {
    const R = v.R, me = v.me, mate = R.mate;
    const a = asker === 'me' ? me : mate, b = asker === 'me' ? mate : me;
    const ids = s => (s === me ? R.hand : R.mateHand);
    return { H: counts(ids(a)), nH: R.melds[a].length, qH: R.que[a], M: counts(ids(b)), nM: R.melds[b].length, qM: R.que[b], a, b };
  }
  // 换完会怎样（给界面提示用）：asker 'me' = 我来换；'mate' = 队友来换
  function tsPreview(v, asker, g, t) {
    const R = v.R; if (!R || !R.mateHand) return null;
    const c = tsCtx(v, asker);
    const r = tsCheck(c.H, c.nH, c.qH, c.M, c.nM, c.qM, g, t);
    return { win: r.win, asker: r.s, other: r.m, asker0: shanten(c.H, c.nH, c.qH), other0: shanten(c.M, c.nM, c.qM) };
  }
  // 我能不能靠换一张直接胡：返回能换来胡的队友的牌（种类）
  function tsWins(v) {
    const R = v.R; if (!R || !R.mateHand) return [];
    const c = tsCtx(v, 'me'), out = new Set();
    for (let g = 0; g < 27; g++) if (c.H[g]) for (let t = 0; t < 27; t++) if (c.M[t] && t !== g && !out.has(t) && tsCheck(c.H, c.nH, c.qH, c.M, c.nM, c.qM, g, t).win) out.add(t);
    return [...out];
  }
  // 轮到我：要不要找队友换一张。能胡就换；不然只在两边都不变差、而且明显变好时换（次数少就更挑）
  function chooseTSwap(v, lv) {
    lv = lvOf(lv);
    const R = v.R, me = v.me, o = v.opt;
    if (!o || !o.ts || !R.mateHand || !(R.mate >= 0)) return null;
    const c = tsCtx(v, 'me');
    const s0 = shanten(c.H, c.nH, c.qH), m0 = shanten(c.M, c.nM, c.qM);
    const melds = R.melds[me].map(m => ({ k: m.k, t: m.t }));
    let best = null;
    for (let g = 0; g < 27; g++) {
      if (!c.H[g]) continue;
      for (let t = 0; t < 27; t++) {
        if (!c.M[t] || t === g) continue;
        const r = tsCheck(c.H, c.nH, c.qH, c.M, c.nM, c.qM, g, t);
        let val;
        if (r.win) {
          c.H[g]--; c.H[t]++;
          const f = calcFan(c.H, melds, { zimo: true }, v.rules);
          c.H[g]++; c.H[t]--;
          val = 100 + (f ? f.fan : 0) * 2 - Math.max(0, r.m - m0) * 3;
        } else {
          if (r.s > s0 || r.m > m0) continue;
          val = (s0 - r.s) + (m0 - r.m) + (r.s === 0 && s0 > 0 ? 1.5 : 0) + (r.m === 0 && m0 > 0 ? 1.5 : 0);
        }
        if (!best || val > best.val) best = { val, g, t, win: r.win };
      }
    }
    if (!best) return null;
    const left = o.tsLeft || 0;
    const need = best.win ? 0 : lv === 1 ? 1e9 : left >= 99 ? 1 : left >= 3 ? 2 : 2.5;
    if (best.val < need) return null;
    const pick = (ids, t) => { for (let i = ids.length - 1; i >= 0; i--) if (TY(ids[i]) === t) return ids[i]; return null; };
    const give = R.drawn != null && TY(R.drawn) === best.g ? R.drawn : pick(R.hand, best.g);
    const take = pick(R.mateHand, best.t);
    return give == null || take == null ? null : { give, take, win: best.win };
  }
  // 队友来要牌：能让他胡就换；不让自己变慢就换；让他听牌、自己只慢一步也换
  function chooseTAnswer(v) {
    const R = v.R, o = v.opt;
    if (!o || o.k !== 'offer' || !R.mateHand) return false;
    const c = tsCtx(v, 'mate');
    const s0 = shanten(c.H, c.nH, c.qH), m0 = shanten(c.M, c.nM, c.qM);
    const r = tsCheck(c.H, c.nH, c.qH, c.M, c.nM, c.qM, TY(o.give), TY(o.take));
    if (r.win || r.m <= m0) return true;
    return r.s < s0 && r.s <= 0 && r.m - m0 <= 1;
  }

  // 统一入口
  function decide(v, lv, rnd) {
    const o = v.opt; if (!o) return null;
    if (o.k === 'offer') return { k: chooseTAnswer(v) ? 'tsyes' : 'tsno' };
    if (o.k === 'swap') return { k: 'swap', ids: chooseSwap(v.R.hand, lv, rnd) };
    if (o.k === 'que') return { k: 'que', s: chooseQue(v.R.hand, lv, rnd) };
    if (o.k === 'claim') return { k: chooseClaim(v, lv, rnd) };
    if (o.k === 'turn') return chooseTurn(v, lv, rnd);
    return null;
  }

  // 给玩家的提示：打哪些牌能听、听什么、剩几张、几番
  function tingHints(v) {
    const R = v.R, me = v.me;
    if (!R || !R.hand) return null;
    const K = know(v);
    const que = R.que[me];
    const melds = R.melds[me].map(m => ({ k: m.k, t: m.t }));
    const allC = counts(R.hand); for (const m of melds) allC[m.t] += m.k === 'peng' ? 3 : 4;
    const c = counts(R.hand);
    const n = R.hand.length;
    const res = {};
    const one = cc => {
      const all = allC.slice();
      for (let t = 0; t < 27; t++) all[t] += cc[t] - c[t];
      const w = waits(cc, melds.length, que, all);
      return w.map(t => { cc[t]++; const f = calcFan(cc, melds, {}, v.rules); cc[t]--; return { t, left: K.unseen[t], fan: f ? f.fan : 0, title: f ? f.title : '' }; });
    };
    if (n % 3 === 2) {
      for (let t = 0; t < 27; t++) {
        if (!c[t]) continue;
        c[t]--; const w = one(c); c[t]++;
        if (w.length) res[t] = w;
      }
      return { mode: 'discard', by: res };
    }
    const w = one(c);
    return { mode: 'wait', waits: w };
  }

  const AI = { LV, shanten, shantenStd, shanten7, decide, chooseDiscard, chooseClaim, chooseTurn, chooseSwap, chooseQue, tingHints, know, evalHand, chooseTSwap, chooseTAnswer, tsPreview, tsWins };
  G.MJAI = AI;
  if (typeof module !== 'undefined' && module.exports) module.exports = AI;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

      rulesHTML: `<h4>The tiles</h4>108 tiles: Characters, Bamboo and Dots, 1 to 9, four of each. No chows; you can only pung, kong or win.
<h4>Swap three</h4>After the deal, everyone picks three tiles of one suit. They are passed clockwise, counter-clockwise or across, chosen at random.
<h4>Void suit</h4>Everyone gives up one suit. You can’t win while you still hold any of it, and you can’t pung or kong it. When you discard those tiles is up to you (a room can make them go first); anyone still holding some when the wall runs out is a flower pig.
<h4>Bloody battle</h4>Whoever wins steps out and the others play on, until one player is left or the wall runs out. Several players can win on the same discard.
<h4>A winning hand</h4>Four sets (runs or pungs) plus a pair, or seven pairs. Only two suits at most, since one suit is void.
<h4>Passing a win</h4>If you could win on someone’s tile and don’t (you pass, pung or kong instead), then until your next draw you can only win on a discard worth more fan than the one you passed. Self-draws aren’t affected.
<h4>Wind and rain</h4>Kongs pay at once. An exposed kong: the player who discarded pays 2× base. An added kong: everyone still playing pays 1×. A concealed kong: everyone still playing pays 2×. If you kong and then deal in, that kong money moves to the winner.
<h4>When the wall runs out</h4>Anyone still holding their void suit is a flower pig and pays everyone else the capped amount. Players who are not ready pay each ready player for that player's best hand. Players who are not ready return their kong money.
<h4>Scoring</h4>A win is worth base × 2<sup>fan</sup>, up to the fan cap. A discard win is paid by the player who discarded. A self-draw is paid by everyone still playing, plus one base (or one fan, depending on the room). A kong bloom off an exposed kong is paid either by the player who gave the kong, as a discard win, or by everyone, as a self-draw (a room setting).
<h4>Dealer</h4>The first dealer is random. After that, the first player to win deals the next round; if that first win was several players winning on one discard, the player who discarded deals. If nobody wins, the dealer stays.`,

<h4>血战到底</h4>有人胡了就退出这一局，其他人接着打，直到只剩一家或者牌摸完。一张牌可以同时被几家胡（一炮多响）。
<h4>胡牌</h4>四组（顺子或刻子）加一对将，或者七对。缺了一门，所以最多两门花色。
<h4>过水</h4>别人打的牌能胡却没胡（点了过，或者去碰、杠），在自己下次摸牌之前，只能胡比放过的那手番数更大的牌。自摸不受影响。
<h4>刮风下雨</h4>杠了马上收钱。直杠：放杠的人给 2 倍底分；补杠：还在打的每家给 1 倍；暗杠：还在打的每家给 2 倍。杠完打出去的牌被人胡了，这次杠的钱转给胡的人（呼叫转移）。
<h4>牌摸完了</h4>手里还有缺门的是花猪，赔给其他人封顶的番；没听牌的赔给听牌的人（查大叫，按对方能胡的最大番）；没听牌的人把杠钱退回去（退税）。
<h4>算分</h4>每次胡牌得 底分 × 2<sup>番数</sup>，最多到封顶。点炮由放炮的人给；自摸是还在打的每家都给，另外加一底（或者加一番，看房间设置）。直杠后杠上开花（点杠花）看房间设置：算点炮由放杠的人给，或者算自摸。
<h4>坐庄</h4>第一局随机坐庄。之后第一个胡牌的人下一局坐庄；第一炮是一炮多响的话，放炮的人坐庄。没人胡就连庄。`,

<script>// ===== 声音：录好的牌声（sfx.js，Kenney CC0）+ WebAudio 合成的铃声，加上可选的语音播报。录音解不开时退回合成的牌声 =====
(function (G) {
  'use strict';
  const KEY = 'mj_snd';
  const P = Object.assign({ on: true, voice: true, call: false, vib: true }, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

  // ======================= 结算面板（HTML） =======================
  function ledgerLines(v, s) {
    const R = v.R, me = v.me;

    const acc = new Map();
    const add = (k, a) => { if (!a) return; acc.set(k, (acc.get(k) || 0) + a); };
    for (const L of R.ledger || []) {
      const tot = L.from.reduce((a, f) => a + f.amt, 0);
      const mine = L.from.find(f => f.s === s);
      if (L.k === 'hu') {
        if (L.to === s) { const h = HOW(L.how); add(T(L.fan ? 'lHu' : 'lHu0', { h: h.charAt(0).toUpperCase() + h.slice(1), t: I18.fan(L.title), f: L.fan }) + (L.from.length > 1 ? T('lHuN', { n: L.from.length }) : ''), tot); }
        else if (mine) add(T(L.how === 'zimo' ? 'lPayZimo' : L.how === 'dgh' ? 'lPayDgh' : L.how === 'rob' ? 'lPayRob' : 'lPayPao', { n: N(L.to) }), -mine.amt);
      } else if (L.k === 'gang') {
        const w = T(L.kind === 'an' ? 'cRain' : 'cWind');
        if (L.to === s) add(T('lGang', { w, k: T(L.kind === 'an' ? 'kAn' : L.kind === 'bu' ? 'kBu' : 'kMing') }), tot);
        else if (mine) add(T('lGangPay', { n: N(L.to), w }), -mine.amt);
      } else if (L.k === 'zhuan') {
        if (L.to === s) add(T('lZhuan'), tot); else if (mine) add(T('lZhuanPay', { n: N(L.to) }), -mine.amt);
      } else if (L.k === 'pig') {
        if (L.to === s) add(T('lPig'), tot); else if (mine) add(T('lPigPay'), -mine.amt);
      } else if (L.k === 'cha') {
        if (L.to === s) add(T('lCha', { f: L.fan }), tot); else if (mine) add(T('lChaPay'), -mine.amt);
      } else if (L.k === 'tax') {
        if (L.to === s) add(T('lTax'), tot); else if (mine) add(T('lTaxPay'), -mine.amt);
      }
    }
    return [...acc.entries()];
  }
  function handHTML(v, s) {
    const R = v.R;
    let h = '';
    for (const m of R.melds[s]) {
      const n = m.k === 'peng' ? 3 : 4;
      for (let j = 0; j < n; j++) h += mini(m.k === 'angang' && j !== 3 ? -1 : m.t, (j === 0 ? 'gap' : '') + (m.k === 'angang' && j !== 3 ? ' back' : ''));
    }
    const hand = (R.hands ? R.hands[s] : R.shown[s] || []).slice().sort((a, b) => a - b);
    hand.forEach((id, i) => { h += mini(TY(id), i === 0 && R.melds[s].length ? 'gap' : ''); });
    const w = R.wins.find(x => x.s === s);
    if (w) h += mini(w.t, 'gap win');
