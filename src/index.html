// ---- 小游戏一：比大小 ----
function gameHL(){
  hubStop();
  const LAD = [10, 25, 50, 90, 150, 240, 380, 560, 800, 1200];
  const el = $('hubIn');
  el.innerHTML = hubTop(t('g_hl'), true) +
    `<div class="felt-box"><div class="lad" id="hlLad">${LAD.map((a, i) => `<span><i>${i + 1}</i>${fmt(a)}</span>`).join('')}</div>
      <div class="hl-stage"><div id="hlA"></div><svg class="arw" viewBox="0 0 24 24"><use href="#i-next"/></svg><div id="hlB"></div></div>
      <div class="mg-msg" id="hlMsg"></div></div>
    <div class="mg-btns" id="hlBtns"></div><p class="note">${esc(t('hl_rule', { a: fmt(LAD[LAD.length - 1]) }))}</p>`;
  const cw = Math.min(92, Math.floor((el.clientWidth - 110) / 2));
  const A = mkCard(null, cw, true), B = mkCard(null, cw, true); $('hlA').appendChild(A); $('hlB').appendChild(B);
  let deck = newDeck(), cur = 0, streak = 0, busy = false, over = false, msg = '', bad = false, tm = [];
  hubOff = () => tm.forEach(clearTimeout);
  const later = (f, ms) => tm.push(setTimeout(f, ms));
  const draw = () => { if (deck.length < 5) deck = newDeck().filter(c => c !== cur); return deck.pop(); };
  const chance = dir => { const r = P.rankOf(cur); return deck.filter(c => dir > 0 ? P.rankOf(c) > r : P.rankOf(c) < r).length / Math.max(1, deck.length); };
  function paint(){
    [...$('hlLad').children].forEach((s, i) => { s.className = i < streak ? 'done' : (i === streak && !over ? 'next' : ''); });
    const m = $('hlMsg'); m.textContent = msg; m.classList.toggle('bad', bad);
    $('hlBtns').innerHTML = over ? `<button class="btn gold wide" data-g="new">${esc(t('hl_again'))}</button>`
      : `<button class="btn up" data-g="1" ${busy ? 'disabled' : ''}><span>▲ ${esc(t('hl_hi'))}</span><small>${esc(t('hl_pct', { p: pctStr(chance(1)) }))}</small></button>
         <button class="btn dn" data-g="-1" ${busy ? 'disabled' : ''}><span>▼ ${esc(t('hl_lo'))}</span><small>${esc(t('hl_pct', { p: pctStr(chance(-1)) }))}</small></button>
         ${streak ? `<button class="btn gold wide" data-g="take" ${busy ? 'disabled' : ''}>${esc(t('hl_take', { a: fmt(LAD[streak - 1]) }))}</button>` : ''}`;
  }
  function start(){
    streak = 0; over = false; bad = false; busy = false; msg = t('hl_pick');
    cur = draw(); setFace(A, cur); snapDown(A, true); snapDown(B, true);
    later(() => { A.classList.remove('down'); Snd.flip(); }, 90);
    paint();
  }
  function bank(){
    const a = LAD[streak - 1]; earn(a); Wal.best.hl = Math.max(Wal.best.hl || 0, a); wSave();
    over = true; busy = false; bad = false; msg = t('hl_banked', { a: fmt(a) }); paint(); Snd.win(); coinBurst($('hlMsg'));
  }
  function guess(dir){
    if (busy || over) return;
    busy = true; paint();
    const nx = draw(), a = P.rankOf(cur), b = P.rankOf(nx);
    setFace(B, nx); B.classList.remove('down'); Snd.flip();
    later(() => {
      if (a !== b && (b > a) !== (dir > 0)) { over = true; busy = false; bad = true; msg = t('hl_bust'); Snd.fold(); paint(); return; }
      if (a === b) { msg = t('hl_same'); bad = false; }
      else { streak++; bad = false; msg = t('hl_prize', { n: streak, a: fmt(LAD[streak - 1]) }); Snd.chip(2); }
      paint();
      if (streak >= LAD.length) return later(bank, 500);
      // 翻开的这张滑到左边，成为新的"这一张"
      later(() => {
        const dx = A.getBoundingClientRect().left - B.getBoundingClientRect().left;
        const an = REDUCED ? null : B.animate([{ transform: 'none' }, { transform: `translateX(${dx}px)` }], { duration: 300, easing: 'cubic-bezier(.3,.8,.3,1)' });
        const done = () => { cur = nx; setFace(A, cur); snapDown(A, false); snapDown(B, true); busy = false; paint(); };
        if (an) an.onfinish = done; else done();
      }, 650);
    }, 480);
  }
  $('hlBtns').onclick = e => { const b = e.target.closest('[data-g]'); if (!b || b.disabled) return; const g = b.dataset.g; if (g === 'new') start(); else if (g === 'take') { if (!busy && streak) bank(); } else guess(+g); };
  start();
}

// ---- 小游戏二：谁的牌大 ----
function gameQZ(){
  hubStop();
  const N = 10, TL = 12000;
  const el = $('hubIn');
  el.innerHTML = hubTop(t('g_qz'), true) +
    `<div class="mg-head"><span id="qzN"></span><span class="sp"></span><b id="qzPts">+0</b></div><div class="qz-bar"><i id="qzBar"></i></div>
    <div class="felt-box"><div class="qz-board" id="qzBoard"></div></div>
    <div class="qz-hands">${['a', 'b'].map(k => `<button class="qz-hand" data-q="${k}"><span class="lbl">${esc(t('qz_' + k))}</span><span class="cs"></span><em></em></button>`).join('')}</div>
    <button class="btn glass" data-q="s" id="qzSplit">${esc(t('qz_split'))}</button><div class="mg-msg" id="qzMsg"></div><div id="qzEnd"></div>`;
  const bw = Math.min(58, Math.floor((el.clientWidth - 24 - 24 - 4 * 6) / 5)), hw = Math.min(54, Math.floor((el.clientWidth - 32 - 10 - 40) / 4));
  const boardEls = [...Array(5)].map(() => { const c = mkCard(null, bw, true); $('qzBoard').appendChild(c); return c; });
  const handEls = ['a', 'b'].map(k => [0, 1].map(() => { const c = mkCard(null, hw, true); el.querySelector(`[data-q="${k}"] .cs`).appendChild(c); return c; }));
  let i = 0, right = 0, streak = 0, total = 0, Q = null, answered = true, tm = [];
  hubOff = () => tm.forEach(clearTimeout);
  const later = (f, ms) => tm.push(setTimeout(f, ms));
  function deal(){
    let tries = 0;
    do {
      const d = newDeck(); Q = { board: d.slice(0, 5), a: d.slice(5, 7), b: d.slice(7, 9) };
      Q.sa = P.score(Q.a.concat(Q.board)); Q.sb = P.score(Q.b.concat(Q.board));
    } while (Math.abs(Math.floor(Q.sa / 1048576) - Math.floor(Q.sb / 1048576)) >= 3 && Math.random() < 0.75 && ++tries < 30); // 多出些势均力敌的题
    Q.ans = Q.sa > Q.sb ? 'a' : Q.sb > Q.sa ? 'b' : 's';
    i++; answered = false;
    $('qzN').textContent = t('qz_q', { i, n: N }); $('qzMsg').textContent = ''; $('qzMsg').classList.remove('bad');
    el.querySelectorAll('.qz-hand').forEach(h => { h.classList.remove('win', 'pick', 'bad'); h.querySelector('em').textContent = ''; });
    const all = boardEls.concat(handEls[0], handEls[1]), cards = Q.board.concat(Q.a, Q.b);
    all.forEach((e, k) => { e.classList.remove('hi', 'dim'); setFace(e, cards[k]); snapDown(e, true); later(() => e.classList.remove('down'), 60 + k * 45); });
    Snd.card(); Snd.card(0.12);
    const bar = $('qzBar'); bar.classList.remove('run'); bar.style.animationPlayState = ''; void bar.offsetWidth; bar.style.animationDuration = TL + 'ms'; bar.classList.add('run');
    later(() => { if (!answered) answer(null); }, TL + 500);
  }
  function answer(k){
    if (answered) return; answered = true;
    $('qzBar').style.animationPlayState = 'paused';
    const ok = k === Q.ans, msg = $('qzMsg');
    const best = { a: P.bestHand(Q.a.concat(Q.board)), b: P.bestHand(Q.b.concat(Q.board)) };
    ['a', 'b'].forEach((x, j) => {
      const h = el.querySelector(`[data-q="${x}"]`);
      h.querySelector('em').textContent = t('cats')[best[x].cat];
      h.classList.toggle('win', Q.ans === x || Q.ans === 's');
      h.classList.toggle('pick', k === x); h.classList.toggle('bad', k === x && !ok);
    });
    const win = Q.ans === 'b' ? best.b.cards : best.a.cards;
    boardEls.forEach((e, j) => { e.classList.toggle('hi', win.includes(Q.board[j])); e.classList.toggle('dim', !win.includes(Q.board[j])); });
    handEls.forEach((hs, j) => hs.forEach((e, q) => { const c = (j ? Q.b : Q.a)[q]; const w = (Q.ans === 's' || Q.ans === (j ? 'b' : 'a')) && (j ? best.b : best.a).cards.includes(c); e.classList.toggle('hi', w); }));
    if (ok) { const g = 20 + 10 * Math.min(5, streak); streak++; right++; total += g; msg.textContent = t('qz_right', { a: g }) + (Q.ans === 's' ? ' · ' + t('qz_tie') : ''); Snd.chip(3); }
    else { streak = 0; msg.textContent = (k ? t('qz_wrong') : t('qz_time')) + (Q.ans === 's' ? ' · ' + t('qz_tie') : ''); msg.classList.add('bad'); Snd.fold(); }
    $('qzPts').textContent = '+' + fmt(total);
    later(() => { if (i < N) deal(); else finish(); }, ok ? 1500 : 2300);
  }
  function finish(){
    earn(total); Wal.best.qz = Math.max(Wal.best.qz || 0, total); wSave();
    $('qzMsg').textContent = '';
    $('qzEnd').innerHTML = `<div class="result"><b>+${fmt(total)}</b><span>${esc(t('qz_done', { k: right, n: N }))}</span></div><div class="mg-btns"><button class="btn glass" data-hub="home">${esc(t('back'))}</button><button class="btn gold" id="qzAgain">${esc(t('qz_again'))}</button></div>`;
    $('qzAgain').onclick = gameQZ;
    if (total) { Snd.win(); coinBurst($('qzEnd').querySelector('b')); }
    $('qzEnd').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'end' });
  }
  el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => answer(b.dataset.q));
  deal();
}

// ---- 小游戏三：翻牌配对 ----

  const cw = Math.min(64, Math.floor((el.clientWidth - 32 - 24 - 3 * 9) / 4), Math.floor((innerHeight - 250) / 4 / 1.4 - 2));
  const pick = newDeck().slice(0, 8), cards = pick.concat(pick);
  for (let k = cards.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [cards[k], cards[j]] = [cards[j], cards[k]]; }
  let open = [], moves = 0, pairs = 0, lock = false, tm = [];
  hubOff = () => tm.forEach(clearTimeout);
  const paint = () => { $('mmMoves').textContent = t('mm_moves', { n: moves }); $('mmPairs').textContent = t('mm_pairs', { n: pairs }); };
  const grid = $('mmGrid');
  cards.forEach((c, k) => {
    const b = document.createElement('button'), e = mkCard(c, cw, true); b.appendChild(e); grid.appendChild(b);
    b.onclick = () => {
      if (lock || e._got || !e.classList.contains('down')) return;
      e.classList.remove('down'); Snd.flip(); open.push({ k, e });
      if (open.length < 2) return;
      moves++; const [x, y] = open; open = [];
      if (cards[x.k] === cards[y.k]) {
        x.e._got = y.e._got = true; pairs++;
        tm.push(setTimeout(() => { x.e.classList.add('got'); y.e.classList.add('got'); Snd.chip(2); }, 260));
        if (pairs === 8) tm.push(setTimeout(finish, 700));
      } else { lock = true; tm.push(setTimeout(() => { x.e.classList.add('down'); y.e.classList.add('down'); lock = false; }, 820)); }
      paint();
    };
  });
  function finish(){
    const a = Math.max(40, GAME_MAX.mm - 20 * Math.max(0, moves - 10));
    earn(a); Wal.best.mm = Math.max(Wal.best.mm || 0, a); wSave(); Snd.win();
    $('mmEnd').innerHTML = `<div class="result"><b>+${fmt(a)}</b><span>${esc(t('mm_done', { n: moves }))}</span></div><div class="mg-btns"><button class="btn glass" data-hub="home">${esc(t('back'))}</button><button class="btn gold" id="mmAgain">${esc(t('mm_again'))}</button></div>`;
    $('mmAgain').onclick = gameMM; coinBurst($('mmEnd').querySelector('b'));
    $('mmEnd').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'end' });
  }
  paint();
}

window.addEventListener('resize', () => { if (!$('game').hidden) { layout(); render(true); } });
window.addEventListener('beforeunload', e => { if (S.mode === 'host' && !S.solo && !S.closing && S.view && S.view.players.length > 1) { e.preventDefault(); e.returnValue = ''; } });
applyLang();
})();
</script>
