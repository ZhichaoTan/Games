<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06202c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Moontide: the island is sinking under the king tide. Get your islanders to the lighthouses. 2 to 4 players online, or against bots.">
<title>Moontide</title>
<script>/*@@NOZOOM@@*/</script>
<style>
/*@@FONT@@*/
:root{
  --bg0:#03111a;--bg1:#072130;--bg2:#0c3343;
  --ink:#eef6f3;--ink2:#b8cdcc;--ink3:#7d989c;--gold:#ffd76a;--gold2:#d3ac63;--coral:#ff8a73;--red:#e5492f;--teal:#5fd3c6;--mint:#9dffc6;
  --panel:rgba(5,22,32,.9);--line:rgba(255,215,106,.22);--glass:rgba(255,255,255,.06);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --brush:"MTBrush","Kaiti SC","STKaiti","KaiTi",serif;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
html[lang=en] body{font-family:"Manrope",var(--ui)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
[hidden]{display:none!important}
.screen{position:fixed;inset:0}
svg.ic{width:20px;height:20px;flex:none}
#sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ===== lobby ===== */
#lobby{overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(90% 46% at 78% 4%,rgba(255,236,180,.13),transparent 70%),radial-gradient(130% 75% at 50% 0%,#145266 0%,#0b3343 42%,#051923 78%,#030f17 100%)}
#lobby::before,#room::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--noise);opacity:.45;mix-blend-mode:overlay}
.lob{position:relative;max-width:440px;margin:0 auto;padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 28px)}
.lobtop{position:relative;z-index:2;display:flex;align-items:center;gap:8px;min-height:36px}
.lobtop .grow{flex:1;min-width:0}
.pillbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);font-size:13px;color:var(--ink2);white-space:nowrap}
.pillbtn:active{background:rgba(255,255,255,.1)}
.pillbtn.home{gap:4px;padding:0 13px 0 8px;color:var(--ink);text-decoration:none}
.pillbtn.home .ic{width:18px;height:18px;color:var(--gold)}
.pillbtn .ic{width:17px;height:17px}
.hero{position:relative;text-align:center;padding:12px 0 4px}
.scene{display:block;width:100%;max-width:360px;height:auto;margin:0 auto -6px;overflow:visible}
.scene .beam{animation:spin 12s linear infinite}
.scene .bob{animation:bob 2.6s ease-in-out infinite}
.scene .bob2{animation:bob 3.1s ease-in-out -.8s infinite}
.scene .fin{animation:fin 7s ease-in-out infinite}
@keyframes fin{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,1px)}}
.title{position:relative;display:inline-flex;align-items:center;gap:12px;margin-top:2px}
.title h1{margin:0;display:flex;flex-direction:column;align-items:center;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.title .w1{font-family:var(--brush);font-weight:400;font-size:62px;line-height:1.08;letter-spacing:4px;background:linear-gradient(180deg,#fffbe8 0%,#ffe6a3 48%,#d3ac63 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 2px 2px}
.title .w2{font:800 12px/1 "Manrope",var(--ui);letter-spacing:.6em;color:var(--gold);margin-top:6px;padding-left:.6em}
.seal{writing-mode:vertical-rl;font-family:var(--brush);font-size:21px;line-height:1;color:#fff4ea;background:linear-gradient(160deg,#e4573f,#a8301f);padding:8px 6px;border-radius:5px;box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,235,220,.35);transform:rotate(4deg);letter-spacing:3px}
html[lang=zh] .title .w2{display:none}
html[lang=en] .title .seal{display:none}
html[lang=en] .title h1{align-items:center}
html[lang=en] .title .w1{font:italic 700 54px/1 "Fraunces",Georgia,serif;letter-spacing:-.015em;padding:0 6px 6px 0}
.tagline{margin:12px auto 0;color:var(--ink2);font-size:14px;line-height:1.65;max-width:310px}
.box{position:relative;margin-top:16px;padding:16px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.me-row{display:flex;gap:14px;align-items:center}
.me-av{width:62px;height:62px;border-radius:50%;flex:none;box-shadow:0 0 0 2.5px var(--gold),0 6px 16px rgba(0,0,0,.4)}
.me-av svg{width:100%;height:100%;display:block}
.fld{flex:1;min-width:0}
.lbl{display:block;font-size:12px;color:var(--ink3);letter-spacing:1px;margin:0 0 6px 2px}
.inp{width:100%;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.28);color:var(--ink);padding:0 14px;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:rgba(255,215,106,.6)}
.avs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
.avs button{min-width:0;aspect-ratio:1;border-radius:50%;overflow:hidden;opacity:.72;transition:transform .15s,opacity .15s}
.avs button svg{width:100%;height:100%;display:block}
.avs button.on{opacity:1;box-shadow:0 0 0 2.5px var(--gold);transform:scale(1.06)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{position:relative;z-index:1;height:38px;border-radius:11px;font-size:15px;font-weight:700;color:var(--ink2);transition:color .2s}
.tabs button.on{color:#2a1e05}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:11px;background:linear-gradient(180deg,#ffe49a,#d9a94a);box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;font-size:16px;font-weight:800;width:100%;transition:transform .1s,filter .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#ffe7a6,#d9a94a);color:#2a1e05;box-shadow:0 6px 18px rgba(217,169,74,.3),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.red{background:linear-gradient(180deg,#f06a4f,#bb3a24);color:#fff;box-shadow:0 6px 18px rgba(187,58,36,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.teal{background:linear-gradient(180deg,#7de6d6,#2fa596);color:#04241f;box-shadow:0 6px 18px rgba(47,165,150,.28),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);color:var(--ink)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 16px}
.btn[disabled]{filter:grayscale(.8) brightness(.7);pointer-events:none}
.code-row{display:flex;gap:10px}
.code-row .inp{flex:1;text-align:center;font-size:22px;letter-spacing:10px;font-weight:800;text-transform:uppercase;height:50px}
.code-row .btn{width:110px}
.pane{display:flex;flex-direction:column;gap:12px}
.opts{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;font-size:14px;color:var(--ink2)}
.opts>span{white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:44px;height:32px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);font-size:13px;color:var(--ink2)}
.seg button.on{background:rgba(255,215,106,.16);border-color:rgba(255,215,106,.7);color:var(--gold)}
.more{font-size:13px;color:var(--ink3);text-align:center;padding:4px;display:flex;justify-content:center;gap:6px;align-items:center}
.err{color:#ffab9c;font-size:13px;min-height:18px;text-align:center;margin-top:8px}
.resume{display:flex;align-items:center;gap:10px}
.resume+.resume{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.resume .tx{flex:1;font-size:14px;color:var(--ink2);line-height:1.5}
.resume .tx b{color:var(--ink);font-size:15px}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--ink3);line-height:1.7}
.wx{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(229,73,47,.16);border:1px solid rgba(229,73,47,.35);font-size:13px;color:#ffd5cc;line-height:1.5}

/* ===== waiting room ===== */
#room{overflow-y:auto;background:radial-gradient(130% 75% at 50% 0%,#145266 0%,#0b3343 42%,#051923 78%,#030f17 100%)}
.room{position:relative;max-width:460px;margin:0 auto;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 24px)}
.rhead{display:flex;align-items:center;gap:10px;height:40px}
.rhead .grow{flex:1}
.codebig{margin:14px 0 4px;text-align:center}
.codebig .l{font-size:13px;color:var(--ink3);letter-spacing:2px}
.codebig .c{font-size:54px;font-weight:800;letter-spacing:12px;color:var(--gold);margin:4px 0 0 12px;font-variant-numeric:tabular-nums;font-family:"Manrope",var(--ui)}
.share{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
.seats4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rs{position:relative;padding:14px 10px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-align:center;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.rs .av{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 2.5px var(--pc,transparent)}
.rs .av svg{width:100%;height:100%;display:block}
.rs .nm{font-size:15px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs .sub{font-size:12px;color:var(--ink3)}
.rs.empty{border-style:dashed;color:var(--ink3)}
.rs .x{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.rs .x svg{width:16px;height:16px}
.rs .tag{position:absolute;left:8px;top:8px;font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(255,215,106,.18);color:var(--gold)}
.rs .tag.me{left:auto;right:8px;background:rgba(255,255,255,.12);color:var(--ink)}
.rules-sum{margin-top:14px;font-size:13px;color:var(--ink2);line-height:1.8;text-align:center}
.ractions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.lvb{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,215,106,.14);color:var(--gold);border:1px solid rgba(255,215,106,.35)}

/* ===== the game ===== */
#game{display:flex;flex-direction:column;background:radial-gradient(80% 50% at 72% 18%,rgba(255,236,180,.07),transparent 70%),radial-gradient(120% 80% at 50% 45%,#0d3a4a 0%,#082837 45%,#04141e 100%);overflow:hidden;touch-action:none}
.topbar{flex:none;height:calc(var(--sat) + 46px);padding:var(--sat) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;z-index:30}
.tb-btn{flex:none;width:36px;height:36px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative}
.tb-btn svg{width:19px;height:19px}
.tb-info{flex:1;min-width:0;display:flex;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.chip{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07)}
.chip b{color:var(--ink);font-weight:800}
.chip.warn{background:rgba(229,73,47,.3);border-color:rgba(229,73,47,.5);color:#ffd8cf}
.chip.tide{cursor:pointer}
.tbar{display:flex;gap:2px}
.tbar i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.12)}
.tbar i.on.e0{background:#f1deac}.tbar i.on.e1{background:#5fae6a}.tbar i.on.e2{background:#9aa58a}
.netdot{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:#46d18d;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.netdot.bad{background:#ff6b5b}

.plates{flex:none;display:flex;gap:6px;padding:2px calc(var(--sar) + 8px) 6px calc(var(--sal) + 8px);z-index:20}
.plate{position:relative;flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:6px;row-gap:3px;padding:5px 7px 5px 5px;border-radius:14px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.07);transition:border-color .25s,background .25s}
.plate .av{position:relative;width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px var(--pc)}
.plate .av svg{width:100%;height:100%;display:block;border-radius:50%}
.plate .nm{min-width:0;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.plate .nm small{font-weight:700;color:var(--gold);font-size:10px;margin-left:3px}
.plate .st{grid-column:1/-1;display:flex;align-items:center;gap:5px;padding-left:2px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden}
.plate .st span{display:flex;align-items:center;gap:1px}
.plate .st svg{width:13px;height:13px;flex:none}
.plate .st .sf{color:var(--mint);font-weight:800}
.plate .st .ls{color:#ff9f8a}
.plate .st .it svg{width:14px;height:14px}
.plate.on{border-color:rgba(255,215,106,.75);background:rgba(255,215,106,.1);box-shadow:0 0 0 1px rgba(255,215,106,.25),0 6px 18px rgba(0,0,0,.3)}
.plate.off{opacity:.6}
.plate .clk{position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;border-radius:2px;background:var(--gold);transform-origin:0 50%}
.plate .tags{position:absolute;right:-3px;top:-7px;display:flex;gap:2px}
.plate .tags i{font-style:normal;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:99px;background:#2c4b58;color:var(--ink2);line-height:1.4}
.plate .tags i.au{background:#4a3a12;color:var(--gold)}
.plate .tags i.me{background:linear-gradient(180deg,#ffe7a6,#d9a94a);color:#2a1e05}
.plate .bub{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);z-index:40;max-width:150px;padding:6px 10px;border-radius:12px;background:#fbf6ea;color:#1d2a33;font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:bub 3s ease forwards;pointer-events:none}
.plate .bub.emo{font-size:26px;background:none;box-shadow:none;padding:0}
.plate .bub::before{content:"";position:absolute;left:50%;top:-5px;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom-color:#fbf6ea}
.plate .bub.emo::before{display:none}
@keyframes bub{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}10%{opacity:1;transform:translate(-50%,4px) scale(1)}85%{opacity:1}100%{opacity:0}}

.stage{position:relative;flex:1;min-height:0;z-index:10}
.stage .bwrap{position:absolute;inset:0}
.feed{position:absolute;left:50%;top:4px;transform:translateX(-50%);z-index:12;max-width:calc(100% - 24px);padding:6px 14px;border-radius:99px;background:rgba(4,16,24,.82);border:1px solid rgba(255,255,255,.08);font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s}
.feed.on{opacity:1}
.feed b{color:var(--gold)}
.feed .bad{color:#ffab9c}
.feed .good{color:var(--mint)}
.zbtn{position:absolute;right:calc(var(--sar) + 10px);bottom:8px;z-index:12;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.zbtn svg{width:20px;height:20px}
.banner{position:absolute;left:50%;top:42%;z-index:14;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0}
.banner.on{animation:ban 1.5s cubic-bezier(.2,.9,.3,1) forwards}
.banner .h{font-family:var(--brush);font-size:48px;color:#fff6d8;text-shadow:0 0 18px rgba(255,215,106,.6),0 3px 10px rgba(0,0,0,.6);white-space:nowrap}
.banner .s{margin-top:2px;font-size:14px;font-weight:800;color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.6)}
html[lang=en] .banner .h{font:italic 700 40px/1.1 "Fraunces",Georgia,serif}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}30%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}

.dock{flex:none;position:relative;z-index:25;height:calc(var(--sab) + 158px);padding:10px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);background:linear-gradient(180deg,rgba(4,18,27,.0),rgba(4,18,27,.92) 14%,#04121b);display:flex;flex-direction:column;gap:8px}
.dk1{display:flex;align-items:center;gap:10px;min-height:44px}
.dk1 .dieb{position:relative;flex:none;width:44px;height:44px}
.dk1 .dieb svg{width:44px;height:44px;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.dk1 .dieb.roll svg{animation:roll .7s cubic-bezier(.2,.8,.3,1)}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4)}60%{transform:rotate(14deg) scale(1.1)}100%{transform:none}}
.dk1 .dieb.none{opacity:.35}
.dk1 .pr{flex:1;min-width:0}
.dk1 .pr .who{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:6px}
html[lang=zh] .dk1 .pr .who{letter-spacing:.12em}
.dk1 .pr .who .sw{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc)}
.dk1 .pr .tx{font-size:14px;line-height:1.35;color:var(--ink);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dk1 .pr .tx.wait{color:var(--ink2)}
.dk2{display:flex;align-items:center;gap:8px;min-height:30px}
.dk2 .grow{flex:1}
.pips{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);font-weight:700}
.pips i{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,215,106,.7);background:rgba(255,215,106,.08)}
.pips i.on{background:radial-gradient(circle at 35% 30%,#fff6cf,#ffd76a 55%,#c2902d);border-color:#ffe9a8;box-shadow:0 0 8px rgba(255,215,106,.55)}
.pips i.tw{border-color:rgba(157,255,198,.75)}
.pips i.tw.on{background:radial-gradient(circle at 35% 30%,#effff6,#9dffc6 55%,#3dbb7b);border-color:#d6ffe8;box-shadow:0 0 8px rgba(157,255,198,.55)}
.items{display:flex;gap:6px}
.item{display:flex;align-items:center;gap:4px;height:28px;padding:0 9px 0 5px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:800;color:var(--ink2)}
.item svg{width:20px;height:20px}
.tray{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray button{position:relative;flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.tray button svg{width:30px;height:30px}
.tray button.on{background:rgba(255,215,106,.16);border-color:rgba(255,215,106,.8);transform:translateY(-2px)}
.tray button .n{position:absolute;right:-4px;top:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#2c4b58;font-size:10px;font-weight:800;line-height:16px;color:var(--ink)}
.dk3{display:flex;gap:8px;margin-top:auto}
.dk3 .btn{height:46px;font-size:15px;border-radius:14px;flex:1;width:auto;min-width:0;padding:0 12px;white-space:nowrap}
.dk3 .btn.sm2{flex:0 0 auto;padding:0 16px}
.dk3 .btn svg{width:18px;height:18px}
.dk3:empty{display:none}
.autobar{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:99px;background:rgba(255,215,106,.1);border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.autobar .grow{flex:1}
.autobar button{height:32px;padding:0 14px;border-radius:99px;background:linear-gradient(180deg,#ffe7a6,#d9a94a);color:#2a1e05;font-weight:800;font-size:13px}

/* board (the SVG itself lives in board.js) */
.bwrap{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
.bzoom{position:absolute;inset:0;transform-origin:0 0;transition:transform .22s ease}
.board{width:100%;height:100%;display:block;overflow:visible}
.board .tile,.board .boat,.board .isl,.board .cr,.board .reef{transition:transform .4s cubic-bezier(.3,.7,.3,1)}
.board .hull{transition:transform .4s cubic-bezier(.3,.7,.3,1)}
.board .isl .bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.55px)}}
.board .beam,.scene .beam{transform-box:view-box}
.board .beam{animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.board .lhs .lamp{animation:lamp 3.2s ease-in-out infinite}
@keyframes lamp{50%{opacity:.6}}
.board .lhs.flash .lamp{animation:flash 1.2s ease-out}
@keyframes flash{0%{opacity:1;transform:scale(1)}30%{transform:scale(2.4)}100%{transform:scale(1)}}
.board .glints path{animation:glint 7s ease-in-out infinite;opacity:0}
@keyframes glint{0%,72%,100%{opacity:0}82%{opacity:.9}}
.board .surf{animation:surf 5s ease-in-out infinite}
@keyframes surf{50%{fill-opacity:.22}}
.board .pop{animation:fade .45s ease-out backwards}
.board .late{animation:fade .45s ease-out .8s backwards}
@keyframes fade{from{opacity:0}}
.board .cr.dim{opacity:.55}
.board .boat.sunk{transition:transform .9s ease-in,opacity .9s ease-in;opacity:0}
.board .isl.eaten{transition:opacity .5s;opacity:0}
.hl-sink{fill:rgba(255,215,106,.10);stroke:#ffd76a;stroke-width:.85;animation:pulse 1.3s ease-in-out infinite}
.hl-sink.on{fill:rgba(255,215,106,.34);stroke-width:1.5;animation:none}
@keyframes pulse{50%{stroke-opacity:.35}}
.hl-tgt path{fill:rgba(255,240,190,.10);stroke:#fff0b8;stroke-width:.6;stroke-dasharray:1.8 1.2}
.hl-tgt circle{fill:#fff0b8;fill-opacity:.95}
.hl-tgt.safe path{fill:rgba(140,255,190,.14);stroke:#9dffc6}
.hl-tgt.safe circle{fill:#9dffc6}
.hl-tgt.risk path{stroke:#ff9f8a}
.hl-tgt.risk circle{fill:#ff9f8a}
.hl-tgt.hit path{fill:rgba(255,120,100,.18);stroke:#ff8a73;stroke-dasharray:none}
.hl-tgt.hit circle{fill:#ff8a73}
.hl-place path{fill:rgba(255,240,190,.12);stroke:#fff0b8;stroke-width:.55;stroke-dasharray:1.6 1.2}
.hl-glow{fill:#fff6cf;fill-opacity:.22;stroke:#fff6cf;stroke-opacity:.5;stroke-width:.4}
.hl-glow.cr{fill-opacity:.14}
.selring circle{fill:none;stroke:#fff;stroke-width:.75;stroke-dasharray:2 1.4;animation:rot 3s linear infinite}
@keyframes rot{to{stroke-dashoffset:-20}}
.fx.splash .ring{fill:none;stroke:#e9fbff;stroke-width:.6;animation:ring .8s ease-out forwards}
.fx.splash .ring.r2{animation-delay:.12s}
.fx.splash.big .ring{stroke-width:.8}
@keyframes ring{from{r:1;opacity:1}to{r:8;opacity:0}}
.fx.splash .drop{fill:#e9fbff;animation:drop .7s ease-out forwards}
@keyframes drop{from{transform:rotate(var(--a)) translateX(1px)}to{transform:rotate(var(--a)) translateX(6px);opacity:0}}
.fx.sparkle .ray{fill:#fff3b0;animation:ray 1s ease-out forwards}
@keyframes ray{from{transform:rotate(var(--a)) translateY(-1px) scale(.4)}to{transform:rotate(var(--a)) translateY(-7px) scale(1);opacity:0}}
.fx.float{animation:float 1.9s ease-out forwards}
@keyframes float{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}
.fx .lab rect{fill:rgba(10,20,30,.86);stroke:#d3ac63;stroke-width:.4}
.fx .lab text{fill:#fff3d6;font:800 4.2px/1 Manrope,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.fx .lab.shark rect,.fx .lab.oct rect{stroke:#ff8a73}
.fx .lab.boat rect,.fx .lab.dolphin rect,.fx .lab.buoy rect,.fx .lab.tail rect{stroke:#9dffc6}
.fx.chomp .jaws{animation:chomp .7s ease-in-out forwards}
@keyframes chomp{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}60%{transform:scale(.9)}100%{transform:scale(1);opacity:0}}
.fx.grab .tent{animation:tent 1.2s ease-in-out forwards}
@keyframes tent{0%{transform:translateY(6px) scale(.6);opacity:0}30%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(4px)}}
.fx.puff circle{fill:#e8dcc0;fill-opacity:.7;animation:puff .8s ease-out forwards}
@keyframes puff{to{transform:rotate(var(--a)) translateX(5px) scale(1.6);opacity:0}}
.fx.pop-fx{animation:popfx 1.3s ease-out forwards}
@keyframes popfx{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* ===== sheets, overlay, toast ===== */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;background:linear-gradient(180deg,#0f3444,#071d29);border-top:1px solid var(--line);padding:18px 16px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 12px;font-family:var(--brush);font-weight:400;font-size:27px;color:var(--gold);display:flex;align-items:center;gap:10px}
html[lang=en] .sheet h3{font:italic 700 24px/1.2 "Fraunces",Georgia,serif}
.sheet h3 .grow{flex:1}
.sheet .x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.sheet .x svg{width:18px;height:18px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.mrow .grow{flex:1;min-width:0}
.mrow .av{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--pc,transparent)}
.mrow .av svg{width:100%;height:100%;display:block}
.mrow .btn.sm{height:32px;padding:0 12px;font-size:13px}
.mrow small{color:var(--ink3)}
.mhd{margin:14px 2px 2px;font-size:12px;color:var(--ink3);letter-spacing:1px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mgrid.one{grid-template-columns:1fr}
.tog{flex:none;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:background .2s}
.tog i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#e9e4d6;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tog.on{background:linear-gradient(180deg,#ffe49a,#d9a94a)}.tog.on i{transform:translateX(18px);background:#fff}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phr button{padding:10px 8px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13.5px;text-align:left;line-height:1.35}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.emos button{font-size:28px;height:46px;border-radius:12px;background:rgba(255,255,255,.06)}
.chatrow{margin-top:12px}
.chatrow .inp{text-align:left;letter-spacing:0;font-size:16px;font-weight:500;text-transform:none}
.rules-txt{font-size:14px;color:var(--ink2);line-height:1.7}
.rules-txt h4{margin:16px 0 6px;color:var(--ink);font-size:15px}
.rules-txt p{margin:0 0 6px}
.rules-txt ol{margin:0;padding-left:20px}
.rules-txt .rl{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rules-txt .rl svg{flex:none;width:34px;height:28px}
.rules-txt .rl b{color:var(--ink)}
.rules-txt .tiers{display:flex;gap:8px;margin:6px 0}
.rules-txt .tiers div{flex:1;text-align:center;font-size:12px;color:var(--ink3)}
.rules-txt .tiers svg{width:100%;height:auto;max-width:64px;display:block;margin:0 auto 2px}
.rules-txt .dice{display:flex;gap:6px;margin:6px 0 2px}
.rules-txt .dice svg{width:34px;height:34px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 56px);transform:translateX(-50%);z-index:90;padding:9px 16px;border-radius:99px;background:rgba(4,16,24,.94);border:1px solid var(--line);font-size:14px;color:var(--ink);box-shadow:0 8px 20px rgba(0,0,0,.4);animation:tIn .25s ease;max-width:calc(100vw - 32px);text-align:center}
@keyframes tIn{0%{opacity:0;transform:translate(-50%,-8px)}100%{opacity:1;transform:translate(-50%,0)}}
#overlay{position:fixed;inset:0;z-index:80;background:rgba(2,10,15,.72);display:flex;align-items:center;justify-content:center;padding:24px}
#overlay .card{max-width:320px;text-align:center;padding:22px 20px;border-radius:20px;background:#0b2a38;border:1px solid var(--line);font-size:14px;color:var(--ink2);line-height:1.6}
#overlay .card b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
.ovb{display:flex;gap:10px;justify-content:center;margin-top:14px}
.ovb .btn{flex:1;max-width:140px}
.spin{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:3px solid rgba(255,215,106,.25);border-top-color:var(--gold);animation:sp .9s linear infinite}
.spin.sm{width:16px;height:16px;border-width:2px;margin:0 6px 0 0;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* results */
.res-head{text-align:center;margin:2px 0 10px}
.res-head .t1{font-family:var(--brush);font-size:36px;color:var(--gold);line-height:1.15}
html[lang=en] .res-head .t1{font:italic 700 30px/1.2 "Fraunces",Georgia,serif}
.res-head .t2{font-size:15px;font-weight:800;color:var(--ink);margin-top:4px}
.res-head .t3{font-size:12.5px;color:var(--ink3);margin-top:2px}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.rrow.win{background:linear-gradient(90deg,rgba(255,215,106,.12),transparent);border-radius:12px}
.rrow .rk{width:18px;font-weight:800;color:var(--ink3);text-align:center;font-variant-numeric:tabular-nums}
.rrow.win .rk{color:var(--gold)}
.rrow .av{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--pc)}
.rrow .av svg{width:100%;height:100%;display:block}
.rrow .bd{flex:1;min-width:0}
.rrow .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .tk{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.rrow .tk span{position:relative;width:22px;height:22px}
.rrow .tk span svg{width:22px;height:22px;display:block}
.rrow .tk span.lost{opacity:.32;filter:grayscale(1)}
.rrow .tk span.eaten::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:2px;margin-top:-1px;background:#ff6b5b;transform:rotate(-35deg);border-radius:2px}
.rrow .tk span.safe::before{content:"";position:absolute;inset:-1px;border-radius:50%;box-shadow:0 0 0 1.4px var(--mint)}
.rrow .pts{text-align:right;flex:none}
.rrow .pts b{display:block;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.rrow .pts small{font-size:11px;color:var(--ink3)}
.resfoot{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.tally{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:10px}
.peekbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 172px);z-index:58;width:auto!important;padding:0 20px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* wide screens: the board on the left, players and the dock in a column on the right */
@media (min-width:860px) and (min-aspect-ratio:5/4){
  #game{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto 1fr;grid-template-areas:"top top" "stage plates" "stage dock"}
  .topbar{grid-area:top}
  .stage{grid-area:stage}
  .plates{grid-area:plates;flex-direction:column;padding:8px 16px 8px 8px}
  .plate{flex:none;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;padding:8px 10px 8px 8px;column-gap:10px}
  .plate .av{grid-row:1/3;width:40px;height:40px}
  .plate .nm{font-size:14px}
  .plate .st{grid-column:2;font-size:12.5px;padding-left:0}
  .dock{grid-area:dock;height:auto;align-self:start;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:20px;margin:0 16px 16px 8px;padding:14px}
  .dk3{margin-top:8px}
  .peekbtn{bottom:24px}
}
@media (min-width:980px) and (min-height:560px){
  .lob{max-width:1080px;display:grid;grid-template-columns:minmax(0,1fr) 440px;column-gap:72px;align-items:start;padding-top:28px}
  .lob>.lobtop{grid-column:1/-1}
  .lob>.hero{grid-column:1;grid-row:2/span 6;position:sticky;top:10vh;padding:5vh 0 0}
  .lob>:not(.lobtop):not(.hero){grid-column:2}
  .lob>.box:first-of-type,.lob>#wxTip+.box{margin-top:28px}
  .hero .scene{max-width:520px}
  .hero .title .w1{font-size:88px}
  html[lang=en] .hero .title .w1{font-size:76px}
  .hero .seal{font-size:28px;padding:10px 7px}
  .hero .tagline{font-size:17px;max-width:440px;margin-top:18px}
}
@media (max-height:640px){
  .dock{height:calc(var(--sab) + 144px);gap:6px;padding-top:6px}
  .dk3 .btn{height:42px}
  .plate{padding:3px 6px 3px 4px;row-gap:1px}
  .plate .av{width:22px;height:22px}
}
@media (prefers-reduced-motion:reduce){
  .board .beam,.scene .beam,.board .isl .bob,.scene .bob,.scene .bob2,.scene .fin,.board .glints path,.board .surf,.hl-sink,.selring circle{animation:none}
}
</style>
</head>
<body>
<div id="sprite"></div>

<!-- ============ lobby ============ -->
<section id="lobby" class="screen">
  <div class="lob">
    <div class="lobtop">
      <a class="pillbtn home" href="../"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg><span data-t="allGames"></span></a>
      <div class="grow"></div>
      <button class="pillbtn" id="btnRules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rule"/></svg><span data-t="rules"></span></button>
      <button class="pillbtn" id="btnLang"><svg class="ic" viewBox="0 0 24 24"><use href="#i-globe"/></svg><span></span></button>
    </div>
    <div class="hero">
      <div id="scene"></div>
      <div class="title"><h1><span class="w1" data-t="titleA"></span><span class="w2" data-t="titleB"></span></h1><span class="seal" data-t="titleB"></span></div>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <div id="wxTip" class="wx" hidden data-t="wx"></div>
    <div class="box" id="resumeBox" hidden></div>
    <div class="box">
      <div class="me-row">
        <div class="me-av" id="meAv"></div>
        <div class="fld"><label class="lbl" for="nick" data-t="yourName"></label><input id="nick" class="inp" maxlength="10" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="avs" id="avs"></div>
    </div>
    <div class="box">
      <div class="tabs" id="tabs"><span class="pill"></span><button data-tab="join" data-t="tabJoin"></button><button data-tab="host" data-t="tabHost"></button><button data-tab="solo" data-t="tabSolo"></button></div>
      <div id="paneJoin" class="pane">
        <div class="code-row"><input id="joinCode" class="inp" maxlength="4" placeholder="····" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn gold" id="btnJoin" data-t="join"></button></div>
        <div class="more" data-t="joinHint"></div>
      </div>
      <div id="paneHost" class="pane" hidden>
        <div class="opts" id="optsHost"></div>
        <button class="btn gold" id="btnCreate" data-t="create"></button>
      </div>
      <div id="paneSolo" class="pane" hidden>
        <div class="opts" id="optsSolo"></div>
        <button class="btn gold" id="btnSolo" data-t="startSolo"></button>
      </div>
      <div class="err" id="lobErr"></div>
    </div>
    <div class="foot" data-t="foot"></div>
  </div>
</section>

<!-- ============ waiting room ============ -->
<section id="room" class="screen" hidden>
  <div class="room">
    <div class="rhead">
      <button class="tb-btn" id="roomBack" aria-label="back"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <div class="grow"></div>
      <button class="pillbtn" id="roomRules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rule"/></svg><span data-t="rules"></span></button>
    </div>
    <div class="codebig"><div class="l" data-t="roomCode"></div><div class="c" id="roomCode">····</div></div>
    <div class="share"><button class="btn glass sm" id="btnCopy"><svg class="ic" viewBox="0 0 24 24"><use href="#i-copy"/></svg><span data-t="copyInvite"></span></button><button class="btn glass sm" id="btnShare"><svg class="ic" viewBox="0 0 24 24"><use href="#i-share"/></svg><span data-t="share"></span></button></div>
    <div class="seats4" id="seats4"></div>
    <div class="rules-sum" id="rulesSum"></div>
    <div class="ractions" id="roomActs"></div>
  </div>
</section>

<!-- ============ the game ============ -->
<section id="game" class="screen" hidden>
  <div class="topbar">
    <button class="tb-btn" id="btnMenu" aria-label="menu"><svg viewBox="0 0 24 24"><use href="#i-menu"/></svg><span class="netdot" id="netDot" hidden></span></button>
    <div class="tb-info" id="tbInfo"></div>
    <button class="tb-btn" id="btnChat" aria-label="chat"><svg viewBox="0 0 24 24"><use href="#i-chat"/></svg></button>
    <button class="tb-btn" id="btnSound" aria-label="sound"></button>
  </div>
  <div class="plates" id="plates"></div>
  <div class="stage" id="stage">
    <div class="feed" id="feed"></div>
    <div class="banner" id="banner"><div class="h"></div><div class="s"></div></div>
    <button class="zbtn" id="btnZoom" aria-label="zoom"><svg viewBox="0 0 24 24"><use href="#i-zin"/></svg></button>
  </div>
  <div class="dock" id="dock">
    <div class="dk1"><div class="dieb none" id="dieB"></div><div class="pr"><div class="who" id="dkWho"></div><div class="tx" id="dkTx"></div></div></div>
    <div class="dk2" id="dk2"></div>
    <div class="dk3" id="dk3"></div>
  </div>
</section>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet"></div>
<div id="toast" hidden></div>
<div id="overlay" hidden><div class="card" id="ovCard"></div></div>
