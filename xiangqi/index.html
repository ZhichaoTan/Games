  const note = (i, k, v) => { if (i == 0) netNote(k, v); else send({ t: 'note', k, v }); };
  const noteAll = (k, v) => { note(0, k, v); note(1, k, v); };

  // clocks: each side's time runs only on its own turn, and only while both players are connected
  function clkNow() { const l = room.clk.left.slice(); if (clkT0) l[turn()] = Math.max(0, l[turn()] - (Date.now() - clkT0)); return l; }
  function clkStop() { clearTimeout(flagT); if (room.clk) { if (clkT0) room.clk.left = clkNow(); room.clk.run = -1; } clkT0 = 0; }
  function clkGo() {
    clkStop();
    if (!room.clk || !room.started || room.over || !guestOn()) return;
    clkT0 = Date.now(); room.clk.run = turn();
    flagT = setTimeout(() => { if (room.over || !clkT0) return; if (clkNow()[turn()] <= 0) { finish({ winner: 1 - turn(), reason: 'time' }); sync(); } else clkGo(); }, room.clk.left[turn()] + 60);
  }
  function view() { const r = JSON.parse(JSON.stringify(room)); if (r.clk) r.clk.left = clkNow(); return r; }

    if (syncQ) return; syncQ = true;
    Promise.resolve().then(() => {
      syncQ = false;
      if (closing) return;
      const v = view();

    lastAsk[0] = {}; lastAsk[1] = {};
    // the first game follows the room setting; after that the two swap sides every game
    if (room.gameNo == 1) room.red = room.opt.side == 'red' ? 0 : room.opt.side == 'black' ? 1 : (Math.random() < .5 ? 0 : 1); else room.red = 1 - room.red;

    clkGo(); sync();

  function doMove(i, uci, n) {

  function chat(i, m) { const msg = cleanChat(m); if (!msg) return; if (screen() == 'game') bubble(i == 0, msg.emo || msg.text, !!msg.emo); send({ t: 'chat', by: i, text: msg.text, emo: msg.emo }); }

  function reopen() {
    clkStop(); room.started = false; room.over = null; room.moves = ''; room.ask = null; room.score = [0, 0, 0]; room.gameNo = 0; room.clk = null; room.ready = [false, false];
    if (room.p[1] && room.p[1].gone) { room.p[1] = null; tokens[1] = ''; }
  }

  S.move = (uci, n) => { if (doMove(0, uci, n) != 'ok') sync(); };
  S.ask = k => ask(0, k);
  S.answer = ok => answer(0, ok);
  S.cancelAsk = () => { if (room.ask && room.ask.by == 0) { room.ask = null; sync(); } };
  S.resign = () => resign(0);
  S.ready = () => ready(0);
  S.chat = m => chat(0, m);
  S.start = () => begin();
  S.reopen = () => { reopen(); sync(); };
  S.setOpt = (k, v) => { if (room.started) return; room.opt[k] = v; st[k == 'side' ? 'hostSide' : 'hostClock'] = v; save(); sync(); };
  S.kick = () => {
    if (room.started) return;
    const c = conn; conn = null;
    if (c) { c._ok = false; try { c.send({ t: 'kicked' }); } catch (e) {} setTimeout(() => { try { c.close(); } catch (e) {} }, 300); }

  };

  function onData(c, m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'hello') {
      const name = String(m.name || '').trim().slice(0, 10) || 'Guest', tk = String(m.token || '').slice(0, 40), av = clamp(m.av | 0, 0, AV.AVATARS.length - 1);
      const cur = room.p[1] && !room.p[1].gone ? room.p[1] : null;
      // the seat is taken by someone else who is connected right now
      if (cur && tokens[1] !== tk && cur.on && conn && conn.open && conn !== c) { try { c.send({ t: 'err', code: 'full' }); } catch (e) {} setTimeout(() => { try { c.close(); } catch (e) {} }, 600); return; }
      const back = !!cur && tokens[1] === tk;
      // an empty seat, or one whose player went offline (they may have reopened the link in another browser)

      room.p[1] = { name, av, on: true }; tokens[1] = tk;
      const old = conn; conn = c; c._ok = true; seen = Date.now();

    }
    if (c !== conn || !c._ok) return;
    seen = Date.now();
    if (m.t === 'ping') send({ t: 'pong' });
    else if (m.t === 'move') { const r = doMove(1, m.mv, m.n == null ? null : m.n | 0); if (r != 'ok') sync(); }
    else if (m.t === 'ask') ask(1, String(m.k));
    else if (m.t === 'answer') answer(1, !!m.ok);
    else if (m.t === 'cancelAsk') { if (room.ask && room.ask.by == 1) { room.ask = null; sync(); } }
    else if (m.t === 'resign') resign(1);
    else if (m.t === 'ready') ready(1);
    else if (m.t === 'chat') chat(1, m);

      const p = room.p[1]; c._ok = false; conn = null;
      try { c.send({ t: 'bye' }); } catch (e) {}

      if (room.started) { p.on = false; p.gone = true; } else room.p[1] = null;

  function openPeer(first) {

        if (++tries < 15) { setNet(false); try { peer.destroy(); } catch (e) {} setTimeout(() => openPeer(first), 3000); }
        else toast(T('idTaken'));

  }, 3000);
  overlay(`<div class="spin"></div><b>${T('opening')}</b>`, [[T('cancel'), 'glass', () => { closing = true; store.set('xq_host', restore ? restore : null); try { peer && peer.destroy(); } catch (e) {} reloadLobby(); }]], 'net');
  openPeer(true);
}

// ---------- guest ----------
function startClient(code) {
  S = { mode: 'client', isHost: false, code, me: 1, room: null, clkAt: 0 };
  store.set('xq_client', { code, at: Date.now() });
  let peer = null, conn = null, lastMsg = 0, ever = false, dead = false, retryT = 0, fails = 0;
  const quit = () => { dead = true; try { peer && peer.destroy(); } catch (e) {} reloadLobby(); };
  overlay(`<div class="spin"></div><b>${T('connecting', { c: esc(code) })}</b>`, [[T('cancel'), 'glass', quit]], 'net');
  const send = m => { if (conn && conn.open) { try { conn.send(m); return true; } catch (e) {} } toast(T('netBad')); return false; };
  S.move = (uci, n) => send({ t: 'move', mv: uci, n });
  S.ask = k => send({ t: 'ask', k });
  S.answer = ok => send({ t: 'answer', ok });
  S.cancelAsk = () => send({ t: 'cancelAsk' });
  S.resign = () => send({ t: 'resign' });
  S.ready = () => send({ t: 'ready' });
  S.chat = m => send(Object.assign({ t: 'chat' }, m));
  S.leave = () => new Promise(res => {
    dead = true;
    store.set('xq_client', null);
    if (!conn || !conn.open) { try { peer && peer.destroy(); } catch (e) {} return res(); }
    const done = () => { clearTimeout(tm); S.onBye = null; setTimeout(() => { try { peer && peer.destroy(); } catch (e) {} }, 100); res(); };
    const tm = setTimeout(done, 1200);
    S.onBye = done;
    try { conn.send({ t: 'leave' }); } catch (e) { done(); }
  });
  const lobbyBtn = [[T('backLobby'), 'glass', quit]];
  function connect() {
    if (dead) return;
    try { conn && conn.close(); } catch (e) {}
    if (!peer || peer.destroyed || peer.disconnected) {
      try { peer && peer.destroy(); } catch (e) {}
      peer = new Peer(peerOpts());
      peer.on('open', () => dial());
      peer.on('error', err => {
        if (dead) return;
        if (err.type === 'peer-unavailable') {
          if (ever) { setNet(false); overlayNet(T('hostGone')); retry(3000); }
          else { overlay(`<b>${esc(T('notFound', { c: code }))}</b>`, lobbyBtn, 'net'); retry(5000); }
        } else if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(err.type)) { setNet(false); retry(2500); }
      });
    } else dial();
  }
  function dial() {
    if (dead) return;
    conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    const c = conn;
    const to = setTimeout(() => { if (c === conn && !c.open) { if (ever) overlayNet(T('slow')); if (++fails % 2 === 0) { try { peer && peer.destroy(); } catch (e) {} } retry(300); } }, 8000);
    c.on('open', () => { clearTimeout(to); fails = 0; lastMsg = Date.now(); c.send({ t: 'hello', name: myName, av: myAv, token }); });
    c.on('data', m => {
      lastMsg = Date.now();
      if (!m || (dead && m.t !== 'bye')) return;
      if (m.t === 'welcome') { ever = true; S.me = m.me; setNet(true); if (ovTag == 'net') overlay(null); }
      else if (m.t === 'state') { setNet(true); if (ovTag == 'net' && ever) overlay(null); onRoom(m.room, m.me); }
      else if (m.t === 'chat') { const msg = cleanChat(m); if (msg && screen() == 'game') bubble(m.by === S.me, msg.emo || msg.text, !!msg.emo); }
      else if (m.t === 'note') netNote(String(m.k), m.v);
      else if (m.t === 'err') { if (m.code === 'full') { dead = true; store.set('xq_client', null); overlay(`<b>${T('full')}</b>`, lobbyBtn, 'net'); } }
      else if (m.t === 'bye') { if (S.onBye) S.onBye(); }
      else if (m.t === 'kicked') { dead = true; store.set('xq_client', null); overlay(`<b>${T('kicked')}</b>`, lobbyBtn, 'net'); }
      else if (m.t === 'ended') {
        dead = true; store.set('xq_client', null);
        // the host closed the room in the middle of a game: that counts as the host leaving
        if (S.room && S.room.started && !S.room.over && G.mode == 'net') { const r = Object.assign({}, S.room, { over: { winner: G.side, reason: 'left' } }); r.p = r.p.slice(); r.p[0] = Object.assign({}, r.p[0], { on: false, gone: true }); r.score = r.score.slice(); r.score[1]++; S.dead = true; onRoom(r, S.me); }
        else if (S.room && S.room.started && S.room.over) { const r = Object.assign({}, S.room); r.p = r.p.slice(); r.p[0] = Object.assign({}, r.p[0], { on: false, gone: true }); S.dead = true; onRoom(r, S.me); toast(T('ended'), 3000); }
        else overlay(`<b>${T('ended')}</b>`, lobbyBtn, 'net');
      }
    });
    c.on('close', () => { if (c === conn && !dead) { setNet(false); retry(1500); } });
    c.on('error', () => {});
  }
  function overlayNet(txt) { if (S.room && S.room.started) toast(esc(txt), 3000); else overlay(`<div class="spin"></div><b>${esc(txt)}</b>`, lobbyBtn, 'net'); }
  function retry(ms) { clearTimeout(retryT); retryT = setTimeout(connect, ms); }
  const iv = setInterval(() => {
    if (dead) { clearInterval(iv); return; }
    if (conn && conn.open) { try { conn.send({ t: 'ping' }); } catch (e) {} }
    if (ever && Date.now() - lastMsg > 12000) { setNet(false); lastMsg = Date.now(); try { peer && peer.destroy(); } catch (e) {} connect(); }
  }, 4000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !dead && ever && (!conn || !conn.open || Date.now() - lastMsg > 6000)) { try { peer && peer.destroy(); } catch (e) {} connect(); }
  });
  connect();
}

// ---------- the room as each player sees it ----------
function onRoom(room, me) {
  if (!S) return;
  S.room = room; S.me = me; S.clkAt = Date.now(); S.code = room.code;
  const scr = screen(), away = scr == 'review' || scr == 'explore';
  if (!room.started) {
    if (!away) renderRoom(room, me);
    handleAsk(room, me);
    return;
  }
  const mvs = strMv(room.moves);
  if (G.mode != 'net' || G.id != room.gid) { if (away) return; netBegin(room, me, mvs); }
  else netSync(room, me, mvs);
  if (room.over && !G.over) netOver(room, me);
  handleAsk(room, me);
  if (sheetOn == 'result' && G.rec) resultFoot(G.rec);
}
// coming back from the review of an online game
function resumeSession() {
  const r = S.room;
  if (r && r.started && G.mode == 'net' && G.id == r.gid) { show('game'); requestAnimationFrame(() => { sizeGame(); renderGame(false); if (G.over && G.rec) showResult(G.rec); }); }
  else if (r) onRoom(r, S.me);
}
function netBegin(room, me, mvs) {
  Eng.cancel(); exClose(); closeSheet();
  Object.assign(G, { mode: 'net', moves: mvs.slice(), level: 0, side: me == room.red ? 0 : 1, over: false, rec: null, thinking: false, sel: -1, hint: 0, token: G.token + 1,
    base: 0, hints: 0, undos: 0, id: room.gid, t: Date.now(), engine: null });
  G.pos.fromMoves(G.moves);
  setPlates(); show('game');
  gb.clear(); gb.setFlip(G.side == 1); $('gBoard').classList.remove('facing');
  requestAnimationFrame(() => { sizeGame(); renderGame(false); });
  setTicker(-1);
  if (!room.over) { AU.start(); toast(T(G.side == 0 ? 'youRed' : 'youBlack'), 2800); }
}
function netSync(room, me, mvs) {
  const old = G.moves, n = old.length;
  const same = mvs.length >= n && old.every((m, i) => m == mvs[i]);
  if (same && mvs.length == n + 1) {
    // a move from the other side. While I am trying moves out, the real game only updates underneath
    if (G.ex) { const t = notation(G.pos, mvs[n]); G.moves.push(mvs[n]); G.pos.fromMoves(G.moves); toast(T('oppMoved', { m: `<b>${t}</b>` }), 2800); AU.place(); }
    else playMove(mvs[n], false);
  } else if (!same || mvs.length != n) {
    G.moves = mvs.slice(); G.pos.fromMoves(G.moves); G.sel = -1; G.hint = 0;
    if (!G.ex) { renderGame(true); setTicker(-1); if (mvs.length < n) AU.place(); }
  }

  if (!G.ex) renderGame(false);
}
function netOver(room, me) {
  const o = room.over;
  G.over = true; G.thinking = false; G.sel = -1;
  if (G.ex) { exClose(); gb.setFlip(G.side == 1); requestAnimationFrame(() => { sizeGame(); renderGame(true); }); }
  let rec = DB.history.find(h => h.id == room.gid && h.mode == 'net');
  const isNew = !rec;
  if (isNew) {
    const opp = room.p[1 - me] || {}, result = o.winner == -1 ? 'draw' : o.winner == G.side ? 'win' : 'loss';
    rec = { id: room.gid, t: Date.now(), mode: 'net', level: 0, side: G.side, moves: G.moves.slice(), base: 0, result, winner: o.winner, reason: o.reason, opp: { name: opp.name, av: opp.av }, hints: 0, undos: 0 };
    addHistory(rec);
    const st = DB.stats.net || { w: 0, d: 0, l: 0 }; st[result == 'win' ? 'w' : result == 'loss' ? 'l' : 'd']++; DB.stats.net = st;
    save(); endSounds(rec);
  }
  G.rec = rec; renderGame(false);
  setTimeout(() => { if (G.rec === rec && screen() == 'game' && sheetOn != 'result') showResult(rec); }, isNew ? 900 : 150);
}
// a request to take a move back or to agree a draw

// ===== review: every position analysed, a win-rate curve, graded moves, best lines to step through =====
const rb = Board($('rBoard'));
const R = { rec: null, moves: [], ply: 0, ana: [], token: 0, tab: 'chart', preview: null, playT: 0, deep: false, eng: 'muyi', verifying: false };
function sizeReview() { sizeSplit('review', rb); }
const anaMs = () => R.deep ? 1100 : (Eng.adv() == 'pf' ? 400 : 300);
function paintReviewHead() {
  const rec = R.rec; if (!rec) return;
  $('rvTitle').innerHTML = recTitle(rec) + (rec.mode == 'pvp' ? '' : ' · ' + resTxt(rec.result)) + '<span class="eng-chip"></span>';
  $('rvRetry').hidden = !!S;
  updateEngChips();
}
function openReview(rec) {
  Eng.cancel(); G.token++; LX.gen++; LX.cache = {};
  R.rec = rec; R.moves = rec.moves; R.ply = rec.moves.length; R.preview = null;
  const eng = Eng.adv();
  // stored analysis is reused only if it was made by the engine in use now
  R.ana = rec.analysis && (rec.anaEngine || 'muyi') == eng ? rec.analysis.slice() : [];
  R.deep = R.ana.length ? !!rec.deep : false;
  stopPlay(); closeSheet();
  paintReviewHead();
  show('review'); $('review').scrollTop = 0;
  rb.clear();
  rb.setFlip(rec.mode != 'pvp' && rec.side == 1);
  requestAnimationFrame(() => { sizeReview(); renderReview(false); });
  renderPfCta();
  runAnalysis(anaMs());
}
function runAnalysis(ms) {
  const tok = ++R.token, n = R.moves.length, eng = Eng.adv(); R.verifying = false; R.eng = eng;
  updateProgress();
  (async () => {
    for (let i = 0; i <= n; i++) {
      if (R.ana[i]) continue;
      const r = await Eng.analyze(R.moves.slice(0, i), ms);
      if (tok != R.token) return;
      if (!r) { i--; await sleep(300); if (tok != R.token) return; continue; }
      R.ana[i] = { vl: r.vl, w: r.w, mv: r.mv || 0, pv: (r.pv || []).slice(0, LINE_PLIES), d: r.depth || 0 };
      updateProgress();
      if (!R.preview && (i == R.ply || i == R.ply - 1)) renderReview(false); else if (i % 4 == 0) refreshPanels();
    }
    // second pass: a short search can misjudge a move, so every suspected mistake (and every missed mate)
    // is checked again with a longer search before it is shown as one
    R.verifying = true; updateProgress();
    const vms = Math.max(ms * 3, eng == 'pf' ? 1500 : 1800), M0 = metrics(), redo = new Set();
    M0.forEach((m, j) => { if (m && !m.best && (m.cls == 'err' || m.cls == 'blun' || m.drop >= 6)) { redo.add(j); redo.add(j + 1); } });
    for (const i of [...redo].sort((x, y) => x - y)) {
      if (R.ana[i] && R.ana[i].v) continue;
      const r = await Eng.analyze(R.moves.slice(0, i), vms);
      if (tok != R.token) return;
      if (!r) continue;
      R.ana[i] = { vl: r.vl, w: r.w, mv: r.mv || 0, pv: (r.pv || []).slice(0, LINE_PLIES), d: r.depth || 0, v: 1 };
      refreshPanels();
    }
    R.verifying = false;
    R.rec.analysis = R.ana.slice(); R.rec.anaEngine = eng; R.rec.deep = R.deep; save();
    updateProgress(); if (!R.preview) renderReview(false); else refreshPanels();
  })();
}
function updateProgress() {
  const n = R.moves.length + 1, done = R.ana.filter(Boolean).length, e = engName(R.eng);
  $('progBar').style.width = (done / n * 100) + '%';
  $('progTxt').textContent = done < n ? T('anaProg', { e, a: done, b: n }) : R.verifying ? T('anaVerify', { e }) : T('anaDone', { e, m: T(R.deep ? 'modeDeep' : 'modeFast') });
  $('deepBtn').hidden = R.deep;

      <dl class="kv"><dt>${T('bestMove')}</dt><dd><b class="pv red-t">${lineText([], [a.mv])[0].t}</b> ${mateTag(realMate(a.vl))}</dd><dt>${T('bestLine')}</dt><dd>${lineHtml(e, { bestFirst: true })}</dd></dl>
      <button class="mini-btn" data-start="${esc(e.key)}">${T('demoBest')}</button>${demoNote()}`;
    bindLines(el, startPreview); return;
  }
  const sd = j % 2, mt = M[j], a = R.ana[j], b = R.ana[j + 1];
  const before = R.moves.slice(0, j);

    <div class="ana-move" style="margin-top:6px"><span class="note dim">${T('actual')}</span><span class="big ${col}">${played.t}</span>${mt ? `<span class="tag ${CLS[mt.cls].c}">${clsN(mt.cls)}</span>` : `<span class="note dim">${T('analysing')}</span>`}</div>`;
  if (!a || !a.mv) { el.innerHTML = h + `<p class="note" style="margin-top:10px">${T('anaWait')}</p>`; return; }
  const mB = realMate(a.vl), isBest = a.mv == R.moves[j];
  const e = bestLine(j), rec = lineText(before, [a.mv])[0];
  h += `<dl class="kv">`;
  if (mt) {
    const mA = -realMate(b.vl);

    if (mB > 0 && mA <= 0) h += `<dt></dt><dd><span class="tag mate">${T('missedMate')}</span> ${T('hadMate', { n: mB })}</dd>`;
  }
  h += `<dt>${T('bestMove')}</dt><dd><b class="pv ${col}">${rec ? rec.t : '—'}</b> ${mateTag(mB)}${isBest ? ` <span class="note dim" style="display:inline">${T('sameAsPlayed')}</span>` : ''}</dd>`;
  h += `<dt>${T('bestLine')}</dt><dd>${lineHtml(e, { bestFirst: true })}</dd>`;
  if (!isBest) {
    const ea = rvLine(j, [R.moves[j]].concat(b ? b.pv : []));
    h += `<dt>${T('actualLine')}</dt><dd>${lineHtml(ea)}</dd></dl>`;
    h += `<div class="btns" style="margin-top:12px"><button class="mini-btn" style="margin:0" data-start="${esc(e.key)}">${T('demoBestPrev')}</button><button class="mini-btn alt" style="margin:0" data-start="${esc(ea.key)}">${T('demoActual')}</button></div>`;
  } else h += `</dl><button class="mini-btn" data-start="${esc(e.key)}">${T('demoBestPrev')}</button>`;
  h += demoNote();
  el.innerHTML = h; bindLines(el, startPreview);
}
function startPreview(e, k) {
  stopPlay(); if (!e || !e.line.length) return;
  if (R.preview && R.preview.e === e) { previewTo(k); return; }
  if (R.preview) clearTimeout(R.preview.t2);
  // start on the position before the move (k = 0): the arrow shows the best move, › plays it
  R.preview = { base: e.base.length, e, k: 0, get line() { return this.e.line; }, get mate() { return lineInfo(this.e.base, this.e.line).mate; } };
  renderReview(true); AU.select();
  if (k) previewTo(k);
  const rv = $('review'), bt = $('rBoard').getBoundingClientRect(), rt = rv.getBoundingClientRect();
  if (bt.top < rt.top || bt.bottom > rt.bottom) rv.scrollTo({ top: rv.scrollTop + bt.top - rt.top - 40, behavior: 'smooth' });
}
function exitPreview(silent) { if (!R.preview) return; clearTimeout(R.preview.t2); R.preview = null; if (silent !== true) renderReview(true); else { const pb = document.querySelector('.preview-bar'); if (pb) pb.remove(); } }
function renderMoves(M) {
  const el = $('p-moves'), p = new E.Position(); p.startpos();
  let h = '<div class="moves">';
  for (let j = 0; j < R.moves.length; j++) {

    const t = notation(p, R.moves[j]); p.makeMove(R.moves[j]);
    const mt = M[j];
    h += `<button class="${j % 2 ? '' : 'r'} ${R.ply == j + 1 ? 'cur' : ''}" data-k="${j + 1}"><span>${t}</span>${mt && mt.cls != 'good' ? `<span class="tag ${CLS[mt.cls].c}">${clsT(mt.cls)}</span>` : ''}</button>`;
  }
  if (R.moves.length % 2 == 1) h += '<span></span>';
  h += '</div>';
  el.innerHTML = R.moves.length ? h : `<p class="note">${T('noMovesPlayed')}</p>`;
  el.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => { stopPlay(); exitPreview(true); goPly(+b.dataset.k); });
  const box = el.querySelector('.moves'), cur = el.querySelector('.cur'); if (cur) scrollInto(isWide() ? el : box, cur);
}
function renderReport(M) {
  const el = $('p-report'), pvp = R.rec.mode == 'pvp', me = pvp ? 0 : R.rec.side;
  const sum = sd => { const xs = M.filter((m, j) => m && j % 2 == sd && j >= (R.rec.base || 0)); const c = { best: 0, good: 0, slow: 0, err: 0, blun: 0 }; xs.forEach(m => c[m.cls]++);
    return { n: xs.length, acc: xs.length ? xs.reduce((s, m) => s + m.acc, 0) / xs.length : null, c }; };
  const A = [sum(0), sum(1)];
  const done = R.ana.filter(Boolean).length >= R.moves.length + 1;
  const ring = sd => { const s = A[sd], col = sd ? '#d9cfc2' : '#ff7a66';
    return `<div><span class="nm" style="color:${col}">${whoName(sd)}${pvp ? '' : ' · ' + SIDE(sd)}</span><div class="ring" style="--p:${s.acc == null ? 0 : s.acc};--c:${col}"><b>${s.acc == null ? '—' : Math.round(s.acc)}</b></div><small>${T('accOf', { n: s.n })}</small></div>`; };
  let h = `<div class="acc">${ring(me)}${ring(1 - me)}</div>`;
  h += `<table class="cnt"><tr><th></th><th>${whoName(me)}</th><th>${whoName(1 - me)}</th></tr>` +
    ['best', 'good', 'slow', 'err', 'blun'].map(k => `<tr><td><span class="tag ${CLS[k].c}">${clsT(k)}</span> ${clsN(k)}</td><td>${A[me].c[k]}</td><td>${A[1 - me].c[k]}</td></tr>`).join('') + '</table>';
  const keys = M.map((m, j) => ({ m, j })).filter(x => x.m && (pvp || x.j % 2 == me) && x.j >= (R.rec.base || 0) && x.m.drop >= 8).sort((a, b) => b.m.drop - a.m.drop).slice(0, pvp ? 6 : 5);
  const p = new E.Position();
  h += `<div class="keys"><h4>${keys.length ? T(pvp ? 'keyBoth' : 'keyMine') : T(done ? 'keyNone' : 'keyWait')}</h4>`;
  keys.forEach(({ m, j }) => { p.fromMoves(R.moves.slice(0, j)); const t = notation(p, R.moves[j]), best = R.ana[j].mv ? notation(p, R.ana[j].mv) : '';
    h += `<button data-k="${j + 1}"><span class="tag ${CLS[m.cls].c}">${clsT(m.cls)}</span><span class="grow">${T('keyRow', { n: Math.floor(j / 2) + 1, s: pvp ? SIDE(j % 2) + ' ' : '', t })}${best ? T('keyBest', { b: best }) : ''}</span><small>−${Math.round(m.drop)}%</small></button>`; });
  h += '</div>';
  if (done && !pvp && A[me].acc != null) {

    h += `<p class="note" style="margin-top:12px">${T('accYou', { n: `<b>${Math.round(acc)}</b>` })} ${tip}${R.rec.hints ? ' ' + T('usedHints', { n: R.rec.hints }) : ''}${R.rec.undos ? ' ' + T('usedUndos', { n: R.rec.undos }) : ''}</p>`;
  }
  el.innerHTML = h;
  el.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => { stopPlay(); exitPreview(true); goPly(+b.dataset.k); $('ptabs').querySelector('[data-tab="ana"]').click(); });
}

// ===== explore: a free board with the engine's candidate moves, opened from a review position =====
const xb = Board($('xBoard'));
const X = { moves: [], cur: 0, sel: -1, flip: false, token: 0, live: true, cands: null, pos: new E.Position(), thinking: false, timer: 0, from: 'lobby' };
function sizeExplore() { sizeSplit('explore', xb); }
function openExplore(moves, cur, flip, from) {
  Eng.cancel(); G.token++; R.token++;
  X.from = from || 'lobby';
  $('xBackTx').textContent = T(X.from == 'review' ? 'backReview' : 'back');
  $('xPlay').hidden = !!S;
  X.moves = moves.slice(); X.cur = Math.min(cur != null ? cur : moves.length, moves.length); X.sel = -1; X.cands = null;
  if (flip != null) X.flip = !!flip;
  show('explore'); $('explore').scrollTop = 0;
  xb.clear(); xb.setFlip(X.flip);
  requestAnimationFrame(() => { sizeExplore(); renderExplore(false); });
}
function xBase() { return X.moves.slice(0, X.cur); }
function renderExplore(animate, keepCands) {
  const p = X.pos; p.fromMoves(xBase());
  xb.setPosition(p.sq, animate);
  const last = X.cur ? X.moves[X.cur - 1] : 0;
  const m = { sel: X.sel, check: p.inCheck() ? p.kingSq[p.sd] : -1, last: last ? [SRC(last), DST(last)] : null };
  if (X.sel >= 0) m.dots = legalFrom(p, X.sel).map(mv => ({ sq: DST(mv), cap: !!p.sq[DST(mv)] }));
  if (X.live && X.cands && X.cands.lines.length) m.arrows = X.cands.lines.slice(0, 3).map((l, i) => ({ mv: l.mv, color: i == 0 ? 'green' : 'blue', op: i == 0 ? .9 : .55, thin: i > 0, dash: i > 0 })).reverse();
  xb.marks(m);
  const end = checkEnd(p);
  $('xTurn').textContent = end ? endTxt(end) : T('turnOf', { s: SIDE(p.sd) }) + ' · ' + T('moveN', { n: X.cur });
  $('xTitle').innerHTML = `${T('explore')}<span class="eng-chip"></span>`; updateEngChips();
  $('xPrev').disabled = X.cur == 0; $('xFirst').disabled = X.cur == 0; $('xNext').disabled = X.cur >= X.moves.length;
  $('xAi').disabled = !!end || X.thinking;
  $('xLive').querySelector('.sw').classList.toggle('on', X.live);
  renderXMoves();
  if (!keepCands) { X.cands = null; renderCands(); scheduleAnalysis(); }
  else renderCands();
}
function renderXMoves() {
  const el = $('xMoves'), p = new E.Position(); p.startpos();
  let h = '';
  for (let j = 0; j < X.moves.length; j++) {
    if (j % 2 == 0) h += `<span class="no">${j / 2 + 1}.</span>`;
    const t = notation(p, X.moves[j]); p.makeMove(X.moves[j]);
    h += `<button class="${j % 2 ? '' : 'r'} ${X.cur == j + 1 ? 'cur' : ''}" data-k="${j + 1}" style="${j >= X.cur ? 'opacity:.45' : ''}"><span>${t}</span></button>`;
  }
  if (X.moves.length % 2 == 1) h += '<span></span>';
  el.innerHTML = h || `<p class="note" style="grid-column:1/4">${T('xEmpty')}</p>`;
  $('xMovesH').textContent = T(X.moves.length > X.cur ? 'xMovesRedo' : 'tabMoves');
  el.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => { X.cur = +b.dataset.k; X.sel = -1; AU.select(); renderExplore(true); });

}
function renderCands() {
  const el = $('xCands'), p = X.pos;

  el.innerHTML = `<div class="ana-top" style="margin-bottom:2px"><span class="note dim">${T('candHead', { n: LINE_MOVES })}</span>${pvModeHtml(SIDE(sd))}</div>` + X.cands.lines.slice(0, 3).map((l, i) => {
    const e = lineEntry('x' + base.join(',') + ':' + l.mv, base, l.pv, upd);
    const first = lineText(base, [l.mv])[0], rs = sd == 0 ? l.vl : -l.vl, m = realMate(l.vl);

      <span class="sc">${m ? `<b style="color:#ff9c8f">${fmtScore(rs)}</b>` : `<b>${fmtScore(rs)}</b><br>${T('redRate')} ${pctTxt(rw(l))}`}</span>

function scheduleAnalysis() {

$('xFirst').onclick = () => { if (X.cur) { X.cur = 0; X.sel = -1; AU.select(); renderExplore(true); } };

$('xPlay').onclick = () => {

  const lv = DB.settings.level;

(function noise() {

    const x = c.getContext('2d'), d = x.createImageData(96, 96);
    for (let i = 0; i < d.data.length; i += 4) { const g = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = g; d.data[i + 3] = 22; }

})();
document.addEventListener('keydown', e => {
