<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121833">
<title>夜局德州</title>
<style>
/* 布局：竖屏一屏，顶栏 / 跑道形牌桌（自己固定在正下方）/ 底部操作区 */
:root{
  --bg1:#10162e; --bg2:#1f2852;
  --felt:#2f8a4c; --felt2:#25723d; --rim:#d0793c; --rim2:#a65a26;
  --pill:#4d5687; --pill2:#3a4170; --ink:#f4f6ff; --mute:#aab2d8;
  --go:#3bbf5c; --go2:#2b9a47; --stop:#e04a4f; --gold:#ffcf4a; --card:#fbfbf7; --red:#d8262f; --blk:#1b1d26;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 30%, var(--bg2), var(--bg1));color:var(--ink);font:14px/1.35 var(--sans);
  overflow:hidden;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font-size:16px;font-family:var(--sans)}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}

/* ---------- 大厅 ---------- */
#lobby{overflow-y:auto;align-items:center}
.lob{width:100%;max-width:420px;padding:28px max(18px,env(safe-area-inset-left,0px)) 30px;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.logo .suits{display:grid;grid-template-columns:1fr 1fr;gap:2px;font-size:20px;line-height:1}
.logo .suits span{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;background:var(--card);color:var(--blk)}
.logo .suits span.r{color:var(--red)}
.logo h1{margin:0;font-size:34px;letter-spacing:.08em;font-weight:800}
.logo small{display:block;color:var(--mute);font-size:13px;letter-spacing:.02em;font-weight:400}
.card-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-box h2{margin:0;font-size:15px;color:var(--mute);font-weight:600;letter-spacing:.04em}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--mute)}
.inp{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:12px;color:var(--ink);padding:11px 12px}
.inp.code{text-transform:uppercase;letter-spacing:.4em;text-align:center;font-weight:700;font-size:22px}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.avs button{width:38px;height:38px;border-radius:50%;font-size:20px;background:rgba(255,255,255,.08);border:2px solid transparent}
.avs button.on{border-color:var(--gold);background:rgba(255,207,74,.15)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{border-radius:14px;padding:13px 14px;font-weight:700;font-size:16px;background:var(--pill);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.go{background:var(--go)} .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);box-shadow:none}
.btn.small{padding:8px 10px;font-size:14px;border-radius:10px}
.opts{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:13px;color:var(--mute)}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:6px 4px;border-radius:8px;font-size:13px;color:var(--mute);background:transparent}
.seg button.on{background:var(--pill);color:var(--ink);font-weight:700}
.note{font-size:12px;color:var(--mute);line-height:1.6}
.err{color:#ff8d8d;font-size:13px;min-height:1em}
.wx{background:#ffcf4a;color:#2a2000;font-size:13px;padding:9px 12px;border-radius:12px;line-height:1.5}

/* ---------- 牌桌 ---------- */
#game{background:transparent}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px 0;z-index:5}
.top .chip{background:rgba(255,255,255,.08);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.top .chip b{color:var(--ink);letter-spacing:.12em}
.top .sp{flex:1}
.ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:17px}
.net{width:8px;height:8px;border-radius:50%;background:var(--go)}
.net.bad{background:var(--stop);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
#tableWrap{flex:1;position:relative;min-height:0}
#felt{position:absolute;left:13%;right:13%;top:7%;bottom:9%;border-radius:999px;
  background:radial-gradient(70% 55% at 50% 45%, var(--felt), var(--felt2));
  border:7px solid var(--rim);box-shadow:inset 0 0 0 2px var(--rim2),0 0 0 2px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45)}
#feltText{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);text-align:center;color:rgba(0,0,0,.22);font-weight:800;font-size:22px;letter-spacing:.12em;white-space:nowrap;pointer-events:none}
#feltText small{display:block;font-size:15px;letter-spacing:.05em}
#center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:80%}
#board{display:flex;gap:4px;min-height:58px}
.pot{background:rgba(0,0,0,.35);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.pot small{color:var(--mute);font-weight:400;font-size:12px;margin-right:4px}
#banner{font-size:13px;color:var(--gold);font-weight:700;text-align:center;min-height:1.2em;text-shadow:0 1px 2px rgba(0,0,0,.5)}

.c{width:40px;height:56px;border-radius:6px;background:var(--card);color:var(--blk);position:relative;box-shadow:0 2px 5px rgba(0,0,0,.35);flex:none;
  font-weight:800;animation:deal .25s ease-out}
.c.r{color:var(--red)}
.c .rk{position:absolute;left:4px;top:2px;font-size:17px;line-height:1;letter-spacing:-.04em}
.c .st{position:absolute;right:4px;bottom:2px;font-size:22px;line-height:1}
.c .st2{position:absolute;left:4px;top:19px;font-size:12px;line-height:1}
.c.back{background:repeating-linear-gradient(45deg,#c8394a 0 4px,#b02a3b 4px 8px);border:2px solid #fff}
.c.dim{filter:brightness(.55)}
.c.hl{box-shadow:0 0 0 2px var(--gold),0 0 12px rgba(255,207,74,.7)}
@keyframes deal{from{transform:translateY(-14px) scale(.9);opacity:0}}
.c.sm{width:22px;height:31px;border-radius:4px;animation:none}
.c.sm .rk{font-size:11px;left:2px;top:1px}.c.sm .st{font-size:12px;right:2px;bottom:1px}.c.sm .st2{display:none}
.c.md{width:30px;height:42px;border-radius:5px}
.c.md .rk{font-size:14px;left:3px}.c.md .st{font-size:16px;right:3px}.c.md .st2{top:15px;left:3px;font-size:10px}
.c.lg{width:50px;height:70px;border-radius:7px}
.c.lg .rk{font-size:21px;left:5px;top:3px}.c.lg .st{font-size:28px;right:5px;bottom:3px}.c.lg .st2{top:24px;left:5px;font-size:15px}

.seat{position:absolute;transform:translate(-50%,-50%);width:84px;display:flex;flex-direction:column;align-items:center;z-index:3;transition:opacity .3s}
.seat.empty{opacity:.0;pointer-events:none}
.av{position:relative;width:46px;height:46px;border-radius:50%;background:#e9ecf8;display:grid;place-items:center;font-size:24px;color:#2b3157;font-weight:800;
  box-shadow:0 2px 6px rgba(0,0,0,.4)}
.av .ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p,1)*360deg), rgba(255,255,255,.12) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.av .ring.low{background:conic-gradient(var(--stop) calc(var(--p,1)*360deg), rgba(255,255,255,.12) 0)}
.nm{margin-top:-8px;background:var(--pill);border-radius:999px;padding:2px 9px;font-size:12px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  position:relative;z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seat.turn .nm{background:var(--go)}
.ch{font-size:13px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.seat.folded .av,.seat.folded .nm{opacity:.45}
.seat.off .av{filter:grayscale(1)}
.tag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#f08a24;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;white-space:nowrap;z-index:2}
.tag.off{background:#666}
.tag.act{background:rgba(10,12,28,.85);font-size:11px;font-weight:800}
.act.fold{color:#c9c9c9}.act.allin{color:var(--gold)}.act.raise{color:#ff9f6b}
.mini{position:absolute;left:62px;top:4px;display:flex}
.mini .c+.c{margin-left:-9px}
.seat.left .mini{left:auto;right:62px}
.seat .best{font-size:11px;color:var(--gold);font-weight:700;white-space:nowrap;text-shadow:0 1px 2px #000}
.seat.win .av{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(255,207,74,.8)}
.net-p{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;color:var(--gold);text-shadow:0 1px 3px #000;animation:rise 1s ease-out;white-space:nowrap}
.net-p.neg{color:#ff9a9a}
@keyframes rise{from{transform:translate(-50%,10px);opacity:0}}
.dbtn{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;color:#222;font-size:11px;font-weight:900;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.5);z-index:2;transform:translate(-50%,-50%)}
.bet{position:absolute;transform:translate(-50%,-50%);background:rgba(0,0,0,.42);border-radius:999px;padding:2px 9px 2px 4px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;z-index:2;white-space:nowrap}
.bet i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,#e0483d 26% 60%,#fff 61% 70%,#e0483d 71%);display:inline-block}
.bubble{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);background:#fff;color:#222;border-radius:12px;padding:4px 9px;font-size:14px;white-space:nowrap;z-index:9;animation:pop .2s;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.bubble.big{font-size:28px;padding:0 6px;background:transparent;box-shadow:none}
@keyframes pop{from{transform:translate(-50%,6px) scale(.6);opacity:0}}
#myCards{position:absolute;display:flex;gap:3px;z-index:4;transform:translate(0,-50%)}
#myCards .c{transform:rotate(-6deg)}#myCards .c+.c{transform:rotate(6deg);margin-left:-8px}
#myHand{position:absolute;transform:translate(-50%,0);font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;z-index:4;text-shadow:0 1px 2px #000}

/* ---------- 操作区 ---------- */
#panel{padding:6px 10px 8px;display:flex;flex-direction:column;gap:7px;min-height:150px;justify-content:flex-end}
.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sizes button{background:var(--pill2);border-radius:10px;padding:8px 0;font-size:13px;font-weight:600;color:#dfe4ff}
.sizes button.on{background:#7480c4;color:#fff}
.sizes button:disabled{opacity:.35}
.slide{display:flex;align-items:center;gap:10px}
.slide input{flex:1;accent-color:var(--go);height:28px}
.slide .amt{min-width:76px;text-align:center;background:rgba(0,0,0,.3);border-radius:10px;padding:5px 6px;font-weight:800;font-size:16px}
.acts{display:grid;grid-template-columns:1fr 1.15fr 1.3fr;gap:8px}
.acts button{border-radius:14px;padding:13px 4px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.3);line-height:1.1}
.acts button small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:2px}
.acts button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.acts .fold{background:var(--stop)} .acts .call{background:var(--pill)} .acts .raise{background:var(--go)}
.acts button:disabled{opacity:.35}
.wait{text-align:center;color:var(--mute);font-size:14px;padding:10px 0;display:flex;flex-direction:column;gap:10px;align-items:center}
.wait .row{width:100%;max-width:380px}
.pre{display:flex;gap:8px;justify-content:center}
.pre button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--mute)}
.pre button.on{background:var(--pill);color:var(--ink);border-color:var(--gold)}

/* ---------- 弹层 ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;max-height:80%;overflow-y:auto;background:#1b2247;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font-size:16px}
.plist{display:flex;flex-direction:column;gap:6px}
.plist div{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:10px;padding:7px 10px;font-size:14px}
.plist div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist em{font-style:normal;color:var(--mute);font-size:12px}
.log{font-size:12.5px;color:#cfd5f5;line-height:1.7;background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px;max-height:40vh;overflow-y:auto}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emos button{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 0;font-size:22px}
.phr{display:flex;flex-wrap:wrap;gap:6px}
.phr button{background:rgba(255,255,255,.07);border-radius:999px;padding:7px 12px;font-size:14px}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(0,0,0,.8);padding:8px 14px;border-radius:12px;z-index:30;font-size:14px;max-width:86%;text-align:center}
.ov{position:absolute;inset:0;display:grid;place-items:center;z-index:8;pointer-events:none}
.ov div{background:rgba(10,14,30,.85);padding:12px 18px;border-radius:14px;text-align:center;font-size:14px;color:var(--mute);pointer-events:auto;max-width:80%}
.ov b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
#game>.top,#tableWrap,#panel{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.avs{display:grid;grid-template-columns:repeat(6,1fr)}
.avs button{width:auto;aspect-ratio:1;height:auto}
@media (max-height:700px){
  .c.lg{width:42px;height:59px}.c.lg .rk{font-size:18px}.c.lg .st{font-size:22px}.c.lg .st2{top:21px;font-size:13px}
  .acts button{padding:10px 4px;font-size:16px}.sizes button{padding:6px 0}.slide input{height:22px}
  #panel{min-height:132px;gap:6px}.av{width:42px;height:42px;font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-height:760px){.c.lg{width:56px;height:78px}.av{width:50px;height:50px}}
</style>
</head>
<body>

<!-- 大厅 -->
<section id="lobby" class="screen">
  <div class="lob">
    <div class="logo">
      <div class="suits"><span>♠</span><span class="r">♥</span><span class="r">♦</span><span>♣</span></div>
      <h1>夜局德州<small>开个房间，把房间码发给朋友就能一起打</small></h1>
    </div>
    <div id="wxTip" class="wx" hidden>微信里联网可能不稳定。点右上角「···」选择「在浏览器打开」会更顺。</div>

    <div class="card-box">
      <div class="field"><label for="nick">你的昵称</label><input id="nick" class="inp" maxlength="8" placeholder="最多 8 个字" autocomplete="off"></div>
      <div class="field"><label>头像</label><div class="avs" id="avs"></div></div>
    </div>

    <div class="card-box">
      <h2>加入朋友的房间</h2>
      <div class="row"><input id="joinCode" class="inp code" maxlength="4" placeholder="房间码" autocomplete="off" inputmode="latin"><button class="btn go" id="btnJoin" style="flex:.7">加入</button></div>
    </div>

    <div class="card-box">
      <h2>自己开房</h2>
      <div class="opts">
        <span>盲注</span><div class="seg" id="optBlind"></div>
        <span>初始筹码</span><div class="seg" id="optChips"></div>
        <span>思考时间</span><div class="seg" id="optTime"></div>
      </div>
      <button class="btn" id="btnCreate">创建房间</button>
      <button class="btn ghost" id="btnResume" hidden>恢复上次的房间</button>
    </div>

    <button class="btn ghost" id="btnSolo">单机练习（和机器人打）</button>
    <div class="err" id="lobErr"></div>
    <p class="note">开房的人就是这桌的"服务器"：房主的页面要一直开着，关掉或切到后台太久，大家都会掉线。房主最好用电脑或者让手机保持亮屏。人不够可以在房间里加机器人。</p>
  </div>
</section>

<!-- 牌桌 -->
<section id="game" class="screen" hidden>
  <div class="top">
    <button class="ico" id="btnExit" aria-label="离开">✕</button>
    <button class="chip" id="btnCode"><span class="net" id="netDot"></span>房间 <b id="codeTxt">----</b></button>
    <span class="sp"></span>
    <button class="ico" id="btnChat" aria-label="表情">💬</button>
    <button class="ico" id="btnMenu" aria-label="菜单">⚙︎</button>
  </div>
  <div id="tableWrap">
    <div id="felt"></div>
    <div id="feltText"></div>
    <div id="center"><div id="board"></div><div class="pot" id="pot"></div><div id="banner"></div></div>
    <div id="seats"></div>
    <div id="myCards"></div><div id="myHand"></div>
    <div class="ov" id="overlay" hidden><div id="ovText"></div></div>
  </div>
  <div id="panel"></div>
</section>

      const canRaise = p.canRaise && maxTo > h.curBet &&
        this.inHand().some(o => o !== p && !o.allIn); // 至少还有一个人能跟
      let minTo = h.curBet + h.minRaise;
      if (h.curBet === 0) minTo = Math.max(this.settings.bb, 1);
      minTo = Math.min(minTo, maxTo);
      return { toCall, canCheck: toCall === 0, canRaise, minTo, maxTo, curBet: h.curBet, myBet: p.bet };
    }

    act(id, a) {
      const p = this.byId(id), h = this.hand;
      if (!p || !h || h.street === 'done' || h.toAct !== p.seat) return 'not-your-turn';
      const L = this.legal(p);
      let type = a.type;
      if (type === 'check' && !L.canCheck) return 'cannot-check';
      if (type === 'call' && L.toCall === 0) type = 'check';
      if (type === 'raise' && !L.canRaise) type = L.toCall ? 'call' : 'check';
      if (type === 'fold') {
        p.folded = true; p.lastAction = '弃牌';
        this.addLog(`${p.name} 弃牌`);
      } else if (type === 'check') {
        p.lastAction = '过牌'; this.addLog(`${p.name} 过牌`);
      } else if (type === 'call') {
        const c = L.toCall;
        p.chips -= c; p.bet += c; p.committed += c;
        if (p.chips === 0) { p.allIn = true; p.lastAction = '全押'; } else p.lastAction = '跟注';
        this.addLog(`${p.name} ${p.allIn ? '全押跟注' : '跟注'} ${c}`);
      } else if (type === 'raise') {
        let to = Math.floor(Number(a.to) || 0);
        to = Math.max(L.minTo, Math.min(L.maxTo, to));
        const add = to - p.bet;
        const raiseBy = to - h.curBet;
        p.chips -= add; p.bet = to; p.committed += add;
        const wasBet = h.curBet === 0;
        if (p.chips === 0) p.allIn = true;
        if (raiseBy >= h.minRaise) {
          h.minRaise = raiseBy;
          for (const o of this.players) if (o !== p && o.inHand) { o.acted = false; o.canRaise = true; }
        } else { // 不足额全押：已行动过的人不能再加注
          for (const o of this.players) if (o !== p && o.inHand) { if (o.acted) o.canRaise = false; o.acted = false; }
        }
        h.curBet = to;
        p.lastAction = p.allIn ? '全押' : (wasBet ? '下注' : '加注');
        this.addLog(`${p.name} ${p.lastAction} 到 ${to}`);
      } else return 'bad-action';
      p.acted = true;
      this.advance(p.seat);
      return 'ok';
    }

    afterExternalFold() {
      const h = this.hand; if (!h || h.street === 'done') return;
      if (this.inHand().length <= 1) this.advance(h.toAct);
    }

    advance(fromSeat) {
      const h = this.hand;
      h.pot = this.players.reduce((s, p) => s + p.committed - p.bet, 0);
      const live = this.inHand();
      if (live.length === 1) return this.finishUncontested(live[0]);
      const list = this.players.filter(p => p.inHand).sort((a, b) => a.seat - b.seat);
      // 下一个需要行动的人
      let s = fromSeat === undefined ? h.toAct : fromSeat;
      for (let i = 0; i < list.length; i++) {
        s = this.nextSeat(s, list);
        const p = this.bySeat(s);
        if (this.needsAct(p)) {
          h.toAct = s; this.setDeadline(p); this.changed(); return;
        }
      }
      this.endStreet();
    }

    setDeadline(p) {
      const h = this.hand;
      const t = p.isBot ? 0 : (p.connected ? this.settings.turnTime * 1000 : 6000);
      const gen = ++this._timerGen;
      h.deadline = p.isBot ? 0 : this.now() + t;
      if (p.isBot) {
        this.schedule(() => { if (gen === this._timerGen && h === this.hand && h.toAct === p.seat) this.botAct(p); }, 700 + this.rnd() * 1100);
      } else {
        this.schedule(() => {
          if (gen === this._timerGen && h === this.hand && h.toAct === p.seat && h.street !== 'done') {
            const L = this.legal(p);
            this.addLog(`${p.name} 超时`);
            this.act(p.id, { type: L && L.canCheck ? 'check' : 'fold' });
          }
        }, t);
      }
    }

    endStreet() {
      const h = this.hand;
      for (const p of this.players) { p.bet = 0; p.acted = false; p.canRaise = true; }
      h.pot = this.players.reduce((s, p) => s + p.committed, 0);
      h.curBet = 0; h.minRaise = this.settings.bb; h.toAct = -1; h.deadline = 0;
      const canAct = this.inHand().filter(p => !p.allIn);
      if (h.street === 'river') return this.showdown();
      const runout = canAct.length <= 1;
      if (runout) for (const p of this.inHand()) p.showCards = true; // 全押摊牌：亮牌发完
      this.dealNext();
      this.changed();
      const gen = ++this._timerGen;
      if (runout) {
        this.schedule(() => { if (gen === this._timerGen) this.endStreet(); }, 1400);
      } else {
        for (const p of this.players) if (p.inHand && !p.folded && !p.allIn) p.lastAction = '';
        this.schedule(() => { if (gen === this._timerGen) this.advance(h.dealer); }, 500);
      }
    }
    dealNext() {
      const h = this.hand, d = h.deck;
      d.pop(); // 烧牌
      if (h.street === 'preflop') { h.board.push(d.pop(), d.pop(), d.pop()); h.street = 'flop'; }
      else if (h.street === 'flop') { h.board.push(d.pop()); h.street = 'turn'; }
      else if (h.street === 'turn') { h.board.push(d.pop()); h.street = 'river'; }
      this.addLog(`${{ flop: '翻牌', turn: '转牌', river: '河牌' }[h.street]}：${h.board.map(cardStr).join(' ')}`);
    }

    finishUncontested(w) {
      const h = this.hand;
      const total = this.players.reduce((s, p) => s + p.committed, 0);
      w.chips += total; w.won = total;
      h.results = [{ amount: total, winners: [w.seat], name: '' }];
      this.addLog(`${w.name} 赢得 ${total}（其他人弃牌）`);
      this.endHand();
    }

    showdown() {
      const h = this.hand;
      h.street = 'showdown';
      const live = this.inHand();
      for (const p of live) { p.showCards = true; p.best = bestHand(p.hole.concat(h.board)); }
      // 按投入额分层算边池
      const all = this.players.filter(p => p.committed > 0);
      const levels = [...new Set(live.map(p => p.committed))].sort((a, b) => a - b);
      const pots = []; let prev = 0;
      for (const L of levels) {
        let amt = 0;
        for (const p of all) amt += Math.max(0, Math.min(p.committed, L) - prev);
        const elig = live.filter(p => p.committed >= L);
        if (amt > 0) pots.push({ amount: amt, elig });
        prev = L;
      }
      // 弃牌者超出最高层的部分（理论上不会出现）并入最后一个池
      let extra = 0; for (const p of all) extra += Math.max(0, p.committed - prev);
      if (extra && pots.length) pots[pots.length - 1].amount += extra;
      // 合并资格相同的池
      const merged = [];
      for (const pt of pots) {
        const last = merged[merged.length - 1];
        if (last && last.elig.length === pt.elig.length) last.amount += pt.amount; else merged.push(pt);
      }
      h.results = [];
      const orderFromDealer = p => (p.seat - h.dealer + SEATS - 1) % SEATS; // 庄家左手第一个先得零头
      merged.forEach((pt, i) => {
        const top = Math.max(...pt.elig.map(p => p.best.score));
        const ws = pt.elig.filter(p => p.best.score === top).sort((a, b) => orderFromDealer(a) - orderFromDealer(b));
        const share = Math.floor(pt.amount / ws.length); let odd = pt.amount - share * ws.length;
        for (const w of ws) { const g = share + (odd > 0 ? 1 : 0); odd--; w.chips += g; w.won = (w.won || 0) + g; }
        h.results.push({ amount: pt.amount, winners: ws.map(w => w.seat), name: ws[0].best.name, side: i > 0 });
        this.addLog(`${i ? '边池' : '主池'} ${pt.amount}：${ws.map(w => w.name).join('、')} 以${ws[0].best.name}获胜`);
      });
      this.endHand();
    }

    endHand() {
      const h = this.hand;
      h.street = 'done'; h.toAct = -1; h.deadline = 0;
      for (const p of this.players) { p.net = (p.won || 0) - p.committed; p.bet = 0; }
      h.pot = 0;
      this.changed();
      if (this.settings.autoNext && !this.paused) {
        const gen = ++this._timerGen;
        const wait = h.results && h.results.some(r => r.name) ? 6500 : 3500;
        this.nextAt = this.now() + wait;
        this.schedule(() => { if (gen === this._timerGen) { this.nextAt = 0; this.startHand(); } }, wait);
      }
    }

    // ---------- 机器人 ----------
    botAct(p) {
      const h = this.hand, L = this.legal(p);
      if (!L) return;
      const opp = this.inHand().length - 1;
      const eq = equity(p.hole, h.board, Math.max(1, opp), h.board.length ? 260 : 200, this.rnd);
      const pot = this.players.reduce((s, q) => s + q.committed, 0);
      const odds = L.toCall / (pot + L.toCall);
      const r = this.rnd();
      const style = p.style == null ? (p.style = this.rnd()) : p.style; // 0 稳健 ~ 1 激进
      const fair = 1 / (opp + 1);
      const strength = eq / fair; // >1 表示比平均强
      const raiseTo = frac => Math.round(Math.max(L.minTo, Math.min(L.maxTo, L.curBet + Math.max(h.minRaise, frac * (pot + L.toCall)))) / this.settings.sb) * this.settings.sb || L.minTo;
      if (L.canRaise && (eq > 0.8 || strength > 2.2) && r < 0.75 + style * 0.2) {
        const to = eq > 0.9 && r < 0.3 ? L.maxTo : raiseTo(0.6 + r * 0.6);
        return this.act(p.id, { type: 'raise', to });
      }
      if (L.canRaise && strength > 1.4 && r < 0.25 + style * 0.35) return this.act(p.id, { type: 'raise', to: raiseTo(0.45 + r * 0.3) });
      if (L.canCheck) {
        if (L.canRaise && r < 0.06 + style * 0.1) return this.act(p.id, { type: 'raise', to: raiseTo(0.5) }); // 偶尔诈唬
        return this.act(p.id, { type: 'check' });
      }
      if (eq >= odds + 0.04 - style * 0.05 || (L.toCall <= this.settings.bb && strength > 0.7)) return this.act(p.id, { type: 'call' });
      return this.act(p.id, { type: 'fold' });
    }

    // ---------- 给某个玩家看的画面 ----------
    view(id) {
      const h = this.hand;
      const me = this.byId(id);
      const done = h && h.street === 'done';
      return {
        settings: this.settings, started: !!this.started, paused: this.paused, handNum: this.handNum,
        nextIn: this.nextAt ? Math.max(0, this.nextAt - this.now()) : 0,
        hand: h && { street: h.street, board: h.board, dealer: h.dealer, sb: h.sbSeat, bb: h.bbSeat, toAct: h.toAct,
          curBet: h.curBet, pot: h.pot, results: h.results, deadlineIn: h.deadline ? Math.max(0, h.deadline - this.now()) : 0 },
        players: this.players.map(p => ({
          id: p.id, seat: p.seat, name: p.name, avatar: p.avatar, chips: p.chips, bet: p.bet, isBot: p.isBot, connected: p.connected,
          inHand: p.inHand, folded: p.folded, allIn: p.allIn, lastAction: p.lastAction, rebuys: p.rebuys,
          won: p.won || 0, net: done ? p.net : 0,
          hole: (p.id === id || (p.showCards && !p.folded)) ? p.hole : (p.inHand && p.hole.length ? [-1, -1] : []),
          best: (p.showCards && !p.folded && p.best) ? { name: p.best.name, cards: p.best.cards } : null,
        })),
        me: me ? { seat: me.seat, legal: me && h ? this.legal(me) : null,
          handName: h && me.hole.length && h.board.length ? bestHand(me.hole.concat(h.board)).name : '' } : null,
        log: this.log.slice(-30),
      };
    }
  }

  function cardStr(c) { return RANK_CH[rankOf(c)].replace('T', '10') + SUIT_CH[suitOf(c)]; }

  G.Poker = { Game, bestHand, eval5, score, equity, cardStr, rankOf, suitOf, RANK_CH, SUIT_CH, CAT_NAME, SEATS };
})(typeof window !== 'undefined' ? window : globalThis);

    rebuyAll(){},
  };

  function broadcastEmote(seat, e){
    showBubble(seat, e);
    for (const c of conns.values()) if (c.open) try { c.send({ t: 'emote', seat, e }); } catch(err){}
  }

  function onData(conn, msg){
    if (!msg || typeof msg !== 'object') return;
    let pid = conn._pid;
    if (msg.t === 'hello') {
      const name = String(msg.name || '').trim().slice(0, 8) || '玩家';
      const tk = String(msg.token || '').slice(0, 40);
      const av = Math.max(0, Math.min(AVATARS.length-1, msg.av|0));
      let p = game.players.find(x => x.token === tk && !x.isBot && x.id !== 'host');
      if (p) { p.name = name; p.avatar = av; }
      else {
        if (hostApi.locked) { conn.send({ t: 'err', msg: '房主已锁房，暂时不能加入' }); setTimeout(()=>conn.close(), 500); return; }
        p = game.addPlayer({ id: 'p' + rid(8), name, token: tk, avatar: av });
        if (!p) { conn.send({ t: 'err', msg: '这个房间已经坐满了（最多 9 人）' }); setTimeout(()=>conn.close(), 500); return; }
        if (game.started && game.hand && game.hand.street !== 'done') game.addLog(`${name} 下一手开始加入`);
      }
      const old = conns.get(p.id); if (old && old !== conn) { try{ old.close(); }catch(e){} }
      conn._pid = p.id; conns.set(p.id, conn); seen.set(p.id, Date.now());
      game.setConnected(p.id, true);
      conn.send({ t: 'welcome', id: p.id });
      queueSync();
      return;
    }
    if (!pid) return;
    seen.set(pid, Date.now());
    const p = game.byId(pid); if (!p) return;
    if (msg.t === 'ping') { try{ conn.send({ t: 'pong' }); }catch(e){} }
    else if (msg.t === 'act') { const r = game.act(pid, { type: String(msg.a), to: +msg.to }); if (r !== 'ok') conn.send({ t:'err', msg:'现在不能这样操作' }); }
    else if (msg.t === 'emote') { const e = String(msg.e || '').slice(0, 12); if (EMOS.includes(e) || PHRASES.includes(e)) broadcastEmote(p.seat, e); }
    else if (msg.t === 'rebuy') game.rebuy(pid);
    else if (msg.t === 'leave') { conns.delete(pid); game.removePlayer(pid); }
  }

  let tries = 0;
  function openPeer(){
    peer = new Peer(PREFIX + roomCode, peerOpts());
    peer.on('open', () => { tries = 0; setNet(true); if (!cfg.players) toast(`房间 ${roomCode} 已开好，把房间码发给朋友`, 3500); });
    peer.on('connection', conn => {
      conn.on('data', m => onData(conn, m));
      conn.on('close', () => { const pid = conn._pid; if (pid && conns.get(pid) === conn) { conns.delete(pid); game.setConnected(pid, false); } });
      conn.on('error', () => {});
    });
    peer.on('disconnected', () => { setNet(false); setTimeout(() => { if (peer && !peer.destroyed) { try { peer.reconnect(); } catch(e){} } }, 1500); });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        // 刚刷新时旧 ID 还没释放，稍等再试
        if (++tries < 15) { setNet(false, '<b>正在找回房间…</b>房间码还被占着，稍等几秒'); peer.destroy(); setTimeout(openPeer, 3000); }
        else { setNet(false, '<b>房间码被占用</b>请回到大厅重新开房'); }
      } else if (['network','server-error','socket-error','socket-closed'].includes(err.type)) {
        setNet(false); setTimeout(() => { if (peer.destroyed) openPeer(); else if (peer.disconnected) try{ peer.reconnect(); }catch(e){} }, 3000);
      }
    });
    peer.on('open', () => setNet(true));
  }
  if (!cfg.solo) openPeer();
  else {
    for (let i = 0; i < 4; i++) hostApi.addBot();
    game.start();
  }
  enterGame();
  sync();
}
let hostApi = null;

// 客户端：连到房主，收画面、发操作

function startClient(code){
  mode = 'client'; roomCode = code;
  let peer = null, conn = null, lastMsg = 0, everConnected = false, failCount = 0, dead = false;
  setNet(false, '<b>正在连接房间…</b>');
  enterGame();

  const send = m => { if (conn && conn.open) { try { conn.send(m); return true; } catch(e){} } toast('网络断开，正在重连…'); return false; };
  sendAct = a => send({ t: 'act', a: a.type, to: a.to });
  sendEmote = e => send({ t: 'emote', e });
  sendRebuy = () => send({ t: 'rebuy' });
  clientLeave = () => { dead = true; try { conn && conn.open && conn.send({ t: 'leave' }); } catch(e){} setTimeout(()=>{ try{ peer && peer.destroy(); }catch(e){} }, 300); };

  function connect(){
    if (dead) return;
    try { conn && conn.close(); } catch(e){}
    if (!peer || peer.destroyed || peer.disconnected) {
      try { peer && peer.destroy(); } catch(e){}
      peer = new Peer(peerOpts());
      peer.on('open', () => dial());
      peer.on('error', err => {
        if (err.type === 'peer-unavailable') {
          failCount++;
          setNet(false, everConnected ? '<b>房主掉线了</b>等房主回来，会自动重连' : '<b>找不到这个房间</b>检查房间码，或者房主还没开房 / 已经离开');
          retry(everConnected ? 3000 : 5000);
        } else if (['network','server-error','socket-error','socket-closed','disconnected'].includes(err.type)) { setNet(false, '<b>网络不太好</b>正在重连…'); retry(2500); }
      });
      peer.on('disconnected', () => {});
    } else dial();
  }
  function dial(){
    if (dead) return;
    conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    const c = conn;
    const to = setTimeout(() => { if (c === conn && !c.open) { setNet(false, '<b>连接超时</b>正在重试…'); retry(500); } }, 12000);
    c.on('open', () => { clearTimeout(to); lastMsg = Date.now(); c.send({ t: 'hello', name: myName, token, av: myAv }); });
    c.on('data', m => {
      lastMsg = Date.now();
      if (!m) return;
      if (m.t === 'welcome') { myId = m.id; everConnected = true; failCount = 0; setNet(true); }
      else if (m.t === 'state') { view = m.v; viewAt = performance.now(); if (myId) setNet(true); render(); }
      else if (m.t === 'emote') showBubble(m.seat, m.e);
      else if (m.t === 'err') toast(m.msg);
      else if (m.t === 'kicked') { dead = true; setNet(false, '<b>你被房主请出了房间</b>'); }
    });
    c.on('close', () => { if (c === conn && !dead) { setNet(false, '<b>连接断开</b>正在重连…'); retry(1500); } });
    c.on('error', () => {});
  }
  let retryT = 0;
  function retry(ms){ clearTimeout(retryT); retryT = setTimeout(connect, ms); }
  setInterval(() => {
    if (dead) return;
    if (conn && conn.open) { try { conn.send({ t: 'ping' }); } catch(e){} }
    if (everConnected && Date.now() - lastMsg > 12000) { setNet(false, '<b>连接断开</b>正在重连…'); lastMsg = Date.now(); peer && peer.destroy(); connect(); }
  }, 4000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !dead && (!conn || !conn.open || Date.now() - lastMsg > 6000)) { try{ peer && peer.destroy(); }catch(e){} connect(); }
  });
  connect();
}

const SUIT = ['♠','♥','♦','♣'];
function cardHTML(c, cls){
  if (c < 0) return `<div class="c back ${cls||''}"></div>`;
  const r = P.RANK_CH[P.rankOf(c)].replace('T','10'), s = P.suitOf(c);
  return `<div class="c ${s===1||s===2?'r':''} ${cls||''}"><span class="rk">${r}</span><span class="st2">${SUIT[s]}</span><span class="st">${SUIT[s]}</span></div>`;
}
// 跑道形边上的点：t=0 在正下方，顺时针
function seatPos(t){
  const a = Math.PI/2 + t * 2 * Math.PI;
  const cx = Math.cos(a), sy = Math.sin(a);
  const x = 50 + 41 * Math.sign(cx) * Math.pow(Math.abs(cx), 0.55);
  const y = 50 + 44 * Math.sign(sy) * Math.pow(Math.abs(sy), 0.45);
  return [x, y];
}
function fmt(n){ return n >= 100000 ? (n/1000).toFixed(n>=1e6?0:1).replace(/\.0$/,'')+'k' : String(n); }

let sliderKey = '', sliderVal = 0, preAct = '';
function render(){
  if (!view || $('game').hidden) return;
  const v = view, h = v.hand;
  const me = v.players.find(p => p.id === myId);
  const mySeat = me ? me.seat : 0;
  const list = v.players.slice().sort((a,b)=>((a.seat-mySeat+9)%9)-((b.seat-mySeat+9)%9));
  const n = Math.max(list.length, 2);
  const W = $('tableWrap').clientWidth, H = $('tableWrap').clientHeight;
  $('feltText').innerHTML = `${mode==='host' && roomCode==='单机' ? '练习模式' : '夜局德州'}<small>盲注 ${v.settings.sb}/${v.settings.bb}${v.handNum?` · 第 ${v.handNum} 手`:''}</small>`;

  let html = '';
  const now = performance.now();
  const winners = new Set(); if (h && h.results) h.results.forEach(r=>r.winners.forEach(s=>winners.add(s)));
  list.forEach((p, i) => {
    const [x, y] = seatPos(i / n);
    p._xy = [x, y];
    const isMe = p.id === myId;
    const turn = h && h.toAct === p.seat && h.street !== 'done';
    const cls = ['seat', turn?'turn':'', p.folded?'folded':'', (!p.connected&&!p.isBot)?'off':'', winners.has(p.seat)&&h.street==='done'?'win':'', x < 50 ? '' : 'left'].join(' ');
    let tag = '';
    if (!p.connected && !p.isBot) tag = '<span class="tag off">离线</span>';
    else if (h && h.street !== 'done' && p.inHand) { if (p.seat === h.sb) tag = '<span class="tag">小盲</span>'; else if (p.seat === h.bb) tag = '<span class="tag">大盲</span>'; }
    else if (!p.inHand && v.started && p.chips > 0 && h && h.street !== 'done') tag = '<span class="tag off">等下一手</span>';
    if (p.chips === 0 && !p.inHand) tag = '<span class="tag off">没筹码了</span>';
    let act = '';
    if (p.lastAction && !(h && h.street==='done' && !p.folded)) {
      const k = p.lastAction === '弃牌' ? 'fold' : p.lastAction === '全押' ? 'allin' : /加注|下注/.test(p.lastAction) ? 'raise' : '';
      act = `<span class="tag act ${k}">${p.lastAction}</span>`;
      if (!(!p.connected && !p.isBot)) tag = '';
    }
    let mini = '';
    if (!isMe && p.hole.length && !p.folded) mini = `<div class="mini">${p.hole.map(c=>cardHTML(c, c<0?'sm':'md')).join('')}</div>`;
    let ring = '';
    if (turn && h.deadlineIn) { ring = `<span class="ring" id="ring"></span>`; }
    const netp = h && h.street==='done' && p.net ? `<span class="net-p ${p.net<0?'neg':''}">${p.net>0?'+':''}${p.net}</span>` : '';
    const best = p.best && !isMe ? `<span class="best">${p.best.name}</span>` : '';
    const b = bubbles[p.seat]; const bub = b && b.until > Date.now() ? `<span class="bubble ${b.txt.length<=2?'big':''}">${esc(b.txt)}</span>` : '';
    html += `<div class="${cls}" style="left:${x}%;top:${y}%">${tag}${act}${netp}${bub}
      <div class="av">${p.isBot?'🤖':AVATARS[p.avatar]||'🙂'}${ring}</div>
      <div class="nm">${esc(p.name)}</div><div class="ch">${fmt(p.chips)}${p.rebuys?` <small style="color:var(--mute);font-weight:400">+${p.rebuys}</small>`:''}</div>${best}${mini}</div>`;
    if (p.bet > 0) {
      const k = isMe ? 0.34 : 0.5;
      html += `<div class="bet" style="left:${x+(50-x)*k}%;top:${y+(50-y)*k}%"><i></i>${fmt(p.bet)}</div>`;
    }
    if (h && h.dealer === p.seat) {
      const dx = x + (50 - x) * 0.2 + (x < 50 ? 7 : -7), dy = y + (50 - y) * 0.2;
      html += `<div class="dbtn" style="left:${isMe ? `calc(${x}% - 38px)` : dx+'%'};top:${isMe ? `calc(${y}% - 14px)` : dy+'%'}">D</div>`;
    }
  });
  $('seats').innerHTML = html;

  // 公共牌和底池
  const best = me && me.best ? me.best.cards : null;
  const done = h && h.street === 'done';
  $('board').innerHTML = h ? h.board.map(c => cardHTML(c, best && done ? (best.includes(c) ? 'hl' : 'dim') : '')).join('') : '';
  const live = h ? h.pot + v.players.reduce((s,p)=>s+p.bet,0) : 0;
  $('pot').hidden = !h || (!live && !done);
  if (h) $('pot').innerHTML = done ? `<small>本手</small>${fmt(h.results ? h.results.reduce((s,r)=>s+r.amount,0) : 0)}` : `<small>底池</small>${fmt(live)}`;
  let banner = '';
  if (done && h.results) {
    const by = new Map(); // 同一批赢家的主池/边池合成一行
    for (const r of h.results) { const k = r.winners.join(','); const o = by.get(k) || { w: r.winners, amt: 0, name: r.name }; o.amt += r.amount; by.set(k, o); }
    banner = [...by.values()].map(o => { const ws = o.w.map(s => (v.players.find(p=>p.seat===s)||{name:'?'}).name).join('、'); return `${esc(ws)} 赢 ${fmt(o.amt)}${o.name?' · '+o.name:''}${o.w.length>1?'（平分）':''}`; }).join('<br>');
  } else if (!v.started) banner = mode === 'host' ? '人到齐了就点下面「开始」' : '等房主开始…';
  else if (!h || (v.paused)) banner = v.paused ? '房主暂停了牌局' : (v.players.filter(p=>p.chips>0&&(p.connected||p.isBot)).length < 2 ? '至少要 2 个人才能开始' : '');
  $('banner').innerHTML = banner;

  // 我的手牌
  const mc = $('myCards'), mh = $('myHand');
  if (me && me.hole.length) {
    const [x, y] = me._xy;
    mc.style.left = `calc(${x}% + 30px)`; mc.style.top = `calc(${y}% - 6px)`;
    mc.innerHTML = me.hole.map(c => cardHTML(c, 'lg' + (best && done ? (best.includes(c) ? ' hl' : ' dim') : '') + (me.folded ? ' dim' : ''))).join('');
    const hn = me.best ? me.best.name : (v.me && v.me.handName);
    mh.textContent = me.folded ? '已弃牌' : (hn || '');
    mh.style.left = `calc(${x}% + 58px)`; mh.style.top = `calc(${y}% + 32px)`;
    mh.hidden = !mh.textContent;
  } else { mc.innerHTML = ''; mh.hidden = true; }

  renderPanel(me);
}

function renderPanel(me){
  const v = view, h = v.hand, L = v.me && v.me.legal;
  const panel = $('panel');
  if (!me) { panel.innerHTML = `<div class="wait">正在入座…</div>`; return; }
  if (mode === 'host' && !v.started) {
    panel.innerHTML = `<div class="wait">房间码 <b style="font-size:22px;letter-spacing:.3em;color:var(--ink)">${roomCode}</b>
      <div class="row"><button class="btn small ghost" id="pCopy">复制邀请</button><button class="btn small" id="pBot">加机器人</button><button class="btn small go" id="pStart">开始</button></div></div>`;
    $('pCopy').onclick = copyInvite; $('pBot').onclick = () => hostApi.addBot(); $('pStart').onclick = () => {
      if (v.players.filter(p=>p.chips>0).length < 2) return toast('至少要 2 个人，可以先加个机器人');
      hostApi.start();
    };
    return;
  }
  if (me.chips === 0 && !(me.inHand && h && h.street !== 'done')) {
    panel.innerHTML = `<div class="wait">筹码输光了<button class="btn go" id="pRebuy">补充 ${fmt(v.settings.startChips)} 筹码</button></div>`;
    $('pRebuy').onclick = () => sendRebuy(); return;
  }
  if (!L) {
    // 不是我的回合：显示预操作
    if (h && me.inHand && !me.folded && !me.allIn && h.street !== 'done') {
      const toCall = h.curBet - me.bet;
      panel.innerHTML = `<div class="wait">${waitText(v)}<div class="pre">
        <button data-p="cf" class="${preAct==='cf'?'on':''}">${toCall>0?'弃牌':'过牌/弃牌'}</button>
        <button data-p="ck" class="${preAct==='ck'?'on':''}">${toCall>0?'跟注 '+fmt(Math.min(toCall,me.chips)):'过牌'}</button></div></div>`;
      panel.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { preAct = preAct === b.dataset.p ? '' : b.dataset.p; preKey = h.curBet; renderPanel(me); });
    } else {
      preAct = '';
      panel.innerHTML = `<div class="wait">${waitText(v)}</div>`;
    }
    return;
  }
  // 预操作自动执行
  if (preAct) {
    const pa = preAct; preAct = '';
    if (pa === 'cf') { setTimeout(() => sendAct({ type: L.canCheck ? 'check' : 'fold' }), 150); panel.innerHTML = `<div class="wait">…</div>`; return; }
    if (pa === 'ck' && (L.canCheck || h.curBet === preKey)) { setTimeout(() => sendAct({ type: L.canCheck ? 'check' : 'call' }), 150); panel.innerHTML = `<div class="wait">…</div>`; return; }
  }
  const pot = h.pot + v.players.reduce((s,p)=>s+p.bet,0);
  const key = v.handNum + h.street + L.curBet + L.myBet;
  const sig = key + '|' + JSON.stringify(L) + '|' + pot;
  if (sig === panelSig && panel.querySelector('#aCall')) return; // 同一个决策点不重画，免得打断拖动
  panelSig = sig;
  if (key !== sliderKey) { sliderKey = key; sliderVal = L.minTo; }
  const potTo = f => Math.round(L.curBet + f * (pot + L.toCall));
  const opts = L.curBet > 0 && h.street === 'preflop' && L.curBet <= v.settings.bb
    ? [['2.5BB', Math.round(v.settings.bb*2.5)], ['3BB', v.settings.bb*3], ['4BB', v.settings.bb*4], ['1池', potTo(1)]]
    : L.curBet > 0 && L.toCall > 0
      ? [['×2', L.curBet*2], ['×2.5', Math.round(L.curBet*2.5)], ['×3', L.curBet*3], ['1池', potTo(1)]]
      : [['⅓池', potTo(1/3)], ['½池', potTo(.5)], ['¾池', potTo(.75)], ['1池', potTo(1)]];
  opts.push(['全押', L.maxTo]);
  const clamp = x => Math.max(L.minTo, Math.min(L.maxTo, x));
  const step = v.settings.sb;
  panel.innerHTML = `
    ${L.canRaise ? `<div class="sizes">${opts.map(([t,a]) => `<button data-a="${clamp(a)}" ${a < L.minTo && a !== L.maxTo ? 'disabled' : ''}>${t}</button>`).join('')}</div>
    <div class="slide"><input type="range" id="rng" min="${L.minTo}" max="${L.maxTo}" step="${step}" value="${sliderVal}" aria-label="加注金额"><span class="amt" id="amt">${fmt(sliderVal)}</span></div>` : ''}
    <div class="acts">
      <button class="fold" id="aFold">弃牌</button>
      <button class="call" id="aCall">${L.canCheck ? '过牌' : (L.toCall >= me.chips ? '全押' : '跟注')}<small>${L.canCheck ? '' : fmt(L.toCall)}</small></button>
      <button class="raise" id="aRaise" ${L.canRaise ? '' : 'disabled'}><span id="rLbl">${raiseLabel(L)}</span><small id="rAmt">${fmt(sliderVal)}</small></button>
    </div>`;
  const rng = $('rng');
  const setVal = x => { sliderVal = clamp(x); if (rng) rng.value = sliderVal; $('amt') && ($('amt').textContent = fmt(sliderVal)); $('rAmt').textContent = fmt(sliderVal); $('rLbl').textContent = raiseLabel(L);
    panel.querySelectorAll('[data-a]').forEach(b => b.classList.toggle('on', +b.dataset.a === sliderVal)); };
  if (rng) rng.oninput = () => { let x = +rng.value; if (x > L.maxTo - step) x = L.maxTo; setVal(x); };
  panel.querySelectorAll('[data-a]').forEach(b => b.onclick = () => setVal(+b.dataset.a));
  setVal(sliderVal);
  $('aFold').onclick = () => {
    if (L.canCheck) { if (!$('aFold').dataset.sure) { $('aFold').dataset.sure = 1; $('aFold').textContent = '确定弃牌？'; return; } }
    sendAct({ type: 'fold' });
  };
  $('aCall').onclick = () => sendAct({ type: L.canCheck ? 'check' : 'call' });
  $('aRaise').onclick = () => sendAct({ type: 'raise', to: sliderVal });
  function raiseLabel(L){ return sliderVal >= L.maxTo ? '全押' : (L.curBet === 0 ? '下注' : '加注到'); }
}
let preKey = 0, panelSig = '';
function waitText(v){
  const h = v.hand;
  if (!h) return v.paused ? '已暂停' : '等待下一手…';
  if (h.street === 'done') { const s = Math.ceil((v.nextIn - (performance.now() - viewAt)) / 1000); return v.paused ? '已暂停' : (s > 0 ? `下一手 ${s} 秒后开始` : '下一手马上开始'); }
  const p = v.players.find(x => x.seat === h.toAct);
  return p ? `等 ${esc(p.name)} 行动…` : '发牌中…';
}

// 倒计时圈
function tick(){
  requestAnimationFrame(tick);
  if (!view || !view.hand) return;
  const ring = $('ring');
  const h = view.hand;
  if (ring && h.deadlineIn) {
    const total = view.settings.turnTime * 1000;
    const left = h.deadlineIn - (performance.now() - viewAt);
    const p = Math.max(0, Math.min(1, left / total));
    ring.style.setProperty('--p', p.toFixed(3));
    ring.classList.toggle('low', left < 8000);
    if (view.me && view.me.legal && left < 8000 && left > 0 && !tick.buzzed) { tick.buzzed = true; try{ navigator.vibrate && navigator.vibrate(120); }catch(e){} }
  }
  if (!(view.me && view.me.legal)) tick.buzzed = false;
}
requestAnimationFrame(tick);
setInterval(() => { if (view && view.hand && view.hand.street === 'done' && !(view.me && view.me.legal)) renderPanel(view.players.find(p=>p.id===myId)); }, 1000);

  if (k !== lastTurnKey) { lastTurnKey = k; beep(); }
};
function beep(){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; o.type = 'sine'; g.gain.value = 0.0001;
    o.connect(g); g.connect(audio.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.12, audio.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.25);
    o.stop(audio.currentTime + 0.3);
  } catch(e){}
}
document.addEventListener('pointerdown', () => { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch(e){} }, { once: true });

function showBubble(seat, txt){ bubbles[seat] = { txt, until: Date.now() + 3000 }; render(); setTimeout(render, 3100); }

// ---------- 顶栏 ----------
function copyInvite(){
  const url = location.origin + location.pathname + '#' + roomCode;
  const txt = `来打德州！房间码 ${roomCode}\n${url}`;
  const done = () => toast('已复制，发给朋友吧');
  try { navigator.clipboard.writeText(txt).then(done, () => sheetCopy(txt)); } catch(e) { sheetCopy(txt); }
}
function sheetCopy(txt){
  openSheet(`<h3>长按复制下面的文字</h3><textarea class="inp" style="height:90px;font-size:16px" readonly>${esc(txt)}</textarea>`);
  const ta = document.querySelector('#sheet textarea'); ta.focus(); ta.select();
}
$('btnCode').onclick = () => { if (roomCode !== '单机') copyInvite(); };
$('btnExit').onclick = () => {
  openSheet(`<h3>离开牌桌？</h3><p class="note">${mode==='host' && roomCode!=='单机' ? '你是房主，你离开后整个房间都会断开。筹码会保存在这台设备上，之后可以「恢复上次的房间」。' : '你的座位会被移除。'}</p>
    <div class="row"><button class="btn ghost" id="sNo">再玩会</button><button class="btn" style="background:var(--stop)" id="sYes">离开</button></div>`);
  $('sNo').onclick = closeSheet;
  $('sYes').onclick = () => { if (clientLeave) clientLeave(); setTimeout(() => { try { history.replaceState(null,'',location.pathname + location.search); } catch(e){} location.reload(); }, 350); };
};
$('btnChat').onclick = () => {
  openSheet(`<h3>发个表情</h3><div class="emos">${EMOS.map(e=>`<button>${e}</button>`).join('')}</div><div class="phr">${PHRASES.map(e=>`<button>${e}</button>`).join('')}</div>`);
  document.querySelectorAll('#sheet .emos button, #sheet .phr button').forEach(b => b.onclick = () => { sendEmote(b.textContent); closeSheet(); });
};
$('btnMenu').onclick = () => {
  if (!view) return;
  const v = view, host = mode === 'host';
  const rows = v.players.slice().sort((a,b)=>a.seat-b.seat).map(p => `<div><span>${p.isBot?'🤖':AVATARS[p.avatar]} ${esc(p.name)} <em>${fmt(p.chips)}${p.rebuys?` · 补码${p.rebuys}次`:''}${!p.connected&&!p.isBot?' · 离线':''}</em></span>
    ${host && p.id !== 'host' ? `<button class="btn small ghost" data-kick="${p.id}">移出</button>` : ''}</div>`).join('');
  openSheet(`<h3>牌桌 · 盲注 ${v.settings.sb}/${v.settings.bb} · 每人 ${fmt(v.settings.startChips)} 起</h3>
    <div class="plist">${rows}</div>
    ${host ? `<div class="row"><button class="btn small" id="mBot">加机器人</button><button class="btn small" id="mPause">${v.paused?'继续':'暂停'}</button>${roomCode!=='单机'?`<button class="btn small" id="mLock">${hostApi.locked?'🔒 已锁房':'🔓 锁房'}</button><button class="btn small" id="mCopy">复制邀请</button>`:''}</div>` : ''}
    <h3>牌局记录</h3><div class="log" id="mLog">${v.log.map(esc).join('<br>')}</div>
    <p class="note">牌型从大到小：皇家同花顺 › 同花顺 › 四条 › 葫芦 › 同花 › 顺子 › 三条 › 两对 › 一对 › 高牌</p>
    <button class="btn ghost" id="mClose">关闭</button>`);
  const lg = $('mLog'); lg.scrollTop = lg.scrollHeight;
  $('mClose').onclick = closeSheet;
  if (host) {
    $('mBot').onclick = () => { hostApi.addBot(); closeSheet(); };
    $('mPause').onclick = () => { if (!v.started) hostApi.start(); else hostApi.togglePause(); closeSheet(); };
    if ($('mCopy')) $('mCopy').onclick = copyInvite;
    if ($('mLock')) $('mLock').onclick = () => { hostApi.locked = !hostApi.locked; toast(hostApi.locked ? '已锁房：新的人进不来，掉线的人还能回来' : '已解锁，新朋友可以加入了'); closeSheet(); };
    document.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => {
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = '确定？'; return; }
      hostApi.kick(b.dataset.kick); closeSheet();
    });
  }
};
function openSheet(inner){
  const s = $('sheet'); s.hidden = false; s.className = 'sheet-bg';
  s.innerHTML = `<div class="sheet">${inner}</div>`;
  s.onclick = e => { if (e.target === s) closeSheet(); };
}
function closeSheet(){ $('sheet').hidden = true; $('sheet').innerHTML = ''; }
window.addEventListener('resize', () => render());
window.addEventListener('beforeunload', e => { if (mode === 'host' && roomCode !== '单机' && view && view.players.length > 1) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
