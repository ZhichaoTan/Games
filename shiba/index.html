<title>Shiba Stack</title>
<script>/* Keeps the page at its normal size on phones. Shared by the hub, Hold'em and Mahjong (each build inlines it in <head>).
   iOS Safari ignores user-scalable=no, so a double tap or a pinch could zoom the page, and inside a game the table
   then wouldn't pinch back out. Double taps are covered by touch-action:manipulation on every element, pinches by
   cancelling Safari's gesture events. If the page still ends up zoomed (a text field, a system setting), pinching is
   allowed again until it's back to normal size and a small note says how to zoom out. */
(function () {
  var root = document.documentElement, vv = window.visualViewport;
  var st = document.createElement('style');
  st.textContent = '*,*::before,*::after{touch-action:manipulation}html.zoomed #game{touch-action:manipulation}' +
    '#zoomhint{position:fixed;left:0;top:0;z-index:2147483000;display:flex;justify-content:center;pointer-events:none;transform-origin:0 0;opacity:0;transition:opacity .25s}' +
    '#zoomhint.on{opacity:1}#zoomhint span{margin-top:calc(env(safe-area-inset-top,0px) + 10px);padding:9px 16px;border-radius:999px;background:rgba(12,14,13,.9);color:#f4efe4;' +
    'font:700 14px/1.2 -apple-system,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12);white-space:nowrap}';
  (document.head || root).appendChild(st);
  var zoomed = function () { return !!vv && vv.scale > 1.02; };
  // The note only shows for a real, visible zoom on a touch screen: a slightly-off scale that iOS can leave behind after the
  // keyboard or a rotation (Zhichao saw the note at normal size, 2026-11-13), a desktop trackpad pinch, or a focused text field don't count.
  var touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  var typing = function () { var a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
  var bigZoom = function () { return zoomed() && vv.scale > 1.12 && vv.width < innerWidth * 0.9 && touch && !typing(); };
  var block = function (e) { if (!zoomed() && e.cancelable) e.preventDefault(); };
  document.addEventListener('gesturestart', block, { passive: false });
  document.addEventListener('gesturechange', block, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if ((e.touches && e.touches.length > 1) || (e.scale && e.scale !== 1)) block(e);
  }, { passive: false });
  if (!vv) return;
  var hint = null, timer = 0;
  var place = function () {
    if (!hint) return;
    hint.style.width = innerWidth + 'px';
    hint.style.transform = 'translate(' + vv.offsetLeft + 'px,' + vv.offsetTop + 'px) scale(' + (1 / vv.scale) + ')';
  };
  var sync = function () {
    var z = zoomed();
    if (z !== root.classList.contains('zoomed')) root.classList.toggle('zoomed', z);
    clearTimeout(timer);
    if (z) {
      if (!hint) {
        hint = document.createElement('div'); hint.id = 'zoomhint'; hint.setAttribute('aria-hidden', 'true');
        hint.appendChild(document.createElement('span'));
        document.body.appendChild(hint);
      }
      hint.firstChild.textContent = /^zh/.test(root.lang) ? '双指捏合，缩回原来大小' : 'Pinch with two fingers to zoom back out';
      place();
      timer = setTimeout(function () { if (bigZoom()) { place(); hint.classList.add('on'); } }, 1500);
    } else if (hint) hint.classList.remove('on');
  };
  vv.addEventListener('resize', sync);
  vv.addEventListener('scroll', function () { if (zoomed()) place(); });
})();
</script>

:root{
  --bg0:#0d0716;--bg1:#1d1029;--bg2:#2e1a40;
  --ink:#fbf3ea;--ink2:#d6c6d8;--ink3:#9c89a6;--gold:#ffd76a;--gold2:#d3ac63;--coral:#ff8a73;--red:#e5492f;--teal:#5fd3c6;--mint:#9dffc6;--pink:#f59abf;--orange:#ffb35c;
  --panel:rgba(22,12,32,.92);--line:rgba(255,215,106,.22);--glass:rgba(255,255,255,.06);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --brush:"SBBrush","Kaiti SC","STKaiti","KaiTi",serif;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --c:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
html[lang=en] body{font-family:"Manrope",var(--ui)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
[hidden]{display:none!important}
.screen{position:fixed;inset:0}
svg.ic{width:20px;height:20px;flex:none}
#sprite{position:absolute;width:0;height:0;overflow:hidden}
.num{font-variant-numeric:tabular-nums}

/* ===== lobby ===== */
#lobby{overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(90% 46% at 80% 4%,rgba(255,214,170,.12),transparent 70%),radial-gradient(130% 75% at 50% 0%,#4b2c5f 0%,#2f1a41 42%,#180d25 78%,#0d0716 100%)}
#lobby::before,#room::before,#game::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--noise);opacity:.45;mix-blend-mode:overlay}
.lob{position:relative;max-width:440px;margin:0 auto;padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 28px)}
.lobtop{position:relative;z-index:2;display:flex;align-items:center;gap:8px;min-height:36px}
.lobtop .grow{flex:1;min-width:0}
.pillbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);font-size:13px;color:var(--ink2);white-space:nowrap}
.pillbtn:active{background:rgba(255,255,255,.1)}
.pillbtn.home{gap:4px;padding:0 13px 0 8px;color:var(--ink);text-decoration:none}
.pillbtn.home .ic{width:18px;height:18px;color:var(--gold)}
.pillbtn .ic{width:17px;height:17px}
.hero{position:relative;text-align:center;padding:10px 0 4px}
.scene{display:block;width:100%;max-width:360px;height:auto;margin:0 auto -4px;overflow:visible}
.scene .tw{animation:tw 3.2s ease-in-out infinite}
.scene .tw:nth-child(4n){animation-delay:-1.6s}
@keyframes tw{50%{opacity:.15}}
.scene .fall{animation:fall 3.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes fall{0%,100%{transform:translateY(-3px)}50%{transform:translateY(5px)}}
.scene .kk{animation:tw 2.4s ease-in-out infinite}
.scene .pup .tail,.pup .tail{transform-box:fill-box;transform-origin:10% 90%;animation:wag 1.1s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.scene .pup .head{transform-box:fill-box;transform-origin:50% 90%;animation:tilt 4.5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}45%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
.title{position:relative;display:inline-flex;align-items:center;gap:12px;margin-top:2px}
.title h1{margin:0;display:flex;flex-direction:column;align-items:center;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.title .w1{font-family:var(--brush);font-weight:400;font-size:62px;line-height:1.08;letter-spacing:4px;background:linear-gradient(180deg,#fffbe8 0%,#ffe6a3 48%,#d3ac63 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 2px 2px}
.title .w2{font:800 12px/1 "Manrope",var(--ui);letter-spacing:.6em;color:var(--gold);margin-top:6px;padding-left:.6em}
.seal{writing-mode:vertical-rl;font-family:var(--brush);font-size:21px;line-height:1;color:#fff4ea;background:linear-gradient(160deg,#e4573f,#a8301f);padding:8px 6px;border-radius:5px;box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,235,220,.35);transform:rotate(4deg);letter-spacing:3px}
html[lang=zh] .title .w2{display:none}
html[lang=en] .title .seal{display:none}
html[lang=en] .title .w1{font:italic 700 54px/1 "Fraunces",Georgia,serif;letter-spacing:-.015em;padding:0 6px 6px 0}
.tagline{margin:12px auto 0;color:var(--ink2);font-size:14px;line-height:1.65;max-width:320px;text-wrap:balance}
.box{position:relative;margin-top:16px;padding:16px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.me-row{display:flex;gap:14px;align-items:center}
.me-av{width:62px;height:62px;border-radius:50%;flex:none;box-shadow:0 0 0 2.5px var(--gold),0 6px 16px rgba(0,0,0,.4)}
.me-av svg{width:100%;height:100%;display:block}
.fld{flex:1;min-width:0}
.lbl{display:block;font-size:12px;color:var(--ink3);letter-spacing:1px;margin:0 0 6px 2px}
.inp{width:100%;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.28);color:var(--ink);padding:0 14px;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:rgba(255,215,106,.6)}
.avs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
.avs button{min-width:0;aspect-ratio:1;border-radius:50%;overflow:hidden;opacity:.72;transition:transform .15s,opacity .15s}
.avs button svg{width:100%;height:100%;display:block}
.avs button.on{opacity:1;box-shadow:0 0 0 2.5px var(--gold);transform:scale(1.06)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{position:relative;z-index:1;height:38px;border-radius:11px;font-size:15px;font-weight:700;color:var(--ink2);transition:color .2s}
.tabs button.on{color:#2a1e05}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:11px;background:linear-gradient(180deg,#ffe49a,#d9a94a);box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;font-size:16px;font-weight:800;width:100%;transition:transform .1s,filter .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#ffe7a6,#d9a94a);color:#2a1e05;box-shadow:0 6px 18px rgba(217,169,74,.3),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.red{background:linear-gradient(180deg,#f06a4f,#bb3a24);color:#fff;box-shadow:0 6px 18px rgba(187,58,36,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);color:var(--ink)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 16px}
.btn[disabled]{filter:grayscale(.8) brightness(.7);pointer-events:none}
.code-row{display:flex;gap:10px}
.code-row .inp{flex:1;text-align:center;font-size:22px;letter-spacing:10px;font-weight:800;text-transform:uppercase;height:50px}
.code-row .btn{width:110px}
.pane{display:flex;flex-direction:column;gap:12px}
.opts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center;font-size:14px;color:var(--ink2)}
.opts>span{white-space:nowrap}
.opts:empty{display:none}
.opts .seg{flex-wrap:nowrap}
.opts .seg button{flex:1 1 auto;min-width:0;padding:0 6px;white-space:nowrap}
html[lang=en] .opts{grid-template-columns:minmax(0,1fr);gap:6px}
html[lang=en] .opts>span:not(:first-child){margin-top:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:44px;height:32px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);font-size:13px;color:var(--ink2)}
.seg button.on{background:rgba(255,215,106,.16);border-color:rgba(255,215,106,.7);color:var(--gold)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:92px;padding:12px 12px 10px;border-radius:16px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.08);text-align:left;overflow:hidden;transition:border-color .2s,background .2s,transform .1s}
.mode:active{transform:scale(.98)}
.mode svg{position:absolute;right:8px;top:9px;width:50px;height:40px;overflow:visible;opacity:.95}
.mode b{margin-top:auto;font-size:16px;font-weight:800;color:var(--ink)}
.mode small{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mode.on{border-color:rgba(255,215,106,.8);background:linear-gradient(180deg,rgba(255,215,106,.16),rgba(255,215,106,.05))}
.mode.on small{color:var(--gold2)}
.mtip{font-size:13px;color:var(--ink2);line-height:1.5;text-align:center;min-height:20px}
.more{font-size:13px;color:var(--ink3);text-align:center;padding:4px;display:flex;justify-content:center;gap:6px;align-items:center}
.err{color:#ffab9c;font-size:13px;min-height:18px;text-align:center;margin-top:8px}
.resume{display:flex;align-items:center;gap:10px}
.resume+.resume{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.resume .tx{flex:1;font-size:14px;color:var(--ink2);line-height:1.5}
.resume .tx b{color:var(--ink);font-size:15px}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--ink3);line-height:1.7;text-wrap:balance}
.wx{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(229,73,47,.16);border:1px solid rgba(229,73,47,.35);font-size:13px;color:#ffd5cc;line-height:1.5}

/* ===== waiting room ===== */
#room{overflow-y:auto;background:radial-gradient(130% 75% at 50% 0%,#4b2c5f 0%,#2f1a41 42%,#180d25 78%,#0d0716 100%)}
.room{position:relative;max-width:460px;margin:0 auto;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 24px)}
.rhead{display:flex;align-items:center;gap:10px;height:40px}
.rhead .grow{flex:1}
.codebig{margin:14px 0 4px;text-align:center}
.codebig .l{font-size:13px;color:var(--ink3);letter-spacing:2px}
.codebig .c{font-size:54px;font-weight:800;letter-spacing:12px;color:var(--gold);margin:4px 0 0 12px;font-variant-numeric:tabular-nums;font-family:"Manrope",var(--ui)}
.share{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
.seats4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rs{position:relative;padding:14px 10px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-align:center;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.rs .av{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 2.5px var(--pc,transparent)}
.rs .av svg{width:100%;height:100%;display:block}
.rs .nm{font-size:15px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs .sub{font-size:12px;color:var(--ink3)}
.rs.empty{border-style:dashed;color:var(--ink3)}
.rs .x{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.rs .x svg{width:16px;height:16px}
.rs .tag{position:absolute;left:8px;top:8px;font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(255,215,106,.18);color:var(--gold)}
.rs .tag.me{left:auto;right:8px;background:rgba(255,255,255,.12);color:var(--ink)}
.rs .wn{position:absolute;left:8px;bottom:9px;font-size:11px;color:var(--gold2)}
.rules-sum{margin-top:14px;font-size:13px;color:var(--ink2);line-height:1.8;text-align:center}
.ractions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.lvb{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,215,106,.14);color:var(--gold);border:1px solid rgba(255,215,106,.35)}

/* ===== the game ===== */
#game{display:flex;flex-direction:column;background:radial-gradient(70% 40% at 50% 0%,rgba(255,200,170,.07),transparent 70%),radial-gradient(120% 85% at 50% 40%,#2f1b42 0%,#1e1029 52%,#0e0716 100%);overflow:hidden;touch-action:none}
.topbar{flex:none;position:relative;height:calc(var(--sat) + 46px);padding:var(--sat) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;z-index:30}
.tb-btn{flex:none;width:36px;height:36px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative}
.tb-btn svg{width:19px;height:19px}
.tb-info{flex:1;min-width:0;display:flex;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.chip{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:99px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07);min-width:0}
.chip b{color:var(--ink);font-weight:800}
.chip svg{width:15px;height:15px;flex:none;color:var(--gold)}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.aim{cursor:pointer}
.chip.aim.on{border-color:rgba(255,215,106,.6);background:rgba(255,215,106,.12);color:var(--gold)}
.netdot{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:#46d18d;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.netdot.bad{background:#ff6b5b}

/* opponents' wells */
.opps{flex:none;position:relative;z-index:20;display:flex;justify-content:center;gap:6px;padding:0 calc(var(--sar) + 8px) 6px calc(var(--sal) + 8px)}
.opps:empty{display:none}
.opp{position:relative;flex:1 1 0;min-width:0;max-width:max(200px,calc(var(--om,60px) + 104px));display:flex;gap:7px;align-items:stretch;padding:5px 6px 5px 5px;border-radius:14px;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.07);transition:border-color .2s,background .2s,opacity .3s}
.opp canvas{display:block;flex:none;border-radius:5px}
.opp .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:1px}
.opp .who{display:flex;align-items:center;gap:5px;min-width:0}
.opp .av{position:absolute;right:6px;bottom:6px;flex:none;width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px var(--pc)}
.opp .av svg{width:100%;height:100%;display:block;border-radius:50%}
.opp .nm{min-width:0;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .st{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.opp .st b{color:var(--ink2);font-weight:800}
.opp .tg{position:absolute;right:-4px;top:-7px;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;background:linear-gradient(180deg,#ffe7a6,#d9a94a);color:#2a1e05;line-height:1.5;display:none;align-items:center;gap:2px}
.opp .tg svg{width:11px;height:11px}
.opp.aim{border-color:rgba(255,215,106,.85);background:rgba(255,215,106,.1);box-shadow:0 0 0 1px rgba(255,215,106,.25)}
.opp.aim .tg{display:flex}
.opp.watch{border-color:rgba(157,255,198,.7)}
.opp.out{opacity:.55}
.opp.out canvas{filter:grayscale(.9) brightness(.7)}
.opp .pl{position:absolute;left:5px;top:5px;display:none;align-items:center;justify-content:center;font:800 12px/1 "Manrope",var(--ui);color:#fff;background:rgba(14,7,22,.78);border-radius:5px}
.opp.out .pl{display:flex}
.opp.hit{animation:hit .45s ease}
@keyframes hit{20%{transform:translateY(2px) scale(.98)}50%{transform:translateY(-1px)}}
.opp .bub{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);z-index:40;max-width:160px;padding:6px 10px;border-radius:12px;background:#fbf6ea;color:#2a1c2a;font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:bub 3s ease forwards;pointer-events:none}
.opp .bub.emo{font-size:26px;background:none;box-shadow:none;padding:0}
.opp .bub::before{content:"";position:absolute;left:50%;top:-5px;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom-color:#fbf6ea}
.opp .bub.emo::before{display:none}
@keyframes bub{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}10%{opacity:1;transform:translate(-50%,4px) scale(1)}85%{opacity:1}100%{opacity:0}}

.stage{position:relative;flex:1;min-height:0;z-index:10}
.play{position:absolute;left:50%;top:0;display:flex;gap:calc(var(--c) * .5);transform:translateX(-50%);--sw:calc(var(--c) * 2.75)}
.play.narrow{gap:calc(var(--c) * .36);padding-left:calc(var(--c) * .5);--sw:calc(var(--c) * 2.1)}
.play.narrow .side.l{display:none}
.side{flex:none;width:var(--sw);display:flex;flex-direction:column;gap:calc(var(--c) * .4);padding-top:calc(var(--c) * 1.5)}
.play.narrow .side{gap:calc(var(--c) * .3)}
.box2{position:relative;border-radius:calc(var(--c) * .45);background:rgba(10,5,18,.55);border:1px solid rgba(255,230,200,.12);padding:calc(var(--c) * .2) 0 calc(var(--c) * .25)}
.box2 .cap{font-size:max(10px,calc(var(--c) * .44));font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:center;line-height:1.3}
html[lang=zh] .box2 .cap{letter-spacing:.2em}
.box2 canvas{display:block;margin:0 auto}
#holdBox{cursor:pointer}
#holdBox.used canvas{opacity:.35}
.stats{display:flex;flex-direction:column;gap:calc(var(--c) * .3);padding:0 2px}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat span{font-size:max(10px,calc(var(--c) * .42));font-weight:700;color:var(--ink3);letter-spacing:.04em;white-space:nowrap}
.stat b{font:800 max(13px,calc(var(--c) * .68))/1.15 "Manrope",var(--ui);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.play.narrow .stat b{font-size:max(13px,calc(var(--c) * .52))}
.play.narrow .stat span{font-size:max(10px,calc(var(--c) * .36))}
.play.narrow .box2 .cap{font-size:max(10px,calc(var(--c) * .36))}
.stat b.gold{color:var(--gold)}
.stat b small{font-size:.7em;color:var(--ink2)}
.pup{position:relative;width:var(--sw);height:var(--sw);margin-top:auto;cursor:pointer}
.pup svg{width:100%;height:100%;display:block;overflow:visible}
.pup .shiba .head{transform-box:fill-box;transform-origin:50% 92%;transition:transform .25s}
.pup [data-mood=happy] .head,.pup [data-mood=wow] .head,.pup [data-mood=love] .head{animation:hop .5s ease 2}
@keyframes hop{50%{transform:translateY(-5px) rotate(-3deg)}}
.pup [data-mood=shock] .head{animation:shake .35s ease 2}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.pup [data-mood=worry] .head{animation:none;transform:rotate(-5deg)}
.pup [data-mood=ko] .head{transform:rotate(12deg) translateY(3px)}
.pup [data-mood=sleep] .head{transform:rotate(-8deg) translateY(4px)}
.pup [data-mood=sleep] .tail,.pup [data-mood=ko] .tail{animation:none}
.pup [data-mood=sleep] .z1{animation:zz 2.4s ease-in-out infinite}
.pup [data-mood=sleep] .z2{animation:zz 2.4s ease-in-out -1.2s infinite}
@keyframes zz{0%,100%{opacity:.2;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2px)}}
.pup [data-mood=love] .hrt{transform-box:fill-box;transform-origin:50% 50%;animation:beat .7s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.2)}}
.pup .k1,.pup .k2,.pup .k3{animation:tw 1.4s ease-in-out infinite}
.pup .k2{animation-delay:-.5s}.pup .k3{animation-delay:-.9s}

.wellbox{position:relative;flex:none;width:calc(var(--c) * 10);height:calc(var(--c) * 21.5)}
.wellbox canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.wellbox .frame{position:absolute;left:-3px;right:-3px;top:calc(var(--c) * 1.5 - 3px);bottom:-3px;border-radius:calc(var(--c) * .4);border:1.5px solid rgba(255,228,196,.2);box-shadow:0 0 0 1px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.45),inset 0 0 calc(var(--c) * 1.2) rgba(0,0,0,.25);pointer-events:none;transition:border-color .4s,box-shadow .4s}
.wellbox.danger .frame{border-color:rgba(255,110,96,.75);animation:danger 1.1s ease-in-out infinite}
@keyframes danger{50%{box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 26px rgba(255,90,80,.45),inset 0 0 calc(var(--c) * 1.2) rgba(255,60,60,.12)}}
.wellbox.shake{animation:wshake .18s ease}
@keyframes wshake{40%{transform:translateY(calc(var(--c) * .12))}}
.wellbox.jolt{animation:jolt .32s ease}
@keyframes jolt{20%{transform:translateY(calc(var(--c) * -.3))}60%{transform:translateY(calc(var(--c) * .08))}}
.meter{position:absolute;left:calc(var(--c) * -.42);bottom:0;width:calc(var(--c) * .22);height:calc(var(--c) * 20);border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column-reverse}
.meter i{flex:none;display:block;width:100%;background:linear-gradient(180deg,#ffd27a,#ffa043);border-top:1px solid rgba(20,8,20,.6);transition:height .25s}
.meter i.rdy{background:linear-gradient(180deg,#ff8a7a,#ff4f4f);animation:rdy .5s ease-in-out infinite}
@keyframes rdy{50%{filter:brightness(1.35)}}
.pops{position:absolute;left:-30%;right:-30%;top:32%;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:5}
.pop{font-family:var(--brush);font-size:calc(var(--c) * 1.45);line-height:1.05;color:#fff6dc;text-shadow:0 0 14px rgba(255,200,120,.55),0 3px 8px rgba(0,0,0,.7);white-space:nowrap;animation:pop 1.25s cubic-bezier(.2,.9,.3,1) forwards}
.pop.big{font-size:calc(var(--c) * 1.9);color:#ffe9a8}
.pop.tw{color:#ffd9ec;text-shadow:0 0 14px rgba(245,154,191,.8),0 3px 8px rgba(0,0,0,.7)}
.pop.pc{color:#d9fff0;text-shadow:0 0 18px rgba(157,255,198,.8),0 3px 8px rgba(0,0,0,.7);font-size:calc(var(--c) * 2)}
.pop.sm{font:800 calc(var(--c) * .62)/1.2 "Manrope",var(--ui);color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.8);letter-spacing:.04em}
html[lang=en] .pop{font:italic 700 calc(var(--c) * 1.15)/1.1 "Fraunces",Georgia,serif}
html[lang=en] .pop.big,html[lang=en] .pop.pc{font-size:calc(var(--c) * 1.5)}
html[lang=en] .pop.sm{font:800 calc(var(--c) * .6)/1.2 "Manrope",var(--ui)}
@keyframes pop{0%{opacity:0;transform:scale(.6) translateY(10px)}14%{opacity:1;transform:scale(1.08)}24%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--c) * -1.4))}}
.wmsg{position:absolute;left:0;right:0;top:calc(var(--c) * 1.5);bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;z-index:6;padding:0 8px}
.wmsg:empty{display:none}
.wmsg.dim{background:rgba(12,6,20,.62);border-radius:calc(var(--c) * .4);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.wmsg .h{font-family:var(--brush);font-size:calc(var(--c) * 1.7);line-height:1.1;color:#fff4d4;text-shadow:0 0 16px rgba(255,215,106,.5),0 3px 10px rgba(0,0,0,.7)}
html[lang=en] .wmsg .h{font:italic 700 calc(var(--c) * 1.35)/1.15 "Fraunces",Georgia,serif}
.wmsg .s{font-size:max(12px,calc(var(--c) * .56));font-weight:700;color:var(--ink2);line-height:1.5;max-width:100%}
.wmsg .n{white-space:nowrap;font:800 calc(var(--c) * 3.4)/1 "Manrope",var(--ui);color:#fff6dc;text-shadow:0 0 22px rgba(255,215,106,.6),0 4px 12px rgba(0,0,0,.6);animation:cnt .9s ease forwards}
.wmsg .n.go{font-size:calc(var(--c) * 2.3)}
@keyframes cnt{0%{opacity:0;transform:scale(1.8)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.8)}}
.wmsg .btn{width:auto;padding:0 22px;height:44px;font-size:15px;margin-top:6px}
.ktip{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--ink3);pointer-events:none;letter-spacing:.02em}
.hint{position:absolute;left:50%;top:calc(var(--c) * 3.6);transform:translateX(-50%);z-index:8;width:max-content;max-width:calc(100% - 16px);padding:7px 14px;border-radius:16px;background:rgba(14,7,22,.88);border:1px solid var(--line);font-size:12.5px;line-height:1.45;text-align:center;color:var(--ink2);pointer-events:none;animation:hint 6s ease forwards}
@keyframes hint{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
.orb{position:fixed;left:0;top:0;z-index:50;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd76a 45%,#ff8a3d);box-shadow:0 0 14px 4px rgba(255,190,90,.65);pointer-events:none;transition:transform .5s cubic-bezier(.4,0,.6,1),opacity .2s}

/* touch buttons */
.pad{flex:none;position:relative;z-index:25;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:6px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px)}
.pad .cl{display:grid;gap:8px}
.pad .cl.l{grid-template-columns:repeat(3,var(--pb));grid-template-areas:". hold ." "left down right"}
.pad .cl.r{grid-template-columns:repeat(2,var(--pb));grid-template-areas:". ccw" "drop cw"}
.pad{--pb:56px}
.pad button{width:var(--pb);height:var(--pb);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.12);box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:var(--ink);touch-action:none;transition:transform .06s,background .1s}
.pad button svg{width:26px;height:26px}
.pad button.dn{transform:scale(.93);background:rgba(255,215,106,.22);border-color:rgba(255,215,106,.6)}
.pad [data-k=hold]{grid-area:hold;height:calc(var(--pb) * .72);align-self:end;color:var(--ink2)}
.pad [data-k=ccw]{grid-area:ccw;height:calc(var(--pb) * .72);align-self:end;color:var(--ink2)}
.pad [data-k=left]{grid-area:left}.pad [data-k=down]{grid-area:down}.pad [data-k=right]{grid-area:right}
.pad [data-k=drop]{grid-area:drop;background:linear-gradient(180deg,rgba(255,215,106,.3),rgba(255,215,106,.12));border-color:rgba(255,215,106,.45);color:var(--gold)}
.pad [data-k=cw]{grid-area:cw}
.pad .lab{font-size:10px;font-weight:800;margin-left:3px;letter-spacing:.04em}

/* ===== sheets, overlay, toast ===== */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;background:linear-gradient(180deg,#33203f,#180c22);border-top:1px solid var(--line);padding:18px 16px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 12px;font-family:var(--brush);font-weight:400;font-size:27px;color:var(--gold);display:flex;align-items:center;gap:10px}
html[lang=en] .sheet h3{font:italic 700 24px/1.2 "Fraunces",Georgia,serif}
.sheet h3 .grow{flex:1}
.sheet .x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.sheet .x svg{width:18px;height:18px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.mrow .grow{flex:1;min-width:0}
.mrow .av{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--pc,transparent)}
.mrow .av svg{width:100%;height:100%;display:block}
.mrow .btn.sm{height:32px;padding:0 12px;font-size:13px}
.mrow small{color:var(--ink3)}
.mrow .seg button{height:30px}
.mhd{margin:14px 2px 2px;font-size:12px;color:var(--ink3);letter-spacing:1px}
.mnote{font-size:12.5px;color:var(--ink3);line-height:1.5;padding:2px 2px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mgrid.one{grid-template-columns:1fr}
.tog{flex:none;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:background .2s}
.tog i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#e9e4d6;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tog.on{background:linear-gradient(180deg,#ffe49a,#d9a94a)}.tog.on i{transform:translateX(18px);background:#fff}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phr button{padding:10px 8px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13.5px;text-align:left;line-height:1.35}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.emos button{font-size:28px;height:46px;border-radius:12px;background:rgba(255,255,255,.06)}
.chatrow{margin-top:12px}
.chatrow .inp{text-align:left;letter-spacing:0;font-size:16px;font-weight:500;text-transform:none}
.rules-txt{font-size:14px;color:var(--ink2);line-height:1.7}
.rules-txt h4{margin:16px 0 6px;color:var(--ink);font-size:15px}
.rules-txt p{margin:0 0 6px}
.rules-txt .pics{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:8px 0 6px;flex-wrap:wrap}
.rules-txt .pics svg{height:46px;width:auto;overflow:visible}
.rules-txt .pics div{text-align:center;font-size:12px;color:var(--ink3)}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 56px);transform:translateX(-50%);z-index:90;padding:9px 16px;border-radius:20px;line-height:1.4;background:rgba(18,9,26,.95);border:1px solid var(--line);font-size:14px;color:var(--ink);box-shadow:0 8px 20px rgba(0,0,0,.4);animation:tIn .25s ease;max-width:calc(100vw - 32px);text-align:center}
@keyframes tIn{0%{opacity:0;transform:translate(-50%,-8px)}100%{opacity:1;transform:translate(-50%,0)}}
#overlay{position:fixed;inset:0;z-index:80;background:rgba(8,4,14,.72);display:flex;align-items:center;justify-content:center;padding:24px}
#overlay .card{max-width:320px;text-align:center;padding:22px 20px;border-radius:20px;background:#2a1936;border:1px solid var(--line);font-size:14px;color:var(--ink2);line-height:1.6}
#overlay .card b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
.ovb{display:flex;gap:10px;justify-content:center;margin-top:14px}
.ovb .btn{flex:1;max-width:140px}
.spin{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:3px solid rgba(255,215,106,.25);border-top-color:var(--gold);animation:sp .9s linear infinite}
.spin.sm{width:16px;height:16px;border-width:2px;margin:0 6px 0 0;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* results */
.res-head{text-align:center;margin:2px 0 12px}
.res-head .pupr{width:96px;height:96px;margin:-4px auto -2px}
.res-head .pupr svg{width:100%;height:100%;display:block;overflow:visible}
.res-head .t1{font-family:var(--brush);font-size:38px;color:var(--gold);line-height:1.15}
html[lang=en] .res-head .t1{font:italic 700 30px/1.2 "Fraunces",Georgia,serif}
.res-head .t2{font-size:15px;font-weight:800;color:var(--ink);margin-top:4px}
.res-head .t3{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:linear-gradient(180deg,#ffe7a6,#d9a94a);color:#2a1e05}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.rgrid div{padding:10px 6px;border-radius:14px;background:rgba(255,255,255,.05);text-align:center}
.rgrid span{display:block;font-size:11.5px;color:var(--ink3)}
.rgrid b{display:block;font:800 19px/1.2 "Manrope",var(--ui);color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.rgrid div.hi b{color:var(--gold)}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
.rrow.win{background:linear-gradient(90deg,rgba(255,215,106,.14),transparent);border-radius:12px}
.rrow .rk{width:20px;font:800 15px/1 "Manrope",var(--ui);color:var(--ink3);text-align:center}
.rrow.win .rk{color:var(--gold)}
.rrow .av{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--pc)}
.rrow .av svg{width:100%;height:100%;display:block}
.rrow .bd{flex:1;min-width:0}
.rrow .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm small{font-weight:700;color:var(--ink3);font-size:11px;margin-left:4px}
.rrow .dt{font-size:12px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.rrow .w{text-align:right;flex:none}
.rrow .w b{display:block;font:800 20px/1.1 "Manrope",var(--ui);color:var(--gold);font-variant-numeric:tabular-nums}
.rrow .w small{font-size:11px;color:var(--ink3)}
.resfoot{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.resfoot .row2{display:flex;gap:10px}
.peekbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 24px);z-index:58;width:auto!important;padding:0 20px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* wide screens */
@media (min-width:980px) and (min-height:560px){
  .lob{max-width:1080px;display:grid;grid-template-columns:minmax(0,1fr) 440px;column-gap:72px;align-items:start;padding-top:28px}
  .lob>.lobtop{grid-column:1/-1}
  .lob>.hero{grid-column:1;grid-row:2/span 6;position:sticky;top:10vh;padding:5vh 0 0}
  .lob>:not(.lobtop):not(.hero){grid-column:2}
  .lob>.box:first-of-type,.lob>#wxTip+.box{margin-top:28px}
  .hero .scene{max-width:520px}
  .hero .title .w1{font-size:88px}
  html[lang=en] .hero .title .w1{font-size:76px}
  .hero .seal{font-size:28px;padding:10px 7px}
  .hero .tagline{font-size:17px;max-width:440px;margin-top:18px}
}
#game.wide .opps{position:absolute;z-index:20;padding:0;display:grid;gap:12px;align-content:start}
#game.wide .opp{max-width:none;flex-direction:column;gap:7px;padding:8px}
#game.wide .opp .inf{gap:3px;padding:0 1px}
#game.wide .opp .st{flex-direction:row;gap:10px}
#game.wide .opp .nm{font-size:13px}
#game.wide .opp .av{position:static;width:22px;height:22px}
@media (prefers-reduced-motion:reduce){
  .scene .tw,.scene .fall,.scene .kk,.pup .tail,.scene .pup .head,.blink,.wellbox.danger .frame{animation:none}
}
</style>
</head>
<body>
<div id="sprite"></div>

<!-- ============ lobby ============ -->
<section id="lobby" class="screen">
  <div class="lob">
    <div class="lobtop">
      <a class="pillbtn home" href="../"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg><span data-t="allGames"></span></a>
      <div class="grow"></div>
      <button class="pillbtn" id="btnRules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rule"/></svg><span data-t="rules"></span></button>
      <button class="pillbtn" id="btnLang"><svg class="ic" viewBox="0 0 24 24"><use href="#i-globe"/></svg><span></span></button>
    </div>
    <div class="hero">
      <div id="scene"></div>
      <div class="title"><h1><span class="w1" data-t="titleA"></span><span class="w2" data-t="titleB"></span></h1><span class="seal" data-t="titleB"></span></div>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <div id="wxTip" class="wx" hidden data-t="wx"></div>
    <div class="box" id="resumeBox" hidden></div>
    <div class="box">
      <div class="me-row">
        <div class="me-av" id="meAv"></div>
        <div class="fld"><label class="lbl" for="nick" data-t="yourName"></label><input id="nick" class="inp" maxlength="10" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="avs" id="avs"></div>
    </div>
    <div class="box">
      <div class="tabs" id="tabs"><span class="pill"></span><button data-tab="join" data-t="tabJoin"></button><button data-tab="host" data-t="tabHost"></button><button data-tab="solo" data-t="tabSolo"></button></div>
      <div id="paneJoin" class="pane">
        <div class="code-row"><input id="joinCode" class="inp" maxlength="4" placeholder="····" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn gold" id="btnJoin" data-t="join"></button></div>
        <div class="more" data-t="joinHint"></div>
      </div>
      <div id="paneHost" class="pane" hidden>
        <div class="opts" id="optsHost"></div>
        <button class="btn gold" id="btnCreate" data-t="create"></button>
      </div>
      <div id="paneSolo" class="pane" hidden>
        <div class="modes" id="modes"></div>
        <div class="mtip" id="modeTip"></div>
        <div class="opts" id="optsSolo"></div>
        <button class="btn gold" id="btnSolo" data-t="startSolo"></button>
      </div>
      <div class="err" id="lobErr"></div>
    </div>
    <div class="foot" data-t="foot"></div>
  </div>
</section>

<!-- ============ waiting room ============ -->
<section id="room" class="screen" hidden>
  <div class="room">
    <div class="rhead">
      <button class="tb-btn" id="roomBack" aria-label="back"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <div class="grow"></div>
      <button class="pillbtn" id="roomRules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rule"/></svg><span data-t="rules"></span></button>
    </div>
    <div class="codebig"><div class="l" data-t="roomCode"></div><div class="c" id="roomCode">····</div></div>
    <div class="share"><button class="btn glass sm" id="btnCopy"><svg class="ic" viewBox="0 0 24 24"><use href="#i-copy"/></svg><span data-t="copyInvite"></span></button><button class="btn glass sm" id="btnShare"><svg class="ic" viewBox="0 0 24 24"><use href="#i-share"/></svg><span data-t="share"></span></button></div>
    <div class="seats4" id="seats4"></div>
    <div class="rules-sum" data-t="roomSum"></div>
    <div class="ractions" id="roomActs"></div>
  </div>
</section>

<!-- ============ the game ============ -->
<section id="game" class="screen" hidden>
  <div class="topbar">
    <button class="tb-btn" id="btnMenu" aria-label="menu"><svg viewBox="0 0 24 24"><use href="#i-menu"/></svg><span class="netdot" id="netDot" hidden></span></button>
    <div class="tb-info" id="tbInfo"></div>
    <button class="tb-btn" id="btnChat" aria-label="chat"><svg viewBox="0 0 24 24"><use href="#i-chat"/></svg></button>
    <button class="tb-btn" id="btnSound" aria-label="sound"></button>
  </div>
  <div class="opps" id="opps"></div>
  <div class="stage" id="stage">
    <div class="play" id="play">
      <div class="side l">
        <div class="box2" id="holdBox"><div class="cap" data-t="hold"></div><canvas id="cvHold"></canvas></div>
        <div class="stats" id="stats"></div>
        <div class="pup" id="pup"></div>
      </div>
      <div class="wellbox" id="wellbox">
        <canvas id="cvWell"></canvas>
        <div class="frame"></div>
        <div class="meter" id="meter"></div>
        <div class="pops" id="pops"></div>
        <div class="wmsg" id="wmsg"></div>
      </div>
      <div class="side r">
        <div class="box2" id="nextBox"><div class="cap" data-t="next"></div><canvas id="cvNext"></canvas></div>
      </div>
    </div>
    <div class="ktip" id="ktip" hidden></div>
  </div>
  <div class="pad" id="pad" hidden>
    <div class="cl l">
      <button data-k="hold" aria-label="hold"><svg viewBox="0 0 24 24"><use href="#i-hold"/></svg></button>
      <button data-k="left" aria-label="left"><svg viewBox="0 0 24 24"><use href="#i-left"/></svg></button>
      <button data-k="down" aria-label="down"><svg viewBox="0 0 24 24"><use href="#i-down"/></svg></button>
      <button data-k="right" aria-label="right"><svg viewBox="0 0 24 24"><use href="#i-right"/></svg></button>
    </div>
    <div class="cl r">
      <button data-k="ccw" aria-label="turn back"><svg viewBox="0 0 24 24"><use href="#i-ccw"/></svg></button>
      <button data-k="drop" aria-label="drop"><svg viewBox="0 0 24 24"><use href="#i-drop"/></svg></button>
      <button data-k="cw" aria-label="turn"><svg viewBox="0 0 24 24"><use href="#i-cw"/></svg></button>
    </div>
  </div>
</section>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet"></div>
<div id="toast" hidden></div>
<div id="overlay" hidden><div class="card" id="ovCard"></div></div>

// ===== drawing: the well (canvas), hold and next, the opponents' small wells, the layout =====
const { W: COLS, H: ROWS, TOP, FACE, BUB, CELLS, SHAPES } = SB;
const HEAD = 1.5;   // rows of headroom drawn above the well, where new blocks appear
const R = { c: 24, dpr: 1, wide: false, narrow: false, m: 4 };
let DPR = Math.min(3, Math.max(1, Math.round(W.devicePixelRatio || 1)));
function sizeCanvas(cv, w, h) {
  const pw = Math.round(w * DPR), ph = Math.round(h * DPR);

  cv.style.width = w + 'px'; cv.style.height = h + 'px';

}
const offscreen = (w, h) => (typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(w, h) : Object.assign(document.createElement('canvas'), { width: w, height: h }));
// a cell with a face, cached per colour, size and face
const faceCache = new Map();
function faceCell(t, px, f) {
  const key = t + ':' + px + ':' + f;
  let cv = faceCache.get(key);
  if (cv) return cv;
  if (faceCache.size > 160) faceCache.clear();
  cv = offscreen(px, px);
  const x = cv.getContext('2d');
  x.drawImage(A.cellImg(t, px), 0, 0);
  A.face(x, 0, 0, px, f, 0);
  faceCache.set(key, cv);
  return cv;
}
// draw one cell value v (colour + face flag) at canvas pixel (px, py), size s
function putCell(x, v, px, py, s, f) {
  const t = v & 15; if (!t) return;
  if ((v & FACE) && s >= 9) x.drawImage(faceCell(t, s, f || 'sleep'), px, py);
  else x.drawImage(A.cellImg(t, s), px, py);
}

// ---------- the main well ----------
const WELL = { cv: $('cvWell'), x: null, st: null, stx: null, key: '', fx: [], flash: [], trail: [] };
// src: { cell(x, y) -> value for rows TOP-2..ROWS-1, cur: {t,x,y,r} or null, ghost: y or null, clr: Set of rows clearing, clrT: 0..1, danger, key }
function drawWell(src, tnow) {
  const c = R.c, s = Math.round(c * DPR), x = WELL.x; if (!x) return;
  const cw = WELL.cv.width, ch = WELL.cv.height, y0 = Math.round(HEAD * c * DPR);
  const rowY = y => y0 + (y - TOP) * s;
  // the still part (grid and resting blocks) is drawn once per change
  const key = src.key + '|' + s + '|' + (src.danger ? 1 : 0) + '|' + (src.clr ? [...src.clr].join(',') : '');
  if (WELL.key !== key || !WELL.st) {
    WELL.key = key;
    if (!WELL.st || WELL.st.width !== cw || WELL.st.height !== ch) { WELL.st = offscreen(cw, ch); WELL.stx = WELL.st.getContext('2d'); }
    const g = WELL.stx;

    bg.addColorStop(0, 'rgba(16,8,26,.78)'); bg.addColorStop(1, 'rgba(26,12,38,.86)');
    g.fillStyle = bg; A.rr(g, 0, y0, cw, ch - y0, Math.round(c * 0.4 * DPR)); g.fill();
    g.fillStyle = 'rgba(255,240,230,.035)';
    for (let i = 1; i < COLS; i++) g.fillRect(i * s - Math.max(1, DPR * 0.5) / 2, y0, Math.max(1, DPR * 0.5), ch - y0);
    for (let j = 1; j < 20; j++) g.fillRect(0, y0 + j * s - Math.max(1, DPR * 0.5) / 2, cw, Math.max(1, DPR * 0.5));
    const f = src.danger ? 'worry' : 'sleep';
    for (let y = TOP - 2; y < ROWS; y++) {
      const clr = src.clr && src.clr.has(y);
      for (let xx = 0; xx < COLS; xx++) {
        const v = src.cell(xx, y); if (!v) continue;
        if (y < TOP) g.globalAlpha = 0.55;
        putCell(g, v, xx * s, rowY(y), s, clr ? 'squish' : f);
        g.globalAlpha = 1;
      }
    }
  }
  x.clearRect(0, 0, cw, ch);
  x.drawImage(WELL.st, 0, 0);
  // rows being cleared: a white flash that fades
  if (src.clr && src.clr.size) {
    const k = clamp(src.clrT, 0, 1);
    x.fillStyle = `rgba(255,250,235,${0.75 * (1 - k)})`;
    for (const y of src.clr) { const w = cw * (1 - k * 0.15); x.fillRect((cw - w) / 2, rowY(y) + s * 0.08 * k, w, s * (1 - 0.16 * k)); }
  }
  // the landing guide

  if (cur && src.ghost != null && src.ghost > cur.y && P.ghost) {

    x.save(); x.lineWidth = Math.max(1, s * 0.07); x.setLineDash([s * 0.18, s * 0.12]); x.strokeStyle = col.a; x.fillStyle = col.a;
    for (const [cx, cy] of CELLS[cur.t][cur.r]) {

      x.globalAlpha = 0.13; A.rr(x, px + k, py + k, s - 2 * k, s - 2 * k, s * 0.22); x.fill();

    for (let i = 0; i < 4; i++) {
      const [cx, cy] = cs[i], yy = cur.y + cy; if (yy < TOP - 2) continue;
      x.drawImage(A.cellImg(cur.t, s), (cur.x + cx) * s, rowY(yy));
    }
    const [fx, fy] = cs[fi], px = (cur.x + fx) * s, py = rowY(cur.y + fy);
    if (cur.y + fy >= TOP - 2) {

      else { x.beginPath(); for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2, rr = i % 2 ? r * 0.38 : r; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } x.closePath(); x.fill(); }

// confetti for cleared rows (css px inside the well canvas)
function burst(rows, big) {
  const c = R.c, t0 = now();
  const cols = ['#fff3b0', '#ffd9e8', '#d6f7dc', '#d2ecff', '#ffdcad', '#fff'];
  for (const y of rows) {
    const py = (HEAD + y - TOP + 0.5) * c;
    const n = big ? 9 : 6;
    for (let i = 0; i < n; i++) {
      const px = (i + 0.5 + Math.random() * 0.6 - 0.3) * (c * 10 / n);
      WELL.fx.push({ at: t0, life: 650 + Math.random() * 450, x: px, y: py, vx: (Math.random() - 0.5) * c * 6, vy: -c * (3 + Math.random() * 5), g: 1.2, r: c * (0.16 + Math.random() * 0.14), col: cols[(Math.random() * cols.length) | 0], kind: Math.random() < 0.3 ? 'paw' : 'star', rot: Math.random() * 6, spin: (Math.random() - 0.5) * 6 });
    }
  }

// ---------- hold and next ----------
// a block centred in a box of w × h css px with cells of size cs
function drawPiece(x, t, cx, cy, cs, o) {
  o = o || {};

    host.appendChild(b); setTimeout(() => b.remove(), 3100);
  } else if (v) {
    const who = s === v.me ? '' : nameOf(v, s) + ': ';
    if (s === v.me && screenOn === 'game') pop(text, 'sm'); else toast(who + text, 2600);
  }

}
function cleanChat(m) {
  if (!m) return null;
  if (m.emo && EMOS.includes(m.emo)) return { emo: m.emo };
  if (Number.isInteger(m.p) && m.p >= 0 && m.p < T('phrases').length) return { p: m.p, text: T('phrases')[m.p] };
  const t = String(m.text || '').replace(/\s+/g, ' ').trim().slice(0, 40);
  return t ? { text: t } : null;
}

// ===== a guest: connects to the host's room, plays its own well, and sends the host its clears and a picture of its well =====
function startClient(code) {
  S = { mode: 'client', code, isHost: false, view: null, room: null, canPause: false, snaps: {}, aim: -1 };
  store.set('sb_client', { code, at: Date.now() });
  KeepAlive.mark(LIVE, { kind: 'client', code });
  let peer = null, conn = null, lastMsg = 0, ever = false, dead = false, retryT = 0, fails = 0;
  const giveUp = () => { dead = true; try { peer && peer.destroy(); } catch (e) {} goLobby(); };
  overlay(`<div class="spin"></div><b>${esc(T('connecting', { c: code }))}</b>`, [[T('cancel'), 'glass', giveUp]]);
  const send = (m, quiet) => { if (conn && conn.open) { try { conn.send(m); return true; } catch (e) {} } if (!quiet) toast(T('netBad')); return false; };
  const rdNow = () => S.view && S.view.rd;
  S.chat = m => send(Object.assign({ t: 'chat' }, m));
  S.out = why => { const rd = rdNow(); if (rd) send({ t: 'out', r: rd.id, why }, true); };
  S.onEv = (g, e) => {
    if (g !== U.g) return;
    const rd = rdNow(); if (!rd) return;
    if (e.k === 'clear' && e.send > 0) { send({ t: 'atk', r: rd.id, n: e.send, to: S.aim }, true); SND.play('send', 60); }
    else if (e.k === 'over' && e.why !== 'win') send({ t: 'out', r: rd.id, why: e.why }, true);
  };
  // a picture of my well for the others, about eight times a second while it changes
  let snapAcc = 0, lastSnap = '';
  S.tick = dt => {
    const rd = rdNow(), g = U.g;
    if (!rd || rd.phase !== 'play' || !g || !g.started || dead) return;
    snapAcc += dt; if (snapAcc < 120) return; snapAcc = 0;
    const sn = g.snap(), k = sn.b + (sn.p ? sn.p.join(',') : '') + ':' + sn.q + ':' + sn.h;
    if (k === lastSnap) return; lastSnap = k;
    send({ t: 'snap', r: rd.id, d: sn }, true);
  };
  S.leave = () => new Promise(res => {
    dead = true;
    store.set('sb_client', null); KeepAlive.mark(LIVE, null);
    if (!conn || !conn.open) { try { peer && peer.destroy(); } catch (e) {} return res(); }
    const done = () => { clearTimeout(tm); S.onBye = null; setTimeout(() => { try { peer && peer.destroy(); } catch (e) {} }, 100); res(); };
    const tm = setTimeout(done, 1200);
    S.onBye = done;
    try { conn.send({ t: 'leave' }); } catch (e) { done(); }
  });
  function connect() {
    if (dead) return;
    try { conn && conn.close(); } catch (e) {}
    if (!peer || peer.destroyed || peer.disconnected) {
      try { peer && peer.destroy(); } catch (e) {}
      peer = new Peer(peerOpts());
      peer.on('open', () => dial());
      peer.on('error', err => {
        if (dead) return;
        if (err.type === 'peer-unavailable') {
          if (ever) { setNet(false); overlayNet(T('hostGone')); retry(3000); }
          else { overlay(`<b>${esc(T('notFound', { c: code }))}</b>`, [[T('backLobby'), 'glass', giveUp]]); retry(5000); }
        } else if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(err.type)) { setNet(false); retry(2500); }
      });
    } else dial();
  }
  function dial() {
    if (dead) return;
    conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    const c = conn;
    const to = setTimeout(() => { if (c === conn && !c.open) { if (ever) overlayNet(T('slow')); if (++fails % 2 === 0) { try { peer && peer.destroy(); } catch (e) {} } retry(300); } }, 8000);
    c.on('open', () => {
      clearTimeout(to); fails = 0; lastMsg = Date.now();
      const rd = rdNow(), g = U.g;
      c.send({ t: 'hello', name: myName, av: myAv, token, live: rd && g && g.started && !g.over ? rd.id : 0 });
    });
    c.on('data', m => {
      lastMsg = Date.now();
      if (!m || (dead && m.t !== 'bye')) return;
      if (m.t === 'welcome') { ever = true; S.seat = m.seat; setNet(true); overlay(null); }
      else if (m.t === 'state') { setNet(true); if (!$('overlay').hidden && ever && !confirmOpen()) overlay(null); if (m.v && m.room) onView(m.v, m.room); }
      else if (m.t === 'snaps') { if (m.d && typeof m.d === 'object') for (const k in m.d) { const s = k | 0, sn = cleanSnap(m.d[k]); if (s >= 0 && s < 4 && sn) S.snaps[s] = sn; } }
      else if (m.t === 'bub') { const rd = rdNow(), g = U.g, n = m.n | 0; if (rd && m.r === rd.id && g && g.started && !g.over && n > 0 && n <= 20) g.addBubbles(n); }
      else if (m.t === 'fx') { if (Number.isInteger(m.a) && Number.isInteger(m.b)) orb(m.a, m.b, m.n | 0); }
      else if (m.t === 'ko') { if (Number.isInteger(m.s)) koNote(m.s, Number.isInteger(m.by) ? m.by : -1); }
      else if (m.t === 'chat') chatIn(m.s, m);
      else if (m.t === 'note') { if (m.k && typeof m.k === 'string' && /^[a-zA-Z]+$/.test(m.k)) toast(T(m.k, m.v && typeof m.v === 'object' ? { n: String(m.v.n || '').slice(0, 12) } : null), 2600); }
      else if (m.t === 'err') { if (m.code === 'full') { dead = true; overlay(`<b>${T('full')}</b>`, [[T('backLobby'), 'glass', goLobby]]); store.set('sb_client', null); } }
      else if (m.t === 'bye') { if (S.onBye) S.onBye(); }
      else if (m.t === 'kicked') { dead = true; store.set('sb_client', null); overlay(`<b>${T('kicked')}</b>`, [[T('backLobby'), 'glass', goLobby]]); }
      else if (m.t === 'ended') { dead = true; S.ended = true; store.set('sb_client', null); KeepAlive.mark(LIVE, null); overlay(`<b>${T('ended')}</b>`, [[T('backLobby'), 'glass', goLobby]]); }
    });
    c.on('close', () => { if (c === conn && !dead) { setNet(false); retry(1500); } });
    c.on('error', () => {});
  }
  function overlayNet(txt) { if (screenOn === 'game') toast(txt, 3000); else overlay(`<div class="spin"></div><b>${esc(txt)}</b>`, [[T('backLobby'), 'glass', giveUp]]); }
  function retry(ms) { clearTimeout(retryT); retryT = setTimeout(connect, ms); }
  const iv = setInterval(() => {
    if (dead) { clearInterval(iv); return; }
    if (conn && conn.open) { try { conn.send({ t: 'ping' }); } catch (e) {} }
    if (ever && Date.now() - lastMsg > 9000) { setNet(false); lastMsg = Date.now(); try { peer && peer.destroy(); } catch (e) {} connect(); }
  }, 3000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !dead && ever && (!conn || !conn.open || Date.now() - lastMsg > 6000)) { try { peer && peer.destroy(); } catch (e) {} connect(); }
  });
  connect();
}
